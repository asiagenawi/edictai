name: Watch guidance pages

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check watched pages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev

      # Page hashes, ETags, and per-host crawl timing live in .cache/watch.
      # Each run saves a new cache entry; the next run restores the latest one.
      - uses: actions/cache@v6.1.0
        with:
          path: .cache/watch
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-

      # The report lists every change logged in the last week, so a change
      # stays visible until someone updates the records it affects.
      - name: Check pages
        run: |
          set +e
          uv run --no-sync edictai watch \
            --since "$(date -u -d '7 days ago' +%F)" \
            --json watch-report.json --markdown watch-report.md
          code=$?
          set -e
          if [ ! -f watch-report.json ]; then
            echo "::error::watch did not produce a report (exit $code)"
            exit 1
          fi

      # One open issue collects the reports; each run with changes adds a comment.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(jq '.changes | length' watch-report.json)" = "0" ]; then
            echo "No changes."
            exit 0
          fi
          gh label create guidance-watch --color c4493e \
            --description "A watched guidance page changed" --force
          num=$(gh issue list --label guidance-watch --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file watch-report.md
          else
            gh issue create --title "Watched guidance pages changed" \
              --label guidance-watch --body-file watch-report.md
          fi
