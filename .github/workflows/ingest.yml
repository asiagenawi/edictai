name: Weekly ingest

on:
  schedule:
    - cron: "43 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Find new candidates
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev

      # The LegiScan datasets, their dataset_hash values, and the monthly query
      # counter live in .cache/legiscan, so a dataset is downloaded again only
      # when LegiScan reports a new hash. The Congress.gov cache keeps each
      # bill's titles until the bill changes. Runs are serialized (above), so
      # the counter restored here is always the latest one saved.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            .cache/legiscan
            .cache/congress
            .cache/federal_register
            .cache/candidates
          key: ingest-cache-${{ github.run_id }}
          restore-keys: ingest-cache-

      - name: LegiScan datasets
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: uv run --no-sync statescope ingest legiscan

      - name: State candidates
        run: uv run --no-sync statescope ingest candidates

      - name: Federal candidates
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: uv run --no-sync statescope ingest federal --titles

      # Candidates are listed for review only; classification is a separate step.
      - name: Summarize new candidates
        run: python3 .github/scripts/new_candidates.py .cache/candidates candidates-report.md

      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s candidates-report.md ]; then
            echo "No new candidates."
            exit 0
          fi
          gh label create candidates --color 4f7fc4 \
            --description "New bills or documents to classify" --force
          gh issue create --title "New candidates, week of $(date -u +%F)" \
            --label candidates --body-file candidates-report.md
