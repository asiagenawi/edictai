name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The frontend ships the policy data as a static file so the map never
      # waits on the API. Rebuild that snapshot from the records in data/ on
      # every deploy; validation errors stop the deploy.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install pipeline
        run: uv sync --frozen --no-dev

      - name: Build data snapshot
        run: uv run --no-sync statescope validate --format github && uv run --no-sync statescope build --no-parquet

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v5
