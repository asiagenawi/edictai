name: Bug report
description: Report a problem with the site, the build, or the code.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For errors in the policy data itself, use the Correction form instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Site
        - Data build or downloads (SQLite, CSV, Parquet)
        - Validation
        - Other code
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Run ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and device for site issues; operating system, Python version, and commit for code issues.
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste any error messages or logs.
      render: text
