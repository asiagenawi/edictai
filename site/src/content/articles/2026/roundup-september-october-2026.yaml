title: "AI education policy, September to mid-October 2026"
dek: California signed six AI-in-education bills, Florida's State Board adopted rules on AI tools for schools and colleges, and a package of Pennsylvania bills cleared committee. Eight bills touching AI in education were introduced in Congress.
type: Roundup
published: "2026-10-18"
data_release: October 2026
caption: States with actions recorded by Edictai between 1 September and 17 October 2026.
sketch_note: six weeks of action
brief:
  - California's governor signed six bills between September 10 and 30, including a ban on training AI with student data.
  - Florida's State Board of Education adopted rules on September 16 requiring parental opt-in for student-facing AI tools and barring AI designed as a companion.
  - Four Pennsylvania House bills on AI in schools were reported from committee on October 6.
  - New Jersey bills would require public school staff to be natural persons, and New York bills target humanoid robots in classrooms.
body:
  - p: "This roundup covers actions Edictai recorded from September 1 to October 17, 2026. It lists what happened, not what it means; the linked records give the full text and history."
  - h: California
  - p: "The end of California's session brought six signatures. On September 10, the governor signed AB 1159, which bars operators of school-purpose apps and services from using covered student information to train generative AI or develop AI systems [1], and AB 2071, which requires a plan for digital wellness instruction that keeps pace with AI [2]. On September 18 came AB 1792, adding deepfakes and the misuse of generative AI to sexual health instruction [3], and AB 2504, a community college pilot for creative workers displaced by generative AI [4]."
  - p: "On September 30, the governor signed AB 2392, which has the public higher education systems set standards for buying generative AI and training students and staff to use it [5], and AB 1766, which has the health framework's next revision consider content on deepfake safety [6]."
  - h: Florida
  - p: "On September 16, Florida's State Board of Education amended its internet safety rule. Every district and charter school board must add rules on AI instructional tools to its internet safety policy by July 1, 2027 [7]. Parents must be told when a tool is approved and must opt a child in before the child uses it directly, with a comparable non-AI alternative available [8]. Districts may not deploy AI designed to meet students' social or emotional needs or to simulate friendship or companionship [9]. The board's rules extend similar policy requirements to Florida College System institutions [10]."
  - h: Pennsylvania
  - p: "Four House bills on AI in schools were referred to the Education Committee on September 24 and 25 and reported on October 6. HB 2786 would require every school entity and nonpublic school to adopt an AI policy by the 2027-28 school year [11]. HB 2785 would set required terms for school contracts for AI technology, including a ban on collecting students' biometric information [12]. HB 2787 would bar schools from using AI to provide school-based mental health services [13], and HB 2788 would let schools train employees on AI and create a state grant for the training, subject to funding [14]."
  - p: "A fifth bill, HB 2816, referred on October 2, would extend the state's school bullying policy rules to nonpublic schools and define cyberbullying to include AI-generated or modified media [15]."
  - h: New Jersey and New York
  - p: "New Jersey Assembly and Senate bills introduced on September 17 and October 8 would require public school employees and contractors to be natural persons. The sponsor's statement says the aim is to keep interactions between students and school personnel human [16] [17]."
  - p: "In New York, two Assembly bills were referred to the Education Committee on September 2. One would require each district, charter school and BOCES to adopt a policy barring AI-enabled humanoid robots from an instructional role [18]. The other, the FOCUS Act, would require school-issued devices to block AI companions and generative AI, with an exception for assistive technology [19]."
  - h: Congress
  - p: "Eight bills touching AI in education were introduced, five in the House and three in the Senate. The AI LABS Act would fund competitive grants to states for AI education programs in elementary and secondary schools [20]. The Data Science and Literacy Act of 2026 would fund data science education that includes AI [21]. The Artificial Intelligence Education and Workforce Readiness Act of 2026 would fund training for teachers and school leaders to use AI without replacing educators [22]. The Quality Educator Partnership Act, introduced in both chambers on September 24, would have the Education Department's technology office help districts and educator preparation programs build AI skills [23] [24]. The Protecting Kids from Human-Like Chatbots Act would give schools control over chatbot settings in school-managed deployments [25]."
  - p: "In the Senate, the Make AI Work for Americans Act would have the Education Department run a national clearinghouse for AI education, including model guidance on classroom AI use and academic integrity [26]. The TAG Act, a federal transparency bill, counts agency decisions affecting access to education among those it covers [27]."
  - h: State agencies
  - p: "The District of Columbia's Office of the State Superintendent of Education issued a model AI policy for staff use for the 2026-27 school year, which local education agencies may adapt. Staff would complete approved AI training before using AI tools for work and renew it each year [28]. Louisiana's Department of Education updated its K-12 AI guidance on September 3, including a rubric for evaluating AI tools and a summary of the state's rules for data-sharing agreements with vendors [29]. Oklahoma's Department of Education updated its model AI policy for districts in October, ahead of the state's 2027-28 deadline for local policies."
