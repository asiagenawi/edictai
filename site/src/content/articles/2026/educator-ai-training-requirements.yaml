  - h: "Training that staff must complete"
  - p: "Tennessee's law is the only enacted measure in Edictai's records that sets a statewide completion deadline for classroom teachers. Other measures require training but leave the details to local policy or to districts."
  - p: "Florida's State Board of Education rule, effective October 29, requires every district school board and charter school governing board to amend its internet safety policy to address AI instructional tools by July 1, 2027 [5]. Those policies must require teacher and administrator training on AI risks, limitations, safety and compliance with the rule [6]."
  - p: "Arkansas HB 1958, enacted April 17, 2025, requires each public entity, including school districts and institutions of higher education, to create a policy defining authorized use of AI and automated decision tools [7]. Each must also train employees on appropriate use of those tools when deciding an outcome at work [8]."
  - p: "Under Texas HB 3512, school district employees required to take the AI training complete it as the district determines, in consultation with the district's cybersecurity coordinator [9]."
  - h: "Courses and plans built by the state"
  - p: "Maryland's SB 720, signed May 26, requires the Maryland State Department of Education to provide AI professional development to educators and school leaders. It covers AI concepts, classroom uses, privacy, security and academic integrity, and is offered during the workday or for licensure renewal credit [10]."
  - p: "Idaho's S 1227 requires the State Department of Education to develop and recommend a professional development plan for educators on generative AI [11]. Connecticut's 2026 SB 5 creates a Connecticut AI Academy, which must develop courses and videos for K-12 teachers and administrators on appropriate classroom AI use [12]. The Board of Regents for Higher Education must develop certificates and badges for people who complete academy courses [13]."
  - h: "Training tied to budgets and pilot programs"
  - p: "North Carolina's 2026 Appropriations Act, S 257, sets out the content of educator AI training modules, including responsible instructional use such as lesson planning, differentiated instruction and student feedback [14]. A budget corrections act, H 268, lets the Friday Institute carry forward nonrecurring funds for AI professional development modules [15]."
  - p: "Michigan's 2025-2026 budget, HB 4706, directs the Department of Education to use media literacy training funds to design, implement and evaluate professional learning and optional curriculum modules on teaching AI and media literacy [16]."
  - p: "Virginia's HB 1186 and SB 394, identical laws signed April 13, establish an AI pilot program subject to appropriation, with pilot provisions that expire July 1, 2030 [17]. Pilot divisions must include professional development for educators on AI literacy and responsible use [18] [19]."
  - h: "Colleges and universities"
  - p: "California's AB 2392, signed September 30, requires the state's public college systems to provide generative AI training to students, faculty or staff [20]. Their joint working group must present training and procurement recommendations to system leaders by January 1, 2028 [21]. Arkansas HB 1958 also covers institutions of higher education [7]."
  - h: "Federal grant priorities and a DC model policy"
  - p: "EO 14277, signed April 23, 2025, directs the Secretary of Education to prioritize AI in discretionary teacher-training grants, including professional development so all educators can integrate AI fundamentals into all subject areas [22]. The Education Department's final supplemental priority, effective May 13, makes projects that provide such professional development eligible for priority in its discretionary grant competitions [23]."
  - p: "On November 5, the department proposed renaming and revising that priority [24]. The proposal lists support and training for educators on age-appropriate education methods among priority activities [25]."
  - p: "In the District of Columbia, the Office of the State Superintendent of Education published a model policy for staff use of AI in the 2026-27 school year. Local education agencies may adopt it but are not required to. Under it, staff who use AI tools for work complete approved training, show AI literacy before use and renew the training each year [26]."
  - h: "Deadlines ahead"
  - p: "Florida districts and charter boards have until July 1, 2027, to adopt policies that include the training requirement [5]. California's working group must present its training recommendations by January 1, 2028 [21], and Tennessee teachers must complete their course by August 1, 2028 [1]. The Education Department's revised grant priority remains a proposal and is not yet final [24]."
