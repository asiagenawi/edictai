# Analysis. Each [n] in the text is a note below; notes name a record by its id, and the
# jurisdiction, identifier, title, status, quote and link are read from the data at build time.
title: "Which states require or fund AI training for teachers"
dek: "Of 15 enacted measures on educator AI training in Edictai's records, only Tennessee's set a completion deadline for teachers. Another 31 bills remain in committee, one has passed a chamber and 22 did not pass."
type: "Analysis"
published: "2026-11-23"
data_release: "November 2026"
caption: "States with enacted laws on AI training for educators, as recorded by Edictai in November 2026."
sketch_note: "teachers take the course"
drawing: "classroom"
brief:
  - "Tennessee requires teachers in grades six through 12 to finish a state-approved AI course by August 1, 2028, or within two years of licensure."
  - "Maryland, Idaho and Connecticut direct a state agency or a state AI academy to provide AI training, courses or plans for educators."
  - "Michigan, North Carolina and Virginia tie educator AI training to budget funds or to a pilot program that runs subject to appropriation."
  - "A federal grant priority covers educator AI training projects, and a November 5 proposal would add training on age-appropriate methods."
body:
  - p: "Tennessee requires teachers in grades six through 12 to complete a state-approved course on artificial intelligence by August 1, 2028, or within two years of becoming licensed, whichever is later [1]. Its Department of Education must provide at least one asynchronous professional development course on classroom AI use [2]. The same provisions appear in HB 545, the companion to SB 677 [3]."
  - p: "As of November 2026, Edictai's records show 76 records in 27 jurisdictions that require or fund AI professional development for educators. Of the bills in that group, 15 were enacted in 10 states, 31 remain in committee, one has passed a chamber and 22 did not pass. Ten of the 15 enacted measures became law in 2026. One of them, Connecticut's 2024 SB 5, included AI training funds only as introduced, and its AI provisions were removed by amendment [4]."
  - table:
      title: "Selected enacted laws on educator AI training"
      source: "Edictai records, November 2026."
      columns: ["Law", "State", "Who is trained", "What it does", "Enacted"]
      rows:
        - [{ record: us-tn-2025-2026-sb-677 }, "Tennessee", "Teachers, grades 6-12", "Must complete approved course", "22 May 2026"]
        - [{ record: us-md-2026-sb-720 }, "Maryland", "Educators and school leaders", "State must provide training", "26 May 2026"]
        - [{ record: us-id-2026-s-1227 }, "Idaho", "Educators", "State develops training plan", "19 Mar 2026"]
        - [{ record: us-ct-2026-sb-5 }, "Connecticut", "K-12 teachers and administrators", "AI Academy courses and videos", "11 May 2026"]
        - [{ record: us-nc-2025-2026-s-257 }, "North Carolina", "Educators", "Sets training module content", "7 Jul 2026"]
        - [{ record: us-va-2026-hb-1186 }, "Virginia", "Educators in pilot divisions", "Pilot must include training", "13 Apr 2026"]
        - [{ record: us-ca-2025-2026-ab-2392 }, "California", "Public college students, faculty, staff", "Systems must provide training", "30 Sep 2026"]
