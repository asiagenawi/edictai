  - h: Pending K-12 bills
  - p: "Most of the K-12 activity is in bills that have not passed. They take three main forms."
  - p: "The first bans AI from teaching. Matching Texas House and Senate bills filed in 2025 would bar districts and charter schools from using AI to provide instruction or to replace or supplement a teacher's role [11] [12]. A Connecticut bill would prohibit AI from replacing public school educators in instruction and regular interaction with students [13]. A South Carolina bill would bar AI from replacing a licensed teacher in core academic instruction or in assigning final grades [14]. A Pennsylvania bill would stop charter and cyber charter schools from adopting an instructional model that relies on AI instead of professional employees [15]."
  - p: "The second allows AI as a supplement but not a substitute. Washington's bill reads: “Artificial intelligence may supplement or enhance instruction. Artificial intelligence may not replace certificated instructional staff or paraeducators.” [16] A New York bill would bar AI systems, chatbots and avatars from serving as the primary instructor and would ban humanoid robots from instructional settings [17]."
  - p: "The third defines the job as human. Minnesota's omnibus education bill, which has passed one chamber, provides that an AI model is not a qualified teacher [18]. Matching New Jersey bills introduced in September and October 2026 would require public school employees and contractors, from teachers to aides, to be natural persons [19] [20]."
  - h: Jobs and contracts
  - p: "A separate set of New York bills treats the question as one of employment. Two that have passed both chambers would bar AI systems used by school boards, BOCES, SUNY, CUNY and community colleges from displacing employees or transferring their duties to AI [21], and would protect existing collective bargaining agreements [22]."
  - h: A federal proposal
  - p: "The question has also reached federal policy. In a proposed rule on accrediting agencies published in August 2026, the Education Department wrote that agencies and institutions “must ensure that artificial intelligence is not used by faculty to supplant teaching and instruction” [23]. The statement appears in the rule's preamble, and the rule is not final."
