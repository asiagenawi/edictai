title: The laws and bills that say AI cannot replace a teacher
dek: Five laws in four states, and one Florida board rule, now say that AI may not stand in for a teacher, faculty member or school counselor. Three of the five laws apply to colleges, and most K-12 proposals are still bills.
type: Analysis
published: "2026-10-18"
data_release: October 2026
caption: States with laws, rules or bills on AI replacing educators, as recorded by Edictai in October 2026.
sketch_note: a person must teach
drawing: classroom
brief:
  - Illinois and California require a qualified person, not AI, to teach or be the instructor of record for community college or CSU courses.
  - Idaho's 2026 law requires its state framework to ensure no generative AI replaces a human teacher; Florida's board rule limits AI tools to supplementing teachers' judgment.
  - Nevada bars public schools from using AI to do the work of school counselors, psychologists and social workers.
  - K-12 bills in at least eight other states would bar AI from instructing students or require school staff to be people.
body:
  - p: "One provision that recurs in Edictai's records is a rule that AI may not take the place of an educator. As of October 2026, five enacted laws in four states and one state board rule contain such a provision. Bills in eight more states would add one, and New York's legislature has passed two bills that protect school and college employees from being displaced by AI."
  - h: Colleges
  - p: "Three of the five laws apply to colleges. Illinois amended its Public Community College Act in 2025: “A course may not, in lieu of a faculty member, use artificial intelligence as the sole source of instruction for students.” Faculty may still use AI to augment instruction, and the change took effect January 1, 2026 [1]."
  - p: "California took a different route. Its 2025 law on community college personnel requires the instructor of record for a course to be a person who meets the minimum qualifications for faculty [2]. A 2026 law sets the same rule for the California State University [3]. Both say staff may still use AI tools in operations and student services. An earlier bill, AB 2370 of 2024, would have barred AI from replacing community college faculty outright; the version signed into law kept only the instructor-of-record language [4]."
  - h: Schools
  - p: "For K-12 schools, Idaho's 2026 generative AI law requires the state's framework to “Ensure that no generative artificial intelligence replaces or eliminates a human teacher” [5]. The framework the Department of Education wrote under that law lists the same idea among its guiding principles [6]."
  - p: "Florida's State Board of Education reached the same point by rule in September 2026. District and charter school policies must ensure that AI instructional tools are limited to supplementing, and not replacing, the professional judgment of teachers [7]. The same rule requires human review of any AI-driven decision on grading, evaluation, discipline or referrals [8]."
  - p: "Nevada's 2025 law addresses a different role. Public schools, including charter schools, may not use AI to perform the functions and duties of a school counselor, school psychologist or school social worker, although administrative uses such as scheduling are allowed [9]. A Pennsylvania bill now in committee would bar school entities from using AI to provide services that would amount to the practice of a school-based mental health professional [10]."
