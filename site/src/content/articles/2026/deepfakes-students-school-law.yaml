  - h: Colleges
  - p: "Fewer laws reach higher education. Louisiana's 2026 law adds conduct involving AI-generated or deepfake sexual imagery to the definition of power-based violence under its Campus Accountability and Safety Act [15]."
  - h: Federal rules and state guidance
  - p: "At the federal level, the preamble to the 2024 Title IX rule explains that online sex-based harassment schools must address can include the nonconsensual distribution of intimate images altered or generated by AI [16]. That rule is no longer in force: a federal court vacated it in January 2025, and the Department repealed it in September 2026. Some state guidance also speaks to the issue. Utah's AI framework for schools states that using AI tools to manipulate media to impersonate others for bullying, harassment or intimidation is strictly prohibited [17]."
  - p: "A California bill in committee would have the Department of Education study nonconsensual AI-generated intimate images involving K-12 students, including how schools now respond, and report by January 1, 2028 [18]."
