title: Three trials of AI tutoring, two directions
dek: Randomized studies released between August and October 2026 found small or marginal gains from AI tutors in middle-school math and lower grades in a university trial. All three are working papers, not yet peer reviewed.
type: Research digest
published: "2026-10-18"
data_release: October 2026
caption: Illustration for Edictai.
brief:
  - Two trials in Tennessee middle schools found small or marginal math gains from AI tutors.
  - A University of Maryland trial found lower final grades in course sections given an AI study assistant.
  - All three studies are working papers, not yet peer reviewed.
body:
  - p: Three randomized studies of AI tutoring came out in the second half of 2026. Two took place in the same Tennessee school district; the third at a large public university. Their designs differ, so their results are not directly comparable, but each measured what happened when students were given an AI tutor alongside their normal coursework.
  - h: Middle-school math in Hamilton County
  - p: A two-year trial in 18 Hamilton County middle schools randomly assigned grades to use Khan Academy with its Khanmigo tutor in daily remedial math sessions. Assignment raised math achievement by about 1.3 national percentile ranks per term [1], gains the authors describe as similar to Khan Academy practice without AI [2]. Most students tried the tutor, but the median student messaged it on only a third of practice days [3].
  - p: A second experiment in the same district, with more than 6,000 students in grades 6 to 8, crossed AI support with mastery-based progression. Students with the AI progressed more slowly but were more accurate on their next attempt after a mistake [4]. The strongest evidence of learning a week later came when the AI was built into the mastery workflow, and those gains were only marginally significant [5].
  - h: A university course trial
  - p: At the University of Maryland, College Park, instructors were randomized to give their course sections a GPT-4o-based study assistant built into the learning management system. Among sections of the same course, access reduced final grades by 0.37 standard deviations and participation in online course activities by 0.90 standard deviations [6]. Estimated grade losses for first-generation students were more than twice those for continuing-generation students [7].
  - h: Reading them together
  - p: The studies differ in age group, subject, tool and how the AI was offered, and none has yet been peer reviewed. In the Khanmigo trial, most students rarely used the tutor in depth; in the mastery experiment, the AI helped most after a mistake; in the university trial, access came with far less participation in the course's existing online activities.
