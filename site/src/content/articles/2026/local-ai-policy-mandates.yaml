  - h: By rule rather than statute
  - p: "Florida's requirement comes from its State Board of Education. An amendment to the state's internet safety rule, adopted in September 2026, requires each district school board and charter school governing board to amend its internet safety policy to address AI instructional tools by July 1, 2027 [9]."
  - h: Narrower requirements
  - p: "Two other laws require a local policy on one specific use of AI. Alabama's 2024 law directs the State Board of Education to require each local board to adopt a student discipline and education policy on private images, and that policy must prohibit explicit images generated with AI [10]. Utah's 2026 school security law bars students from using AI glasses during class and requires each local education agency to set a policy on exceptions, such as emergencies and medical needs [11]."
  - h: Colleges and universities
  - p: "Tennessee's 2024 law also reached higher education. The University of Tennessee board, the Board of Regents and each state university board had to adopt an AI policy by July 1, 2025 [12]. Arkansas's public-entity law covers public colleges and universities as well [2]. Maryland's 2024 AI Governance Act requires its public senior higher education institutions and Baltimore City Community College to adopt AI policies compatible with the state's own [13]."
  - p: "Some systems have acted without a statute. The University System of Georgia's Board of Regents requires every institution to adopt policies or procedures on AI in academic contexts [14]. SUNY requires its institutions to publish or update AI policies by December 31, 2026 [15]. Florida's September 2026 State Board rules extend the policy requirement to Florida College System institutions [16]."
  - h: Bills that did not pass
  - p: "At least six similar bills failed. Indiana's 2025 bill would have required districts and charter schools to adopt, post and communicate an AI policy to students [17]. Hawaii's 2026 bill would have had each public school write one with parents and the local community [18]. West Virginia's 2026 bill would have required county boards to adopt a policy based on a state model [19]."
  - p: "Arizona's 2026 bill would have required district and charter boards to adopt policies on detecting and preventing unauthorized student use of AI, with a human reviewing any flagged assignment [20]. North Carolina's House bill on social media and AI safety would have required local boards to adopt AI use policies [21]. A Florida bill would have written AI policies into district codes of student conduct before the State Board acted by rule [22]."
  - h: Still pending
  - p: "Several bills remain open. An Illinois bill that has passed one chamber would require each school board to adopt an AI policy by the 2027-28 school year that bars teachers from using AI to assign grades for tasks requiring professional judgment [23]. A Pennsylvania bill would require every school entity and nonpublic school to adopt a policy by the same school year [24]. An Iowa bill would cover school districts, community colleges and Board of Regents institutions [25]."
  - h: What the laws leave to districts
  - p: "Most of these laws pair the requirement with something the state writes first. Utah, Ohio and the failed West Virginia bill rely on a model policy; Virginia and Maryland on department guidance; Idaho on a state framework. Tennessee, Arkansas and Oklahoma set the subject or required content of the policy in the statute itself, and Oklahoma's law adds statewide rules on educator review, parent notice and opt-outs that every district policy must meet [7]."
