title: Where schools must write their own AI policy
dek: Seven states have passed laws, and one state board has adopted a rule, requiring school districts to adopt a policy on artificial intelligence. Most tie that policy to a model or guidance the state writes first.
type: Analysis
published: "2026-10-18"
data_release: October 2026
caption: States with a law, rule or system policy requiring local AI policies, as recorded by Edictai in October 2026.
sketch_note: must adopt a policy
brief:
  - Seven states have laws requiring each school district to adopt its own AI policy; Florida does the same by State Board rule.
  - Five of the seven laws passed in the 2026 sessions.
  - Most build the local policy on a model, framework or guidance the state writes first.
body:
  - p: When a state wants rules on AI in classrooms but does not want to write one rule for every school, it can require each district to adopt a policy of its own. As of October 2026, Edictai's records include laws in seven states that do this for public schools, one state board rule that does the same, and requirements in four states that reach public colleges and universities.
  - h: The first laws
  - p: "Tennessee was first. Its 2024 law required local boards of education and public charter schools to adopt a policy on AI for instruction and assignments in time for the 2024-25 school year, and to report each July 1 that they had done so [1]. Ohio followed through its budget: the 2026-27 operating appropriations act requires every school district, community school and STEM school to adopt a policy on AI by July 1, 2026, and lets schools adopt the state education department's model policy [2]."
  - h: The 2026 sessions
  - p: "Five more states passed such laws in 2026. Utah requires each local education agency to adopt a policy based on a state model, submit it to the state board, train staff on it and review it at least every two years; an agency that adopts nothing is held to the model [3]. Idaho requires every district and public charter school to adopt a policy on generative AI use by students and employees, aligned with the state framework [4]."
  - p: Virginia passed matching House and Senate bills requiring each school board to establish and enforce policies consistent with guidance the Department of Education must write [5]. Oklahoma's Responsible Technology in Schools Act requires each district board to adopt a policy before the 2027-28 school year covering oversight, permitted and prohibited uses, data protection, transparency and periodic review [6]. Maryland's Artificial Intelligence Ready Schools Act requires each local school system to have a policy aligned with state guidance within 120 days of the guidance's release [7].
  - table:
      title: State requirements for district AI policies
      source: Edictai records, October 2026.
      columns: [State, Instrument, Measure, Deadline for districts, Policy built on]
