title: Which states require school districts to adopt an AI policy
dek: Laws in eight states now require every school district to adopt its own policy on artificial intelligence, and Florida does the same by board rule. Five of the eight laws passed in 2026, and most build the local policy on a model or guidance the state writes first.
type: Analysis
published: "2026-10-18"
data_release: October 2026
caption: States with a law, rule or system policy requiring local AI policies, as recorded by Edictai in October 2026.
sketch_note: must adopt a policy
brief:
  - Tennessee, Arkansas, Ohio, Utah, Idaho, Virginia, Oklahoma and Maryland have laws requiring each school district to adopt an AI policy. Florida's State Board of Education requires it by rule.
  - Five of the eight laws passed in the 2026 sessions.
  - Most tie the local policy to a model, framework or guidance the state must write first. Tennessee, Arkansas and Oklahoma set the content in the statute.
  - At least six failed bills would have added similar requirements, and more are pending.
body:
  - p: "A state that wants rules on AI in classrooms has two broad choices. It can write the rules itself, or it can require each school district to adopt a policy of its own. As of October 2026, Edictai's records show eight states that have taken the second route by statute for public schools, one that has done so by board rule, and several requirements that reach public colleges and universities."
  - h: The early laws
  - p: "Tennessee was first. Its 2024 law requires local boards of education to adopt a policy on AI use by students, teachers and staff for instruction and assignments, in place by the 2024-25 school year, and to report compliance to the state each July 1 [1]."
  - p: "Arkansas followed in 2025 with a broader law. It requires every public entity, a term that includes school districts, open-enrollment charter schools and public colleges, to create a policy defining the authorized use of AI and automated decision tools and to train employees on it [2]."
  - p: "Ohio acted through its 2026-27 budget. The law required the state education department to write a model policy by December 31, 2025, and requires every district, community school and STEM school to adopt a policy by July 1, 2026 [3]."
  - h: The 2026 sessions
  - p: "Five more states passed such laws in 2026. Utah requires each local education agency to adopt a policy based on a state model, submit it to the state board, train staff on it and review it at least every two years. An agency that adopts nothing is held to the model [4]. Idaho requires every district and public charter school to adopt a policy on generative AI use by students and employees, aligned with a state framework [5]."
  - p: "Virginia passed matching House and Senate bills requiring each school board to establish and enforce policies consistent with guidance the Department of Education must write [6]. Oklahoma's Responsible Technology in Schools Act requires each district board to adopt a policy before the 2027-28 school year [7]. Maryland's Artificial Intelligence Ready Schools Act requires each local school system to have a policy aligned with state guidance within 120 days of the guidance's release [8]."
