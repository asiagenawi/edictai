        - [Florida, Board rule, { record: us-fl-sbe-rule-6a-1-0957-ai-instructional-tools, text: Rule 6A-1.0957 }, 1 Jul 2027, Internet safety policy]
  - h: By rule rather than statute
  - p: Florida's requirement comes from its State Board of Education rather than a statute. An amendment to the state's internet safety rule requires each district school board and charter school governing board to amend its internet safety policy to address AI instructional tools by July 1, 2027 [8].
  - h: Colleges and universities
  - p: "Tennessee's law also reached higher education: the University of Tennessee board, the Board of Regents and each state university board had to adopt a policy by July 1, 2025 [1]. Elsewhere, systems have acted on their own. The University System of Georgia's Board of Regents requires every institution to adopt policies or procedures on AI in academic contexts [9]. SUNY requires its campuses to publish or update AI policies by December 31, 2026 [10]. Florida's State Board rules extend the policy requirement to Florida College System institutions [11]."
  - h: Bills that did not pass
  - p: Three similar bills failed. Indiana's 2025 bill would have required districts and charter schools to adopt, post and communicate an AI policy to students [12]. Hawaii's 2026 bill would have had each public school write one with parents and the local community [13]. West Virginia's 2026 bill would have required county boards to adopt a policy based on a state model [14].
  - h: What the laws leave to districts
  - p: Most of these laws pair the requirement with something the state writes first. Utah and the failed West Virginia bill build on a model policy; Virginia and Maryland on department guidance; Idaho on a state framework; Ohio offers a model districts may adopt. Tennessee and Oklahoma set the subjects or the purpose of the policy in the statute itself.
# provision: which of the record's provisions (from 0) supplies the locator and quote; the first if omitted.
