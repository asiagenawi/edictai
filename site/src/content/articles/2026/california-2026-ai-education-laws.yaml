  - h: The state's model policy for districts
  - p: "California does not require districts to adopt an AI policy. Instead, SB 1288 of 2024 required a state working group, at least half of whose members are credentialed teachers, to write a model policy for local educational agencies and charter schools by July 1, 2026 [18]. The Department of Education published that model in June 2026. It is not binding, and districts may adapt it [19]."
  - p: "The model says AI detection software should not be the sole basis for discipline or a grade penalty [19]. It calls for AI tools that bar the use of student data to train public AI models or for advertising [20], and it keeps final grading authority with the educator of record even when AI drafts feedback [21]. It also asks that vendor contracts include breach notification, audit rights and data deletion when the contract ends [22]."
  - h: What did not pass
  - p: "A concurrent resolution encouraging the three public higher education systems to form a joint workgroup on AI in higher education did not pass [23]. A bill requiring the Department of Education to study nonconsensual AI-generated intimate images involving K-12 students remains in committee [24]."
