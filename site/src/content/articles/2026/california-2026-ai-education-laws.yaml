title: What California's 2026 AI laws require of schools and colleges
dek: California enacted nine laws with AI provisions for schools and colleges in 2026, from a ban on training AI with student data to a rule that a person must be the instructor of record at California State University. Its districts also now have a state model AI policy, written under a 2024 law.
type: State brief
published: "2026-10-18"
data_release: October 2026
caption: California records cited in this brief, as recorded by Edictai in October 2026.
sketch_note: nine new laws
drawing: gavel
brief:
  - AB 1159 bars operators of school-purpose apps and services from using student information to train or develop AI, and extends similar protections to college students from July 1, 2027.
  - AB 2392 requires the community colleges and CSU, and asks UC, to set joint standards for buying generative AI and training students and staff on it.
  - SB 928 and a 2025 law, SB 241, require the instructor of record at CSU and the community colleges to be a qualified person.
  - Three health-education laws add deepfakes, AI misuse or responsible AI use to what the state's health instruction covers or must consider.
body:
  - p: "As of October 2026, Edictai's records show ten California bills signed in 2026 that had AI provisions at some stage. In one of them, AB 2148, the AI provisions were removed by amendment before it passed. The other nine reach student privacy, college purchasing, the role of faculty, health instruction and workforce training."
  - h: Student data and AI training
  - p: "AB 1159, signed on September 10, amends the state's student online privacy laws for K-12 and preschool. Operators of websites, services and apps used for school purposes may not use covered student information to train a generative AI system or develop an AI system [1]. The law also creates a Higher Education Student Information Protection Act, operative July 1, 2027, that applies similar protections to students at colleges and universities [2]."
  - h: Rules for buying and teaching with generative AI in college
  - p: "AB 2392, signed on September 30, requires the California Community Colleges chancellor's office and the California State University to convene an intersegmental working group with the University of California, which the law requests rather than requires to take part [3]. The group must present recommended procurement standards and training to system leaders by January 1, 2028 [4]. The systems must then provide the training to students, faculty or staff [5]. Until standards are adopted, they must report each systemwide generative AI contract to the Legislature, naming the vendor, the intended use and who will have access [6]."
  - h: A person at the front of the class
  - p: "Two laws address who teaches a college course. SB 241, signed in October 2025, requires the instructor of record for a community college course to meet the minimum qualifications for faculty [7]. SB 928, signed in August 2026, sets the same rule for the California State University: the instructor of record must be a person who meets the trustees' rule for faculty service [8]. Both laws state that staff may still use AI tools in operations and student services."
  - p: "These laws follow AB 2370 of 2024. As introduced, that bill would have barred AI from replacing community college faculty and allowed it only as a peripheral tool. The version signed into law kept only the instructor-of-record requirement [9]."
  - h: Deepfakes and AI in health instruction
  - p: "AB 1792 adds a section to the Education Code so that sexual health instruction covers digital and online safety, including the risks of deepfakes and the misuse of generative AI [10]. AB 1766 requires the Instructional Quality Commission, at the next revision of the health curriculum framework, to consider content on staying safe from sexually exploitative materials and deepfakes online [11]. SB 1133 requires the commission to consider information on the impacts and responsible use of AI when the health framework is next revised on or after January 1, 2027 [12]."
  - p: "AB 2071 requires the State Department of Education to develop, by January 1, 2028, a plan to expand digital wellness instruction, including how to keep the curriculum current with AI technology [13]. These laws sit alongside a 2024 law, AB 2876, under which the commission must consider adding AI literacy to the mathematics, science and history-social science frameworks at their next revision [14]."
  - h: Funding and workforce
  - p: "The education omnibus trailer bill, AB 126, funds the California Educators Together online repository, which must include guidance and resources on safeguards for new technology in schools, including AI [15]. AB 2504 directs the community college chancellor, once money is appropriated, to set up a pilot at up to 10 colleges to retrain creative-industry workers displaced or at risk of displacement by generative AI [16]. Separately, Executive Order N-6-26, signed in May 2026, asks higher education institutions to look at adding on-the-job training to degree programs as part of the state's response to AI in the workforce [17]."
