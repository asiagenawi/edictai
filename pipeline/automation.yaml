# Settings for `edictai classify run`, `classify eval-gate`, `articles write`,
# `watch-apply`, and the weekly and watch workflows (.github/workflows/).
# docs/automation.md describes how they are used.

classify:
  model: claude-sonnet-5-5
  # output_config.effort: low, medium, high, xhigh, or max.
  effort: medium
  # Items sent in one request. Triage lines are short; full lines carry bill text.
  items_per_request:
    triage: 25
    full: 1
  max_tokens:
    triage: 12000
    full: 8000
  # Send requests through the Message Batches API; direct calls are the fallback.
  use_batches: true
  batch_poll_seconds: 30
  # A batch still running after this long is cancelled and its unfinished
  # requests are sent as direct calls.
  batch_timeout_minutes: 90
  direct_workers: 4
  # `classify fetch-texts --version`: also store the newest earlier version whose
  # text mentions AI, for bills whose AI language was amended out.
  text_version: ai

# The claude-code backend: Claude Code run headless (`claude -p`) on a Claude
# subscription. It is used when EDICTAI_LLM_BACKEND is claude-code, or when it is
# auto (the default) and CLAUDE_CODE_OAUTH_TOKEN is set; otherwise the API is used.
claude_code:
  executable: claude
  # Seconds one call may run before it is stopped and counted as failed.
  timeout_seconds: 1800
  # Calls run at the same time.
  workers: 2

budget:
  # Dollars per run with the API backend, from the token usage the API reports.
  # WEEKLY_SPEND_CAP_USD overrides it.
  spend_cap_usd: 10
  # Claude Code calls per run with the claude-code backend, shared by the
  # evaluation gate, the classification, and the article. A reply asked once
  # more counts as a second call.
  claude_code_calls: 400
  # getBillText queries one run may send at most.
  legiscan_text_queries: 500
  # LegiScan queries left unused at the end of the month for other commands.
  legiscan_monthly_reserve: 500
  # Federal text requests (Congress.gov and the Federal Register) one run may send.
  federal_text_requests: 300

articles:
  # One article per run, drafted and then edited and fact-checked by a second call.
  model: claude-opus-5-5
  draft_effort: high
  edit_effort: high
  max_tokens:
    draft: 32000
    edit: 32000
  # Dollars the article may spend, inside the run's budget.spend_cap_usd.
  spend_cap_usd: 3
  # Claude Code calls the article may use, inside the run's budget.claude_code_calls.
  claude_code_calls: 4
  # Words in the body paragraphs; the draft aims for target_words.
  min_words: 600
  max_words: 1200
  target_words: 850
  # Records with an action, publication, or update this many days before the run
  # date count as changed this week, with the record files the run added or changed.
  window_days: 7
  # Records given to the model at most; counts are taken over all of a subject's records.
  max_records: 60
  # Further editing calls when the edited article fails the checks.
  repair_attempts: 1
  build_timeout_minutes: 15
  subjects:
    min_records: 6
    min_jurisdictions: 4
    min_studies: 4
    min_roundup_items: 6
    roundup_days: 28
    # A subject keeps only its most significant records and studies, so a piece stays
    # focused: changed this week and recently settled first, then other enacted laws and
    # current documents, then active and pending bills, then closed ones.
    max_subject_records: 20
    max_subject_studies: 12
    min_federal_records: 3
  # How the subject is chosen: the highest score plus the type's rotation bonus. Each
  # part is a weight times a count, and every count stops at count_cap, so size alone
  # does not win. The run log and article.json list the parts (`why`).
  scoring:
    recent_days: 120 # enacted, published or signed this recently is recent
    active_days: 30 # any dated activity this recently is active
    count_cap: 6
    changed: 8 # per record or study changed this week
    enacted_recent: 4 # per law enacted, document published or order signed recently
    enacted_lately: 4 # more per one of those within active_days
    jurisdictions_recent: 3 # per jurisdiction those come from
    active: 1 # per record active within active_days
    settled: 0.5 # per enacted law, current document or order in force
    fresh_study: 1 # per study no article cites
    recent_study: 3 # per uncited study published within recent_days
    federal_action: 30 # bonus for a recent federal order, document or advanced bill
    roundup_due: 40 # bonus for a Roundup once roundup_days have passed
    rotation: 10 # per place in the type rotation, least recently used highest
    cited_share: 0.5 # cut by this times the share of records articles already cite
    # Catch-all provision types keep broad_factor of their score unless broad_changed
    # of their records changed this week.
    broad: [appropriates-funding, creates-task-force]
    broad_factor: 0.2
    broad_changed: 3

watch:
  # `watch-apply`: one call per changed page, reviewing the change and saying how the
  # records should change. Run weekly by .github/workflows/watch.yml.
  model: claude-opus-5-5
  effort: high
  max_tokens: 16000
  # Claude Code calls one run may use (a reply asked once more counts twice), and
  # dollars with the API backend. A page left unanswered is reviewed next run.
  claude_code_calls: 60
  spend_cap_usd: 10
  # Characters of each page or document text given to the model.
  max_text_chars: 60000
  # Per page: new AI links fetched, and other sources of the records that cite it.
  max_linked: 4

eval:
  # The run fails when the classifier scores below either floor on
  # pipeline/eval/classifier_eval.yaml.
  precision_floor: 0.85
  recall_floor: 0.9

# USD per million tokens at standard rates. Batch requests are billed at
# batch_discount times these. A model missing here cannot be budgeted, so the
# run refuses to use it. When cache prices are left out, cache writes are
# counted at 1.25 times the input price and cache reads at the input price.
prices:
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.20
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_write: 5.00
    cache_read: 0.20
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
batch_discount: 0.5
