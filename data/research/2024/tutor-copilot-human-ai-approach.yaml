summary: Stanford researchers ran a preregistered randomized controlled trial in which virtual tutors working with elementary and middle school students in a large southern U.S. school district were randomly given access to Tutor CoPilot, a large language model tool that suggests expert-like responses in real time. Students whose tutors had the tool were more likely to master lesson topics, with the largest gains for students of lower-rated or less experienced tutors, at an estimated cost of about $20 per tutor per year.
key_findings:
  - finding: Students whose tutors used Tutor CoPilot were 4 percentage points more likely to master mathematics topics, as measured by session exit tickets.
    citation:
      source_url: https://arxiv.org/pdf/2410.03017
      locator: Abstract
      quote: students whose tutors used Tutor CoPilot were 4 percentage points more likely to master mathematics topics (p<.01)
  - finding: Gains were largest for students of lower-rated tutors (9 percentage points) and less experienced tutors (7 percentage points).
    citation:
      source_url: https://arxiv.org/pdf/2410.03017
      locator: Results, RQ2
      quote: lower-rated tutors experienced a 9 p.p. increase in students passing their exit ticket (56%→ 65%student passing rate from control to treatment). In Figure 2b, less experienced tutors showed a 7 p.p. increase (61%→ 68%).
  - finding: Analysis of more than 350,000 messages showed tutors with the tool asked more probing questions and gave less generic praise; estimated annual cost was about $20 per tutor.
    citation:
      source_url: https://arxiv.org/pdf/2410.03017
      locator: Abstract
      quote: Analysis of more than 350,000 messages indicates that Tutor CoPilot promotes effective pedagogy, increasing probing questions and reducing generic praise.
methods: Preregistered randomized controlled trial with tutors as the unit of randomization; 900 tutors initially assigned (783 active in the study) and 1,013 students in grades 3-6 from nine schools in one large southern U.S. district (79% Hispanic); outcome is session exit-ticket mastery.
