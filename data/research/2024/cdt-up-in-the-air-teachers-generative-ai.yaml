id: 2024-cdt-up-in-the-air-teachers-generative-ai
title: 'Up in the Air: Educators Juggling the Potential of Generative AI with Detection, Discipline, and Distrust'
authors:
  - Maddy Dwyer
  - Elizabeth Laird
publisher: Center for Democracy & Technology
published: '2024-03-27'
classification: survey
education_levels:
  - k12
