summary: The Center for Democracy & Technology surveyed a nationally representative sample of middle and high school teachers in late 2023 about generative AI use, school policies, training, AI detection tools, and discipline. Teachers reported more school policies and training than the prior year, alongside heavy reliance on AI content detectors and more students disciplined over AI use.
key_findings:
  - finding: Eighty-five percent of teachers said their school had a policy that permits or bans generative AI for schoolwork, and 71 percent of them said it was their school's first such policy.
    citation:
      source_url: https://cdt.org/wp-content/uploads/2024/03/2024-03-21-CDT-Civic-Tech-Generative-AI-Survey-Research-final.pdf
      locator: p. 10
      quote: Eighty five percent of teachers say that their school has a policy that either generally permits (subject to some conditions or limits) or bans the use of ChatGPT, or other generative AI tools, for schoolwork.
  - finding: Sixty-eight percent of teachers reported regularly using an AI content detection tool, a 30-point increase from the prior school year.
    citation:
      source_url: https://cdt.org/wp-content/uploads/2024/03/2024-03-21-CDT-Civic-Tech-Generative-AI-Survey-Research-final.pdf
      locator: p. 13
      quote: Sixty eight percent of teachers report using an AI content detection tool regularly, a 30 percentage point increase since last school year.
  - finding: The share of teachers reporting that students at their school got in trouble for using or being accused of using generative AI rose from 48 percent in 2022-23 to 64 percent in 2023-24.
    citation:
      source_url: https://cdt.org/wp-content/uploads/2024/03/2024-03-21-CDT-Civic-Tech-Generative-AI-Survey-Research-final.pdf
      locator: Figure 3, p. 16
      quote: Since last school year, student discipline as a result of generative AI use has increased 16 percentage points
methods: Online survey of a nationally representative sample of 460 6th-12th grade public school teachers fielded November-December 2023 by Edge Research, with quotas and weighting to national demographics; compared with CDT's 2022-23 surveys.
