  - research
summary: A preliminary evaluation randomly assigned 11 Rising Academies schools in Ghana to give students in grades 3-9 access to Rori, a WhatsApp-based math tutor that uses language models, during two 30-minute study hall sessions per week, or to continue regular instruction. Over eight months, math growth scores were substantially higher in the treatment group, at a marginal cost of about $5 per student.
key_findings:
  - finding: Math growth scores were substantially higher for the treatment group, with an effect size of 0.36 that the authors describe as roughly equivalent to an extra year of learning.
    citation:
      source_url: https://arxiv.org/pdf/2402.09809
      locator: Abstract
      quote: We find that the math growth scores were substantially higher for the treatment group and statistically significant (p < 0.001). The effect size of 0.36 is considered large in the context of educational interventions
  - finding: Rori runs on basic mobile phones over low-bandwidth networks, with a marginal cost of about $5 per student.
    citation:
      source_url: https://arxiv.org/pdf/2402.09809
      locator: Abstract
      quote: the marginal cost of providing Rori is approximately $5 per student
methods: School-level randomized trial; about 500 students in grades 3-9 at 11 Rising Academies schools in Ghana (five treatment, six control); two 30-minute weekly sessions; math assessments at two points over eight months; difference-in-differences analysis.
