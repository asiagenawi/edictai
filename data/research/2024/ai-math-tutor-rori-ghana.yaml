id: 2024-ai-math-tutor-rori-ghana
title: 'Effective and Scalable Math Support: Experimental Evidence on the Impact of an AI-Math Tutor in Ghana'
authors:
  - Owen Henkel
  - Hannah Horne-Robinson
  - Nessie Kozhakhmetova
  - Amanda Lee
publisher: arXiv
published: '2024-02-15'
classification: report
education_levels:
