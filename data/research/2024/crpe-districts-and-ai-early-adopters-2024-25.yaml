summary: CRPE built a database of 40 "early adopter" school districts and charter networks with system-wide AI strategies, compiled from public information, and sorted their approaches into guidance, tools for students and staff, changes to systems and structures, and back-office uses. About two-thirds had published AI guidance, and most were pursuing only a few of the eight strategies tracked.
key_findings:
  - finding: Of the 40 early adopter systems, 26 (65%) had published guidance on AI use for staff, students, and families, leaving a third pursuing AI strategies without formal guidance.
    citation:
      source_url: https://crpe.org/districts-and-ai-tracking-early-adopters-and-what-this-means-for-2024-25/
      locator: Beyond tools section
      quote: Of the 40 school systems we studied, 26 (65%) have provided publicly available guidance to staff, students, and families on using AI.
  - finding: The most common strategies were AI tools for teachers, students, and parents (70%, 58%, and 38%) and professional development (63%); new AI courses and learning standards were less common (30% and 8%).
    citation:
      source_url: https://crpe.org/districts-and-ai-tracking-early-adopters-and-what-this-means-for-2024-25/
      locator: Beyond tools section
      quote: The most common strategies include using AI-enabled tools for key stakeholders (teachers, students, and parents at 70%, 58%, and 38%, respectively) and providing professional development opportunities (63%).
  - finding: The 40 systems endorsed or partnered with 65 tools, most often MagicSchool, SchoolAI, and Writable; six systems had comprehensive approaches with five or more strategies.
    citation:
      source_url: https://crpe.org/districts-and-ai-tracking-early-adopters-and-what-this-means-for-2024-25/
      locator: Beyond tools section
      quote: These 40 school systems collectively endorse or partner with 65 tools
methods: Database of 40 early adopter school districts and charter management organizations compiled from publicly available news stories and referrals from AI support organizations; not a representative sample.
