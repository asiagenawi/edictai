id: 2026-tyton-time-for-class-2026
title: 'Time for Class 2026: The AI Tipping Point: From Monitoring Students to Engaging Them'
authors:
  - Catherine Shaw
  - Hadley Dorn
  - Amrita Narayanan
  - Louise Hay
  - Gates Bryant
publisher: Tyton Partners
