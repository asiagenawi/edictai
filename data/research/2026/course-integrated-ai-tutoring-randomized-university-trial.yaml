summary: A randomized controlled trial at the University of Maryland, College Park, in fall 2025 gave some instructors' course sections access to a GPT-4o-based virtual study assistant built into the campus learning management system, with roughly 2,400 undergraduates across many disciplines. Access to the AI tutor lowered final course grades and sharply reduced students' participation in existing online course activities, with larger estimated grade losses for first-generation students.
key_findings:
  - finding: Among sections of the same course, AI tutor access reduced final grades by 0.37 standard deviations and learning management system participation by 0.90 standard deviations.
    citation:
      source_url: https://edworkingpapers.com/ai26-1598
      locator: Abstract
      quote: Among sections of the same course, tutor access reduced final grades by 0.37 standard deviations and learning management system participation by 0.90 standard deviations.
  - finding: Estimated effects on final grades ranged from -0.27 to -0.37 standard deviations across samples, and effects on homework scores were null or negative.
    citation:
      source_url: https://edworkingpapers.com/sites/default/files/ai26-1598.pdf
      locator: Introduction, p. 3
      quote: We found that access to the AI tutor negatively affected student final course grades by 0.27–0.37 standard deviations (SDs), with the clearest evidence in the exact-match sample.
  - finding: Estimated final-grade losses for first-generation students were more than twice those for continuing-generation students.
    citation:
      source_url: https://edworkingpapers.com/sites/default/files/ai26-1598.pdf
      locator: Introduction, p. 4
      quote: the estimated final-grade losses among first-generation students were more than twice those among continuing-generation students in both samples
methods: Randomized controlled trial with instructors randomized within blocks of identical or similar courses; 2,379 undergraduate students and 30 instructors across STEM, social sciences, humanities, and education at the University of Maryland, College Park, fall 2025; outcomes from course grades, learning management system activity, and surveys.
