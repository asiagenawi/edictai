id: 2026-khanmigo-two-year-school-experiment
title: 'One Click Away: AI Tutoring with Khanmigo in a Two-Year School Experiment'
authors:
  - Philip Oreopoulos
  - Nina Low
publisher: Annenberg Institute at Brown University (EdWorkingPapers)
published: 2026-08
