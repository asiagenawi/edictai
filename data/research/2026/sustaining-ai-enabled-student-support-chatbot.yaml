id: 2026-sustaining-ai-enabled-student-support-chatbot
title: 'Sustaining AI-Enabled Student Support: A Four-Year Implementation and Impact Study'
authors:
  - Catherine Mata
  - Emily Russell
  - Lindsay C. Page
publisher: Annenberg Institute at Brown University (EdWorkingPapers)
