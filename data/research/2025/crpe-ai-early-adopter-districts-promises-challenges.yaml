id: 2025-crpe-ai-early-adopter-districts-promises-challenges
title: 'AI Early Adopter Districts: The Promises and Challenges of Using AI to Transform Education'
authors:
  - Bree Dusseault
  - Maddy Sims
  - Michael Berardino
publisher: Center on Reinventing Public Education
