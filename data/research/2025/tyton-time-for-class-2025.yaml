summary: Annual national surveys of administrators, instructors, and students at US colleges, focused on introductory and developmental courses, covering teaching modality, student engagement, digital learning tools, and generative AI. Weekly or daily generative AI use rose sharply among all three groups since spring 2023, while preventing student cheating ranked as a top instructional challenge.
key_findings:
  - finding: Daily or weekly personal use of generative AI reached 40% of administrators, 30% of instructors, and 42% of students in spring 2025, up from 2%, 4%, and 14% in spring 2023.
    citation:
      source_url: https://4213961.fs1.hubspotusercontent-na1.net/hubfs/4213961/Publications/Time%20for%20Class/Tyton%20Partners_Time%20for%20Class%202025.pdf
      locator: p. 6, Key findings
      quote: daily or weekly use up to 40% among administrators (from 2% in spring 2023), 30% among instructors (from 4% in spring 2023), and 42% among students in spring 2025 (from 14% in spring 2023)
  - finding: Preventing student cheating was the top instructional challenge reported by instructors of introductory or developmental courses (45%).
    citation:
      source_url: https://4213961.fs1.hubspotusercontent-na1.net/hubfs/4213961/Publications/Time%20for%20Class/Tyton%20Partners_Time%20for%20Class%202025.pdf
      locator: p. 6, Key findings
      quote: Preventing student cheating and increasing student attendance are the top instructional challenges among instructors teaching introductory or developmental courses (45% and 44%, respectively)
  - finding: Instructor preference for face-to-face teaching rose from 55% in 2023 to 64% in 2025.
    citation:
      source_url: https://tytonpartners.com/time-for-class-2025/
      quote: Instructor preference for in-person teaching jumped to 64%, up from 55% in 2023.
methods: National surveys of administrators (n=312), instructors (n=1,572), and students (n=1,528) at more than 900 US colleges and universities, spring 2025; data weighted by institutional sector.
