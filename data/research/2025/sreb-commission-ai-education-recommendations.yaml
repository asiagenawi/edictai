summary: The Southern Regional Education Board's Commission on AI in Education, which convened more than 75 education and business leaders in 2024 and 2025, approved 12 final policy recommendations for states. They include statewide AI networks, targeted guidance, professional development, AI in K-12 standards, needs assessments, procurement and safety policies, postsecondary adoption playbooks, and evaluation frameworks.
key_findings:
  - finding: The Commission approved 12 final recommendations for states, schools, and colleges, with the last three covering safety, postsecondary adoption, and evaluation.
    citation:
      source_url: https://www.sreb.org/post/sreb-ai-education-commission-approves-final-recommendations
      quote: The SREB Commission on AI in Education has approved 12 final recommendations to help states, schools and colleges as they adopt artificial intelligence tools.
  - finding: It recommends that states regularly review education technology safety policies to protect minors from AI-related harm.
    citation:
      source_url: https://www.sreb.org/post/sreb-ai-education-commission-approves-final-recommendations
      locator: Recommendation 10
      quote: States should regularly review, and revise if necessary, their educational technology safety policies to ensure that minors are protected from harm related to AI use.
  - finding: It recommends that states integrate AI knowledge and skills into K-12 standards and curricula.
    citation:
      source_url: https://www.sreb.org/ai-commission-recommendations
      quote: States should integrate AI knowledge and skills into K-12 standards and curricula
