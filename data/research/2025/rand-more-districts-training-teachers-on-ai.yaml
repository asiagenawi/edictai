id: 2025-rand-more-districts-training-teachers-on-ai
title: 'More Districts Are Training Teachers on Artificial Intelligence: Findings from the American School District Panel'
authors:
  - Melissa Kay Diliberti
  - Robin J. Lake
  - Steven R. Weiner
publisher: RAND Corporation
published: '2025-04-08'
classification: survey
education_levels:
  - k12
topics:
  - educator-training
  - equity-access
summary: RAND compared nationally representative district surveys from fall 2023 and fall 2024 and interviewed district leaders to track how many districts train teachers on generative AI. The share of districts reporting such training roughly doubled to about half, but low-poverty districts remained well ahead of high-poverty districts.
key_findings:
  - finding: Forty-eight percent of districts reported having trained teachers on AI by fall 2024, up from 23 percent in fall 2023, and another 26 percent planned to do so during 2024-25.
    citation:
      source_url: https://www.rand.org/pubs/research_reports/RRA956-31.html
      locator: Survey Results
      quote: In fall 2024, 48 percent of districts reported that they had trained teachers on the use of AI, which is a substantial, 25-percentage-point increase from the percentage of districts that reported implementing training on AI in fall 2023.
  - finding: By fall 2024, 67 percent of low-poverty districts had trained teachers on AI, compared with 42 percent of middle-poverty and 39 percent of high-poverty districts.
    citation:
      source_url: https://www.rand.org/pubs/research_reports/RRA956-31.html
      locator: Survey Results
      quote: By fall 2024, 67 percent of low-poverty districts reported having provided training for teachers on AI use, compared with 42 percent of middle-poverty districts and 39 percent of high-poverty districts.
  - finding: District leaders said initial trainings focused on addressing teachers' fears and discomfort with AI rather than on instructional tools.
    citation:
      source_url: https://www.rand.org/pubs/research_reports/RRA956-31.html
      locator: Key Findings
      quote: In interviews, district leaders said that they focused initial teacher trainings on addressing teachers' fear and discomfort with AI rather than jumping right into instructional tools.
methods: Weighted, nationally representative surveys of K-12 public school districts in the American School District Panel (fall 2023, n=224; fall 2024, n=290) plus interviews with 14 district leaders.
