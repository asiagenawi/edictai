id: 2025-rand-ai-use-in-schools-increasing-guidance-lags
title: 'AI Use in Schools Is Quickly Increasing but Guidance Lags Behind: Findings from the RAND Survey Panels'
authors:
  - Christopher Joseph Doss
  - Robert Bozick
  - Heather L. Schwartz
