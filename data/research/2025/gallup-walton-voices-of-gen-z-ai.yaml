id: 2025-gallup-walton-voices-of-gen-z-ai
title: 'Voices of Gen Z: How American Youth View and Use Artificial Intelligence'
authors:
  - Gallup
  - Walton Family Foundation
  - GSV Ventures
publisher: Gallup
published: '2025-04-01'
classification: survey
education_levels:
  - k12
topics:
