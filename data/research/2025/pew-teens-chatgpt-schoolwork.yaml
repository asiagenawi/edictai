id: 2025-pew-teens-chatgpt-schoolwork
title: About a quarter of U.S. teens have used ChatGPT for schoolwork – double the share in 2023
authors:
  - Olivia Sidoti
  - Eugenie Park
  - Jeffrey Gottfried
publisher: Pew Research Center
published: '2025-01-15'
classification: survey
