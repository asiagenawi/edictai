id: 2025-educause-ai-landscape-study-2025
title: '2025 EDUCAUSE AI Landscape Study: Into the Digital AI Divide'
authors:
  - Jenay Robert
  - Mark McCormack
publisher: EDUCAUSE
published: '2025-02-17'
classification: survey
education_levels:
  - postsecondary
topics:
  - local-policy-requirement
