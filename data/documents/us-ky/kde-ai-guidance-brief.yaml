summary: >-
  Kentucky Department of Education guidance brief from its Office of Education Technology that
  urges districts to treat AI like other emerging technologies, emphasizing consistency, balance,
  and normalization, and offers guiding questions on data privacy, tool vetting, and reviewing AI
  output. It sets out the department's principles for responsible AI governance under the KETS
  Master Plan and is offered as an example for districts writing their own AI policies.
