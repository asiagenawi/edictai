summary: Amends the Title IX regulations governing sex discrimination in education programs receiving
  federal funds. The preamble explains that online sex-based harassment that schools must address can
  include nonconsensual distribution of intimate images altered or generated by AI, and that conduct through
  recipient-operated platforms, including AI technologies, falls within an education program. A federal
  court vacated the rule on 9 January 2025, and the Department repealed it on 29 September 2026.
