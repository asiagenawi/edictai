summary: Sets final priorities and requirements for the Rehabilitation Long-Term Training program, which
  funds scholarships for students in rehabilitation degree and certificate programs. Requires the rehabilitation
  technology topic area to include training on artificial intelligence tools and requires funded programs
  to train scholars on integrating assistive technology and AI tools into vocational rehabilitation services.
published: "2025-06-17"
effective: "2025-07-17"
provisions:
  - type: appropriates-funding
    description: Rehabilitation technology projects must provide scholarships for degree or certificate
      study that includes training on AI tools.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/06/17/2025-11117/final-priorities-and-requirements-rehabilitation-long-term-training-program
      locator: Priority 2, Topic Area 2 (Rehabilitation Technology)
      quote: Rehabilitation technology training includes training on the use, applications, and benefits
        of technology (including assistive technology and artificial intelligence tools) for individuals
        with
  - type: ai-workforce-program
    description: Funded academic programs must train scholars to understand integration of assistive technology
      and AI tools into vocational rehabilitation services.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/06/17/2025-11117/final-priorities-and-requirements-rehabilitation-long-term-training-program
      locator: Requirements, program description item (5)
      quote: (5) The program trains RSA scholars to understand the applications and strategies related
        to the integration of advanced assistive technology and artificial intelligence tools into VR
        services
