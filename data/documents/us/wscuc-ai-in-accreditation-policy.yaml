summary: WSCUC policy, approved in November 2024, that protects the confidentiality and integrity of institutional materials during accreditation and substantive change reviews. Commission representatives and peer reviewers may not submit institutional materials to external AI tools, may use only Commission-approved AI tools, and may use them only as an aid to human judgment.
