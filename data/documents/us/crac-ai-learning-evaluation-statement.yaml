summary: Joint statement by the Council of Regional Accrediting Commissions (C-RAC), whose seven member commissions accredit about 3,000 degree-granting colleges and universities, saying that using AI in learning evaluation and credit transfer does not conflict with accreditation standards, policies, or practices. It supports transparent, accountable, and unbiased AI tools for evaluating prior learning and transfer credit.
