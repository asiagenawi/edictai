summary: Invites fiscal year 2025 applications for the Rehabilitation Long-Term Training program, which
  funds scholarships for students in rehabilitation degree and certificate programs. Rehabilitation technology
  projects include training on artificial intelligence tools, and funded programs must train scholars
  on integrating assistive technology and AI tools into vocational rehabilitation services.
published: "2025-06-17"
provisions:
  - type: appropriates-funding
    description: Rehabilitation technology projects fund scholars' training that includes AI tools.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/06/17/2025-11118/applications-for-new-awards-rehabilitation-training-rehabilitation-long-term-training-program
      locator: Topic Area 2, Rehabilitation Technology (ALN 84.129E)
      quote: applications, and benefits of technology (including assistive technology and artificial intelligence
        tools) for individuals with disabilities to achieve and/or maintain competitive integrated employment
        and independence.
  - type: ai-workforce-program
    description: Funded academic programs must train scholars to understand integration of assistive technology
      and AI tools into vocational rehabilitation services.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/06/17/2025-11118/applications-for-new-awards-rehabilitation-training-rehabilitation-long-term-training-program
      locator: Program requirements, item (5)
      quote: (5) The program trains RSA scholars to understand the applications and strategies related
        to the integration of advanced assistive technology and artificial intelligence tools into VR
        services
