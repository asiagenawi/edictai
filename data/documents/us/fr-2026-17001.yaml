summary: Proposes changes to the Secretary's recognition of accrediting agencies and related institutional
  eligibility rules. In explaining a research-misconduct standard, the preamble states that accrediting
  agencies and institutions must ensure AI is not used by faculty to supplant teaching and that AI should
  not degrade research methods.
published: "2026-08-20"
provisions:
  - type: prohibits-ai-replacing-educators
    description: The preamble states that agencies and institutions must ensure faculty do not use AI
      to supplant teaching and instruction.
