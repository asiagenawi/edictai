      source_url: https://www.federalregister.gov/documents/2026/08/20/2026-17001/accreditation-innovation-and-modernization-the-secretarys-recognition-of-accrediting-agencies
      locator: Preamble discussion of Sec. 602.17
      quote: However, we also believe agencies and institutions must ensure that artificial intelligence
        is not used by faculty to supplant teaching and instruction.
