summary: Invites applications for fiscal year 2025 Asian American and Native American Pacific Islander-Serving
  Institutions Program grants and includes an invitational priority on advancing artificial intelligence
  in education, covering integration of AI tools into pedagogy and student support services, AI and computer
  science courses in general education, and AI in teacher preparation programs.
published: "2025-07-14"
provisions:
  - type: appropriates-funding
    description: Sets an invitational priority for projects that integrate AI tools into institutional
      pedagogy or student support services or expand students' understanding of AI.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/07/14/2025-13154/applications-for-new-awards-asian-american-and-native-american-pacific-islander-serving-institutions
      locator: Invitational Priority Two
      quote: 'Projects that implement or promote greater understanding of Artificial Intelligence (AI)
        through one or both of the following: (1) supporting the integration of AI tools into the institution''s
        pedagogy or student support services'
  - type: educator-prep-requirement
    description: The priority covers embedding AI and computer science into institutions' teacher professional
      development or teacher preparation programs.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/07/14/2025-13154/applications-for-new-awards-asian-american-and-native-american-pacific-islander-serving-institutions
      locator: Invitational Priority Two, part (2)(b)
      quote: embedding AI and computer science into an institution of higher education's general preservice
        or in-service teacher professional development or teacher preparation programs
