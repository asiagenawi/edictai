summary: Middle States Commission on Higher Education policy and procedures, effective July 1, 2025, setting broad expectations for lawful, ethical, transparent, and secure use of AI. The Commission allows institutions to use AI to prepare accreditation materials, holds them responsible for the accuracy of what they submit, and asks them to fold AI into existing data governance and information security policies.
