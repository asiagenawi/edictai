  notes: >-
    Checked against FR Doc. 2026-07087 (published 2026-04-13, effective
    2026-05-13). Legacy record classified this as guidance; it is a final
    rule (34 CFR Part 75), so classification is policy. Legacy said it was
    "issued under Executive Order 14277"; the notice cites EO 14277 for its AI
    definition, and the ED press release on the proposed priority ties it to
    the order. Legacy topic Equity & Access dropped; the priority's
    accessibility language is limited to universal design for learning.
