  - instructional-use
  - workforce
  - research
summary: >-
  Final rule establishing a supplemental priority the Secretary of Education
  may use in any Department discretionary grant competition, effective May
  13, 2026. It covers projects that expand understanding of AI (such as AI
  literacy, K-12 and college AI and computer science courses, educator
  professional development, and AI dual-enrollment and certification
  opportunities) and projects that expand appropriate and ethical use of AI
  in teaching, tutoring, special education, teacher training, and school
  operations.
published: 2026-04-13
effective: 2026-05-13
provisions:
  - type: educator-pd-requirement
    description: Makes projects that provide educator professional development on integrating AI fundamentals into subject areas eligible for priority in Department discretionary grant competitions.
    citation:
      source_url: https://www.federalregister.gov/documents/2026/04/13/2026-07087/final-priority-and-definitions-secretarys-supplemental-priority-and-definitions-on-advancing
      locator: Final Priority (a)(v), 91 FR 18778
      quote: Provide professional development for educators on the integration of the fundamentals of AI into their respective subject areas
  - type: ai-workforce-program
    description: Makes projects that create AI courses and in-demand certification programs for high school students eligible for priority.
    education_levels:
      - k12
    citation:
      source_url: https://www.federalregister.gov/documents/2026/04/13/2026-07087/final-priority-and-definitions-secretarys-supplemental-priority-and-definitions-on-advancing
      locator: Final Priority (a)(viii), 91 FR 18779
      quote: Create opportunities for high school students through the development or expansion of AI courses and career-relevant, in-demand certification programs
authorized_by: us-eo-14277
