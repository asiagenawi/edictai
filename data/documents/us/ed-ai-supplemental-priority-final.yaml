id: us-ed-ai-supplemental-priority-final
jurisdiction: us
issuer: us-ed
title: Final Priority and Definitions-Secretary's Supplemental Priority and Definitions on Advancing Artificial Intelligence in Education
classification: policy
status: current
education_levels:
  - k12
  - postsecondary
topics:
  - funding
