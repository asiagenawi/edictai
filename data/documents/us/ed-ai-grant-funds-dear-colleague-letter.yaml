summary: >-
  Dear Colleague Letter from Secretary of Education Linda McMahon to grantees
  and prospective grantees stating that formula and discretionary grant funds
  may be used for AI-based instructional materials, AI-enhanced high-impact
  tutoring, and AI for college and career pathway exploration and advising,
  when consistent with program requirements. It sets out principles for
  responsible use: educator-led, ethical, accessible, transparent and
  explainable, and data-protective, including compliance with FERPA.
published: 2025-07-22
provisions:
  - type: restricts-student-data-use
    description: States that AI systems supported with grant funds must comply with federal privacy laws, including FERPA.
    citation:
      source_url: https://www.ed.gov/media/document/opepd-ai-dear-colleague-letter-7222025-110427.pdf
      locator: Principles for Responsible Use
      quote: Systems must comply with federal privacy laws including the Family Educational Rights and Privacy Act.
  - type: bias-or-equity-requirement
    description: Calls for AI tools to be accessible to people who need digital accessibility accommodations, including children, educators, and family members with disabilities.
    citation:
