summary: >-
  Guidance from the Office of Superintendent of Public Instruction on using AI in Washington
  public schools under a "Human-AI-Human" approach, in which AI use starts with human inquiry
  and ends with human reflection. It covers AI foundations, classroom implementation, ethics,
  data privacy, academic integrity, and sample district policy language. First published
  January 18, 2024; Version 3.0 was published July 1, 2024.
