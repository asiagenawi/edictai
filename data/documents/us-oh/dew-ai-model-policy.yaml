summary: >-
  A model board policy on artificial intelligence released by the Ohio Department of Education
  and Workforce on December 30, 2025, as required by Ohio Revised Code 3301.24. Districts,
  community schools, and STEM schools, which must adopt an AI policy by July 1, 2026, may adopt it
  as written or customize it. It covers student and staff use, ethics and academic integrity,
  data privacy and security, curriculum integration, and review of third-party AI tools.
