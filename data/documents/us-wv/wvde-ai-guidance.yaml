summary: >-
  West Virginia Department of Education guidance on generative AI for PK-12 staff, from
  superintendents to classroom teachers. It covers guiding principles for educator use,
  teaching students about AI, academic integrity, prohibited uses, student privacy and safety,
  evaluating AI products, and sample considerations for district policies. Version 1.2 (March
  2025) added a section on emerging risks, including AI companion apps.
