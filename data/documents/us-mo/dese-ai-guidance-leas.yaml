summary: >-
  Missouri Department of Elementary and Secondary Education guidance (Version 1.0, 2025-26),
  developed by its Computer Science Advisory Council, to help local education agencies write
  their own AI policies under local control. It covers the benefits and challenges of AI,
  data privacy, professional development, instructional best practices, AI integration, and
  points to consider in district AI policies.
