summary: >-
  The Nevada Department of Education's AI guidance, shaped by town halls and stakeholder
  meetings held by the Nevada AI Alliance in early 2024, to help local education agencies
  develop AI policies and use AI responsibly in schools. It is organized around the STELLAR
  ethical-use principles (Security, Transparency, Empowerment, Learning, Leadership,
  Achievement, Responsible Use) and includes best practices for districts, administrators,
  teachers, parents, and students.
