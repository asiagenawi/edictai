summary: >-
  Oregon Department of Education guidance on generative AI in K-12 classrooms, released as
  Version 3.0 in June 2026 as a web-based interactive guide that replaced the earlier v2.0
  document. It moves from introducing generative AI toward practical guidance on safe, effective
  implementation, built around guiding principles, and is accompanied by a step-by-step guide
  for school leaders on developing AI policies and protocols and other companion resources.
