summary: >-
  Guidelines from the Virginia Secretary of Education setting guiding principles for AI in K-12
  and higher education (including "do no harm," integrity, and augmenting rather than replacing
  teachers), strategies for integration, and roles for the Virginia Department of Education,
  SCHEV, local governing boards, and educators, such as creating AI policy resources, approval
  processes for AI tools, and training.
