summary: >-
  Oklahoma State Department of Education guidance for PK-12 schools, revised as Version 3.0 in
  July 2026 to incorporate the Oklahoma Responsible Technology in Schools Act (70 O.S. § 11-120).
  It explains the law's requirements, including educator-directed use, human review, the bar on
  AI as the primary basis for high-stakes decisions, parent disclosure and opt-out, and the
  district policy deadline, and offers instructional guidance on AI literacy, academic
  integrity, accessibility, and vendor vetting.
updated: 2026-07
version: "3.0"
provisions:
  - type: academic-integrity-rules
    description: Sets out academic integrity guidelines for student AI use, including an AI acceptable use rating scale for assignments.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklahoma.gov/content/dam/ok/en/osde/ai-and-digital-learning/Guidance%20for%20Using%20AI%20in%20Oklahoma%20Schools%20v.3.pdf
      locator: Part II, Sec. 10 (Academic Integrity Guidelines), pp. 21-22
      quote: Policies must adapt to guide students in using AI as an ethical tool while keeping them active participants in their education.
  - type: procurement-standards
    description: Provides a risk-tiered framework for vetting AI tools by the student data they collect, with administrative approval for high-risk tools.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklahoma.gov/content/dam/ok/en/osde/ai-and-digital-learning/Guidance%20for%20Using%20AI%20in%20Oklahoma%20Schools%20v.3.pdf
      locator: Part I, Sec. 3 and Sec. 5
      quote: 'High Risk (Red) All tools collecting sensitive information like student demographics or PII Use With Extreme Caution: Robust security measures and strict adherence to user consent. Requires administrative approval.'
