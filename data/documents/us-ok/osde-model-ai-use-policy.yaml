summary: >-
  A template board policy from the Oklahoma State Department of Education, updated October 2026,
  that districts can adapt to meet the Oklahoma Responsible Technology in Schools Act. It covers
  definitions, roles, educator oversight, data privacy, parent opt-out, annual review, and an
  implementation deadline of the start of the 2027-2028 school year.
updated: 2026-10
provisions:
  - type: requires-local-ai-policy
    description: Sets the template's deadline for districts that adopt it, full compliance with the policy no later than the start of the 2027-28 school year, as the Act requires.
    education_levels:
      - k12
    citation:
      source_url: https://oklahoma.gov/content/dam/ok/en/osde/ai-and-digital-learning/Model%20Policy%20AI%20Use%20in%20Schools%20Update%20October%202026.pdf
      locator: Sec. XI (Implementation Timeline)
      quote: full compliance required no later than the start of the 2027–2028 school year
  - type: regulates-ai-assessment
    description: Prohibits educators from using AI as the primary basis for grades, discipline, placement, or other major decisions.
    education_levels:
      - k12
    citation:
      source_url: https://oklahoma.gov/content/dam/ok/en/osde/ai-and-digital-learning/Model%20Policy%20AI%20Use%20in%20Schools%20Update%20October%202026.pdf
      locator: Sec. VI(A) (Educator Prohibited Uses of AI)
      quote: Using AI as the primary basis for grades, discipline, placement, or major decisions.
  - type: requires-disclosure
    description: Requires annual notification to parents of the AI tools, vendors, student data collected and its use, and the purpose of each tool, notice within 30 days of new data-collecting tools, and the right to opt students out of any student-facing AI tool without penalty.
    education_levels:
      - k12
    citation:
      source_url: https://oklahoma.gov/content/dam/ok/en/osde/ai-and-digital-learning/Model%20Policy%20AI%20Use%20in%20Schools%20Update%20October%202026.pdf
      locator: Secs. VIII-IX (Transparency and Parent Notification; Parent/Guardian Opt-Out Rights)
      quote: Parents/guardians may opt their student out of any student-facing AI tool at any time without penalty.
