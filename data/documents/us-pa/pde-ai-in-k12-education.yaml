summary: >-
  A Pennsylvania Department of Education web page offering guidance to educators, families, and
  students on using AI safely and responsibly. It explains what AI is, its benefits and risks,
  privacy and data cautions, and when teachers and students should not use AI, stating that AI
  should support teachers and student learning rather than replace them and should not be the
  only grader.
undated: true
provisions:
  - type: regulates-ai-assessment
    description: Advises that AI not be used as the only grader and that teachers review and make final decisions.
    education_levels:
      - k12
    citation:
      source_url: https://www.pa.gov/agencies/education/ai-digital-media-literacy/ai-in-k-12-education
      locator: When Teachers and Students Should Not Use AI
      quote: Do not use AI as the only grader.
