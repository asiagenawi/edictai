summary: >-
  Mississippi Department of Education guidance offering procedural advice and instructional
  strategies to district leaders, school leaders, and teachers on appropriate AI use in schools.
  It covers digital citizenship, strategies to deter cheating and plagiarism, standards-aligned
  content, formative assessment, accessibility, considerations for writing an AI use policy, and
  staff training.
