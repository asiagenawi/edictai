summary: >-
  Statewide, non-mandatory guidance from the Illinois State Board of Education on AI use in
  prekindergarten through grade 12, developed under Public Act 104-0399 with a blue-ribbon
  advisory panel. It frames AI as a means to inform teaching and learning that keeps the
  teacher-student relationship central, and offers districts tools, model policy resources, and
  case studies on instruction, AI literacy, data privacy, and local decision-making.
