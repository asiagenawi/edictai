summary: A non-binding model board policy that California school districts and charter schools can adapt, developed by the California Department of Education with the SB 1288 working group. It covers disclosure and plagiarism, limits on AI detection software, privacy and vendor contract safeguards, parent review rights, teacher-retained grading authority, and AI literacy as a core academic competency.
published: '2026-06-25'
provisions:
  - type: academic-integrity-rules
    description: Model policy states that AI detection software should not be the sole basis for discipline or grade penalties.
    education_levels:
      - k12
    citation:
      source_url: https://www.cde.ca.gov/ci/pl/aipolicy.asp
      locator: Model Policy, AI Detection Software
      quote: AI detection software should not be used as the sole basis for disciplinary action or grade penalty.
  - type: restricts-student-data-use
    description: Model policy calls for AI tools to protect student data and bars its use for training public AI models or advertising.
    education_levels:
      - k12
    citation:
      source_url: https://www.cde.ca.gov/ci/pl/aipolicy.asp
      locator: Model Policy, Privacy by Design
      quote: All AI tools should protect student data, prohibit its use for training public AI models or advertising, and maintain strong security safeguards against data breaches.
  - type: regulates-ai-assessment
    description: Model policy requires students to be told when their work is submitted to AI for grading or feedback and keeps final grading authority with the educator.
    education_levels:
      - k12
    citation:
      source_url: https://www.cde.ca.gov/ci/pl/aipolicy.asp
      locator: Model Policy, Grading and Assessment
      quote: Regardless of whether AI is used to generate draft feedback, the educator of record retains sole authority to determine final grades.
  - type: procurement-standards
    description: Model policy calls for AI vendor contracts to include enforceable student data protections such as breach notification, audit rights, and data deletion.
    education_levels:
      - k12
    citation:
      source_url: https://www.cde.ca.gov/ci/pl/aipolicy.asp
      locator: Model Policy, Vendor Contractual Safeguards
      quote: All AI vendor contracts should include enforceable provisions protecting student data privacy and security, including breach notification requirements, audit rights, data deletion upon contract termination, and vendor accountability for unauthorized use of student data.
