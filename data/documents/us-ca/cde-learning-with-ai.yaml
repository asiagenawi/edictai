summary: The California Department of Education's first, non-binding web guidance on AI in K-12 education, framed around learning with AI and learning about AI. It covers safe use and data privacy, critiquing inaccuracies and bias, AI's social impacts, and teaching the "5 Big Ideas of AI" through the state computer science standards. CDE now keeps it as an archived page beside its newer guidance.
