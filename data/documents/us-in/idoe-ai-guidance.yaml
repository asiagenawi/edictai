summary: >-
  A short Indiana Department of Education guide presenting key considerations for AI in K-12
  education, organized around AI literacy, instruction and learning, impact, and security. It
  offers considerations for local AI policy, such as adding AI to existing acceptable use
  policies, defining acceptable uses, protecting student data under FERPA and COPPA, and not
  relying on AI detection tools alone for academic dishonesty decisions.
undated: true
provisions:
