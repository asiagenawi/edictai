summary: A customizable model policy from the Office of the State Superintendent of Education for DC local education agencies to adapt for staff use of AI; adoption is optional. It sorts staff uses into a "stoplight" framework, with red uses (such as student discipline decisions, teacher evaluations, and IEP or Section 504 eligibility) prohibited, yellow uses (such as grading and drafting IEPs) allowed with enhanced oversight, and green uses (such as lesson planning) allowed with human review. It does not cover student use or tool procurement.
published: 2026-09-01
provisions:
  - type: educator-pd-requirement
    description: The model policy has staff complete approved AI training, show AI literacy before use, and renew the training each year.
    education_levels:
      - k12
    citation:
      source_url: https://osse.dc.gov/sites/default/files/dc/sites/osse/page_content/attachments/LEA%20AI%20Model%20Policy%20Booklet%20Sept%202026.pdf
      locator: p. 8, Requirements for Staff Use
      quote: All staff using AI tools for professional purposes must complete [replace with LEA name] approved training modules about the safe, legal, ethical, effective, and equitable use of AI in educational settings.
