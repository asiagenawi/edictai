summary: >-
  Vermont Agency of Education guidance (Version 1.0) on using AI in schools, framed around
  personalized, proficiency-based, and project-based learning. It sets developmental
  expectations by grade band, a four-principles framework for educator and student use, and
  risk guidance on academic honesty, cognitive offloading, data privacy, student well-being,
  and bias, plus a tool-vetting framework and implementation steps for school leaders.
