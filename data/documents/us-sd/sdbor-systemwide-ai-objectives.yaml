summary: 'The South Dakota Board of Regents announced systemwide objectives for adopting AI at the state''s
  public universities. The work is organized into five components: governance and infrastructure, curricular
  and program impacts, agentic AI in operations, research, and AI literacy for students, faculty, and
  staff. A systemwide AI Advisory Committee, with members from the System Office and each university and
  supported by focused workgroups, coordinates and governs these initiatives.'
