summary: >-
  Statewide framework from the Maryland State Department of Education for responsible AI use in
  K-12 schools, covering roles and responsibilities, data privacy and security, equity, academic
  integrity and assessment, professional learning, student AI literacy, operational uses, and
  procurement and vendor governance. It says MSDE does not approve specific AI tools and that
  local education agencies adopt district AI policies and vet tools.
updated: "2026-06"
provisions:
  - type: requires-local-ai-policy
    description: Local education agencies are expected to implement statewide expectations by adopting district AI policies and vetting and approving tools.
    education_levels:
      - k12
    citation:
      source_url: https://msde.maryland.gov/about/Documents/DCCR/ai/AI-Guidance-A.pdf
      locator: Roles and Responsibilities
      quote: Local education agencies implement statewide expectations by adopting district AI policies, vetting, and approving tools
  - type: procurement-standards
    description: Calls for rigorous vendor vetting, contractual protections, documented risk assessments, and ongoing monitoring of AI tools.
    education_levels:
      - k12
    citation:
      source_url: https://msde.maryland.gov/about/Documents/DCCR/ai/AI-Guidance-A.pdf
      locator: Procurement and Vendor Governance
      quote: Maryland requires rigorous vendor vetting, strong contractual protections, documented risk assessments, and ongoing monitoring.
