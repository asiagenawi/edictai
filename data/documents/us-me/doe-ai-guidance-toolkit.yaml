summary: >-
  An interactive toolkit from the Maine Department of Education's Office of Teaching and
  Learning that pairs AI guidance with practical tools, scenarios, and learning opportunities,
  grounded in digital citizenship and computer science. Developed with Maine educators, it
  offers a framework to help shape district policies and stresses that AI should support, not
  replace, human connection and critical thinking, while promoting equity, privacy, and digital
  literacy.
