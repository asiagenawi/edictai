summary: >-
  Wisconsin Department of Public Instruction guidance for K-12 educators, librarians, and
  administrators on integrating AI. It is organized around seven focus areas: core concepts
  and goals, partner engagement and communication, ethics and data policy, security and
  infrastructure, professional development, curriculum and pedagogy, and continuous
  evaluation. Version 1.0 was created in June 2024 and version 1.1 was issued in December 2024.
