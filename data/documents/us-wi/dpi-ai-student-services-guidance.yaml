summary: Wisconsin Department of Public Instruction web guidance for school counselors, social workers,
  nurses, and psychologists on using AI in student services. It lists example uses for communication,
  prevention and intervention, administrative tasks, data analysis, and accessibility. It also covers
  AI literacy, student well-being, and social emotional learning, and summarizes profession-specific ethical
  guidelines on confidentiality, bias, data privacy, and using AI as a support tool rather than a replacement
  for professional judgment.
