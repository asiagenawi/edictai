summary: >-
  South Carolina Department of Education course standards, dated September 2023, for an
  Introduction to Artificial Intelligence elective (course code 57M0) in the career and technical
  education Information Technology cluster. The one-credit course, recommended for grades 9-10,
  covers computing systems, data and analytics, and core AI and machine learning concepts.
