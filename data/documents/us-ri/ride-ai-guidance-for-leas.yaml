summary: >-
  Non-binding guidance from the Rhode Island Department of Education, dated August 2025, on using
  AI in Rhode Island schools. It covers instructional guidance, equity and bias, meeting the needs
  of diverse learners, security and safety, college and career readiness, district operations
  and communications, and family engagement, with a getting-started checklist for districts.
