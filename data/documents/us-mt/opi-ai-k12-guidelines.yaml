summary: >-
  Advisory guidelines from the Montana Office of Public Instruction, developed with the Montana
  Digital Academy's Frontier Learning Lab, to help district and school leaders build local AI
  guidance, policy, and professional learning. Version 2.0 covers core principles for AI
  integration, an implementation roadmap, universal access, student privacy and responsible
  procurement, and a protocol for responding to malicious deepfakes and synthetic media.
