summary: >-
  Guidance from the Massachusetts Department of Elementary and Secondary Education, developed with
  its AI Task Force and ISTE+ASCD, to help district leaders create or refine local AI guidance and
  policies. It sets core principles for AI use, including data privacy and security, an
  implementation framework and self-assessment for districts, and a summary of legal foundations
  covering student privacy, civil rights, procurement, and deepfakes.
undated: true
provisions:
  - type: issues-model-policy
    description: Recommends core principles that districts adopt to anchor local AI policy and guidance development.
    education_levels:
      - k12
    citation:
      source_url: https://www.doe.mass.edu/edtech/ai/ai-guidance.pdf
      locator: Core Principles for AI Use in Massachusetts Schools
      quote: To help anchor local policy and guidance development, the Department of Elementary and Secondary Education recommends that districts adopt the following
  - type: procurement-standards
    description: Advises that districts approve only AI tools vetted through a data privacy agreement process and that vendor contracts address AI capabilities, data practices, and legal compliance.
    education_levels:
      - k12
    citation:
      source_url: https://www.doe.mass.edu/edtech/ai/ai-guidance.pdf
      locator: Legal Foundations for AI Use (p. 29)
      quote: "Procurement: Districts must ensure vendor contracts address AI capabilities, data practices, and compliance with privacy and accessibility laws."
