summary: On September 16, 2026, the Florida State Board of Education adopted rules on AI and educational technology that apply to Florida College System institutions as well as school districts and charter school boards. Each must adopt policies that notify parents when an AI instructional tool is approved, let parents choose a non-AI alternative, prohibit companion-style AI and undisclosed monitoring, bar vendors from selling student data, and set academic integrity expectations.
published: '2026-09-16'
provisions:
  - type: requires-local-ai-policy
    description: Requires Florida College System institutions, along with districts and charter school boards, to adopt policies governing AI and other educational technologies.
    citation:
      source_url: https://www.fldoe.org/newsroom/latest-news/florida-sets-national-standard-for-responsible-ai-in-classroomsfrom-vpk-through-college.stml
      quote: Districts, charter school boards, and Florida College System institutions must adopt transparent policies governing AI and other educational technologies.
  - type: restricts-student-data-use
    description: Requires those policies to prohibit vendors from selling student data or using it to train agentic models.
