summary: >-
  Minnesota Department of Education principles for responsible AI use in schools, based on the
  U.S. Department of Education's 2023 AI report and the National Center on Education and the
  Economy's 2024 framework. The principles call for grounding AI use in a shared vision and
  values, keeping people at the center of decisions, advancing equity, ensuring safety, privacy,
  and effectiveness, and continuous improvement.
