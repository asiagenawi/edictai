summary: Texas A&M University System regulation, approved December 10, 2024, that implements Texas Government Code Section 2054.601 and sets a broad framework for ethical, responsible, and innovative use of AI and machine learning across system members, including education, administration, and student use. It establishes a System AI Council and lets member institutions write their own rules.
