summary: Texas A&M University System regulation, most recently revised February 18, 2026, guiding the use of generative and other AI for research. It bars using public or third-party AI tools with non-public research data, such as unpublished, export-controlled, or classified research, unless the tool is covered by a system or member contract with adequate safeguards.
