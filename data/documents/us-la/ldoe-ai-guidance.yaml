  - type: procurement-standards
    description: Provides an AI technology evaluation rubric for school systems to assess tools on data privacy, cybersecurity, and instructional criteria, and says data-sharing agreements with AI vendors must comply with R.S. 17:3913.
    education_levels:
      - k12
    citation:
      source_url: https://doe.louisiana.gov/docs/default-source/technology-footprint/ldoe-ai-guidance.pdf
      locator: Evaluating AI Technology; AI Technology Evaluation Rubric (pp. 21-27)
      quote: Data-Sharing Agreements (DSAs) between AI vendors and school systems must be crafted to ensure compliance with privacy regulations
