summary: >-
  Louisiana Department of Education guidance for K-12 schools that sets guiding principles for AI
  use, an AI literacy framework with Louisiana AI competencies for students, teachers, and leaders,
  and advice on classroom integration, career pathways, and prompting. It includes an AI technology
  evaluation rubric for vetting tools, a summary of relevant state privacy laws including
  data-sharing agreement requirements, and a sample family letter.
updated: "2026-09-03"
