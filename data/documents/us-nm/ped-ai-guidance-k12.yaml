summary: >-
  The New Mexico Public Education Department's guidance, written with the Friday Institute at
  North Carolina State University, to help districts develop their own approaches to using AI
  in teaching and learning. It covers AI literacy by grade band (K-5, 6-8, 9-12), educator
  professional development, academic integrity, data privacy, and local AI policy development,
  and introduces the M.A.Z.E. approach to evaluating AI tools.
