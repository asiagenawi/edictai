summary: University System of Georgia Board of Regents policy requiring every USG institution to develop and implement policies or procedures for the ethical, responsible, and secure use of AI in academic contexts. Institutional rules must cover, at minimum, topics such as the definition of AI, ethical principles, accountability for AI-generated content, training for faculty, staff, and students, and student privacy.
