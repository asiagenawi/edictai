summary: >-
  The Idaho Department of Education's statewide K-12 framework for generative AI, developed
  under SB 1227 (2026) by a working group of educators, technology leaders, and cybersecurity
  experts. It sets guiding principles (including that AI does not replace a teacher), and covers
  AI literacy, training, age appropriateness, appropriate and inappropriate uses, academic
  integrity and assessment, and platform purchasing, with an Idaho School Boards Association
  draft model policy for districts.
undated: true
provisions:
  - type: prohibits-ai-replacing-educators
    description: States as a guiding principle that AI does not replace a teacher.
    education_levels:
      - k12
    citation:
      source_url: https://www.sde.idaho.gov/wp-content/uploads/2026/08/Generative-Artificial-Intelligence-in-Education-Framework.pdf
      locator: p. 5, Guiding Principles
      quote: AI does not replace a teacher.
  - type: procurement-standards
    description: >-
      Recommends a vetting process for AI platforms, vendor questions on data use and
      compliance, and a data privacy agreement with every selected vendor.
    education_levels:
      - k12
    citation:
      source_url: https://www.sde.idaho.gov/wp-content/uploads/2026/08/Generative-Artificial-Intelligence-in-Education-Framework.pdf
      locator: pp. 15-16, Platform Purchasing
      quote: >-
        After a tool is selected, a district, school or charter should always require a Data
        Privacy Agreement (DPA) with the vendor.
