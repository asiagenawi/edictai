summary: >-
  Wyoming Department of Education framework to help school districts write their own policies
  on appropriate and responsible use of AI, particularly generative AI, in instruction, school
  management, and district operations. It sets out guiding principles including AI literacy,
  academic integrity, and human agency, and a student AI usage continuum. The guidance is
  advisory; districts write their own policies.
