summary: >-
  A North Dakota Department of Public Instruction web framework to help schools plan AI
  implementation around a "Human - Technology - Human" workflow in which people review AI output
  for accuracy and bias. It offers implementation checklists for school leadership, educators,
  business and IT operations, policy and legal considerations, and public outreach, along with
  definitions, grade-band and accessibility considerations, and resource lists.
