summary: >-
  North Carolina Department of Public Instruction recommendations for responsible use of
  generative AI and AI literacy in public schools, organized around the five focus areas of the
  state Digital Learning Plan (leadership and vision, human capacity, curriculum and
  instruction, data privacy and cybersecurity, and technology infrastructure). It is a living
  document, first published January 16, 2024 and revised repeatedly since, with additions
  such as the EVERY responsible-use framework, tool evaluation resources, and guidance on
  deepfakes and AI social companions.
