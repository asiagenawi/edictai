summary: >-
  A New Jersey Department of Education web page giving an overview of AI in K-12 schools and
  general principles for ethical and effective classroom use, such as building AI literacy
  before tool use, keeping humans in the loop, verifying AI output, and valuing student process
  over products. It links to a curated list of AI learning and teaching resources and to the
  department's AI Innovation in Education grant for districts.
