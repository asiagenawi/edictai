summary: Guidance from the Delaware Department of Education, developed with the Delaware Council on Educational Technology and its Generative AI Subcommittee, to help school districts and charter schools address generative AI in local policies. It explains what AI is, sets out key policy areas such as student data protection and equitable access, offers classroom integration and academic integrity strategies, and suggests a framework for educator professional learning.
