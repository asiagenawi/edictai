summary: >-
  Michigan Department of Education administrative guidance that walks districts through a
  phased, roughly year-long plan for responsible AI use, from forming a workgroup and updating
  acceptable use and board policies to classroom practice, professional development,
  procurement, community engagement, and evaluation within the state's MICIP continuous
  improvement cycle. It emphasizes human oversight of high-stakes decisions and compliance with
  FERPA, COPPA, and CIPA.
