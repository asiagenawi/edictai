summary: >-
  A short Michigan Department of Education guide for districts with limited capacity, listing
  essential practices for safe and equitable AI use: purposeful use, privacy and academic
  integrity, AI literacy, and human oversight. It offers a starter checklist, such as adding AI
  language to acceptable use policies, setting disclosure norms, and adding vendor AI clauses to
  procurement templates.
