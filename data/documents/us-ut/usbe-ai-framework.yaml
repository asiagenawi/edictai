summary: >-
  Utah State Board of Education guidance for students, staff, and school communities on
  responsible use of AI, especially generative AI, in instruction, school management, and
  operations where local policy permits. It sets guiding principles, lists responsible and
  prohibited uses (including AI-manipulated media for bullying, plagiarism, and uses that
  compromise privacy), and addresses safety, security, and privacy. The version posted at access
  is dated March 2026 and is described as a living document.
updated: 2026-03
provisions:
  - type: academic-integrity-rules
    description: >-
      States that students should not submit AI-generated work as their own and that teachers will
      clarify when and how AI tools may be used on assignments.
    education_levels:
      - k12
    citation:
      source_url: https://schools.utah.gov/informationtechnology/artificialintelligence/_artificialintelligence/AIFramework.pdf
      locator: p. 11, Prohibited Use of AI Tools
      quote: Students should not submit AI-generated work as their original work.
  - type: addresses-deepfakes
    description: >-
      Prohibits using AI tools to manipulate media to impersonate others for bullying, harassment,
      or intimidation.
    education_levels:
      - k12
    citation:
      source_url: https://schools.utah.gov/informationtechnology/artificialintelligence/_artificialintelligence/AIFramework.pdf
      locator: p. 11, Prohibited Use of AI Tools
      quote: >-
        Using AI tools to manipulate media to impersonate others for bullying, harassment, or any
        form of intimidation is strictly prohibited.
