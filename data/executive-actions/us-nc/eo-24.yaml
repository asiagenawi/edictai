summary: >-
  Governor Josh Stein created the North Carolina AI Leadership Council, whose members include
  higher education representatives and a K-12 education representative, and an AI Accelerator
  within the Department of Information Technology to coordinate state AI governance, pilots, and
  training. The order calls for a statewide AI literacy strategy and public AI literacy
  trainings developed with partners including the Department of Public Instruction. It remains
  in effect until December 31, 2028 unless rescinded.
