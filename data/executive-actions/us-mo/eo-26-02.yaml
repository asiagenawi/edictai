summary: >-
  Governor Mike Kehoe ordered a strategic framework for AI use in state government, a review of
  the business climate for AI companies, and a review of data center energy demands. It directs
  the Department of Higher Education and Workforce Development to evaluate AI programming at
  public colleges and universities and to recommend and establish AI-focused degrees,
  certifications, apprenticeships, and retraining, with findings due by November 30, 2026.
