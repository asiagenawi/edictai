topics:
  - task-force
  - workforce
summary: >-
  Governor Phil Scott created an advisory Vermont AI Economic Taskforce to assess AI's effect
  on the state economy sector by sector and recommend actions, investments, and legislation.
  Members include an education-sector representative, and the taskforce must coordinate with
  institutions of higher education on workforce initiatives. Annual reports are due January 1,
  2027 and January 1, 2028; the order runs two years unless extended.
provisions:
  - type: creates-task-force
    description: Establishes an advisory AI Economic Taskforce that includes an education-sector representative and coordinates with institutions of higher education on workforce alignment.
    education_levels:
      - postsecondary
    citation:
      source_url: https://governor.vermont.gov/sites/scott/files/documents/Establishing%20the%20Vermont%20AI%20Economic%20Taskforce%20-%20EO%2004-26.pdf
      locator: Para. 8
      quote: >-
        The Taskforce shall coordinate with the Agency of Commerce and Community Development,
        the Department of Labor, the State Workforce Development Board, and institutions of
        higher education to ensure alignment with existing economic development and workforce
        initiatives.
