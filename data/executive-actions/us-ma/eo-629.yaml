summary: >-
  Governor Maura Healey's order creating an AI Strategic Task Force, led by the secretaries of
  economic development and technology services, to study AI's impact on the state, including on
  higher education institutions, and advise the Governor. Members include higher education
  representatives, and objectives include assessing AI's workforce impacts and training needs.
provisions:
  - type: creates-task-force
    description: Establishes the AI Strategic Task Force to study AI and generative AI and their impact on the state, including higher education institutions, and to report recommendations to the Governor.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.mass.gov/executive-orders/no-629-establishing-an-artificial-intelligence-strategic-task-force
      locator: Section 3
      quote: to study AI and GenAI technology and its impact on the state, including with respect to its employees, constituents, private business, and higher education institutions
