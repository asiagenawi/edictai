summary: >-
  Governor Jay Inslee's order directing executive agencies to assess and set guidelines for
  state government use and procurement of generative AI. It also directs the Workforce
  Training and Education Coordinating Board to create research opportunities and partnerships
  that expose students and researchers to generative AI and support AI workforce training.
provisions:
  - type: ai-workforce-program
    description: Directs the Workforce Training and Education Coordinating Board to identify and create research partnerships to expand generative AI technology and education and accelerate AI workforce development.
    education_levels:
      - postsecondary
    citation:
      source_url: https://governor.wa.gov/sites/default/files/exe_order/24-01%20-%20Artificial%20Intelligence%20(tmp).pdf
      locator: Para. 10
      quote: >-
        The goals will be to expose students and researchers to emerging opportunities
        regarding the development of generative AI Systems and accelerate training and AI
        workforce development.
