summary: >-
  Governor Phil Murphy created an advisory Artificial Intelligence Task Force, whose members
  include the Commissioner of Education and the Secretary of Higher Education, to study the
  impacts of emerging AI and recommend government actions, with a report due within 12 months.
  The order also directs the Office of the Secretary of Higher Education to review AI as a
  research opportunity for New Jersey colleges and universities.
