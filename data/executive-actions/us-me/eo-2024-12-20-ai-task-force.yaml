summary: >-
  Governor Janet Mills established the Maine Artificial Intelligence Task Force to study the
  implications of AI for Maine and recommend ways to prepare the economy and workforce, protect
  residents from harmful uses, and deploy AI in public agencies. Members include the
  Commissioner of Education, the Chancellor of the University of Maine System, and the
  President of the Maine Community College System; a public report was due by October 31, 2025.
