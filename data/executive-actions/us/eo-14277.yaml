summary: >-
  Sets a federal policy of promoting AI literacy and proficiency through AI
  education, educator training, and early exposure to AI concepts. Creates the
  White House Task Force on Artificial Intelligence Education, chaired by the
  OSTP Director, and directs it to plan a Presidential Artificial Intelligence
  Challenge for students and educators. Directs the Department of Education to
  issue guidance on using grant funds for AI and to prioritize AI in teacher
  training grants, and directs the Department of Labor to expand AI-related
  apprenticeships and high school AI coursework.
provisions:
  - type: creates-task-force
    description: Establishes the White House Task Force on Artificial Intelligence Education, chaired by the Director of the Office of Science and Technology Policy.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/04/28/2025-07368/advancing-artificial-intelligence-education-for-american-youth
      locator: Sec. 4(a)-(b)
      quote: There is hereby established the White House Task Force on Artificial Intelligence Education (Task Force).
  - type: issues-model-policy
    description: Directs the Secretary of Education to issue guidance within 90 days on using formula and discretionary grant funds to improve education outcomes using AI.
    education_levels:
      - k12
      - postsecondary
    citation:
      source_url: https://www.federalregister.gov/documents/2025/04/28/2025-07368/advancing-artificial-intelligence-education-for-american-youth
      locator: Sec. 6(c)
      quote: the Secretary of Education shall issue guidance regarding the use of formula and discretionary grant funds to improve education outcomes using AI
  - type: educator-pd-requirement
    description: Directs the Secretary of Education to prioritize the use of AI in discretionary teacher-training grant programs, including professional development so educators can integrate AI fundamentals into all subject areas.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/04/28/2025-07368/advancing-artificial-intelligence-education-for-american-youth
      locator: Sec. 7(a)
      quote: providing professional development for all educators, so they can integrate the fundamentals of AI into all subject areas
  - type: ai-workforce-program
    description: Directs the Secretary of Labor to grow Registered Apprenticeships in AI-related occupations and to support AI courses and certification programs for high school students.
    citation:
      source_url: https://www.federalregister.gov/documents/2025/04/28/2025-07368/advancing-artificial-intelligence-education-for-american-youth
      locator: Sec. 8(a), 8(d)
      quote: Prioritizing the development and growth of Registered Apprenticeships in AI-related occupations.
