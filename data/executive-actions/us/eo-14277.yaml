  notes: >-
    Text checked against the Federal Register publication (FR Doc. 2025-07368,
    90 FR 17519, published 2025-04-28). Legacy record framed the order as
    K-12 only; the order also covers postsecondary teacher preparation (HEA
    Title II) and dual enrollment, so both education levels are set. Executive
    Order 14434 (2026-09-29) directs agencies to use "Super Intelligence (SI)"
    in place of "AI", and federal pages now refer to the Task Force and the
    Challenge with "SI"; it does not amend or revoke this order.
