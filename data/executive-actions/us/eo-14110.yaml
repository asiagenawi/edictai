summary: >-
  Government-wide executive order on AI safety, security, and civil rights.
  Its education provision directed the Secretary of Education to develop
  resources, policies, and guidance on safe, responsible, and
  nondiscriminatory AI use in education, including an AI toolkit for
  education leaders. It was revoked by Executive Order 14148 on January 20,
  2025.
