  topic: academic-integrity
  education_levels: [k12, postsecondary]
- code: regulates-ai-assessment
  name: Regulates AI in grading, testing, or proctoring
  topic: assessment
  education_levels: [k12, postsecondary]
- code: procurement-standards
  name: Sets procurement or vetting standards for AI tools
  topic: procurement
  education_levels: [k12, postsecondary]
- code: addresses-deepfakes
  name: Addresses deepfakes involving students or staff
  topic: synthetic-media
  education_levels: [k12, postsecondary]
- code: chatbot-minor-protections
  name: Protections for minors using AI chatbots
  topic: safety-wellbeing
  education_levels: [k12]
- code: creates-task-force
  name: Creates a task force, council, or study
  topic: task-force
  education_levels: [k12, postsecondary]
- code: appropriates-funding
