# Provision types: what a policy actually does, at the level of a single clause.
# These are the columns of the cross-state comparison grid. They are
# descriptive, not evaluative -- a provision type records that a requirement
# exists, never whether it is good policy.
- code: requires-ai-literacy-instruction
  name: Requires AI literacy instruction
  topic: ai-literacy
  education_levels: [k12, postsecondary]
- code: ai-in-standards
  name: Adds AI to content standards or frameworks
  topic: curriculum-standards
  education_levels: [k12]
- code: ai-course-or-graduation-requirement
  name: Creates an AI course or graduation requirement
  topic: curriculum-standards
  education_levels: [k12, postsecondary]
- code: requires-local-ai-policy
  name: Requires districts or institutions to adopt an AI policy
  topic: local-policy-requirement
  education_levels: [k12, postsecondary]
- code: issues-model-policy
  name: Directs an agency to issue guidance or a model policy
  topic: local-policy-requirement
  education_levels: [k12, postsecondary]
- code: educator-pd-requirement
  name: Requires or funds educator AI professional development
  topic: educator-training
  education_levels: [k12, postsecondary]
- code: educator-prep-requirement
  name: Adds AI to educator preparation or licensure
  topic: educator-training
  education_levels: [k12, postsecondary]
- code: restricts-student-data-use
