id: us-pa-2025-2026-hb-2785
jurisdiction: us-pa
session: 2025-2026
identifier: HB 2785
title: In books, furniture and supplies, providing for procurement and technology requirements.
classification: bill
education_levels:
  - k12
topics:
  - procurement
  - student-privacy
  - data-governance
summary: Requires school entities that contract for artificial intelligence-related technology to include
  specified contract terms, including data security, a ban on collecting students' biometric information,
  and data deletion after termination. Directs the Department of Education to publish implementation guidelines
  and requires AI vendors serving schools to report their products to the department.
provisions:
  - type: procurement-standards
    description: School entities contracting for AI-related technology must include specified provisions
      in the contract.
    citation:
      source_url: https://www.palegis.us/legislation/bills/text/PDF/2025/0/HB2785/PN4005
      locator: Section 807.2(a)
      quote: 'If a school entity chooses to contract with a third party that provides F OR artificial
        intelligence-related technology, programs or platforms, the school entity shall require the following
        provisions in the contract:'
  - type: restricts-student-data-use
    description: Contracts must prohibit collection of students' biometric information through the vendor's
      AI technology.
    citation:
      source_url: https://www.palegis.us/legislation/bills/text/PDF/2025/0/HB2785/PN4005
      locator: Section 807.2(a)(5)
      quote: A prohibition on the collection of a student's biometric information through the third party's
        artificial intelligence-related technology, programs or platforms, except as may be required by
        law.
  - type: issues-model-policy
    description: The Department of Education must post guidelines for school entities and vendors to implement
      the section.
    citation:
      source_url: https://www.palegis.us/legislation/bills/text/PDF/2025/0/HB2785/PN4005
      locator: Section 807.2(b)
      quote: the department shall establish and post on the department's publicly accessible Internet
        website guidelines for use by a school entity and third party to implement this section.
