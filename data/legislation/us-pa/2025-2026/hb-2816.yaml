identifier: HB 2816
title: In student supports, further providing for policy relating to bullying and cyberbullying.
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Extends school bullying and cyberbullying policy requirements to nonpublic schools and defines
  cyberbullying to include the use of artificial intelligence-generated or modified media.
provisions:
  - type: addresses-deepfakes
    description: Defines cyberbullying to include conduct using AI-generated or modified media.
    citation:
      source_url: https://www.palegis.us/legislation/bills/text/PDF/2025/0/HB2816/PN3982
      locator: Section 1303.1-A(e)
      quote: using a device, system, network, Internet service, email, social media or other digital means,
        including artificial intelligence- generated or modified media, when the conduct meets the criteria
        in paragraphs (1), (3) and (4) of the definition of "bullying."
