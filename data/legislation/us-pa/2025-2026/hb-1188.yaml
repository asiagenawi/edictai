id: us-pa-2025-2026-hb-1188
jurisdiction: us-pa
session: 2025-2026
identifier: HB 1188
title: Providing for protection of State-owned electronic devices and networks from applications controlled
  by foreign adversaries.
classification: bill
education_levels:
  - k12
topics:
  - procurement
summary: Prohibits AI and AI platforms operated by companies controlled by foreign adversaries from being
  installed on, or accessed through, devices and wireless networks owned by the Commonwealth, political
  subdivisions, and local education agencies.
provisions:
  - type: procurement-standards
    description: Bars foreign-adversary-controlled AI from devices owned or operated by entities including
      local education agencies.
    citation:
      source_url: https://www.palegis.us/legislation/bills/text/PDF/2025/0/HB1188/PN1338
      locator: Sec. 1, new 71 Pa.C.S. § 7302(a)
      quote: On device.--A State-owned electronic device may not have an unauthorized foreign adversary
        controlled artificial intelligence or unauthorized foreign adversary controlled artificial intelligence
        platform downloaded or installed on the device.
