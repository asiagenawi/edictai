id: us-pa-2025-2026-sb-631
jurisdiction: us-pa
session: 2025-2026
identifier: SB 631
title: Providing for parental consent for virtual mental health services provided by a school entity.
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - instructional-use
summary: Requires school entities to obtain annual parental consent before providing or coordinating virtual
  mental health services for students under 18. Defines virtual mental health services to include behavioral
  health support provided by artificial intelligence.
provisions:
  - type: requires-disclosure
    description: School entities may not provide virtual mental health services, which include AI-provided
      behavioral health support, without parental consent.
    citation:
      source_url: https://www.palegis.us/legislation/bills/text/PDF/2025/0/SB0631/PN0635
      locator: Section 3(d)
      quote: A school entity may not provide or coordinate any virtual mental health services for a student
        whose parent or guardian has not provided consent under this section.
