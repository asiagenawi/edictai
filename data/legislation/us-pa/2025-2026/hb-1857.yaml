id: us-pa-2025-2026-hb-1857
jurisdiction: us-pa
session: 2025-2026
identifier: HB 1857
title: Requiring business entities to disclose the use of artificial intelligence in certain consumer
  interactions; establishing the right of consumers to human review in high-impact decisions; and providing
  for enforcement by Attorney General.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - institutional-operations
  - equity-access
summary: Requires business entities that use artificial intelligence in consumer interactions to disclose
  that use and to provide access to a human representative on request. Gives consumers a right to human
  review of high-impact decisions, defined to include decisions affecting education.
provisions:
  - type: requires-disclosure
    description: Defines high-impact decisions, which carry a right to human review of AI-involved interactions,
      to include education.
    citation:
      source_url: https://www.palegis.us/legislation/bills/text/PDF/2025/0/HB1857/PN2298
      locator: Section 2
      quote: '"High-impact decision." A decision or determination that materially affects an individual''s
        legal rights, employment, housing, credit, education, health care or access to government benefits.'
