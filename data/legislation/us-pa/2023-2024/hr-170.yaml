id: us-pa-2023-2024-hr-170
jurisdiction: us-pa
session: 2023-2024
identifier: HR 170
title: Directing the Joint State Government Commission to establish an advisory committee to conduct a
  study on the field of artificial intelligence and its impact and potential future impact in Pennsylvania.
classification: resolution
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - academic-integrity
summary: Directs the Joint State Government Commission to establish an advisory committee to study artificial
  intelligence and its impact in Pennsylvania. The study includes an evaluation of how AI has affected
  students' academic records and help for State-related university leaders in curbing student AI use.
provisions:
  - type: creates-task-force
    description: The advisory committee's report must evaluate AI's effect on students' academic record
      and help university leaders curb student AI use.
    citation:
      source_url: https://www.legis.state.pa.us/cfdocs/legis/PN/Public/btCheck.cfm?txtType=PDF&sessYr=2023&sessInd=0&billBody=H&billTyp=R&billNbr=0170&pn=3488
      locator: Resolved clause, item (10)
      quote: An evaluation of how AI has affected the academic track record of this Commonwealth's students,
        and assist State-related university leaders with identifying solutions to curbing the usage of
        AI by their students.
