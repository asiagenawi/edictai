id: us-pa-2023-2024-sb-913
jurisdiction: us-pa
session: 2023-2024
identifier: SB 913
title: Providing for parental consent for virtual mental health services provided by a school entity.
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - instructional-use
summary: Requires school entities to obtain annual parental consent before providing or coordinating virtual
  mental health services for students under 18. Defines virtual mental health services to include behavioral
  health support provided by artificial intelligence.
provisions:
  - type: requires-disclosure
    description: School entities must obtain annual parental consent before providing virtual mental health
      services, which include AI-provided behavioral health support.
    citation:
      source_url: https://www.legis.state.pa.us/cfdocs/legis/PN/Public/btCheck.cfm?txtType=PDF&sessYr=2023&sessInd=0&billBody=S&billTyp=B&billNbr=0913&pn=1788
      locator: Section 3(c)
      quote: a school entity providing or coordinating virtual mental health services shall annually obtain
        a completed form with the consent of the parent or guardian of a student who is under 18 years
        of age prior to providing or coordinating virtual mental health services to the student.
