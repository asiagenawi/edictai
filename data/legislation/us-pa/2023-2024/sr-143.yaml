id: us-pa-2023-2024-sr-143
jurisdiction: us-pa
session: 2023-2024
identifier: SR 143
title: Directing the Joint State Government Commission to establish an advisory committee to conduct a
  study on the field of artificial intelligence and its impact and potential future impact in Pennsylvania.
classification: resolution
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - academic-integrity
summary: Directs the Joint State Government Commission to establish an advisory committee to study artificial
  intelligence and its impact in Pennsylvania. The study includes an evaluation of how AI has affected
  students' academic records and ways to help State-related university leaders curb student AI use.
provisions:
  - type: creates-task-force
    description: The advisory committee's study must evaluate AI's effect on students' academic record
      and ways to help university leaders curb student AI use.
    citation:
      source_url: https://www.legis.state.pa.us/cfdocs/legis/PN/Public/btCheck.cfm?txtType=PDF&sessYr=2023&sessInd=0&billBody=S&billTyp=R&billNbr=0143&pn=1008
      locator: Resolved clause, item (10)
      quote: An evaluation of how artificial intelligence has affected the academic track record of Pennsylvania's
        students and ways to assist State-related university leaders with identifying solutions to curbing
        the usage of artificial intelligence by students.
