jurisdiction: us-ks
session: 2025-2026
identifier: HB 2592
title: Creating the Kansas task force on artificial intelligence and emerging technologies to study such
  technologies and make recommendations to the legislature.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
summary: Creates the Kansas task force on artificial intelligence and emerging technologies to study AI's
  impacts, risks, workforce implications, and regulatory needs, and to explore AI use in state and local
  government and the responsible integration of AI into public education. Nonvoting members include appointees
  of the state board of education and the board of regents; the task force reports annually until it expires
  January 1, 2028.
provisions:
  - type: creates-task-force
    description: The task force must explore the responsible integration of AI into public education.
    citation:
      source_url: https://kslegislature.gov/li/b2025_26/measures/documents/hb2592_00_0000.pdf
      locator: Section 1(a)
      quote: The task force shall explore the use of artificial intelligence throughout the state to improve
        the efficiency and effectiveness of state and local government operations and the responsible
        integration of artificial intelligence into public education.
