summary: Enacts the Artificial Intelligence Transparency Act, requiring deployers to notify consumers
  before an AI system is used in consequential decisions, including education enrollment, and to explain
  adverse decisions and offer an appeal. Also requires companion products to disclose that they are not
  human.
provisions:
  - type: requires-disclosure
    description: Deployers must notify consumers before AI is used in consequential decisions, which include
      education enrollment.
    citation:
      source_url: https://www.nmlegis.gov/Sessions/26%20Regular/bills/house/HB0028.pdf
      locator: Sec. 3(A)
      quote: Before an artificial intelligence system is used to generate a substantial factor or make
        a consequential decision concerning a consumer, a deployer shall provide notice directly to the
        consumer
