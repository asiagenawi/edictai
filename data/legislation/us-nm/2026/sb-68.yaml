topics:
  - local-policy-requirement
  - educator-training
  - institutional-operations
summary: Enacts the Artificial Intelligence Government Use Act, requiring public bodies, defined to include
  school districts, charter schools, state schools for the deaf and blind, and public post-secondary institutions,
  to adopt policies on employee use of artificial intelligence and automated decision tools, require a
  human to make final consequential decisions, and train employees on those policies.
provisions:
  - type: requires-local-ai-policy
    description: Each public body, including school districts, charter schools, and public post-secondary
      institutions, must establish a policy on authorized employee use of AI and automated decision tools.
    citation:
      source_url: https://www.nmlegis.gov/Sessions/26%20Regular/bills/senate/SB0068.pdf
      locator: Sec. 3(A)
      quote: A public body shall establish a policy regarding the authorized uses of artificial intelligence
        and automated decision tools and technology resources by employees.
  - type: educator-pd-requirement
    description: Each public body must train its employees on its AI use policies and on appropriate use
      of AI in decision-making.
    citation:
      source_url: https://www.nmlegis.gov/Sessions/26%20Regular/bills/senate/SB0068.pdf
      locator: Sec. 4(A)
      quote: 'A public body shall train its employees on: A. its policies regarding cybersecurity and
        employee use of artificial intelligence, automated decision tools and technology resources'
