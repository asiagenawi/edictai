summary: Enacts the Artificial Intelligence Act, requiring developers and deployers of high-risk artificial
  intelligence systems to provide notice, documentation, risk management policies, and impact assessments
  to address algorithmic discrimination. Consequential decisions covered by the act include education
  enrollment and educational opportunities.
