summary: Requests the Legislative Education Study Committee to convene an education data governance and
  artificial intelligence working group during the 2025 interim. The group is to study education data
  systems, current uses of AI by students and educators, and policies to guide AI use in public schools,
  and recommend policies by October 31, 2025.
provisions:
  - type: creates-task-force
    description: Requests the Legislative Education Study Committee to convene an education data governance
      and AI working group.
    citation:
      source_url: https://www.nmlegis.gov/Sessions/25%20Regular/final/HM002.pdf
      locator: '[Page 4]'
      quote: the legislative education study committee be requested to convene an education data governance
        and artificial intelligence working group throughout the 2025 legislative interim
  - type: creates-task-force
    description: The working group is to study policies to guide AI use in public schools, including access,
      sensitive data, and human connection in classrooms.
    citation:
      source_url: https://www.nmlegis.gov/Sessions/25%20Regular/final/HM002.pdf
      locator: '[Page 6], study topic H'
      quote: current and potential policies to guide the use of artificial intelligence in public schools,
        including policies to promote access to artificial intelligence, protect sensitive data, protect
        data sovereignty and maintain meaningful human connection in classrooms
