id: us-vt-2025-2026-h-340
jurisdiction: us-vt
session: 2025-2026
identifier: H 340
title: An act relating to regulating developers and deployers of certain automated decision systems
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - assessment
  - admissions
summary: Regulates developers and deployers of automated decision systems used in consequential decisions,
  with duties to avoid algorithmic discrimination, audits, reporting, and risk management programs. Consequential
  decisions include educational and vocational training decisions such as assessment or grading, cheating
  or plagiarism detection, admissions or enrollment, and financial aid.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential decisions to include education decisions, bringing automated decision
      systems used for them under the act's anti-discrimination duties.
    citation:
      source_url: https://legislature.vermont.gov/Documents/2026/Docs/BILLS/H-0340/H-0340%20As%20Introduced.pdf
      locator: Sec. 1, 9 V.S.A. § 4193a(4)(A)
      quote: '(A) educational and vocational training, including: (i) assessment or grading, including
        detecting student cheating or plagiarism; (ii) accreditation; (iii) certification;'
