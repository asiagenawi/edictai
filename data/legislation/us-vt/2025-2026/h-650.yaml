id: us-vt-2025-2026-h-650
jurisdiction: us-vt
session: 2025-2026
identifier: H.650
title: An act relating to educational technology products
classification: bill
education_levels:
  - k12
topics:
  - student-privacy
  - procurement
  - data-governance
summary: >-
  Would require providers of student-facing educational technology products used in Vermont
  schools to register annually with the Secretary of State, and would bar schools from using
  products the Secretary of State has not certified. Certification standards must consider
  design features including use of artificial intelligence, and certified products could not
  collect non-essential student data or use it for sale or noneducational profiling. Passed the
  House in March 2026 and was referred to Senate Finance.
abstract: >-
  This bill proposes to require that providers of educational technology products register
  annually with the State. It also requires the Secretary of State to create a certification
  standard and review process for these products before they can be used by schools.
provisions:
  - type: procurement-standards
    description: Bars schools from using educational technology products not certified by the Secretary of State, whose certification standards must consider the product's use of artificial intelligence.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.vermont.gov/Documents/2026/Docs/BILLS/H-0650/H-0650%20As%20passed%20by%20the%20House%20Official.pdf
      locator: 9 V.S.A. § 2444c(a)(2), (b)(4)(B) (as passed by the House)
      quote: >-
        No school shall use an educational technology product that has not been certified by
        the Secretary of State pursuant to this section.
  - type: restricts-student-data-use
    description: Certified products may not collect non-essential student data or use collected data for sale, third-party sharing, or noneducational student profiles.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.vermont.gov/Documents/2026/Docs/BILLS/H-0650/H-0650%20As%20passed%20by%20the%20House%20Official.pdf
      locator: 9 V.S.A. § 2444c(c)(4)-(5) (as passed by the House)
      quote: >-
        create a student profile for noneducational uses, which includes targeted advertising
        and disciplinary actions
