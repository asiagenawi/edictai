id: us-vt-2025-2026-h-341
jurisdiction: us-vt
session: 2025-2026
identifier: H 341
title: An act relating to creating oversight and safety standards for developers and deployers of inherently
  dangerous artificial intelligence systems
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - institutional-operations
  - equity-access
summary: Creates oversight and safety standards for developers and deployers of high-risk, dual-use foundation,
  and generative artificial intelligence systems, with high-risk systems including those used in consequential
  decisions defined to include access to education, and requires safety and impact assessments submitted
  to the Division of Artificial Intelligence.
