id: us-vt-2025-2026-h-821
jurisdiction: us-vt
session: 2025-2026
identifier: H 821
title: An act relating to artificial intelligence
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
summary: Adds members to the Artificial Intelligence Advisory Council, including a public education representative,
  extends the Council to 2030, and directs it to review professional guidance and report on ways government
  can promote ethical and responsible use of artificial intelligence in health and human services and
  in education. Also requires disclosure of generative AI use to consumers.
provisions:
  - type: creates-task-force
    description: The AI Advisory Council must review guidance on AI use in education and report on promoting
      ethical and responsible AI use in education.
    citation:
      source_url: https://legislature.vermont.gov/Documents/2026/Docs/BILLS/H-0821/H-0821%20As%20Introduced.pdf
      locator: Sec. 2(b)(1)
      quote: summarizes ways that government can promote the ethical and responsible use of artificial
        intelligence technology in health and human services and in education
