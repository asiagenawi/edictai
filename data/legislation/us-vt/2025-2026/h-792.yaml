id: us-vt-2025-2026-h-792
jurisdiction: us-vt
session: 2025-2026
identifier: H 792
title: An act relating to liability standards for developers and deployers of artificial intelligence
  systems
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Sets products liability standards for developers and deployers of high-impact and generative
  artificial intelligence systems, including design defect, failure to warn, and safe harbor rules. High-impact
  systems include those used as a controlling factor in consequential decisions, defined to include decisions
  affecting access to education.
