summary: Regulates how businesses collect, share, and sell Vermont consumers' personal data, and requires
  data loyalty assessments of covered algorithms that use machine learning or artificial intelligence,
  including steps to mitigate harms in determining access to education and other opportunities.
provisions:
  - type: bias-or-equity-requirement
    description: Data loyalty assessments of covered algorithms must describe steps to mitigate harms,
      including in determining access to education opportunities.
    citation:
      source_url: https://legislature.vermont.gov/Documents/2026/Docs/BILLS/H-0812/H-0812%20As%20Introduced.pdf
      locator: Data loyalty assessment section, subdivision (6)(B)
      quote: making or facilitating advertising for, or determining access to or restrictions on the use
        of housing, education, employment, health care, insurance, or credit opportunities
