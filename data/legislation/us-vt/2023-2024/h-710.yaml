id: us-vt-2023-2024-h-710
jurisdiction: us-vt
session: 2023-2024
identifier: H 710
title: An act relating to regulating developers and deployers of certain artificial intelligence systems
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: Regulates developers and deployers of high-risk artificial intelligence systems that make consequential
  decisions, defined to include access to education, by requiring reasonable care against algorithmic
  discrimination, documentation, and impact assessments, and also sets impact assessment duties for generative
  AI developers.
provisions:
  - type: bias-or-equity-requirement
    description: Developers of high-risk AI used in consequential decisions, including access to education,
      must use reasonable care to avoid algorithmic discrimination.
    citation:
      source_url: https://legislature.vermont.gov/Documents/2024/Docs/BILLS/H-0710/H-0710%20As%20Introduced.pdf
      locator: Sec. 1, § 1001(4) and § 1002(a)
      quote: “Consequential decision” means any decision that has a material legal, or similarly significant,
        effect on a consumer’s access to credit, criminal justice, education, employment, health care,
        housing, or insurance.
