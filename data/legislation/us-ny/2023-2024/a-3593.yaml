id: us-ny-2023-2024-a-3593
jurisdiction: us-ny
session: 2023-2024
identifier: A 3593
title: Enacts the NY privacy act to require companies to disclose their methods of de-identifying personal
  information, to place special safeguards around data sharing and to allow consumers to obtain the names
  of all entities with whom their information is shared.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - admissions
summary: Enacts the New York Privacy Act governing collection and sharing of personal data. Requires controllers
  and processors engaged in automated decision-making affecting education enrollment, among other areas,
  to conduct annual impact assessments.
provisions:
  - type: bias-or-equity-requirement
    description: Automated decision-making affecting education enrollment, among other fields, requires
      an annual impact assessment.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A03593&term=2023&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A03593
      locator: § 3, new Gen. Bus. Law § 1102
      quote: A controller or processor engaged in automated decision-making affecting financial or lending
        services, housing, public accommodation, insurance, education enrollment, employment, health care
        services, or access to basic necessities
