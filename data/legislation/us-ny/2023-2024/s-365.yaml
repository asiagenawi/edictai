id: us-ny-2023-2024-s-365
jurisdiction: us-ny
session: 2023-2024
identifier: S 365
title: Enacts the New York privacy act to require companies to disclose their methods of de-identifying
  personal information, to place special safeguards around data sharing and to allow consumers to obtain
  the names of all entities with whom their information is shared.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: As introduced, would enact the New York privacy act, including a requirement that controllers
  or processors engaged in automated decision-making affecting education enrollment and other areas annually
  conduct an impact assessment testing for accuracy, fairness, bias, and discrimination. The AI provisions
  were removed by amendment.
provisions:
  - type: bias-or-equity-requirement
    description: Requires annual impact assessments, including bias and discrimination testing, of automated
      decision-making affecting education enrollment and other areas.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S00365&term=2023&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S00365
      locator: Introduced, § 1102(8)(c)(i)
      quote: A controller or processor engaged in automated decision-making affecting financial or lending
        services, housing, public accommodation, insurance, education enrollment, employment, health care
        services, or access to basic necessities
