jurisdiction: us-ny
session: 2023-2024
identifier: A 10583
title: Prohibits state agencies and state-owned entities from utilizing large language models or any artificial
  intelligence systems to make decisions that affect individuals' rights, benefits, or services; requires
  such decisions to be made by human personnel of the respective state agency or state-owned entity; provides
  exceptions; provides for enforcement.
classification: bill
education_levels:
  - postsecondary
topics:
  - institutional-operations
summary: Prohibits state agencies and state-owned entities, defined to include public universities, from
  using large language models or other AI systems to make decisions affecting individuals' rights, benefits,
  or services, requiring such decisions to be made by human personnel, and requires each entity to adopt
  compliance policies.
provisions:
  - type: requires-local-ai-policy
    description: State agencies and state-owned entities, including public universities, must adopt policies
      ensuring AI is not used to make decisions affecting individuals' rights, benefits, or services.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A10583&term=2023&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A10583
      locator: § 1, new State Tech. Law § 106-c(4)
      quote: Each state agency and state-owned entity shall develop and imple- ment policies and procedures
        to ensure compliance with this section.
