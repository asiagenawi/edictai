id: us-ny-2025-2026-s-1169
jurisdiction: us-ny
session: 2025-2026
identifier: S 1169
title: Regulates the development and use of certain artificial intelligence systems to prevent algorithmic
  discrimination; requires independent audits of high risk AI systems; provides for enforcement by the
  attorney general.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - admissions
  - equity-access
summary: Regulates the development and use of high-risk AI systems to prevent algorithmic discrimination,
  covering consequential decisions in education and vocational training such as accreditation, certification,
  admissions, and financial aid, and requires deployers to notify affected individuals, with independent
  audits and attorney general enforcement.
provisions:
  - type: ai-in-admissions
    description: Defines consequential decisions to include education and vocational training decisions
      on accreditation, certification, admissions, and financial aid or scholarships.
    education_levels:
      - postsecondary
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S01169&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S01169B
      locator: Sec. 105(4)(b)
      quote: '(b) Education and vocational training, including, but not limited to, all of the following:
        (i) Accreditation; (ii) Certification; (iii) Admissions; and (iv) Financial aid or scholarships.'
  - type: requires-disclosure
    description: Requires covered deployers to inform the affected person at the onset of an engagement
      that a high-risk AI system is used to make a consequential decision.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S01169&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S01169B
      locator: Sec. 108(1)
      quote: Any covered deployer shall inform the covered subject and covered agent, if applicable, at
        the immediate onset of an engagement between the covered subject and the covered deployer as to
        the use of a high-risk AI system for the making of a consequential decision
