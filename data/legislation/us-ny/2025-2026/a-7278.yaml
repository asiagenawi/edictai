id: us-ny-2025-2026-a-7278
jurisdiction: us-ny
session: 2025-2026
identifier: A 7278
title: Prohibits state agencies and state-owned entities from utilizing large language models or any artificial
  intelligence systems to make decisions that affect individuals' rights, benefits, or services; requires
  such decisions to be made by human personnel of the respective state agency or state-owned entity; provides
  exceptions; provides for enforcement.
classification: bill
education_levels:
  - postsecondary
topics:
  - institutional-operations
summary: Bars state agencies and state-owned entities, defined to include public universities, from using
  large language models or other AI systems to make decisions affecting individuals' rights, benefits,
  or services, allows advisory and research uses, and requires each entity to adopt compliance policies.
