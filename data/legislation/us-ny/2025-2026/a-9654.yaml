summary: Enacts the New York Artificial Intelligence Civil Rights Act, which bars developers and deployers
  from using covered algorithms that discriminate or cause a disparate impact and requires pre-deployment
  evaluations and annual impact assessments. Covered consequential actions include education decisions
  such as assessment, proctoring, admissions, enrollment, discipline, and financial aid.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential actions to include education decisions, bringing algorithms used
      in those decisions under the act's evaluation and anti-discrimination duties.
