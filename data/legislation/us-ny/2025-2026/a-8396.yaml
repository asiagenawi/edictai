id: us-ny-2025-2026-a-8396
jurisdiction: us-ny
session: 2025-2026
identifier: A 8396
title: Enacts the student suicide prevention act; requires the governing board or body of every local
  educational agency serving students in grades seven to twelve, to adopt policies, procedures and guidelines
  on student suicide prevention, intervention and postvention for students in such grades.
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Enacts the student suicide prevention act requiring local educational agencies serving grades
  seven to twelve to adopt suicide prevention policies, and expands the education law definition of bullying
  to include intentionally using artificial intelligence to mimic or alter a person's likeness or voice
  without consent.
provisions:
  - type: addresses-deepfakes
    description: Adds intentionally using AI to mimic or alter a person's likeness or voice without consent
      to the definition of bullying that school anti-bullying policies address.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A08396&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A08396B
      locator: Sec. 4 (definition of bullying, subd. 11)
      quote: intentionally using artificial intelligence to mimic or alter a person's likeness or voice
        without their consent
