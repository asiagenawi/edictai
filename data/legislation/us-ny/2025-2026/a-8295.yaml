id: us-ny-2025-2026-a-8295
jurisdiction: us-ny
session: 2025-2026
identifier: A 8295
title: Regulates automated decision-making by government agencies; requires agencies to conduct impact
  assessments; requires disclosure of automated decision-making tools utilized by governmental agencies.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - employment-evaluation
summary: Regulates automated decision-making by government agencies with impact assessments and disclosure,
  and amends the education law so that use of AI systems and automated decision-making tools by boards
  of education, BOCES, SUNY, CUNY, and community colleges cannot displace employees, impair collective
  bargaining agreements, or transfer employees' duties to AI.
provisions:
  - type: prohibits-ai-replacing-educators
    description: Bars use of AI systems by boards of education from displacing employees or transferring
      their duties to AI.
    education_levels:
      - k12
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A08295&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A08295D
      locator: Sec. 5, Education Law 2585(5)(b)
      quote: 'The use of such artificial intelligence systems and automated decision-making tools shall
        not result in the: (i) discharge, displace- ment or loss of position'
  - type: prohibits-ai-replacing-educators
    description: Protects the employment rights and status of SUNY, CUNY, and community college employees
      when AI systems are used.
    education_levels:
      - postsecondary
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A08295&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A08295D
      locator: Sec. 8, new Education Law 115(3)
      quote: including but not limited to terms and conditions of employment, civil service status, and
        collective bargaining unit membership status of all existing employees of the state university
        of New York, the city univer- sity of New York, or community colleges shall be preserved and protected.
