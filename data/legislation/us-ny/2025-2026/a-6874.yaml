summary: >-
  Would direct the Commissioner of Education to create a competitive grant program for AI
  literacy, funding public schools, community colleges, colleges and universities, and
  community organizations, with priority for high-need applicants. School grants could pay
  for teacher training, AI labs, and grade-level AI literacy instruction.
abstract: >-
  Establishes the Artificial Intelligence Literacy Act which establishes an artificial
  intelligence literacy in the digital equity competitive grant program.
provisions:
  - type: appropriates-funding
    description: Creates an AI literacy digital equity competitive grant program administered by the Commissioner of Education, with set shares for schools, community colleges, higher education institutions, and community organizations.
    education_levels:
