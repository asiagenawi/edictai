      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A11175&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A11175
      locator: Sec. 1, new Civil Service Law 216(2)(a)
      quote: A public employer shall notify any duly recognized and certified employee representative
        of its intention to begin any procurement process or plan to acquire or deploy any new application
        or technology that utilizes an artificial intelligence model
  - type: procurement-standards
    description: Defines covered public employers to include school districts, BOCES, SUNY, CUNY, and
      community colleges.
    citation:
