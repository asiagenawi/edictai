jurisdiction: us-ny
session: 2025-2026
identifier: A 9219
title: Requires experts in professional fields to be consulted when developing and maintaining artificial
  intelligence technology for use in such fields.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - assessment
  - curriculum-standards
summary: Requires developers of AI technology used in professional fields, including educational curriculum
  or assessment tools, to involve a credentialed professional domain expert in design, training, validation,
  and ongoing risk assessment, and to document that involvement to the attorney general.
provisions:
  - type: regulates-ai-assessment
    description: Applies the professional-expert involvement requirement to AI used in educational curriculum
      or assessment tools.
