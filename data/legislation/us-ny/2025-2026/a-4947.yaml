id: us-ny-2025-2026-a-4947
jurisdiction: us-ny
session: 2025-2026
identifier: A 4947
title: Enacts the NY privacy act to require companies to disclose their methods of de-identifying personal
  information, to place special safeguards around data sharing and to allow consumers to obtain the names
  of all entities with whom their information is shared.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - admissions
  - equity-access
summary: Enacts the New York privacy act, which gives consumers rights over their personal data and requires
  controllers and processors that use automated decision-making affecting education enrollment, among
  other fields, to conduct annual impact assessments.
provisions:
  - type: ai-in-admissions
    description: Requires annual impact assessments of automated decision-making that affects education
      enrollment and other listed fields.
    education_levels:
      - postsecondary
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A04947&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A04947
      locator: Sec. 3, new GBL 1202(c)(i)
      quote: A controller or processor engaged in automated decision-making affecting financial or lending
        services, housing, public accommodation, insurance, education enrollment, employment, health care
        services, or access to basic necessities
