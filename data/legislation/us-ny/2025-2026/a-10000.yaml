id: us-ny-2025-2026-a-10000
jurisdiction: us-ny
session: 2025-2026
identifier: A 10000
title: Makes appropriations for the support of government - State Operations Budget.
classification: bill
education_levels:
  - postsecondary
topics:
  - funding
  - workforce
summary: Makes state operations appropriations, including funds for City University of New York artificial
  intelligence initiatives, the Education Department's Empire AI Student Challenge program, State University
  of New York AI and society departments and a natural language processing AI program, and opportunity
  promise scholarships for associate's degrees in high-demand fields including artificial intelligence.
provisions:
  - type: appropriates-funding
    description: Appropriates $7,500,000 for CUNY artificial intelligence initiatives under a plan approved
      by the budget director.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A10000&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A10000D
      locator: City University of New York appropriations, item 15557
      quote: For services and expenses of artificial intelligence initiatives, provided that such funds
        shall be allocated pursuant to a plan approved by the director of the budget (15557)
  - type: appropriates-funding
    description: Appropriates $750,000 to the Education Department for the Empire AI Student Challenge
      program.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A10000&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A10000D
      locator: Education Department appropriations, Empire AI Student Challenge item
      quote: For services and expenses of the Empire AI Student Challenge program, pursuant to a plan
        developed by the commissioner of education and approved by the director of the budget.
  - type: ai-workforce-program
    description: Funds opportunity promise scholarships for SUNY associate's degree programs in high-demand
      fields that include artificial intelligence.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A10000&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A10000D
      locator: State University of New York appropriations, opportunity promise scholarship item
      quote: in an approved program directly leading to an associate's degree in a high-demand field including
        but not limited to advanced manufacturing, technology, cybersecurity, engineering, artificial
        intelligence
