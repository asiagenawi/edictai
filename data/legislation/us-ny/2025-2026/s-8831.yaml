id: us-ny-2025-2026-s-8831
jurisdiction: us-ny
session: 2025-2026
identifier: S 8831
title: Provides for the use of automated employment decision-making tools and artificial intelligence
  systems by a county, city, town, village, school district, board of cooperative educational services,
  county vocational education and extension board, district corporation, the state university of New York,
  the city university of New York, or community college; amends the effectiveness thereof.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - employment-evaluation
summary: Governs use of automated employment decision tools and AI systems by local governments, school
  districts, BOCES, SUNY, CUNY, and community colleges, and amends the education law so that AI use cannot
  displace school district, SUNY, CUNY, or community college employees, transfer their duties to AI, or
  impair collective bargaining rights.
provisions:
  - type: prohibits-ai-replacing-educators
    description: Bars use of AI systems by boards of education from displacing school district employees
      or impairing collective bargaining agreements.
    education_levels:
      - k12
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S08831&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S08831
      locator: Sec. 9, Education Law 2585(5)(b)
      quote: (i) discharge, displace- ment or loss of position, including partial displacement such as
        a reduction in the hours of non-overtime work, wages, or employment bene- fits, or result in the
        impairment of existing collective bargaining agreements
  - type: prohibits-ai-replacing-educators
    description: Bars AI use from transferring SUNY employees' duties to an AI system.
    education_levels:
      - postsecondary
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S08831&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S08831
      locator: Sec. 13, Education Law 355-a(14)(b)
      quote: (ii) transfer of duties and functions currently performed by employees of the state university
        of New York to an artificial intelligence system.
  - type: prohibits-ai-replacing-educators
    description: Bars AI use from transferring community college employees' duties to an AI system.
    education_levels:
      - postsecondary
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S08831&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S08831
      locator: Sec. 15
      quote: (ii) transfer of existing duties and functions currently performed by employees of each community
        college to an artificial intelligence system.
