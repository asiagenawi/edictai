id: us-ny-2025-2026-s-10133
jurisdiction: us-ny
session: 2025-2026
identifier: S 10133
title: Prohibits the use of most artificial intelligence in classrooms prior to high school except for
  AI used for diagnostic purposes or explicit instruction interventions for students with disabilities.
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
summary: Prohibits the use of artificial intelligence in classrooms before ninth grade, except for diagnostic
  purposes or explicit instruction interventions for students with disabilities, allows school staff to
  use AI for administrative and planning purposes, and requires the commissioner to give districts guidance
  on permissible uses.
provisions:
  - type: limits-ai-instructional-use
    description: Bans AI in classrooms before ninth grade, with exceptions for diagnostic use and interventions
      for students with disabilities.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S10133&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S10133
      locator: Sec. 1, new Education Law 115(2)
      quote: No artificial intelligence shall be used in classrooms in schools prior to ninth grade; provided,
        however, AI may be used for diagnostic purposes or explicit instruction interventions for students
        with disa- bilities.
  - type: issues-model-policy
    description: Requires the commissioner to provide school districts with guidance on permissible uses
      and best practices.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S10133&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S10133
      locator: Sec. 1, new Education Law 115(2)
      quote: The commissioner shall provide school districts with guidance regarding permissible uses
        and best practices regarding such uses.
