identifier: A 9190
title: Prohibits the use of most artificial intelligence in classrooms prior to high school
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - local-policy-requirement
summary: >-
  Would ban the use of artificial intelligence in classrooms before ninth grade, except for
  diagnostic uses or explicit instruction interventions for students with disabilities. The
  Commissioner of Education would give districts guidance on permitted uses; teachers and
  staff could still use AI for administrative and planning work.
abstract: >-
  Prohibits the use of most artificial intelligence in classrooms prior to high school except
  for AI used for diagnostic purposes or explicit instruction interventions for students with
  disabilities.
provisions:
  - type: limits-ai-instructional-use
