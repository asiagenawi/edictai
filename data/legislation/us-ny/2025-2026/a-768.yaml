id: us-ny-2025-2026-a-768
jurisdiction: us-ny
session: 2025-2026
identifier: A 768
title: Enacts the "New York artificial intelligence consumer protection act", in relation to preventing
  the use of artificial intelligence algorithms to discriminate against protected classes.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - admissions
summary: Enacts the New York artificial intelligence consumer protection act, requiring developers and
  deployers of high-risk artificial intelligence decision systems used for consequential decisions, including
  education enrollment or education opportunity, to take reasonable care against algorithmic discrimination,
  document their systems, manage risk, and make disclosures.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential decisions to include education enrollment or education opportunity,
      bringing those AI decision systems under the act.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A00768&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A00768
      locator: § 1550(4)
      quote: '"Consequential decision" shall mean any decision that has a material legal or similarly
        significant effect on the provision or denial to any consumer of, or the cost or terms of, any:
        (a) education enrollment or education opportunity'
  - type: bias-or-equity-requirement
    description: Requires deployers of high-risk AI decision systems to use reasonable care to protect
      consumers from algorithmic discrimination.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=A00768&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#A00768
      locator: § 1552(1)(a)
      quote: each deployer of a high-risk artificial intelligence decision system shall use reasonable
        care to protect consumers from any known or reasonably foreseeable risks of algorithmic discrimination
