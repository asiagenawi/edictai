topics:
  - ai-literacy
  - funding
  - educator-training
  - equity-access
summary: As amended in an earlier print (S. 9006-B), would establish an artificial intelligence literacy
  digital equity competitive grant program under the commissioner of education, with grants to public
  schools, community colleges, colleges, and community organizations for AI literacy, teacher training,
  labs, and programs. The AI provisions were removed by amendment.
provisions:
  - type: appropriates-funding
    description: Would direct the commissioner to establish a competitive grant program for AI literacy
      efforts at academic institutions and community organizations.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S09006&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S09006B
      locator: Amended (S. 9006-B), § 30, new Education Law § 115(2)(a)
      quote: The commissioner shall establish an artificial intelligence literacy digital equity competitive
        grant program which shall provide grants to academic institutions and community organizations
        to support artificial intelligence literacy efforts.
  - type: educator-pd-requirement
    description: Would allow school grants to fund teacher training and certification for AI literacy.
    education_levels:
      - k12
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S09006&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S09006B
      locator: Amended (S. 9006-B), § 30, new Education Law § 115(2)(f)
      quote: '(f) Such program shall provide grants to public elementary and secondary schools and charter
        schools to be used for: (i) providing teachers with training and certification to support artificial
        intelligence literacy efforts in schools;'
  - type: bias-or-equity-requirement
    description: Would give grant priority to applicants with high need, such as limited computer science
      access or many low-income students.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S09006&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S09006B
      locator: Amended (S. 9006-B), § 30, new Education Law § 115(2)(b)
      quote: a high level of need, as determined by factors including, but not limited to, lack of access
        to computer science education, a high percentage of students or community members from low-income
        households, limited technological infrastructure, or geographic barriers to digital inclusion
