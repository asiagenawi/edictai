summary: Makes state operations appropriations for the 2026-27 fiscal year, including $7,500,000 for City
  University of New York artificial intelligence initiatives, $10,000,000 for State University of New
  York departments of AI and society and a natural language processing AI program, and $750,000 for an
  Empire AI Student Challenge program under a plan developed by the commissioner of education.
provisions:
  - type: appropriates-funding
    description: Appropriates funds to the City University of New York for artificial intelligence initiatives.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S09000&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S09000D
      locator: City University of New York appropriations
      quote: For services and expenses of artificial intelligence initiatives, provided that such funds
        shall be allocated pursuant to a plan approved by the director of the budget (15557)
  - type: appropriates-funding
    description: Appropriates funds to the State University of New York for departments of AI and society
      and a natural language processing AI program.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S09000&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S09000D
      locator: State University of New York appropriations
      quote: For services and expenses of departments of AI and society and the SUNY natural
  - type: appropriates-funding
    description: Funds an Empire AI Student Challenge program through the Education Department.
    citation:
      source_url: https://assembly.state.ny.us/leg/?default_fld=&bn=S09000&term=2025&Summary=Y&Actions=Y&Text=Y&Committee%26nbspVotes=Y&Floor%26nbspVotes=Y#S09000D
      locator: Education Department appropriations
      quote: For services and expenses of the Empire AI Student Challenge program, pursuant to a plan
        developed by the commissioner of education and approved by the director of the budget.
