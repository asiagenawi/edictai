identifier: HB 1296
title: Artificial intelligence inventory and policies.
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - academic-integrity
  - procurement
  - instructional-use
summary: >-
  Would have required the Indiana Department of Education to issue guidelines and a model
  policy on school AI policies, keep an inventory of AI platforms that teachers and
  administrators could submit for review, and survey teachers and students about AI. Schools
  would have had to adopt and post AI policies, and could not penalize a student based solely on
  an AI detector's evidence. The bill was referred to the House Education Committee and did not
  advance.
abstract: >-
  Requires the department of education (department) to establish the following: (1) Guidelines
  and a model policy regarding school artificial intelligence policies. (2) An inventory of
  artificial intelligence platforms that includes certain information. (3) A process and review
  by which teachers and school administrators may submit an artificial intelligence platform for
  inclusion on the inventory. Requires the department to: (1) conduct a survey of teachers and
  students regarding artificial intelligence platforms; and (2) submit a report regarding the
  results of the survey to the governor, legislative council, and members of the artificial
  intelligence task force. Requires school corporations and charter schools to adopt, post, and
  communicate to students a school policy regarding artificial intelligence. Prohibits school
  corporations, charter schools, and employees of a school corporation or charter school from
  penalizing a student based solely on evidence provided by an artificial intelligence detector.
