id: us-md-2026-hb-1057
jurisdiction: us-md
session: "2026"
identifier: HB 1057
title: Education - Artificial Intelligence - Guidelines, Professional Development, and Collaborative (Artificial
  Intelligence Ready Schools Act)
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - local-policy-requirement
  - procurement
  - educator-training
  - ai-literacy
  - task-force
summary: Requires the State Department of Education to provide guidance on artificial intelligence to
  local school systems, educators, parents, and students, and requires each local school system to have
  an AI policy aligned with that guidance and to designate an AI coordinator. Requires the Department
  to publish a rubric that local school systems must use to evaluate AI tools, provide AI professional
  development to educators and school leaders, and establishes a Maryland AI Education Collaborative.
provisions:
  - type: issues-model-policy
    description: Requires the Department to provide AI guidance to local school systems, educators, parents,
      and students through an online platform.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/bills/hb/hb1057t.pdf
      locator: Section 1, new Subtitle 22, section on Department guidance, (A)(1)
      quote: 'THE DEPARTMENT SHALL PROVIDE GUIDANCE ON ARTIFICIAL INTELLIGENCE TO LOCAL SCHOOL SYSTEMS,
        EDUCATORS, PARENTS, AND STUDENTS THROUGH AN ONLINE PLATFORM THAT:'
  - type: requires-local-ai-policy
    description: Requires each local school system to have an AI policy aligned with the state guidance.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/bills/hb/hb1057t.pdf
      locator: Section 1, new Subtitle 22, section on Department guidance, (C)
      quote: EACH LOCAL SCHOOL SYSTEM SHALL HAVE AN ARTIFICIAL INTELLIGENCE POLICY ALIGNED WITH THE GUIDANCE.
  - type: procurement-standards
    description: Requires local school systems to use a Department rubric when reviewing and selecting
      AI tools.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/bills/hb/hb1057t.pdf
      locator: Section 1, new Subtitle 22, section on Department guidance, rubric paragraph (3)
      quote: EACH LOCAL SCHOOL SYSTEM SHALL USE THE RUBRIC AND OTHER EVALUATIVE TOOLS DEVELOPED BY THE
        DEPARTMENT IN THE REVIEW AND SELECTION OF ARTIFICIAL INTELLIGENCE TOOLS FOR USE WITHIN THE LOCAL
        SCHOOL SYSTEM.
  - type: educator-pd-requirement
    description: Requires the Department to provide AI professional development to educators and school
      leaders.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/bills/hb/hb1057t.pdf
      locator: Section 1, new Subtitle 22, section on professional development, (B)
      quote: 'THE DEPARTMENT SHALL PROVIDE PROFESSIONAL DEVELOPMENT IN ARTIFICIAL INTELLIGENCE TO EDUCATORS
        AND SCHOOL LEADERS THAT:'
