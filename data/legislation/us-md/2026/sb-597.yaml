id: us-md-2026-sb-597
jurisdiction: us-md
session: "2026"
identifier: SB 597
title: Higher Education - Maryland Artificial Intelligence Partnership
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Alters the Cyber Warrior Diversity Program to include training students in artificial intelligence
  and extends related scholarship terms to AI degree programs. Establishes the Maryland Artificial Intelligence
  Partnership in the University System of Maryland, which provides free AI skills training including credit-bearing
  credentials, and an Artificial Intelligence Public Service Fellowship matching public college students
  with state agency AI projects.
provisions:
  - type: ai-workforce-program
    description: Expands the Cyber Warrior Diversity Program to train students in AI.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/Chapters_noln/CH_633_sb0597e.pdf
      locator: Purpose paragraph
      quote: altering the Cyber Warrior Diversity Program to include training students in artificial intelligence
  - type: ai-workforce-program
    description: Directs the AI Partnership to provide free AI skills training, including courses and
      credit-bearing credentials.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/Chapters_noln/CH_633_sb0597e.pdf
      locator: Section 1, Maryland Artificial Intelligence Partnership duties
      quote: PROVIDE ARTIFICIAL INTELLIGENCE SKILLS TRAINING TO INDIVIDUALS AT NO CHARGE, INCLUDING THROUGH
        COURSES AND CREDIT–BEARING CREDENTIALS.
  - type: ai-workforce-program
    description: Creates an AI Public Service Fellowship placing public college students on state agency
      AI projects.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/Chapters_noln/CH_633_sb0597e.pdf
      locator: Section 1, AI Public Service Fellowship (C)
      quote: THE PURPOSE OF THE FELLOWSHIP IS TO MATCH STUDENTS ENROLLED IN PUBLIC INSTITUTIONS OF HIGHER
        EDUCATION WITH STATE AGENCIES TO ADDRESS ARTIFICIAL INTELLIGENCE PROJECTS.
  - type: appropriates-funding
    description: Extends scholarship eligibility to students in degree or certificate programs relevant
      to AI.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/Chapters_noln/CH_633_sb0597e.pdf
      locator: Section 1, scholarship provisions [Page 10]
      quote: takes at least 6 semester hours of courses each semester leading to a degree or certificate
        that is directly relevant to cybersecurity OR ARTIFICIAL INTELLIGENCE.
