  - student-privacy
summary: Establishes a Task Force on Proactive Review of Audio and Video Recordings on Special Education
  Buses to study the use of artificial intelligence tools to review bus recordings for student safety,
  including privacy issues and costs. The Task Force must report findings and recommendations by December
  1, 2026.
provisions:
  - type: creates-task-force
    description: Creates a task force to study AI review of audio and video recordings on special education
      buses.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/bills/hb/hb0530f.pdf
      locator: Section 1(f)(1)
      quote: study using artificial intelligence tools to systematically and proactively review audio
        and video recordings from special education buses to ensure the safety and security of each student
        passenger;
