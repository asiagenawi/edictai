id: us-md-2026-sb-375
jurisdiction: us-md
session: "2026"
identifier: SB 375
title: County Boards of Education - Artificial Intelligence Training Program - Requirement
classification: bill
education_levels:
  - k12
topics:
  - educator-training
  - ai-literacy
  - student-privacy
summary: Requires the State Department of Education to develop or approve an artificial intelligence training
  program for county board of education members, covering AI fundamentals, AI use policy development,
  and student privacy and data protection laws. Requires each county board member to complete foundational
  and then annual continuing AI training and the Department to report on the program's effectiveness.
provisions:
  - type: educator-pd-requirement
    description: Requires the Department to develop or approve an AI training program for county board
      members.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/bills/sb/sb0375f.pdf
      locator: Section 1, new § 4-148(b)
      quote: 'THE DEPARTMENT SHALL DEVELOP OR APPROVE AN ARTIFICIAL INTELLIGENCE TRAINING PROGRAM FOR
        MEMBERS OF COUNTY BOARDS THAT INCLUDES: (1) A FOUNDATIONAL TRAINING; AND (2) CONTINUING ANNUAL
        TRAINING.'
  - type: educator-pd-requirement
    description: Requires each county board member to complete continuing AI training each year after
      the foundational training.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/bills/sb/sb0375f.pdf
      locator: Section 1, new § 4-148(e)(2)
      quote: THE MEMBER SHALL COMPLETE THE CONTINUING ARTIFICIAL INTELLIGENCE TRAINING REQUIRED UNDER
        SUBSECTION (B) OF THIS SECTION.
