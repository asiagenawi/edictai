title: Budget Bill (Fiscal Year 2027)
classification: bill
education_levels:
  - k12
topics:
  - funding
  - instructional-use
summary: Enacts the Maryland fiscal year 2027 state budget. Adds $500,000 to the State Department of Education
  for Artificial Intelligence Ready Schools Act initiatives, such as an AI Education Collaborative to
  monitor and evaluate AI implementation in schools, contingent on enactment of SB 720 or HB 1057.
provisions:
  - type: appropriates-funding
    description: Adds $500,000 to the State Department of Education for AI Ready Schools Act initiatives.
    citation:
      source_url: https://mgaleg.maryland.gov/2026RS/Chapters_noln/CH_4_sb0282e.pdf
      locator: Section 39(41)
      quote: $500,000 in general funds is added to the appropriation for program R00A01.01 Office of the
        State Superintendent within Headquarters within the Maryland State Department of Education (MSDE)
        for the purpose of supporting costs associated with Artificial Intelligence Ready Schools Act
        initiatives
