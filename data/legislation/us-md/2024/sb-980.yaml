summary: Requires the State Board of Education to update computer science content standards and framework
  by June 1, 2025 and every three years to reflect recent advances including artificial intelligence and
  cybersecurity. Requires elementary and middle schools to provide computer science instruction beginning
  in 2027-2028.
provisions:
  - type: ai-in-standards
    description: The State Board must update computer science standards to include artificial intelligence.
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/sb/sb0980f.pdf
      locator: Education §4-111.4(b)(2)
      quote: 'THE STATE BOARD SHALL UPDATE THE COMPUTER SCIENCE CONTENT STANDARDS AND FRAMEWORK TO ENSURE
        THAT INSTRUCTION IS CONSISTENT WITH RECENT ADVANCES IN COMPUTER SCIENCE, INCLUDING: (I) ARTIFICIAL
        INTELLIGENCE;'
