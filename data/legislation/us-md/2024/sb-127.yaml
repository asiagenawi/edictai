id: us-md-2024-sb-127
jurisdiction: us-md
session: "2024"
identifier: SB 127
title: Maryland Center for School Safety - Firearm Detection Platforms - Evaluation (Maryland Firearm
  Detection Platform Act)
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - safety-wellbeing
  - procurement
  - funding
summary: Requires the Maryland Center for School Safety, with education agencies, school systems, and
  public higher education institutions, to evaluate AI-based firearm detection platforms and report recommendations.
  Allows the Safe Schools Fund to help local school systems buy and maintain assessed platforms.
provisions:
  - type: creates-task-force
    description: The Center for School Safety must evaluate AI firearm detection platforms with education
      partners and report recommendations to school and higher education bodies.
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/sb/sb0127f.pdf
      locator: Sec. 2(b)
      quote: 'shall conduct an evaluation of firearm detection platforms to assess:'
  - type: appropriates-funding
    description: Safe Schools Fund grants may assist local school systems in procuring and maintaining
      assessed AI firearm detection platforms.
    education_levels:
      - k12
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/sb/sb0127f.pdf
      locator: Education §7-1512(f)(11)
      quote: ASSISTING LOCAL SCHOOL SYSTEMS IN PROCURING AND MAINTAINING FIREARM DETECTION PLATFORMS ASSESSED
        BY THE CENTER FOR USE ON PUBLIC SCHOOL PROPERTY.
