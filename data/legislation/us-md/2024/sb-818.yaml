id: us-md-2024-sb-818
jurisdiction: us-md
session: "2024"
identifier: SB 818
title: Information Technology - Artificial Intelligence - Policies and Procedures (Artificial Intelligence
  Governance Act of 2024)
classification: bill
education_levels:
  - postsecondary
  - k12
topics:
  - local-policy-requirement
  - institutional-operations
  - task-force
summary: Artificial Intelligence Governance Act requiring state units to inventory and assess AI systems
  and follow state high-risk AI policies. Requires public senior higher education institutions and Baltimore
  City Community College to adopt compatible policies, including for high-risk AI used for research or
  academic purposes, and to report on such AI annually. Directs the AI Subcabinet to study AI use in local
  school systems.
provisions:
  - type: requires-local-ai-policy
    description: Public senior higher education institutions and Baltimore City Community College must
      adopt policies compatible with state high-risk AI policies.
    education_levels:
      - postsecondary
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/Chapters_noln/CH_496_sb0818e.pdf
      locator: Sec. 1, new Subtitle 8, applicability (B)(3)
      quote: EACH PUBLIC SENIOR HIGHER EDUCATION INSTITUTION AND BALTIMORE CITY COMMUNITY COLLEGE SHALL
        ESTABLISH POLICIES AND PROCEDURES THAT ARE FUNCTIONALLY COMPATIBLE WITH THE POLICIES AND PROCEDURES
        ADOPTED UNDER § 3.5–804(A) OF THIS SUBTITLE
  - type: creates-task-force
    description: The AI Subcabinet must study AI use in local school systems and recommend responsible
      use.
    education_levels:
      - k12
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/Chapters_noln/CH_496_sb0818e.pdf
      locator: Sec. 2(11)
      quote: use of artificial intelligence in local school systems, including recommendations to the
        State on the responsible and productive use of artificial intelligence
