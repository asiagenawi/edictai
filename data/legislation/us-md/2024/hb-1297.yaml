id: us-md-2024-hb-1297
jurisdiction: us-md
session: "2024"
identifier: HB 1297
title: Education - Artificial Intelligence - Study and Regulations
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - student-privacy
  - instructional-use
summary: Requires the State Department of Education to conduct a comprehensive study of the potential
  use of artificial intelligence in public schools, including best practices for safe, responsible, and
  ethical use that protect the personal information of students and school personnel. Requires the department
  to report the results by December 1, 2024, and to adopt regulations based on the study by June 1, 2025.
provisions:
  - type: creates-task-force
    description: The State Department of Education must study the potential use of AI in public schools
      and report to the Governor and General Assembly.
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/hb/hb1297t.pdf
      locator: Section 1(b)(1)
      quote: The State Department of Education shall conduct a comprehensive study of the potential use
        of artificial intelligence in public schools.
  - type: issues-model-policy
    description: The department must adopt regulations based on the study results.
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/hb/hb1297t.pdf
      locator: Section 1(c)(2)
      quote: On or before June 1, 2025, the State Department of Education shall adopt regulations based
        on the results of its study.
