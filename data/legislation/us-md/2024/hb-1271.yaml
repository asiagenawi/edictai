id: us-md-2024-hb-1271
jurisdiction: us-md
session: "2024"
identifier: HB 1271
title: Information Technology - Artificial Intelligence - Policies and Procedures (Artificial Intelligence
  Governance Act of 2024)
classification: bill
education_levels:
  - postsecondary
  - k12
topics:
  - local-policy-requirement
  - institutional-operations
  - task-force
summary: Establishes AI governance requirements for state government, including inventories, impact assessments,
  and policies for high-risk AI, and applies the subtitle to public senior higher education institutions
  and Baltimore City Community College, which must adopt compatible AI policies. Directs the Governor's
  AI Subcabinet to study and recommend on AI use in areas including local school systems.
provisions:
  - type: requires-local-ai-policy
    description: Public senior higher education institutions and Baltimore City Community College must
      establish AI policies compatible with the state's high-risk AI policies.
    education_levels:
      - postsecondary
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/hb/hb1271t.pdf
      locator: Sec. 1, new Subtitle 8, applicability (B)(3)
      quote: ON OR BEFORE JUNE 1, 2025, EACH PUBLIC SENIOR HIGHER EDUCATION INSTITUTION AND BALTIMORE
        CITY COMMUNITY COLLEGE SHALL ESTABLISH POLICIES AND PROCEDURES THAT ARE FUNCTIONALLY COMPATIBLE
  - type: creates-task-force
    description: The AI Subcabinet must study and recommend on AI use in local school systems.
    education_levels:
      - k12
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/hb/hb1271t.pdf
      locator: Sec. 2(a)
      quote: in local school systems, including recommendations to the State on the responsible and productive
        use of artificial intelligence;
