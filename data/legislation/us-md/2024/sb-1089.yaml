identifier: SB 1089
title: Education - Student and School Employee Data Privacy - Protections
classification: bill
education_levels:
  - k12
topics:
  - student-privacy
summary: Extends Maryland's student data privacy law to school employee information and defines covered
  operators to include websites, services, and applications that use artificial intelligence under contract
  with public schools for PreK-12 purposes, subjecting them to data protection, security, and deletion
  requirements.
provisions:
  - type: restricts-student-data-use
    description: Operators of school-contracted services that use AI are covered by student and employee
      data privacy restrictions.
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/bills/sb/sb1089f.pdf
      locator: Sec. 1, Education §4-131(a), definition of operator
      quote: INCLUDING A WEBSITE , A SERVICE, OR AN APPLICATION THAT UTILIZES ARTIFICIAL INTELLIGENCE
