classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - funding
  - procurement
summary: Appropriates the Maryland State budget for fiscal year 2025, including School Safety Grant Program
  funds with legislative intent that local education agencies use a portion to study and procure artificial
  intelligence technologies that identify guns in and around school property.
provisions:
  - type: appropriates-funding
    description: States intent that local education agencies use part of the School Safety Grant Program
      appropriation to study and procure AI gun-detection technology for school property.
    citation:
      source_url: https://mgaleg.maryland.gov/2024RS/Chapters_noln/CH_716_sb0360e.pdf
      locator: Sec. 1, D25E03.03 School Safety Grant Program, page 22
      quote: it is the intent of the Maryland General Assembly that local education agencies use a portion
        of the funding appropriated for the School Safety Grant Program for the purpose of studying and
        procuring potential artificial intelligence technologies that identify guns in and around school
        property
