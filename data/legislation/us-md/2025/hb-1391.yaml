title: Education - Artificial Intelligence - Guidelines and Professional Development
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - educator-training
  - workforce
summary: >-
  As passed by the House, would have required the Maryland State Department of Education, with
  stakeholders, to develop and periodically update guidance on artificial intelligence, promote
  AI training and workforce development, and have career and technical education committees use
  that guidance before incorporating AI into CTE activities. The introduced version also proposed
  a list of approved AI tools and a K-12 AI task force, which were removed by amendment. The bill
  passed the House but received no Senate action before the session ended.
abstract: >-
  Requiring the State Department of Education, in consultation with relevant stakeholders, to
  develop and periodically update certain guidance on artificial intelligence; requiring the
  Department to promote training and workforce development in artificial intelligence; requiring
  the Career and Technical Education Committee and the CTE Skills Standards Advisory Committee to
  use the Department's guidance and, if necessary, consult with the Department before
  incorporating the use of artificial intelligence into certain CTE actions; etc.
