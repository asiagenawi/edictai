id: us-md-2025-hb-981
jurisdiction: us-md
session: "2025"
identifier: HB 981
title: State Department of Education and Department of Information Technology - Evaluation on Artificial
  Intelligence in Public Schools
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - instructional-use
  - local-policy-requirement
  - assessment
summary: Requires the State Department of Education to evaluate the use and potential use of artificial
  intelligence in public schools through a survey of local school systems' AI policies, tools, and readiness
  and a review of AI systems for learning, curriculum, grading, and administration, with Department of
  Information Technology help on costs and benefits and interim and final reports.
provisions:
  - type: creates-task-force
    description: The State Department of Education must evaluate AI use in public schools.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/bills/hb/hb0981f.pdf
      locator: Sec. 1(b)
      quote: The State Department of Education shall conduct an evaluation of the use and potential use
        of artificial intelligence in public schools.
  - type: creates-task-force
    description: The evaluation's survey must ask whether districts have AI use policies for students.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/bills/hb/hb0981f.pdf
      locator: Sec. 1(c)(1)(i)
      quote: whether the local school system has a policy for the use of artificial intelligence by students,
        and if so, how the policy differs by student age, disability status, and English language learning
        status;
