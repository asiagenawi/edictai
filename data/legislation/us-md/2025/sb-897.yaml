identifier: SB 897
title: Primary and Secondary Education - Student Technology and Social Media Resource Guide
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - ai-literacy
summary: Requires the National Center for School Mental Health, in consultation with the State Department
  of Education, to develop a student technology and social media resource guide covering safe use of products
  including artificial intelligence products by prekindergarten through grade 12 students. The guide must
  be posted by the Department and county boards and distributed to each public school.
provisions:
  - type: issues-model-policy
    description: Requires a resource guide with guidance on safe use of technology, including AI products,
      by PreK-12 students.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/bills/sb/sb0897f.pdf
      locator: Section 1, new Subtitle 22, section on the resource guide, (C)(2)
      quote: 'INFORMATION AND GUIDANCE ON SAFE INTERNET, TECHNOLOGY, AND SOCIAL MEDIA USAGE BY STUDENTS
        IN PREKINDERGARTEN THROUGH GRADE 12, INCLUDING: (I) SOCIAL MEDIA PLATFORMS; (II) ONLINE GAMES;
        (III) ARTIFICIAL INTELLIGENCE PRODUCTS;'
