identifier: HB 782
title: Study on Detecting Deadly Weapons in Public Middle and High Schools
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - task-force
  - equity-access
  - student-privacy
summary: Requires the Maryland Center for School Safety to study weapons detection and reporting in public
  middle and high schools, including evaluating software that uses artificial intelligence to identify
  deadly weapons and requesting assessments of technologies' efficacy, bias, data ownership, and privacy,
  with interim and final reports.
provisions:
  - type: creates-task-force
    description: The statewide school safety study must evaluate AI software that identifies deadly weapons.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/Chapters_noln/CH_244_hb0782e.pdf
      locator: Sec. 1(c)(3)
      quote: software that uses artificial intelligence to identify deadly weapons, and the necessary
        steps to ensure that the software works effectively,
