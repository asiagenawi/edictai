title: Howard County - Study on Detecting Deadly Weapons in Public Middle and High Schools Ho. Co. 15-25
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - task-force
summary: Requires the Howard County Board of Education to study how best to detect deadly weapons in county
  public middle and high schools and report them to law enforcement, including an evaluation of software
  that uses artificial intelligence to identify weapons, and to report findings to the State Superintendent
  and the county delegation.
provisions:
  - type: creates-task-force
    description: The county school board's weapons-detection study must evaluate AI software that identifies
      deadly weapons.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/bills/hb/hb1384f.pdf
      locator: Sec. 1(c)(3)
      quote: software that uses artificial intelligence to identify deadly weapons, and the necessary
        steps to ensure that the software works effectively, including integration with security cameras
        and other currently used safety measures;
