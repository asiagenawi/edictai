id: us-md-2025-hb-504
jurisdiction: us-md
session: "2025"
identifier: HB 504
title: Excellence in Maryland Public Schools Act
classification: bill
education_levels:
  - k12
topics:
  - procurement
  - instructional-use
summary: Revises public school funding and educator workforce programs. Among its changes, it provides
  that, for the 2025-2026 through 2027-2028 school years, an existing Education Article section on digital
  tools does not apply to the procurement and use of digital tools that use artificial intelligence to
  support student learning.
provisions:
  - type: procurement-standards
    description: Exempts the procurement and use of digital tools that use AI to support student learning
      from the digital tool section's requirements for the 2025-2026 through 2027-2028 school years.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/Chapters_noln/CH_237_hb0504e.pdf
      locator: Section 4, Article – Education, new subsection (A–1)
      quote: BEGINNING WITH THE 2025–2026 SCHOOL YEAR THROUGH THE 2027–2028 SCHOOL YEAR, THIS SECTION
        DOES NOT APPLY TO THE PROCUREMENT AND USE OF A DIGITAL TOOL THAT UTILIZES ARTIFICIAL INTELLIGENCE
