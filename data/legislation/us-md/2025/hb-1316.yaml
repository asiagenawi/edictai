id: us-md-2025-hb-1316
jurisdiction: us-md
session: "2025"
identifier: HB 1316
title: Primary and Secondary Education - Youth-Centric Technology and Social Media Resource Guide
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - ai-literacy
summary: Requires the National Center for School Mental Health, in consultation with the State Department
  of Education, to develop a youth-centric technology and social media resource guide for public school
  students and families that covers safe use of technologies including artificial intelligence products,
  and to post and distribute it to every public school.
provisions:
  - type: issues-model-policy
    description: The guide distributed to public schools must include guidance on safe student use of
      technologies including AI products.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/bills/hb/hb1316t.pdf
      locator: Sec. 1, new Education Subtitle 9B, (C)(2)
      quote: 'INFORMATION AND GUIDANCE ON SAFE INTERNET, TECHNOLOGY, AND SOCIAL MEDIA USAGE BY STUDENTS
        IN PREKINDERGARTEN THROUGH GRADE 12, INCLUDING: (I) SOCIAL MEDIA PLATFORMS; (II) ONLINE GAMES;
        (III) ARTIFICIAL INTELLIGENCE PRODUCTS;'
