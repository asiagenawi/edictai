id: us-md-2025-sb-936
jurisdiction: us-md
session: "2025"
identifier: SB 936
title: Consumer Protection - High-Risk Artificial Intelligence - Developer and Deployer Requirements
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - admissions
summary: Requires developers and deployers of high-risk artificial intelligence systems to use reasonable
  care to protect consumers from algorithmic discrimination and sets documentation and disclosure requirements.
  Consequential decisions covered by the bill include education enrollment or education opportunity.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential decisions subject to the algorithmic discrimination duties to include
      education enrollment or opportunity.
    citation:
      source_url: https://mgaleg.maryland.gov/2025RS/bills/sb/sb0936f.pdf
      locator: Section 1, definition (D)
      quote: '“CONSEQUENTIAL DECISION” MEANS A DECISION THAT HAS A MATERIALLY LEGAL OR SIMILARLY SIGNIFICANT
        EFFECT ON THE PROVISION OR DENIAL TO A CONSUMER OF: (1) PAROLE, PROBATION, A PARDON, OR ANY OTHER
        RELEASE FROM INCARCERATION OR COURT SUPERVISION; (2) EDUCATION ENROLLMENT OR EDUCATION OPPORTUNITY;'
