summary: Establishes the Hawaii Artificial Intelligence Advisory Council to recommend an action plan on
  AI awareness, education, policy, and use in the State. The council's action plan must address proposed
  policy changes related to workforce development, educational systems, and research opportunities for
  colleges and universities.
provisions:
  - type: creates-task-force
    description: The advisory council's action plan must address policy changes for educational systems
      and colleges and universities.
    citation:
