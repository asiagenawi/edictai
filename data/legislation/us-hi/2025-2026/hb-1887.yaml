id: us-hi-2025-2026-hb-1887
jurisdiction: us-hi
session: 2025-2026
identifier: HB 1887
title: Relating To Artificial Intelligence Literacy Education.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - educator-training
  - local-policy-requirement
  - funding
  - task-force
summary: Requires the Department of Education to implement an AI literacy curricula plan and makes a passing
  grade in an AI literacy course a graduation condition for grades 11 and 12 beginning in 2027-2028. Requires
  teacher professional development and certification for AI literacy teachers, requires each public school
  to adopt an AI policy, establishes an advisory council, and creates a three-year AI education grant
  pilot program.
provisions:
  - type: requires-ai-literacy-instruction
    description: Public schools must provide AI literacy instruction in grades 11 and 12.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1887_.HTM
      locator: Section 1, new 302A-A(b)
      quote: Beginning with the 2027-2028 school year, all public schools shall provide instruction in
        artificial intelligence literacy for students in grades eleven and twelve.
  - type: ai-course-or-graduation-requirement
    description: Students in grades 11 and 12 must pass an AI literacy course to graduate.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1887_.HTM
      locator: Section 1, new 302A-A(b)
      quote: All students in grades eleven and twelve shall complete a course in artificial intelligence
        literacy and obtain a passing grade in the course as a condition for graduation.
  - type: educator-pd-requirement
    description: Teachers must complete AI literacy professional development and certification before
      teaching the course.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1887_.HTM
      locator: Section 1, new 302A-A(c)
      quote: A teacher shall complete artificial intelligence literacy professional development and be
        certified as an artificial intelligence literacy teacher before teaching artificial intelligence
        literacy courses in public schools.
  - type: requires-local-ai-policy
    description: Each public school must develop an AI policy on acceptable and ethical use.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1887_.HTM
      locator: Section 1, new 302A-A(d)
      quote: Each public school shall develop an artificial intelligence policy in consultation with its
        students' parents and the local community that outlines acceptable and ethical use of artificial
        intelligence tools by students and staff.
  - type: appropriates-funding
    description: Creates a three-year AI education grant pilot program in the Department of Education.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1887_.HTM
      locator: Sec. 3(a)
      quote: There is established within the department of education a three-year artificial intelligence
        education grant pilot program.
