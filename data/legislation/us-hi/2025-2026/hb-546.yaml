id: us-hi-2025-2026-hb-546
jurisdiction: us-hi
session: 2025-2026
identifier: HB 546
title: Relating To Artificial Intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - workforce
  - educator-training
  - research
summary: Establishes the Aloha Intelligence Institute at the University of Hawaii to conduct AI research
  and to foster AI-related degree programs, faculty and staff training, workforce initiatives, K-12 educational
  programs, and student pathways aligned with the Department of Education. The institute must also develop
  ethical guidelines for AI use in the State.
provisions:
  - type: ai-workforce-program
    description: The institute must foster AI-related degree programs and training for faculty and staff.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB546_SD1_.HTM
      locator: Section 2, new 304A- (b)(2)
      quote: 'Foster training and education programs, including but not limited to: (A) Artificial intelligence-related
        undergraduate and graduate degree programs; (B) Artificial intelligence-related training for university
        faculty and staff;'
  - type: ai-workforce-program
    description: The institute must support K-12 educational programs and student pathways in AI-related
      fields.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB546_SD1_.HTM
      locator: Section 2, new 304A- (b)(2)(D)-(E)
      quote: (D) Community outreach and K-12 educational programs; and (E) Creation of student pathways
        in artificial intelligence-related fields that align with efforts from the department of education;
