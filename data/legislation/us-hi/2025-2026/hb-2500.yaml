identifier: HB 2500
title: Relating To Artificial Intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - admissions
  - equity-access
  - institutional-operations
summary: Requires developers and deployers of algorithmic decision systems to provide disclosures, including
  notice to individuals affected by decisions about education enrollment or education opportunities, and
  gives individuals rights to access and correct their data. Requires disclosure of generative AI interactions
  and makes developers and deployers jointly liable for certain violations.
provisions:
  - type: requires-disclosure
    description: Deployers must give notice to individuals affected by algorithmic decisions on education
      enrollment or opportunities.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB2500_.HTM
      locator: Section 1, new § -3(a)
      quote: 'which decision has a material legal or similarly significant effect on the provision or
        denial to the individual of, or the cost or terms of: (1) Education enrollment or an education
        opportunity;'
