id: us-hi-2025-2026-hcr-44
jurisdiction: us-hi
session: 2025-2026
identifier: HCR 44
title: Urging The Department Of Education To Co-develop A Sixth To Twelfth Grade Artificial Intelligence
  Literacy And Usage Curriculum With Teachers.
classification: concurrent-resolution
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - equity-access
summary: Urges the Department of Education to co-develop a grade 6-12 artificial intelligence literacy
  and usage curriculum with teachers, consulting research and AI literacy frameworks. Urges that the curriculum
  foster ethical AI use, enable equitable access, and include regular assessments of student progress.
provisions:
  - type: requires-ai-literacy-instruction
    description: Urges the Department of Education to co-develop a grade 6-12 AI literacy and usage curriculum
      with teachers.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HCR44_.HTM
      locator: First resolved clause
      quote: urges the Department of Education to co-develop a sixth to twelfth grade artificial intelligence
        literacy and usage curriculum with teachers
  - type: bias-or-equity-requirement
    description: Urges that the AI literacy curricula enable equitable access across Hawaii.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HCR44_.HTM
      locator: Third resolved clause
      quote: (2) Enables equitable access to AI literacy across Hawaiʻi;
