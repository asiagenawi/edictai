id: us-hi-2025-2026-sb-2967
jurisdiction: us-hi
session: 2025-2026
identifier: SB 2967
title: Relating To Artificial Intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - admissions
  - equity-access
  - institutional-operations
summary: Establishes consumer protection requirements for AI systems used in consumer interactions and
  consequential decisions, which include education admissions and educational opportunities. Requires
  disclosures, a duty of reasonable care against algorithmic discrimination, risk management programs
  and impact assessments for high-risk AI systems, and rights to correction, appeal, and human review.
provisions:
  - type: ai-in-admissions
    description: Defines consequential decisions covered by the law to include education admissions and
      educational opportunities.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/SB2967_.HTM
      locator: §480-A, definition of "consequential decision"
      quote: (5) Education admissions or educational opportunities;
  - type: bias-or-equity-requirement
    description: Deployers and vendors must use reasonable care to protect consumers from algorithmic
      discrimination.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/SB2967_.HTM
      locator: §480-F(a)
      quote: 'A deployer and vendor shall use reasonable care to protect consumers from any known or reasonably
        foreseeable material risks of: (1) Algorithmic discrimination;'
