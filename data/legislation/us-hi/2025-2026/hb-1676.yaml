summary: Establishes an artificial intelligence in education task force within the University of Hawaii
  to develop model guidance on AI as an instructional tool, data privacy and vendor transparency standards,
  digital equity recommendations, educator professional-development guidelines, and a framework for evaluating
  learning outcomes. Requires reports in 2027, 2028, and 2029 and appropriates funds.
provisions:
  - type: creates-task-force
    description: Establishes an AI in education task force within the University of Hawaii.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1676_HD1_.HTM
      locator: Sec. 2(a)
      quote: There is established within the university of Hawaii for administrative purposes an artificial
        intelligence in education task force.
  - type: issues-model-policy
    description: The task force must develop model statewide guidance on AI as an instructional tool.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1676_HD1_.HTM
      locator: Sec. 2(e)(1)
      quote: Model statewide guidance on the use of artificial intelligence as an instructional tool,
        including recommended human-in-the-loop practices;
  - type: procurement-standards
    description: The task force must develop data privacy and vendor transparency standards.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1676_HD1_.HTM
      locator: Sec. 2(e)(2)
      quote: Data privacy and vendor transparency standards, including disclosure of training datasets,
        bias testing, and audit provisions;
  - type: appropriates-funding
    description: Appropriates funds for the task force.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB1676_HD1_.HTM
      locator: Sec. 3
      quote: There is appropriated out of the general revenues of the State of Hawaii the sum of $ or
        so much thereof as may be necessary for fiscal year 2026-2027 for the artificial intelligence
        in education task force.
