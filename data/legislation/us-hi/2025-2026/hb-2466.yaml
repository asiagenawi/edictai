summary: Bans student use of electronic telecommunication devices during instructional hours and requires
  the Department of Education to develop and administer a K-12 social media and artificial intelligence
  literacy curriculum. Requires the department to review the restrictions and the literacy curriculum
  and report to the legislature.
provisions:
  - type: requires-ai-literacy-instruction
    description: The Department of Education must develop and administer a K-12 social media and AI literacy
      curriculum.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB2466_.HTM
      locator: Section 3, new 302A- (a)
      quote: The department shall develop and administer a comprehensive age-appropriate and developmentally
        appropriate K-12 social media and artificial intelligence literacy education curriculum.
  - type: creates-task-force
    description: The department must evaluate the effectiveness of the AI literacy curriculum and report.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/HB2466_.HTM
      locator: Section 4(b)(2)
      quote: The effectiveness of the social media and artificial intelligence literacy curriculum in
        improving students’ understanding of digital risks, critical thinking skills, and online safety;
