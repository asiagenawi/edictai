id: us-hi-2025-2026-sb-59
jurisdiction: us-hi
session: 2025-2026
identifier: SB 59
title: Relating To Algorithmic Discrimination.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Bars covered entities from making algorithmic eligibility or information availability determinations,
  based on machine learning or artificial intelligence, that discriminate on protected characteristics
  in access to credit, insurance, education, employment, housing, or public accommodation. Requires notices
  to affected individuals and annual reports to the Department of the Attorney General.
provisions:
  - type: bias-or-equity-requirement
    description: Defines important life opportunities covered by the algorithmic discrimination rules
      to include education.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/SB59_.HTM
      locator: Sec. -1, definition of "Important life opportunities"
      quote: '"Important life opportunities" means access to, approval for, or offer of credit, insurance,
        education, employment, housing, or place of public accommodation as defined in section 489-2.'
  - type: bias-or-equity-requirement
    description: Prohibits covered entities from making algorithmic determinations that discriminate on
      protected characteristics.
    citation:
      source_url: https://www.capitol.hawaii.gov/sessions/session2026/bills/SB59_.HTM
      locator: Sec. -2(a)
      quote: A covered entity shall not make an algorithmic eligibility determination or an algorithmic
        information availability determination on the basis of an individual's or class of individuals'
        actual or perceived race, color, religion, national origin, sex
