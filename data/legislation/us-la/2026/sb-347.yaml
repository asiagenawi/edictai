id: us-la-2026-sb-347
jurisdiction: us-la
session: "2026"
identifier: SB 347
title: Provides for the crime of "unlawful deepfake" to be added to the definition of power-based violence
  under the Campus Accountability and Safety Act. (gov sig)
classification: bill
education_levels:
  - postsecondary
topics:
  - synthetic-media
  - safety-wellbeing
summary: Adds conduct involving AI-generated or deepfake sexual imagery to the definition of power-based
  violence under the Campus Accountability and Safety Act. Updates the deadline for institutions to distribute
  safety education to students on power-based violence and online threats.
provisions:
  - type: addresses-deepfakes
    description: Defines power-based violence at postsecondary institutions to include crimes involving
      AI-generated or deepfake sexual imagery.
    citation:
      source_url: https://www.legis.la.gov/Legis/ViewDocument.aspx?d=1480197
      locator: Sec. 1, R.S. 17:3399.12(5)(b)
      quote: Any conduct prohibited by R.S. 14:73.13 or 73.14, or any successor statute, involving media
        generated by artificial intelligence or deepfake media depicting sexual imagery.
