id: us-la-2026-hb-1184
jurisdiction: us-la
session: "2026"
identifier: HB 1184
title: Prohibits public contracts with entities owned or controlled by foreign adversaries for the provision
  of artificial intelligence technology (OR NO IMPACT See Note)
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - procurement
summary: Bars public entities, including those purchasing K-12 instructional materials and higher education
  systems, from entering into or extending contracts for AI technology on or after July 1, 2027, unless
  the contractor attests it is not owned or controlled by a foreign country of concern.
provisions:
  - type: procurement-standards
    description: Higher education boards and their institutions may not procure AI technology from vendors
      tied to foreign countries of concern after July 1, 2027.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.legis.la.gov/Legis/ViewDocument.aspx?d=1457601
      locator: New R.S. 17:1421(B)
      quote: neither the Board of Supervisors of Louisiana State University and Agricultural and Mechanical
        College nor any institution or program it administers shall enter into or extend a contract that
        procures artificial intelligence technology,
  - type: procurement-standards
    description: Entities purchasing K-12 textbooks and instructional materials must obtain a foreign-ownership
      affidavit before contracting for AI products.
    education_levels:
      - k12
    citation:
      source_url: https://www.legis.la.gov/Legis/ViewDocument.aspx?d=1457601
      locator: Digest, [Page 7]
      quote: Proposed law restricts the authority of a public entity purchasing textbooks and other instructional
        materials to enter into or extend a contract on or after July 1, 2027, that provides AI technology,
        software, or products
