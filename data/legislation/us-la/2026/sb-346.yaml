id: us-la-2026-sb-346
jurisdiction: us-la
session: "2026"
identifier: SB 346
title: Prohibits the use of deepfake material against students enrolled in K-12. (8/1/26)
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
summary: Prohibits students, faculty, administrative staff, and other employees at elementary and secondary
  schools from using deepfake material against K-12 students to coerce, harass, intimidate, or maliciously
  disseminate or sell it. Directs the State Board of Elementary and Secondary Education and the Department
  of Education to adopt implementing rules.
provisions:
  - type: addresses-deepfakes
    description: Bars school students and staff from using deepfakes against K-12 students with intent
      to coerce, harass, intimidate, or maliciously disseminate or sell.
    citation:
      source_url: https://www.legis.la.gov/Legis/ViewDocument.aspx?d=1480196
      locator: Sec. 1, new R.S. 17:416.14.1(A)
      quote: No student, faculty member, member of the administrative staff, or other employee at an elementary
        or secondary school shall use material considered to be a deepfake against a student enrolled
        in kindergarten through grade twelve
