id: us-la-2026-hb-119
jurisdiction: us-la
session: "2026"
identifier: HB 119
title: Provides relative to unlawful conduct involving images of another person created by artificial
  intelligence (EN SEE FISC NOTE GF EX)
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Expands crimes involving AI-generated sexual images, including a new crime of possessing such
  images of persons under seventeen, and defines 'student' for these offenses. Requires public school
  principals to give students in grade six and above and their parents information each year about these
  crimes, using materials developed by the Department of Education.
provisions:
  - type: addresses-deepfakes
    description: Public school principals must inform students in grades six and above, and their parents,
      about crimes involving AI-created images during the first five days of each school year.
    citation:
      source_url: https://www.legis.la.gov/Legis/ViewDocument.aspx?d=1481219
      locator: Sec. 2, new R.S. 17:416.20.1(A)
      quote: The principal of each public school shall disseminate information during the first five days
        of each school year to each student grades six and above regarding the crime and consequences
        of unlawful dissemination or sale of images of another created by artificial intelligence
