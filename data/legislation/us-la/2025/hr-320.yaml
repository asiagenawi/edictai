jurisdiction: us-la
session: "2025"
identifier: HR 320
title: Requests the state Department of Education, the State Board of Elementary and Secondary Education, the Board of Regents, and postsecondary education management boards to promote artificial intelligence education for students and to encourage professional development relative to artificial intelligence for faculty and staff
classification: resolution
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - educator-training
  - workforce
summary: >-
  A nonbinding Louisiana House resolution urging the state Department of Education, the State
  Board of Elementary and Secondary Education, the Board of Regents, and postsecondary management
  boards to promote AI education for students and encourage AI professional development for
  faculty and staff. It also encourages schools and districts to evaluate and adopt flexible AI
  learning resources.
abstract: >-
  Requests the state Dept. of Education, the State Bd. of Elementary and Secondary Education, the
  Bd. of Regents, and postsecondary education management boards to promote artificial
  intelligence (AI) education for students and to encourage professional development relative to
  AI for faculty and staff.
