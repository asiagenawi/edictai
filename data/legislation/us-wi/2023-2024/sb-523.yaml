id: us-wi-2023-2024-sb-523
jurisdiction: us-wi
session: 2023-2024
identifier: SB 523
title: Grants to schools to acquire proactive firearm detection software and making an appropriation.
  (FE)
classification: bill
education_levels:
  - k12
topics:
  - funding
  - safety-wellbeing
  - procurement
summary: Requires the Department of Justice to award grants of up to $325,000 to school boards and private
  school governing bodies to acquire proactive firearm detection software, including artificial intelligence
  software that integrates with school security cameras. Appropriates $4,000,000 for the grants.
provisions:
  - type: appropriates-funding
    description: Creates a DOJ grant program for schools to acquire firearm detection software.
    citation:
      source_url: https://docs.legis.wisconsin.gov/document/proposaltext/2023/REG/SB523.pdf
      locator: s. 165.88 (3p) (a)
      quote: the department of justice shall award grants to school boards and governing bodies of private
        schools to acquire proactive firearm detection software.
  - type: procurement-standards
    description: Sets requirements the funded software must meet, including AI software that follows authorized
      protocol autonomously or is vendor-monitored.
    citation:
      source_url: https://docs.legis.wisconsin.gov/document/proposaltext/2023/REG/SB523.pdf
      locator: s. 165.88 (3p) (c) 4.
      quote: The artificial intelligence software is written and programmable to follow authorized protocol
        autonomously
