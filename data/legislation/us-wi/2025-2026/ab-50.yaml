id: us-wi-2025-2026-ab-50
jurisdiction: us-wi
session: 2025-2026
identifier: AB 50
title: State finances and appropriations, constituting the executive budget act of the 2025 legislature.
  (FE)
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - funding
  - workforce
  - educator-training
  - curriculum-standards
summary: Executive budget that allows the Technical College System Board to award grants to technical
  college districts for adopting and using artificial intelligence, including educator upskilling, curriculum
  development, and stackable credentials. Also directs the Department of Workforce Development to allocate
  $200,000 a year in grants to help school districts prepare students for a future that includes artificial
  intelligence.
provisions:
  - type: appropriates-funding
    description: Authorizes grants to technical college district boards for AI adoption, including educator
      upskilling and curriculum and credential development.
    education_levels:
      - postsecondary
    citation:
      source_url: https://docs.legis.wisconsin.gov/document/proposaltext/2025/REG/AB50.pdf
      locator: Section 647, new s. 38.04 (25)
      quote: 'the board may award grants to district boards to support the district boards with the adoption
        and use of artificial intelligence in areas including the following: (a) Educator recruitment,
        retention, and upskilling. (b) Curriculum and resource development to meet employer demand.'
  - type: appropriates-funding
    description: Allocates $200,000 a year for grants helping school districts prepare students for a
      future that includes AI.
    education_levels:
      - k12
    citation:
      source_url: https://docs.legis.wisconsin.gov/document/proposaltext/2025/REG/AB50.pdf
      locator: Section 9150 (d)
      quote: the department of workforce development shall allocate $200,000 for grants under s. 106.27
        (1) to help school districts to prepare students for a future that includes artificial intelligence.
