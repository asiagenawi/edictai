summary: Among other education changes, requires the Superintendent of Public Instruction to appoint a
  committee on the use of artificial intelligence in education within the Department of Education. The
  committee reviews AI uses and concerns, including bullying, pupil data, curricula, and academic honesty,
  and submits legislative recommendations to the Joint Interim Standing Committee on Education.
