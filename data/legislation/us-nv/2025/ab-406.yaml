id: us-nv-2025-ab-406
jurisdiction: us-nv
session: "2025"
identifier: AB 406
title: Makes various changes relating to health.
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - instructional-use
  - local-policy-requirement
  - employment-evaluation
summary: >-
  Bars Nevada public schools, including charter schools, from using artificial intelligence
  to perform the mental-health duties of school counselors, psychologists, and social workers,
  while allowing administrative uses such as scheduling and record keeping. It directs the
  Department of Education to develop a policy on AI use by school staff providing mental or
  behavioral health services, and separately restricts AI systems marketed as providing
  mental health care.
abstract: >-
  AN ACT relating to health; prohibiting certain uses of artificial intelligence in public
  schools; requiring the Department of Education to develop a policy concerning certain uses
  of artificial intelligence; imposing certain restrictions relating to the marketing and
  programming of artificial intelligence systems; prohibiting certain persons from
  representing themselves as qualified to provide mental or behavioral health care; imposing
  certain restrictions relating to the use of artificial intelligence by providers of mental
  or behavioral health care; providing civil penalties; and providing other matters properly
  relating thereto.
provisions:
  - type: prohibits-ai-replacing-educators
    description: Public schools may not use AI to perform the mental-health functions and duties of school counselors, school psychologists, or school social workers.
    education_levels:
      - k12
    citation:
      source_url: https://www.leg.state.nv.us/Session/83rd2025/Bills/AB/AB406_EN.pdf
      locator: Sec. 2(1)
      quote: shall not use artificial intelligence to perform the functions and duties of a school counselor, school psychologist or school social worker
  - type: issues-model-policy
    description: The Department of Education must develop a policy on AI use by school mental-health personnel, including a method to examine the accuracy and efficacy of the AI used.
    education_levels:
      - k12
    citation:
      source_url: https://www.leg.state.nv.us/Session/83rd2025/Bills/AB/AB406_EN.pdf
      locator: Sec. 2(2)
      quote: The Department shall develop a policy for the use of artificial intelligence by a school counselor, school psychologist, school social worker or other educational personnel
