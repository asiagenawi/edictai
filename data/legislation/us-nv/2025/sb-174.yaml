identifier: SB 174
title: Revises provisions relating to pupils with disabilities. (BDR 34-53)
classification: bill
education_levels:
  - k12
topics:
  - equity-access
  - instructional-use
summary: Revises provisions on pupils with disabilities, including requiring individualized education
  program teams for pupils with visual or hearing impairments to provide necessary assistive technology,
  which the bill defines to include artificial intelligence.
provisions:
  - type: bias-or-equity-requirement
    description: Defines assistive technology that IEP teams must provide to pupils with visual or hearing
      impairments to include artificial intelligence.
    citation:
      source_url: https://www.leg.state.nv.us/Session/83rd2025/Bills/SB/SB174_R1.pdf
      locator: Sec. 4.5(6)(a)
      quote: Software that converts text to speech; and (7) Artificial intelligence.
