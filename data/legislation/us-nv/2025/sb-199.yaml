id: us-nv-2025-sb-199
jurisdiction: us-nv
session: "2025"
identifier: SB 199
title: Enacts provisions relating to artificial intelligence systems. (BDR 52-583)
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - local-policy-requirement
  - academic-integrity
  - student-privacy
  - procurement
summary: Regulates artificial intelligence companies and, in Section 26, creates a working group appointed
  by the Superintendent of Public Instruction, including teachers and pupils, to assess AI use in education
  and develop guidance and a model policy for school districts and charter schools. The model policy must
  address academic integrity, acceptable uses, pupil and teacher data privacy, procurement, equity, and
  teacher professional development.
provisions:
  - type: creates-task-force
    description: A working group must assess the current and future use of AI systems in education.
    citation:
      source_url: https://www.leg.state.nv.us/Session/83rd2025/Bills/SB/SB199_R1.pdf
      locator: Sec. 26(4)(a)
      quote: Conduct an assessment of the current and future state of the use of artificial intelligence
        systems in education
  - type: issues-model-policy
    description: The working group must develop guidance and a model policy for school districts and charter
      schools on safe and effective AI use.
    citation:
      source_url: https://www.leg.state.nv.us/Session/83rd2025/Bills/SB/SB199_R1.pdf
      locator: Sec. 26(4)(c)
      quote: Develop a model policy for school districts and charter schools regarding the safe and effective
        use of artificial intelligence systems in a manner that benefits and does not negatively impact
        pupils and teachers.
  - type: academic-integrity-rules
    description: The model policy must address academic integrity and plagiarism among other AI subjects.
    citation:
      source_url: https://www.leg.state.nv.us/Session/83rd2025/Bills/SB/SB199_R1.pdf
      locator: Sec. 26(7)(a)
      quote: Academic integrity and plagiarism
