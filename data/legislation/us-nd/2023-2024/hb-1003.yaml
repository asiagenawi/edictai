id: us-nd-2023-2024-hb-1003
jurisdiction: us-nd
session: 2023-2024
identifier: HB 1003
title: Matching grants for legal education and the workforce education advisory council; to provide for
  a transfer; to provide for a legislative management study; to provide loan authorization for the Mayville
  state university old main project; to provide for a report; to provide an exemption; to provide legislative
  intent; and to declare an emergency.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
summary: Appropriates funds for the North Dakota University System and directs the legislative management
  to consider studying the impacts of artificial intelligence, including its effects on student learning,
  and to report findings and recommendations to the next legislative assembly.
provisions:
  - type: creates-task-force
    description: Directs an interim legislative management study of AI impacts that must include effects
      on student learning.
    citation:
      source_url: https://ndlegis.gov/assembly/68-2023/regular/documents/23-0232-05000.pdf
      locator: Sec. 44
      quote: The study must include a review of the effect of artificial intelligence on the provision
        of health care, effects on student learning
