id: us-nh-2026-sb-583
jurisdiction: us-nh
session: "2026"
identifier: SB 583
title: Directing the department of education to create an education funding transparency data and reporting
  system.
classification: bill
education_levels:
  - k12
topics:
  - data-governance
  - institutional-operations
summary: Directs the Department of Education to create an education funding transparency data and reporting
  system with a longitudinal funding data system and dashboards. Requires the system to include data mining,
  machine learning, predictive analytics and natural language processing capabilities, and restricted
  dashboards for data protected under federal education privacy law, with appropriations of $900,000 and
  $500,000 annually.
