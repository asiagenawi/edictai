id: us-ia-2025-2026-hsb-294
jurisdiction: us-ia
session: 2025-2026
identifier: HSB 294
title: A bill for an act relating to artificial intelligence, including the use of artificial intelligence
  to create materials related to elections and protections in interactions with artificial intelligence
  systems, and making penalties applicable.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - admissions
  - equity-access
  - institutional-operations
summary: Regulates high-risk artificial intelligence systems used in consequential decisions, which include
  enrollment in education or an educational opportunity, by requiring developer documentation, deployer
  impact assessments and annual reviews for algorithmic discrimination, and disclosure of AI interactions.
  Also addresses AI-generated election materials.
provisions:
  - type: ai-in-admissions
    description: Defines consequential decisions to include enrollment in education or an educational
      opportunity.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.legis.iowa.gov/docs/publications/LGI/91/attachments/HSB294.html
      locator: New chapter, definition of "consequential decision"
      quote: b. Enrollment in education or an educational opportunity. c. Employment.
  - type: bias-or-equity-requirement
    description: Deployer impact assessments must analyze and mitigate risks of algorithmic discrimination.
    citation:
      source_url: https://www.legis.iowa.gov/docs/publications/LGI/91/attachments/HSB294.html
      locator: New chapter, deployer impact assessment
      quote: An analysis of whether the use of the high-risk artificial intelligence system poses any
        known or foreseeable risk of algorithmic discrimination and, if so, the nature of the algorithmic
        discrimination and the steps that have been taken to mitigate the risks.
