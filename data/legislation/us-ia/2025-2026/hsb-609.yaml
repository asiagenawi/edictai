id: us-ia-2025-2026-hsb-609
jurisdiction: us-ia
session: 2025-2026
identifier: HSB 609
title: A bill for an act modifying the duties of the workforce development board, state board of education,
  and department of education related to cyber and artificial intelligence.(See HF 2528.)
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - curriculum-standards
  - workforce
  - funding
summary: Requires the workforce development board to establish a cyber and artificial intelligence workforce
  initiative, including support for K-12 cyber and AI literacy standards, higher education partnerships,
  and, subject to appropriation, a grant program for AI training programs. Directs the state board of
  education to oversee statewide cyber and AI education standards and frameworks from kindergarten through
  higher education and a voluntary school certification program, and requires the department of education
  to run a community cyber and AI awareness initiative.
provisions:
  - type: ai-in-standards
    description: The workforce initiative must support standards for cyber and AI literacy in the K-12
      public school curriculum.
    education_levels:
      - k12
    citation:
      source_url: https://www.legis.iowa.gov/docs/publications/LGI/91/attachments/HSB609.html
      locator: Section 84A.1B, new subsection, par. a
      quote: In conjunction with the department of education, support for the development and implementation
        of standards for cyber and artificial intelligence literacy within the kindergarten through grade
        twelve public school curriculum.
  - type: ai-in-standards
    description: The state board must oversee adoption of statewide cyber and AI education standards from
      kindergarten through higher education.
    education_levels:
      - k12
    citation:
      source_url: https://www.legis.iowa.gov/docs/publications/LGI/91/attachments/HSB609.html
      locator: Section 256.7, new subsection, par. c
      quote: Development and adoption of consistent statewide standards and frameworks for cyber and artificial
        intelligence education, from kindergarten through higher education.
  - type: appropriates-funding
    description: Subject to appropriation, the initiative must include a grant program for cyber and AI
      training programs at educational institutions.
    citation:
      source_url: https://www.legis.iowa.gov/docs/publications/LGI/91/attachments/HSB609.html
      locator: Section 84A.1B, new subsection, par. c
      quote: A grant program to support educational institutions and private sector entities in developing
        and expanding cyber and artificial intelligence training programs.
