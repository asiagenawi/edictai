identifier: H.R. 5584
title: LIFT AI Act Literacy in Future Technologies Artificial Intelligence Act
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - educator-training
  - funding
summary: Authorizes the National Science Foundation to make competitive awards to institutions of higher
  education and nonprofits to develop K-12 AI literacy curricula, instructional materials, teacher professional
  development, and evaluation methods.
provisions:
  - type: appropriates-funding
    description: NSF may make merit-reviewed awards to develop K-12 AI literacy curricula, instructional
      material, teacher professional development, and evaluation methods.
    citation:
      source_url: https://www.congress.gov/119/bills/hr5584/BILLS-119hr5584ih.pdf
      locator: Sec. 2(b)
      quote: The Director may make awards on a merit-reviewed, competitive basis to institutions of higher
        education or nonprofit organizations (or a consortium thereof) to support research activities
        to develop edu- cational curricula, instructional material, teacher profes- sional development,
  - type: educator-pd-requirement
    description: Award funds may support AI literacy professional development for state and local educational
      agencies, principals, and educators.
    citation:
      source_url: https://www.congress.gov/119/bills/hr5584/BILLS-119hr5584ih.pdf
      locator: Sec. 2(c)(4)
      quote: Designing and implementing professional development courses and experiences in AI literacy,
        including mentoring, for State and local educational agencies, principals, educators, or other
        school lead- ers
