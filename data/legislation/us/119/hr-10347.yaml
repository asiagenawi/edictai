summary: Directs the Secretary of Education to make grants to states, local educational agencies, Tribal
  schools, and institutions of higher education to expand data literacy and data science education, defined
  to include artificial intelligence and machine learning.
provisions:
  - type: appropriates-funding
    description: Grant-funded data science education is defined to include artificial intelligence and
