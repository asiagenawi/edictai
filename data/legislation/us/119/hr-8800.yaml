id: us-119-hr-8800
jurisdiction: us
session: "119"
identifier: H.R. 8800
title: Military Chaplains Modernization Act of 2026 SHIPS for America Act of 2026 Shipbuilding and Harbor
  Infrastructure for Prosperity and Security for America Act of 2026
classification: bill
education_levels:
  - postsecondary
topics:
  - academic-integrity
  - task-force
summary: Requires the Superintendent of the United States Air Force Academy to report a strategy to improve
  academic outcomes, including an assessment of the Cadet Honor Code and recommendations to update it
  to address artificial intelligence and large language models.
provisions:
  - type: creates-task-force
    description: The Academy's academic outcomes report must assess the Cadet Honor Code and recommend
      updates to address AI and large language models.
    citation:
      source_url: https://www.congress.gov/119/bills/hr8800/BILLS-119hr8800eh.pdf
      locator: Sec. 529F(1)
      quote: an assessment of the Cadet Honor Code and any recommendations of the Superintendent to update
        the Cadet Honor Code to address artificial intelligence, large language models, and other emerging
        technology;
