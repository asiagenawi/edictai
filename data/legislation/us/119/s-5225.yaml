id: us-119-s-5225
jurisdiction: us
session: "119"
identifier: S. 5225
title: K–12 AI Literacy and Readiness Act of 2026
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - educator-training
  - funding
  - instructional-use
summary: Amends the Elementary and Secondary Education Act so that state and local Student Support and
  Academic Enrichment funds may be used for instruction on safe, effective, and responsible use of artificial
  intelligence and for professional development that prepares teachers and other school staff to use and
  teach the use of AI.
provisions:
  - type: appropriates-funding
    description: Adds safe, effective, and responsible use of AI to the allowable state uses of funds
      for student instruction.
    citation:
      source_url: https://www.congress.gov/119/bills/s5225/BILLS-119s5225is.pdf
      locator: Sec. 2(a)
      quote: the use of artificial intelligence (as defined in section 5002 of the National Artificial
        Intelligence Initiative Act of 2020 (15 U.S.C. 9401)) in a manner that is safe, effective, and
        responsible; or
  - type: appropriates-funding
    description: Adds instruction on the use of AI to the allowable local uses of funds.
    citation:
      source_url: https://www.congress.gov/119/bills/s5225/BILLS-119s5225is.pdf
      locator: Sec. 2(c)
      quote: instruction on the use of artificial intelligence (as defined in section 5002 of the National
        Artificial Intelligence Initiative Act of 2020 (15 U.S.C. 9401)) in a manner that is safe, effective,
        and responsible; or
  - type: educator-pd-requirement
    description: Allows funds to be used to give teachers and school staff the knowledge and skills to
      use and teach the use of AI, including through professional development.
    citation:
      source_url: https://www.congress.gov/119/bills/s5225/BILLS-119s5225is.pdf
      locator: Sec. 2(b), (d)
      quote: providing teachers, paraprofessionals, school librarians and media personnel, specialized
        instructional support personnel, and administrators with the knowledge and skills to use, and
        teach the use of, artificial intelligence
