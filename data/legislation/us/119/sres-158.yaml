summary: Expresses the sense of the Senate that paraprofessionals and education support staff in schools
  and public colleges should have fair compensation, benefits, and working conditions, including notice
  of and input into the implementation of algorithms and artificial intelligence technology in their schools,
  and professional development as new technologies are introduced.
