title: SCREEN Act Shielding Children’s Retinas from Egregious Exposure on the Net Act Safeguarding Adolescents
  From Exploitative BOTs Act SAFE BOTs Act Kids Online Safety Act Stop Profiling Youth and Kids Act SPY
  Kids Act Kids Internet Safety Partnership Act Safe Social Media Act No Fentanyl on Social Media Act
  Assessing Safety Tools for Parents and Minors Act Promoting a Safe Internet for Minors Act AI Warnings
  And Resources for Education Act AWARE Act
