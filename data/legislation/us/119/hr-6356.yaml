id: us-119-hr-6356
jurisdiction: us
session: "119"
identifier: H.R. 6356
title: Artificial Intelligence Civil Rights Act of 2025
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - assessment
  - admissions
summary: Prohibits developers and deployers from using covered algorithms in ways that cause disparate
  impact or discrimination in consequential actions, and requires pre-deployment evaluations and impact
  assessments. Consequential actions include education decisions such as assessment, proctoring, academic
  integrity, admissions, and financial aid.
provisions:
  - type: bias-or-equity-requirement
    description: Consequential actions governed by the Act include education decisions such as assessment,
      proctoring, academic integrity, accreditation, admissions, and financial aid.
    citation:
      source_url: https://www.congress.gov/119/bills/hr6356/BILLS-119hr6356ih.pdf
      locator: Sec. 2(4)(B)
      quote: (B) Education and career and technical education, including assessment, proctoring, promotion
        of academic integrity, accreditation, certification, admissions, enrollment, discipli- nary actions
        including suspension, expulsion, or referral to law enforcement,
  - type: bias-or-equity-requirement
    description: Bars developers and deployers from using covered algorithms in a manner that causes or
      contributes to a disparate impact related to a consequential action.
    citation:
      source_url: https://www.congress.gov/119/bills/hr6356/BILLS-119hr6356ih.pdf
      locator: Sec. 101(a)
      quote: shall not offer, license, promote, sell, or use a covered algorithm in a manner that
