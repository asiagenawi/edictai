id: us-119-hres-297
jurisdiction: us
session: "119"
identifier: H.Res. 297
title: Expressing the sense of the House of Representatives that paraprofessionals and education support
  staff should have fair compensation, benefits, and working conditions.
classification: resolution
education_levels:
  - k12
  - postsecondary
topics:
  - employment-evaluation
  - educator-training
summary: Expresses the sense of the House that paraprofessionals and education support staff in schools
  and public colleges should have fair compensation, benefits, and working conditions, including notice
  of and input into the implementation of algorithms and artificial intelligence technology in their schools,
  and professional development as new technologies are introduced.
