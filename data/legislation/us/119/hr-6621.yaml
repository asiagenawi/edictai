id: us-119-hr-6621
jurisdiction: us
session: "119"
identifier: H.R. 6621
title: Workforce of the Future Act of 2025
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - workforce
  - funding
summary: Requires a joint federal report on the impact of artificial intelligence on jobs, including the
  resources institutions of higher education need to deliver AI-related skills. Authorizes Department
  of Education grants to expand prekindergarten through grade 12 and postsecondary emerging and advanced
  technology education, which the bill defines to include artificial intelligence.
provisions:
  - type: creates-task-force
    description: The AI jobs report must identify the resources institutions of higher education, including
      community and technical colleges, need to deliver AI-related skills and education.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.congress.gov/119/bills/hr6621/BILLS-119hr6621ih.pdf
      locator: Sec. 103(b)(10)
      quote: Identification of the resources and oppor- tunities required for labor organizations and
        institu- tions of higher education, including community col- leges, technical colleges
  - type: appropriates-funding
    description: Directs the Secretary of Education to award grants to expand emerging and advanced technology
      education.
    citation:
      source_url: https://www.congress.gov/119/bills/hr6621/BILLS-119hr6621ih.pdf
      locator: Sec. 203(a)(1)
      quote: The Secretary shall award grants to eligible entities to support the expansion of emerging
        and advanced technology education.
  - type: appropriates-funding
    description: Defines the emerging and advanced technology education funded by the grants to include
      artificial intelligence.
    citation:
      source_url: https://www.congress.gov/119/bills/hr6621/BILLS-119hr6621ih.pdf
      locator: Sec. 202(4)
      quote: the relationship between computing and mathe- matics; artificial intelligence; quantum computing;
