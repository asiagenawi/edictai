summary: >-
  Would amend the Elementary and Secondary Education Act of 1965 so that the academic standards states adopt
  may include standards for artificial intelligence and other emerging technologies. The bill was referred
  to the Senate HELP Committee.
provisions:
  - type: ai-in-standards
    description: Adds standards for AI and other emerging technologies to the state academic standards provision of ESEA Section 1111(b)(1)(C).
