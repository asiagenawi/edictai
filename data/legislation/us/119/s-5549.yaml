summary: Supports educators through programs on educator preparation, recruitment, and retention. Directs
  the Department of Education's educational technology office to support digital literacy skills, including
  skills related to artificial intelligence, and to build the capacity of local educational agencies and
  educator preparation programs to integrate emerging technologies; it also lists AI-driven tutoring platforms
  among emerging technology tools.
provisions:
  - type: educator-prep-requirement
    description: The educational technology office must build the capacity of local educational agencies
      and educator preparation programs to integrate emerging technologies and support AI-related skills.
    citation:
      source_url: https://www.congress.gov/119/bills/s5549/BILLS-119s5549is.pdf
      locator: Sec. 102, new (c)(3)
      quote: building the capacity of local educational agencies and educator preparation programs to
        integrate emerging technologies and support the development of digital literacy skills, including
        skills related to Artificial Intelligence.
  - type: educator-prep-requirement
    description: Lists emerging technology tools such as AI-driven tutoring platforms alongside educator
      preparation practices.
    citation:
      source_url: https://www.congress.gov/119/bills/s5549/BILLS-119s5549is.pdf
      locator: Sec. 402(5)
      quote: emerging technology tools, such as AI-driven tutoring platforms
