id: us-119-s-4414
jurisdiction: us
session: "119"
identifier: S. 4414
title: LIFT AI Act
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - educator-training
  - research
summary: >-
  Would authorize the National Science Foundation to make competitive awards to colleges and nonprofits to
  develop K-12 AI literacy curricula, instructional materials, teacher professional development, and
  evaluation tools. The bill was referred to the Senate Commerce, Science, and Transportation Committee.
provisions:
  - type: requires-ai-literacy-instruction
    description: Funds development of formal and informal K-12 AI literacy curricula and augmentation of existing curricula to include AI literacy; does not mandate instruction.
    education_levels:
      - k12
    citation:
      source_url: https://www.govinfo.gov/content/pkg/BILLS-119s4414is/html/BILLS-119s4414is.htm
      locator: Sec. 2(b)-(c)
      quote: to support research activities to develop educational curricula, instructional material, teacher professional development, and evaluation methods for AI literacy at the K-12 level
  - type: educator-pd-requirement
    description: Allows awards to fund AI literacy professional development for state and local educational agencies, principals, and educators.
    education_levels:
      - k12
    citation:
      source_url: https://www.govinfo.gov/content/pkg/BILLS-119s4414is/html/BILLS-119s4414is.htm
      locator: Sec. 2(c)(4)
