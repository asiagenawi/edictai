summary: Expands Department of Agriculture programs to increase access to artificial intelligence in agriculture,
  including by adding AI to cooperative extension work and by prioritizing food and agricultural sciences
  education grants for teaching enhancement projects on AI systems and precision agriculture. Creates
  an Artificial Intelligence Agriculture Advisor.
