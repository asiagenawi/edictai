summary: Authorizes the Secretary of Defense to fund National Security and Defense AI Institutes hosted
  at senior military colleges. Institutes must support AI workforce development, and funds may go to AI
  education activities and outreach to broaden participation in the AI workforce.
provisions:
  - type: ai-workforce-program
    description: Each Institute must support workforce development in AI-related disciplines.
    citation:
      source_url: https://www.congress.gov/119/bills/hr5466/BILLS-119hr5466ih.htm
      locator: Sec. 2(b)(5)
      quote: supports workforce development in artificial intelligence related disciplines in the United
        States.
  - type: appropriates-funding
    description: Financial assistance to senior military colleges may fund AI research and education activities.
    citation:
      source_url: https://www.congress.gov/119/bills/hr5466/BILLS-119hr5466ih.htm
      locator: Sec. 2(c)(2)(C)
      quote: conducting research and education activities involving artificial intelligence systems to
        solve challenges with national security implications;
