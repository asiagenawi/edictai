summary: Supports educators through multiple programs and directs the Department of Education's educational
  technology office to support research on digital literacy skills, including AI skills, and to build
  the capacity of local educational agencies and educator preparation programs to integrate emerging technologies
  and develop AI-related skills.
provisions:
  - type: educator-prep-requirement
    description: The Office of Educational Technology must build the capacity of local educational agencies
      and educator preparation programs to develop skills related to AI.
    citation:
      source_url: https://www.congress.gov/119/bills/hr10530/BILLS-119hr10530ih.pdf
      locator: Sec. 102 (new (c)(3))
      quote: building the capacity of local educational agencies and educator preparation programs to
        inte- grate emerging technologies and support the devel- opment of digital literacy skills, including
        skills re- lated to Artificial Intelligence.
  - type: appropriates-funding
    description: Grant partnerships describe how they will integrate technology, including AI, into funded
      strategies to support learning.
