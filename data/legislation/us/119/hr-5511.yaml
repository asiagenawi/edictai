id: us-119-hr-5511
jurisdiction: us
session: "119"
identifier: H.R. 5511
title: Algorithmic Accountability Act of 2025
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Directs the Federal Trade Commission to require covered entities to perform impact assessments
  of covered algorithms, derived from machine learning, artificial intelligence, or similar techniques,
  used to make decisions with legal, material, or similarly significant effects on consumers, which include
  decisions on access to education and vocational training, including assessment, accreditation, or certification.
provisions:
  - type: bias-or-equity-requirement
    description: Critical decisions subject to impact assessment include decisions on education and vocational
      training, including assessment, accreditation, or certification.
    citation:
      source_url: https://www.congress.gov/119/bills/hr5511/BILLS-119hr5511ih.pdf
      locator: Sec. 2(7)(A)
      quote: (A) education and vocational training, in- cluding assessment, accreditation, or certifi-
        cation; (B) employment, workers management, or self-employment;
