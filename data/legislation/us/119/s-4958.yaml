summary: Amends the Elementary and Secondary Education Act so that Student Support and Academic Enrichment
  funds may support teaching elementary and secondary students about the dangers, limitations, and responsible
  use of artificial intelligence, including AI chatbots, and may provide counseling for mental health
  issues arising from AI chatbot use.
provisions:
  - type: appropriates-funding
    description: Adds supporting schools in teaching students about the dangers, limitations, and responsible
      use of AI to allowable state uses of funds.
    citation:
      source_url: https://www.congress.gov/119/bills/s4958/BILLS-119s4958is.pdf
      locator: Sec. 2(2)(B), ESEA 4104(b)(3)(C)(vii)
      quote: supporting schools in teaching elementary school and secondary school students about the
        dangers, limitations, and responsible use of artificial intelligence technologies, including artificial
        intelligence chatbots.
  - type: chatbot-minor-protections
    description: Allows funds for counseling for mental health issues arising from students' use of AI
      chatbots.
    citation:
      source_url: https://www.congress.gov/119/bills/s4958/BILLS-119s4958is.pdf
      locator: Sec. 2(2)(A), ESEA 4104(b)(3)(B)(ii)(II)
      quote: which may include providing counseling for mental health issues arising from the use of an
        artificial intelligence chatbot
