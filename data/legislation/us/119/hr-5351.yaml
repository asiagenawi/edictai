id: us-119-hr-5351
jurisdiction: us
session: "119"
identifier: H.R. 5351
title: NSF AI Education Act of 2025
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - workforce
  - educator-training
  - research
  - funding
summary: >-
  Would authorize the National Science Foundation to fund AI scholarships and fellowships for undergraduate
  and graduate students, professional development fellowships for K-12 teachers and other school
  professionals, up to eight community college and career and technical education Centers of AI Excellence,
  and research on AI in education. The House Science Committee ordered it reported with a substitute
  amendment on June 25, 2026.
provisions:
  - type: educator-pd-requirement
    description: Authorizes NSF fellowships for teachers, school counselors, and other school professionals to train on teaching and using AI in K-12 settings.
    education_levels:
      - k12
    citation:
      source_url: https://www.govinfo.gov/content/pkg/BILLS-119hr5351ih/html/BILLS-119hr5351ih.htm
      locator: Sec. 2, new 5401(e)(2)(E)(iv)
      quote: may award fellowships to teachers, school counselors, and other school professionals for professional development programs
  - type: ai-workforce-program
    description: Directs NSF to designate up to eight community college and area career and technical education Centers of AI Excellence.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.govinfo.gov/content/pkg/BILLS-119hr5351ih/html/BILLS-119hr5351ih.htm
      locator: Sec. 3
      quote: shall establish up to eight regionally and geographically diverse eligible applicants to be designated as Community College and Area Career and Technical Education Centers of AI Excellence
  - type: appropriates-funding
    description: Authorizes NSF scholarships and fellowships for students in AI-related degree programs, with possible priority for those studying to teach AI.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.govinfo.gov/content/pkg/BILLS-119hr5351ih/html/BILLS-119hr5351ih.htm
      locator: Sec. 2, new 5401(e)(2)(D)
