summary: Establishes the Economy of the Future Commission to develop legislative recommendations on economic
  changes caused by artificial intelligence adoption. The Commission must evaluate effects on K-12 public
  education, career and technical education, and higher education, and its final report must include recommendations
  on artificial intelligence education.
provisions:
  - type: creates-task-force
    description: The Commission must evaluate the effects of AI adoption on K-12 education, career and
      technical education, and higher education.
    citation:
      source_url: https://www.congress.gov/119/bills/s4046/BILLS-119s4046is.pdf
      locator: Sec. 2(g)(2)(C)
      quote: (C) kindergarten through grade 12 public education, career and technical education, and higher
        education; and
  - type: creates-task-force
    description: The Commission's final report must include legislative recommendations on artificial
      intelligence education.
    citation:
      source_url: https://www.congress.gov/119/bills/s4046/BILLS-119s4046is.pdf
      locator: Sec. 2
      quote: the Commission shall prepare and submit a final report regarding the impact of the adoption
        of artificial intelligence that includes legislative recommendations on artificial intelligence
        education
