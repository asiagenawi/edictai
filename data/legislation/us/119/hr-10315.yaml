summary: Directs the Secretary of Education to make competitive grants to states to establish or expand
  educational programs on artificial intelligence in elementary and secondary schools, including dedicated
  AI curricula and professional education for teachers, and to study the program.
provisions:
  - type: appropriates-funding
    description: The Secretary must make competitive grants to states for AI educational programs in elementary
      and secondary schools.
    citation:
      source_url: https://www.congress.gov/119/bills/hr10315/BILLS-119hr10315ih.pdf
      locator: Sec. 2(a)
      quote: the Secretary makes grants to States, on a competitive basis, to support the establish- ment
        and expansion of educational programs on artificial intelligence in elementary and secondary schools
  - type: educator-pd-requirement
    description: Grant funds support professional education for teachers to understand AI and incorporate
      it into teaching workflows.
    citation:
      source_url: https://www.congress.gov/119/bills/hr10315/BILLS-119hr10315ih.pdf
      locator: Sec. 2(c)(2)
      quote: professional education for teachers to help teachers better understand artificial intelligence
        and incorporate it into teaching workflows.
