id: us-119-hr-6591
jurisdiction: us
session: "119"
identifier: H.R. 6591
title: Computer Science for All Act of 2025
classification: bill
education_levels:
  - k12
topics:
  - funding
  - curriculum-standards
summary: Authorizes the Secretary of Education to make grants to states, local educational agencies, and
  Tribal schools to expand prekindergarten through grade 12 computer science education, which the bill
  defines to include artificial intelligence, and asks applicants to describe preparing students to apply
  computer science to technologies such as AI.
provisions:
  - type: appropriates-funding
    description: Grant applications must describe preparing students to apply computer science knowledge
      to rapidly evolving technologies such as AI.
    citation:
      source_url: https://www.congress.gov/119/bills/hr6591/BILLS-119hr6591ih.pdf
      locator: Sec. 4(b)(6)
      quote: Preparing the students for application of computer science knowledge in rapidly evolving
        tech- nologies, such as artificial intelligence.
