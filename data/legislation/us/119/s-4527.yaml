identifier: S. 4527
title: Improving Emerging Tech Opportunities for Veterans Act of 2026
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
summary: Expands the Veterans Affairs high technology education program to include emerging technologies
  such as artificial intelligence, and directs the Secretary to work with employers and educational institutions
  to identify courses of education that prepare veterans for jobs in emerging technology fields.
provisions:
  - type: ai-workforce-program
    description: Program criteria must identify technologies such as AI to be treated as emerging technologies
      eligible under the veterans high technology education program.
    citation:
      source_url: https://www.congress.gov/119/bills/s4527/BILLS-119s4527is.pdf
      locator: Sec. 2(a)(3)
      quote: Such criteria shall also identify which technologies of critical importance, such as artificial
        intelligence and semiconductor manufacturing, shall be treated as emerging technologies for purposes
        of this section.
