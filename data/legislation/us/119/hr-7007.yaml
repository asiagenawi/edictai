topics:
  - ai-literacy
  - funding
  - task-force
summary: Among other measures, authorizes National Science Foundation awards for AI literacy curricula
  and programs and directs federal agencies, including the Secretary of Education, to report on strategies
  for incorporating AI literacy into K-12 and higher education curricula.
provisions:
  - type: appropriates-funding
    description: Award funds may be used to develop AI literacy curricula, educational materials, and
      resources.
    citation:
      source_url: https://www.congress.gov/119/bills/hr7007/BILLS-119hr7007ih.pdf
      locator: Sec. 401(a)(2)(A)
      quote: To develop curricula, educational ma- terials, and resources focused on AI literacy, in-
        cluding relating to understanding the basics of AI, its applications, ethical considerations,
        and the societal impacts of AI.
  - type: creates-task-force
    description: The Secretary of Education must identify strategies for incorporating AI literacy into
      K-12 and higher education curricula.
    citation:
      source_url: https://www.congress.gov/119/bills/hr7007/BILLS-119hr7007ih.pdf
      locator: Sec. 401(b)(1)(D)
      quote: The Secretary of Education shall iden- tify strategies for incorporating AI literacy into
        K–12 and higher education curricula, ensuring that all students have access to quality AI edu-
        cation
