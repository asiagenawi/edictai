summary: Establishes an Artificial Intelligence Horizon Fund, with amounts transferable to the Department
  of Education for grants including foundational AI literacy. Directs the Secretary of Education to create
  a national clearinghouse for AI education that disseminates instructional resources, voluntary model
  AI literacy curricula, and model guidance on classroom AI use, academic integrity, student privacy,
  and related topics.
provisions:
  - type: appropriates-funding
    description: Fund amounts may be transferred to the Department of Education for grants including foundational
      literacy related to AI.
    citation:
      source_url: https://www.congress.gov/119/bills/s5518/BILLS-119s5518is.pdf
      locator: Sec. 101
      quote: of Education for grants related to career and technical education, STEM education, higher
        education programs, educator preparation programs, digital infrastructure, data interoperability,
        foundational literacy as it relates to artificial intelligence
  - type: issues-model-policy
    description: The clearinghouse must disseminate model guidance on classroom use of AI, academic integrity,
      student privacy, and related topics.
    citation:
      source_url: https://www.congress.gov/119/bills/s5518/BILLS-119s5518is.pdf
      locator: Sec. 703(b)(4)
      quote: identify and disseminate model guidance regarding— (A) classroom use of artificial intelligence;
  - type: issues-model-policy
    description: The clearinghouse must disseminate voluntary model curricula for age-appropriate AI literacy.
    citation:
      source_url: https://www.congress.gov/119/bills/s5518/BILLS-119s5518is.pdf
      locator: Sec. 703(b)(3)
      quote: disseminate voluntary model curricula for age-appropriate artificial intelligence literacy
        across grades;
