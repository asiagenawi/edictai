identifier: S. 4627
title: FARM AI Act of 2026 Fostering Agricultural Research and Modernization through Artificial Intelligence
  Act of 2026
classification: bill
education_levels:
  - postsecondary
topics:
  - funding
  - workforce
summary: Expands Department of Agriculture programs to increase access to artificial intelligence in agriculture.
  Adds AI to cooperative extension work, adds a purpose to food and agricultural sciences education grants
  for training programs that teach implementation of computing systems and AI, and prioritizes teaching
  enhancement projects on AI systems and precision agriculture.
provisions:
  - type: ai-workforce-program
    description: Adds a grant purpose for workforce development and technical training programs for rural
      communities that teach implementation of computing systems and AI.
    citation:
      source_url: https://www.congress.gov/119/bills/s4627/BILLS-119s4627is.pdf
      locator: Sec. 3(d)(1), new 1417(b)(7)
      quote: to design and implement workforce development and technical training programs for rural communities
        to teach— ‘‘(A) the implementation of computing systems and artificial intelligence;
  - type: appropriates-funding
    description: Adds a grant priority for teaching enhancement projects on developing and implementing
      AI systems.
    citation:
      source_url: https://www.congress.gov/119/bills/s4627/BILLS-119s4627is.pdf
      locator: Sec. 3(d)(2), new 1417(c)(3)
      quote: applications for teaching enhancement projects that focus on workforce development and technical
        assistance education programs to develop and implement artificial intelligence systems and precision
        agriculture technologies.
