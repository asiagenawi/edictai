identifier: H.R. 5360
title: AWARE Act AI Warnings And Resources for Education Act
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - ai-literacy
summary: Directs the Federal Trade Commission to develop public educational resources for parents, educators,
  and minors on the safe and responsible use of AI chatbots by minors, covering safe and unsafe use, privacy
  and data collection, and parental supervision.
provisions:
  - type: chatbot-minor-protections
    description: The FTC must develop educational resources for parents, educators, and minors on safe
      use of AI chatbots by minors.
    citation:
      source_url: https://www.congress.gov/119/bills/hr5360/BILLS-119hr5360ih.pdf
      locator: Sec. 2(a)
      quote: shall develop and make available to the public educational resources for parents, educators,
        and minors with respect to the safe and responsible use of AI chatbots by minors.
