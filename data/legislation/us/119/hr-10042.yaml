identifier: H.R. 10042
title: Understanding AI in the Classroom Act
classification: bill
education_levels:
  - k12
topics:
  - research
  - safety-wellbeing
  - task-force
summary: Directs the National Science Foundation to hold workshops identifying gaps in data and research
  on the effects and harms to children of integrating artificial intelligence into classrooms, with participation
  from researchers, educators, school leaders, and parent groups, and to report the findings.
provisions:
  - type: creates-task-force
    description: NSF must complete workshops identifying research gaps on harms to children from integrating
      AI into classrooms and report to Congress.
    citation:
      source_url: https://www.congress.gov/119/bills/hr10042/BILLS-119hr10042ih.pdf
      locator: Sec. 2(a)
      quote: the Director shall complete workshops to identify any gaps in relevant data and published
        findings related to any effect on or harm to children as a result of the integration of artificial
        intel- ligence into classrooms
