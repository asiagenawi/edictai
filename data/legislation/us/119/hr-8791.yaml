id: us-119-hr-8791
jurisdiction: us
session: "119"
identifier: H.R. 8791
title: IGNITE HBCU Excellence Act Institutional Grants for New Infrastructure, Technology, and Education
  for HBCU Excellence Act
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Creates a competitive grant program for long-term facility improvements at Historically Black
  Colleges and Universities. Allowable uses include workforce development hubs focused on fields such
  as artificial intelligence that support education, training, and career placement for students, and
  research equipment for emerging fields such as AI.
provisions:
  - type: ai-workforce-program
    description: Grant funds may develop workforce development hubs focused on fields such as AI that
      support student education, training, and career placement.
    citation:
      source_url: https://www.congress.gov/119/bills/hr8791/BILLS-119hr8791ih.pdf
      locator: Sec. 3(a)(1)(G)
      quote: establishing workforce development hubs that— (i) are aligned with regional labor market
        needs; (ii) focus on fields such as artificial intelligence; and (iii) support education, training,
        and career placement for students.
