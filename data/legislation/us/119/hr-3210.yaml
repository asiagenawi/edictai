id: us-119-hr-3210
jurisdiction: us
session: "119"
identifier: H.R. 3210
title: Artificial Intelligence Literacy and Inclusion Act
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - funding
  - curriculum-standards
  - task-force
summary: Authorizes National Science Foundation awards to nonprofits and educational institutions for
  community AI literacy programs and curricula, and directs federal agencies, including the Secretary
  of Education, to report on strategies for incorporating AI literacy into K-12 and higher education curricula.
provisions:
  - type: appropriates-funding
    description: NSF may make awards to educational institutions and others to develop and evaluate local
      AI literacy programs.
    citation:
      source_url: https://www.congress.gov/119/bills/hr3210/BILLS-119hr3210ih.pdf
      locator: Sec. 2(a)(1)
      quote: may make awards to eli- gible entities, including nonprofit organizations, edu- cational
        institutions, or consortiums of such entities, to develop, implement, and evaluate programs that
        promote AI literacy at the local level
  - type: creates-task-force
    description: The Secretary of Education must identify strategies for incorporating AI literacy into
      K-12 and higher education curricula.
    citation:
      source_url: https://www.congress.gov/119/bills/hr3210/BILLS-119hr3210ih.pdf
      locator: Sec. 2(b)(1)(D)
      quote: The Secretary of Education shall iden- tify strategies for incorporating AI literacy into
        K–12 and higher education curricula, ensuring that all students have access to quality AI edu-
        cation
