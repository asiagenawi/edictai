id: us-119-hr-7103
jurisdiction: us
session: "119"
identifier: H.R. 7103
title: Improving Emerging Tech Opportunities for Veterans Act
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
summary: Directs the Department of Veterans Affairs to identify and expedite approval of courses of education
  in emerging technologies, such as artificial intelligence, and expands the veterans high technology
  education program to cover emerging technologies.
provisions:
  - type: ai-workforce-program
    description: The veterans high technology program's criteria must identify emerging technologies,
      such as AI, eligible for covered education programs.
    citation:
      source_url: https://www.congress.gov/119/bills/hr7103/BILLS-119hr7103ih.pdf
      locator: Sec. 3(a)(3)
      quote: Such criteria shall also identify which technologies of critical importance, such as arti-
        ficial intelligence and semiconductor manufac- turing, shall be treated as emerging tech- nologies
        for purposes of this section.
