summary: Establishes a federal framework for AI in education and the workforce, including training for
  teachers and school leaders on AI use without replacing educators, research and regional centers on
  AI in education, AI workforce and reskilling grants, equitable-access grants, and federal resources
  on AI procurement, family consent, and model policies on AI misuse.
provisions:
  - type: educator-pd-requirement
    description: Funds prepare teachers and school leaders to use AI to improve instruction, assessment,
      and communication without replacing educators.
    education_levels:
      - k12
    citation:
      source_url: https://www.congress.gov/119/bills/hr10515/BILLS-119hr10515ih.pdf
      locator: Sec. 105 (amending Section 2103(b)(3))
      quote: prepare teachers, principals, superintendents, and other school leaders to— ‘‘(i) use artificial
        intelligence to im- prove instruction, assessment, and commu- nication among students, educators,
        and families, without replacing— ‘‘(I) educators;
  - type: regulates-ai-assessment
    description: Core educator capacities include reviewing and approving any AI-generated or AI-scored
      assessment of student work.
    education_levels:
      - k12
    citation:
      source_url: https://www.congress.gov/119/bills/hr10515/BILLS-119hr10515ih.pdf
      locator: Sec. 105 (amending Section 2103(b)(3))
      quote: reviewing and approving any assessment of student work generated or scored by artificial
        intel- ligence prior to such
  - type: issues-model-policy
    description: Federal resources must include illustrative model policies to mitigate abuses of AI in
      educational activities, including academic dishonesty.
    citation:
      source_url: https://www.congress.gov/119/bills/hr10515/BILLS-119hr10515ih.pdf
      locator: Sec. 503
      quote: model policies, which shall be illustrative and not prescriptive, for the purpose of mitigating
        abuses of artificial intelligence in educational activi- ties, including—
  - type: procurement-standards
    description: Federal resources address procurement of AI tools by educational agencies and institutions.
    citation:
      source_url: https://www.congress.gov/119/bills/hr10515/BILLS-119hr10515ih.pdf
      locator: Sec. 503
      quote: for procuring artificial intelligence tools for use in education;
