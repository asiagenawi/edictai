summary: Directs federal agencies to be transparent when using automated systems that use artificial intelligence
  to make covered decisions about individuals or interact with the public, including public inventories
  and guidance. Covered decisions include agency determinations affecting access to or the cost or availability
  of education and vocational training.
provisions:
  - type: requires-disclosure
    description: Defines critical decisions subject to the transparency requirements to include agency
      determinations affecting education and vocational training.
    citation:
      source_url: https://www.congress.gov/119/bills/s5648/BILLS-119s5648is.pdf
      locator: Sec. 2(4)(A)
      quote: related to the status, rights, property, or wellbeing of specific individuals or groups,
        the outcome of which meaningfully affects access to, or the cost, terms, or availability of— (A)
        education and vocational training;
