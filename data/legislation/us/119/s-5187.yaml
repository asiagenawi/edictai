title: PHD Talent Act of 2026 Promoting High-skilled Doctoral Talent Act of 2026
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Requires the Secretary of Energy to establish a program supporting accelerated doctoral programs
  at institutions of higher education in specified technology areas, including artificial intelligence.
  Participating institutions must provide education and training to develop dual competency, defined to
  include applying AI and related computational methods to research in a discipline.
