topics:
  - funding
  - workforce
  - educator-training
summary: Directs the National Science Foundation to make competitive awards that broaden participation
  in artificial intelligence research, education, and workforce development, including at institutions
  with limited AI capacity. Funds may support AI research programs, faculty recruitment and professional
  development in AI, bridge programs preparing students for AI graduate programs, and integration of safe
  and reliable practices into AI education programs.
provisions:
  - type: educator-pd-requirement
    description: Award funds may support faculty recruitment and professional development in AI.
    citation:
      source_url: https://www.congress.gov/119/bills/s5050/BILLS-119s5050is.pdf
      locator: Sec. 2, new 5401(g)(3)(B)
      quote: Faculty recruitment and professional development in artificial intelligence and related disciplines.
  - type: ai-workforce-program
    description: Award funds may support bridge programs preparing post-baccalaureate students for graduate
      programs in AI.
    citation:
      source_url: https://www.congress.gov/119/bills/s5050/BILLS-119s5050is.pdf
      locator: Sec. 2, new 5401(g)(3)(C)
      quote: Bridge programs focused on preparing post-baccalaureate students for graduate programs in
        artificial intelligence and related disciplines.
