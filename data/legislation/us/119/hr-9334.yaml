identifier: H.R. 9334
title: Workforce for AI Trust Act
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Amends the National Artificial Intelligence Initiative Act to support graduate and postdoctoral
  fellowships through institutions of higher education for research on trustworthy artificial intelligence,
  authorizes NSF workshops, and directs NIST to develop an AI workforce framework with outreach to AI
  programs at all education levels.
provisions:
  - type: appropriates-funding
    description: NSF makes awards through institutions of higher education for graduate and postdoctoral
      fellowships on trustworthy AI.
    citation:
      source_url: https://www.congress.gov/119/bills/hr9334/BILLS-119hr9334ih.pdf
      locator: Sec. 2(b)
      quote: fellowships for students and postdoctoral researchers from across disciplines, including
        social science disciplines and the humanities, by making awards through eligible institutions
        of higher education
  - type: ai-workforce-program
    description: NIST must support outreach of its AI workforce framework to AI programs at all education
      levels.
    citation:
      source_url: https://www.congress.gov/119/bills/hr9334/BILLS-119hr9334ih.pdf
      locator: Sec. 3
      quote: Outreach and dissemination to artificial intelligence programs at all education levels of
        such framework to prepare
