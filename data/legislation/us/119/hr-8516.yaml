summary: Authorizes the National Science Foundation to fund research on K-12 AI literacy curricula and
  educator professional learning, AI scholarships and fellowships for students, teachers, and school professionals,
  up to eight community college and area career and technical education Centers of AI Excellence, and
  research on teaching AI in pre-kindergarten through grade 12 classrooms. Also adds AI skills development
  to the National STEM Teacher Corps, alongside federal AI standards, research, governance, and deepfake
  provisions.
provisions:
  - type: appropriates-funding
    description: Authorizes NSF awards to develop K-12 AI literacy curricula and evaluation methods.
    education_levels:
      - k12
    citation:
      source_url: https://www.congress.gov/119/bills/hr8516/BILLS-119hr8516ih.pdf
      locator: Sec. 621(b)
      quote: The Director may make awards on a merit-reviewed, competitive basis to institutions of higher
        education and nonprofit organizations (and consortia thereof) to support research activities to
        develop edu- cational curricula and evaluation methods for AI literacy at the K–12 education level.
  - type: ai-workforce-program
    description: Authorizes NSF scholarships and fellowships for undergraduate and graduate students in
      AI programs of study.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.congress.gov/119/bills/hr8516/BILLS-119hr8516ih.pdf
      locator: Sec. 641, new subparagraph (D)
      quote: The Director of the National Science Foundation may sup- port scholarships and fellowships
        for un- dergraduate and graduate students by making awards through institutions of higher education,
        including community col- leges,
  - type: educator-pd-requirement
    description: Authorizes fellowships for teachers and school professionals to train on AI in K-12 settings.
    education_levels:
      - k12
    citation:
      source_url: https://www.congress.gov/119/bills/hr8516/BILLS-119hr8516ih.pdf
      locator: Sec. 641, new subparagraph (E)(iv)
      quote: The Director of the Na- tional Science Foundation may award fel- lowships to teachers, school
        counselors, and other school professionals for profes- sional development programs
  - type: ai-workforce-program
    description: Establishes up to eight Community College and Area Career and Technical Education Centers
      of AI Excellence.
    citation:
      source_url: https://www.congress.gov/119/bills/hr8516/BILLS-119hr8516ih.pdf
      locator: Sec. 642, new subparagraph (B)(ii)
      quote: Such Centers of AI Excellence shall enhance educational outcomes and drive workforce development
        by integrating artificial intelligence into teaching, learn- ing, and community engagement.
  - type: educator-prep-requirement
    description: Research awards must emphasize preparing incoming K-12 teachers to integrate AI into
      their classrooms.
    education_levels:
      - k12
    citation:
      source_url: https://www.congress.gov/119/bills/hr8516/BILLS-119hr8516ih.pdf
      locator: Sec. 643, new subsection (h)(4)
      quote: (A) emphasize preparing incoming K–12 teachers to integrate artificial intelligence into
        their classrooms in innovative ways;
