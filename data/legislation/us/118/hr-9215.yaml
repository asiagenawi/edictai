id: us-118-hr-9215
jurisdiction: us
session: "118"
identifier: H.R. 9215
title: Workforce for AI Trust Act
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Amends the National Artificial Intelligence Initiative Act to fund NSF graduate and postdoctoral
  fellowships at institutions of higher education in trustworthy and ethical AI, and directs NSF to support
  AI skills-based training for undergraduate and graduate students; it also adds AI governance workforce
  activities to NIST's mission.
provisions:
  - type: appropriates-funding
    description: Institutions of higher education receiving awards use them for graduate fellowships,
      tuition, fees, and stipends in programs advancing trustworthy AI.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9215/BILLS-118hr9215ih.pdf
      locator: Sec. 2(a)(1)
      quote: For graduate fellowships, tuition, education-related fees, and stipends for up to three academic
        years.
  - type: ai-workforce-program
    description: NSF is directed to support AI training for undergraduate and graduate students through
      skills-based training or certification programs.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9215/BILLS-118hr9215ih.pdf
      locator: Sec. 2(a), new paragraph (4)(A)
      quote: Training for undergraduate and grad- uate students and postdoctoral researchers through existing
        technical and skills-based training or certification programs
