identifier: H.R. 5628
title: Algorithmic Accountability Act of 2023
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Directs the Federal Trade Commission to require covered entities to perform impact assessments,
  including evaluation of differential performance, of automated decision systems used to make decisions
  with legal, material, or similarly significant effects on consumers, which include decisions on access
  to education and vocational training, including assessment, accreditation, or certification.
provisions:
  - type: bias-or-equity-requirement
    description: Critical decisions subject to impact assessment include decisions on education and vocational
      training, including assessment, accreditation, or certification.
    citation:
      source_url: https://www.congress.gov/118/bills/hr5628/BILLS-118hr5628ih.pdf
      locator: Sec. 2(8)(A)
      quote: consumer’s life relating to access to or the cost, terms, or availability of— (A) education
        and vocational training, in- cluding assessment, accreditation, or certifi- cation;
