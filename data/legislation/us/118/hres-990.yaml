id: us-118-hres-990
jurisdiction: us
session: "118"
identifier: H.Res. 990
title: Expressing the sense of the House of Representatives that paraprofessionals and education support
  staff should have fair compensation, benefits, and working conditions.
classification: resolution
education_levels:
  - k12
  - postsecondary
topics:
  - employment-evaluation
  - educator-training
summary: Expresses the sense of the House that paraprofessionals and education support staff in schools
  and public colleges should have fair compensation and working conditions, including input on the implementation
  of artificial intelligence technology in their schools and professional development as new technologies
  are introduced.
provisions:
  - type: educator-pd-requirement
    description: States that paraprofessionals and support staff should have input on AI technology in
      their schools and receive professional development as new technologies are introduced.
    citation:
      source_url: https://www.congress.gov/118/bills/hres990/BILLS-118hres990ih.pdf
      locator: Resolving clause, [Page 5]
      quote: implementation of electronic monitoring, data, algorithms, and artificial intelligence technology
        in the applicable school and should receive high- quality professional development as new tech-
        nologies are introduced;
