id: us-118-hr-9671
jurisdiction: us
session: "118"
identifier: H.R. 9671
title: Department of Energy Artificial Intelligence Act of 2024
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Creates a Department of Energy artificial intelligence research program. As part of the program,
  the Secretary may provide training, grants, and research opportunities for undergraduate and graduate
  students in AI and assist institutions of higher education in establishing AI degree and certificate
  programs.
provisions:
  - type: ai-workforce-program
    description: Allows the Secretary to assist institutions of higher education in establishing new AI
      degree and certificate programs.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9671/BILLS-118hr9671ih.htm
      locator: Sec. 2, new Sec. 5501(l)(3)
      quote: Assisting institutions of higher education to establish new degree and certificate programs
        in artificial intelligence-related disciplines.
  - type: ai-workforce-program
    description: Allows training, grants, and research opportunities for undergraduate and graduate students
      in advanced AI systems.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9671/BILLS-118hr9671ih.htm
      locator: Sec. 2, new Sec. 5501(l)(1)
      quote: Providing training, grants, and research opportunities, including experiential learning experiences
        for undergraduate and graduate students in advanced artificial intelligence systems.
