identifier: H.R. 1050
title: Data Science and Literacy Act of 2023
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - funding
  - curriculum-standards
summary: Directs the Secretary of Education to make grants to states, local educational agencies, Tribal
  schools, and institutions of higher education to expand data literacy and data science education, defined
  to include artificial intelligence and machine learning.
provisions:
  - type: appropriates-funding
    description: Grant-funded data science education is defined to include artificial intelligence and
      machine learning.
    citation:
      source_url: https://www.congress.gov/118/bills/hr1050/BILLS-118hr1050ih.pdf
      locator: Sec. 105(3)
      quote: 'The term ‘‘data science education’’ includes education in any of the following subjects:
        (A) Analytics. (B) Applied statistics and data science. (C) Artificial intelligence.'
