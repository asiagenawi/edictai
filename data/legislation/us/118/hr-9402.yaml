identifier: H.R. 9402
title: NSF AI Education Act of 2024
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - funding
  - workforce
  - educator-training
  - research
summary: Authorizes National Science Foundation scholarships and fellowships for students studying artificial
  intelligence, including the teaching of AI, and fellowships for K-12 teachers and school professionals
  on AI. Creates up to eight community college and area career and technical education Centers of AI Excellence,
  supports research on teaching AI, and adds AI skills development to the National STEM Teacher Corps.
provisions:
  - type: appropriates-funding
    description: Authorizes NSF scholarships and fellowships, through institutions of higher education,
      for students in AI-related programs of study.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.congress.gov/118/bills/hr9402/BILLS-118hr9402ih.pdf
      locator: Sec. 2
      quote: may sup- port scholarships and fellowships for un- dergraduate and graduate students by making
        awards through institutions of higher education, including community col- leges, to students who
        are enrolled in pro- grams of study leading to degrees or con- centrations in or related to the
        design
  - type: educator-pd-requirement
    description: Authorizes NSF fellowships for teachers, school counselors, and other school professionals
      for professional development on teaching and using AI in K-12 settings.
    education_levels:
      - k12
    citation:
      source_url: https://www.congress.gov/118/bills/hr9402/BILLS-118hr9402ih.pdf
      locator: Sec. 2, Fellowships for school professionals
      quote: education in partnership with industry members on the teaching, use of, or appli- cation
        of artificial intelligence in K–12 set- tings.
  - type: ai-workforce-program
    description: Directs NSF to designate up to eight community college and area career and technical
      education Centers of AI Excellence.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9402/BILLS-118hr9402ih.pdf
      locator: Sec. 3
      quote: shall es- tablish up to eight regionally and geo- graphically diverse eligible applicants
        to be designated as Community College and Area Career and Technical Education Cen- ters of AI
        Excellence
  - type: educator-pd-requirement
    description: Adds AI skills development, including AI best practices for high school teachers, to
      the National STEM Teacher Corps.
    education_levels:
      - k12
    citation:
      source_url: https://www.congress.gov/118/bills/hr9402/BILLS-118hr9402ih.pdf
      locator: Sec. 5
      quote: incorporating artificial intelligence skills development into the National STEM Teacher Corps,
        including consideration of the development of artificial intelligence best prac- tices for high
        school teachers
