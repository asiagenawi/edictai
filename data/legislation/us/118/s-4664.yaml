id: us-118-s-4664
jurisdiction: us
session: "118"
identifier: S. 4664
title: Department of Energy AI Act
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Creates a Department of Energy program on artificial intelligence for science, energy, and national
  security. Requires the Secretary to hire and train at least 500 new AI researchers, including by providing
  training and grants and establishing new AI degree and certificate programs at universities and community
  colleges, and includes training for undergraduate and graduate students in frontier AI.
provisions:
  - type: ai-workforce-program
    description: Directs the Secretary to establish new AI degree and certificate programs at universities
      and community colleges as part of building the AI workforce.
    citation:
      source_url: https://www.congress.gov/118/bills/s4664/BILLS-118s4664rs.htm
      locator: Sec. 4, AI talent paragraph (4)(B)(iii)
      quote: establishing new degree and certificate programs in AI-related disciplines at universities
        and community colleges.
  - type: ai-workforce-program
    description: Includes training for undergraduate and graduate students in frontier AI among the program's
      activities.
    citation:
      source_url: https://www.congress.gov/118/bills/s4664/BILLS-118s4664rs.htm
      locator: Sec. 4, paragraph (iv) on research experiences
      quote: increase research experiences and workforce development, including training for undergraduate
        and graduate students in frontier AI for science, energy, and national security.
  - type: appropriates-funding
    description: In the introduced version, reserves at least 10 percent of program funds for education
      and training of the AI workforce.
    citation:
      source_url: https://www.congress.gov/118/bills/s4664/BILLS-118s4664rs.htm
      locator: Introduced, Sec. 4(f)(1)
      quote: Of the amounts made available under subsection (h), not less than 10 percent shall be used
        to foster the education and training of the next-generation AI workforce.
