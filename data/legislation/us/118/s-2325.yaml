identifier: S. 2325
title: Algorithmic Justice and Online Platform Transparency Act
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Prohibits online platforms from using algorithmic processes that discriminate in offering housing,
  employment, credit, insurance, healthcare, or education opportunities, and requires platforms to assess
  whether such processes produce disparate outcomes.
provisions:
  - type: bias-or-equity-requirement
    description: Platforms using algorithmic processes relating to education opportunities must assess
      whether they produce disparate outcomes.
    citation:
      source_url: https://www.congress.gov/118/bills/s2325/BILLS-118s2325is.pdf
      locator: Sec. 4(a)(2)(A)(iv)
      quote: if the online platform (except for a small business) utilizes an algorithmic process that
        relates to opportunities for housing, education, employment, insurance, credit, or the access
        to or terms of use of any place of public accommodations
