title: Expanding AI Voices Act Expanding AI Voices through Capacity Building Act
classification: bill
education_levels:
  - postsecondary
topics:
  - equity-access
  - funding
  - workforce
  - educator-training
summary: Directs the National Science Foundation to make awards to institutions of higher education outside
  the top research spenders, and to nonprofits, to broaden participation in AI research, education, and
  workforce development, including faculty development and student bridge programs.
provisions:
  - type: appropriates-funding
    description: NSF must make competitive awards to eligible institutions of higher education to broaden
      participation in AI research, education, and workforce development.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9403/BILLS-118hr9403ih.pdf
      locator: Sec. 2, new 5401(g)(1)
      quote: shall make awards on a competitive, merit-reviewed basis to eligible institutions of higher
        education specified in paragraph (2) or eligible non- profit organizations (or consortia thereof)
        to broaden participation in artificial intelligence research, edu- cation, and workforce development
  - type: educator-pd-requirement
    description: Award funds may be used for faculty recruitment and professional development in AI.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9403/BILLS-118hr9403ih.pdf
      locator: Sec. 2, new 5401(g)(4)(B)
      quote: Faculty recruitment and professional development in artificial intelligence and related disciplines.
