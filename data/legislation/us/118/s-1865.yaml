summary: Directs the Office of Management and Budget to issue guidance requiring federal agencies to be
  transparent about automated systems used in decisions about individuals, including decisions affecting
  access to education and vocational training, with disclosure and appeal.
provisions:
  - type: requires-disclosure
    description: Agency transparency guidance covers automated systems used in decisions that affect access
      to education and vocational training.
    citation:
      source_url: https://www.congress.gov/118/bills/s1865/BILLS-118s1865rs.pdf
      locator: Sec. 2(5)(B)(i)
      quote: meaningfully affects access to, or the cost, terms, or availability of— (i) education and
        vocational training;
