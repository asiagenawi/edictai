id: us-118-hr-9770
jurisdiction: us
session: "118"
identifier: H.R. 9770
title: Cyber PIVOTT Act Providing Individuals Various Opportunities for Technical Training to Build a
  Skills-Based Cyber Workforce Act of 2024
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Creates a Cybersecurity and Infrastructure Security Agency program providing full-tuition scholarships
  for students in two-year cyber or cyber-relevant associate degree and certificate programs at participating
  institutions, in exchange for government service. The bill defines cyber-relevant areas to include artificial
  intelligence.
provisions:
  - type: ai-workforce-program
    description: Defines the cyber-relevant fields whose two-year degree and certificate programs qualify
      for the program to include artificial intelligence.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9770/BILLS-118hr9770ih.pdf
      locator: Sec. 2, new section 1334(i)(1)
      quote: means areas of national security that would impact the cyber resiliency of the United States,
        in- cluding relating to operational technology, critical in- frastructure, artificial intelligence
  - type: appropriates-funding
    description: Program participants receive full-tuition scholarships for study at participating institutions.
    citation:
      source_url: https://www.congress.gov/118/bills/hr9770/BILLS-118hr9770ih.pdf
      locator: Sec. 2, new section 1334, Scholarships
      quote: shall provide students participating in the Program with full tuition scholarships, including
        academic fees, lab fees
