summary: Directs the Office of Management and Budget to issue guidance requiring federal agencies to disclose,
  and offer appeal of, the use of automated systems in decisions about individuals, including decisions
  affecting access to education and vocational training.
provisions:
  - type: requires-disclosure
    description: Agencies must provide disclosure and an opportunity for appeal when automated systems
      are used in critical decisions, including those on education access.
