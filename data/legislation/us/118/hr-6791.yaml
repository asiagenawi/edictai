  notes: >-
    Legacy record listed this as "AI Literacy Act of 2024", H.R. 6834; H.R. 6834 (118th) is the PROTECT Act
    of 2023, a PFAS bill. Corrected to H.R. 6791. Legacy also described a Department of Education grant
    program; the bill actually amends the Digital Equity Act (administered by NTIA, Commerce).
