identifier: H.R. 6791
title: Artificial Intelligence Literacy Act of 2023
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - educator-training
  - funding
  - equity-access
summary: >-
  Would amend the Digital Equity Act of 2021 to add AI literacy to the definition of digital literacy and
  make AI literacy activities in K-12 schools, community colleges, universities, and other community
  institutions eligible uses of Digital Equity Competitive Grant funds. Would also require annual reports
  to Congress on those uses. The bill was referred to committee and saw no further action.
provisions:
  - type: appropriates-funding
    description: Makes AI literacy efforts in public elementary and secondary schools, community colleges, and institutions of higher education eligible uses of Digital Equity Competitive Grant Program funds.
    education_levels:
      - k12
      - postsecondary
    citation:
      source_url: https://www.govinfo.gov/content/pkg/BILLS-118hr6791ih/html/BILLS-118hr6791ih.htm
      locator: Sec. 3(c)
      quote: In the case of a grant made to increase artificial intelligence literacy in public elementary and secondary schools
  - type: educator-pd-requirement
    description: Allows grant funds to pay for teacher training, certification, and professional development related to AI education.
    education_levels:
      - k12
    citation:
      source_url: https://www.govinfo.gov/content/pkg/BILLS-118hr6791ih/html/BILLS-118hr6791ih.htm
      locator: Sec. 3(c)
      quote: to provide teachers training and certification to support artificial intelligence literacy efforts in schools
