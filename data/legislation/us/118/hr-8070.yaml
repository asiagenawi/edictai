id: us-118-hr-8070
jurisdiction: us
session: "118"
identifier: H.R. 8070
title: Servicemember Quality of Life Improvement and National Defense Authorization Act for Fiscal Year
  2025
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Among many defense provisions, requires the Secretary of Defense, through the Department of Defense
  Education Activity, to ensure each student of a high school operated by the Activity receives instruction
  in artificial intelligence and machine learning, including foundational concepts, definitions, and responsible
  and ethical use. The instruction may be incorporated into existing courses.
provisions:
  - type: requires-ai-literacy-instruction
    description: Each student of a DoDEA-operated high school must receive instruction in artificial intelligence
      and machine learning.
    citation:
      source_url: https://www.congress.gov/118/bills/hr8070/BILLS-118hr8070eh.pdf
      locator: Sec. 579(a)
      quote: shall require that each student of a high school operated by the Activity receives instruction
        in arti- ficial intelligence and machine learning
