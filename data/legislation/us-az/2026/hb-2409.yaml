id: us-az-2026-hb-2409
jurisdiction: us-az
session: "2026"
identifier: HB 2409
title: Artificial intelligence; statewide education program
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - workforce
summary: Establishes the Arizona Artificial Intelligence Education Program in the Department of Education
  to offer a summer AI education course open to any resident, covering digital hygiene, recognition of
  AI-generated content, and use of AI for small business. Public schools, state universities, and community
  colleges may award academic credit for completing the course.
provisions:
  - type: requires-ai-literacy-instruction
    description: The course must include a curriculum on media literacy skills to identify misinformation
      and AI-generated content and on algorithmic bias.
    citation:
      source_url: https://www.azleg.gov/legtext/57leg/2r/bills/hb2409h.htm
      locator: Section 1, new 15-249.20(A)(1)(d)
      quote: Media literacy skills to identify misinformation and content that is generated by artificial
        intelligence.
  - type: ai-workforce-program
    description: The course must include an AI for small business and entrepreneurship curriculum.
    citation:
      source_url: https://www.azleg.gov/legtext/57leg/2r/bills/hb2409h.htm
      locator: Section 1, new 15-249.20(A)(2)
      quote: An artificial Intelligence for Small Business and Entrepreneurship curriculum that includes
        practical, hands-on training on how to start or grow a small business.
  - type: ai-course-or-graduation-requirement
    description: Public schools, universities, and community colleges may award academic credit for the
      AI course.
    citation:
      source_url: https://www.azleg.gov/legtext/57leg/2r/bills/hb2409h.htm
      locator: Section 1, new 15-249.20(D)
      quote: A public school, a university under the jurisdiction of the Arizona board of regents or a
        community college as defined in section 15-1401 may award academic credit to any individual who
        completes the course
