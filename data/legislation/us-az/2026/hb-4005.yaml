topics:
  - ai-literacy
  - curriculum-standards
summary: Would have required Arizona school districts, starting in 2027-28, to provide instruction on the ethical, moral, and educational uses of AI to students in grades 3, 6, 8, 10, and 12, using a curriculum adopted by the Department of Education, and to report annually on that instruction. Both chambers passed the bill, but Governor Hobbs vetoed it on June 19, 2026.
provisions:
  - type: requires-ai-literacy-instruction
    description: As passed, would have required each school district to provide AI instruction to all students in grades 3, 6, 8, 10, and 12 beginning in the 2027-2028 school year.
    education_levels:
      - k12
    citation:
      source_url: https://www.azleg.gov/legtext/57leg/2R/summary/S.4005ED_ASVETOED.DOCX.htm
      locator: Senate Fact Sheet (as vetoed), Provisions 1
      quote: Requires, beginning in the 2027-2028 school year, each school district to provide instruction on the ethical, moral and educational uses of AI to all students who are enrolled in grades 3, 6, 8, 10 and 12.
