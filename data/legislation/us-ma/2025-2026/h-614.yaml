id: us-ma-2025-2026-h-614
jurisdiction: us-ma
session: 2025-2026
identifier: H 614
title: Relative to issuing guidance regarding setting policies for the use of AI in schools
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - instructional-use
  - equity-access
summary: Requires the commissioner of elementary and secondary education to issue and annually publish
  guidelines for school districts and charter schools on student and educator use of artificial intelligence,
  covering benefits and limitations, safe use, equity implications, and factors for setting local AI policies,
  after at least three public hearings.
provisions:
  - type: issues-model-policy
    description: The commissioner must issue guidelines for districts and charter schools on AI use by
      students and educators.
    citation:
      source_url: https://malegislature.gov/Bills/194/H614.pdf
      locator: Sec. 1, G.L. c. 69, §1A
      quote: The commissioner shall issue guidelines, based off of available best practices, for school
  - type: issues-model-policy
    description: The guidance must address factors schools should weigh when setting AI use policies.
    citation:
      source_url: https://malegislature.gov/Bills/194/H614.pdf
      locator: Sec. 1, G.L. c. 69, §1A
      quote: what factors schools should consider when setting policies concerning the use of AI.
  - type: bias-or-equity-requirement
    description: The guidance must cover the equity implications of classroom AI use.
    citation:
      source_url: https://malegislature.gov/Bills/194/H614.pdf
      locator: Sec. 1, G.L. c. 69, §1A
      quote: the equity implications of the use of AI in the classroom;
