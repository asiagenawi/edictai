id: us-ma-2025-2026-h-97
jurisdiction: us-ma
session: 2025-2026
identifier: H 97
title: Protecting consumers in interactions with artificial intelligence systems
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Regulates developers and deployers of high-risk artificial intelligence systems that make or
  substantially factor into consequential decisions, including education enrollment or opportunities.
  Requires documentation, impact assessments, and measures against algorithmic discrimination.
provisions:
  - type: bias-or-equity-requirement
    description: Education enrollment and opportunity decisions are consequential decisions, so AI systems
      used in them are high-risk and subject to algorithmic discrimination duties.
    citation:
      source_url: https://malegislature.gov/Bills/194/H97.pdf
      locator: Sec. 1, definition of consequential decision
      quote: 'means a decision that has a material legal or similarly significant effect on the provision
        or denial to any consumer of, or the cost or terms of: (1) education enrollment or an education
        opportunity;'
