summary: Creates a commission within the executive office of education to study the use of AI in education,
  survey uses of generative AI and automated decision systems in school systems, and recommend guidelines
  for ethical AI use in teaching and learning, data protection, plagiarism policies, watermarking, and
  equitable AI use.
provisions:
  - type: creates-task-force
    description: Establishes a commission to study and make recommendations on AI use in education, including
      guidelines for educators and student use.
    citation:
      source_url: https://malegislature.gov/Bills/194/S429.pdf
      locator: Sec. 1, new c. 69A(b)
      quote: There shall be a commission within the executive office of education for the purpose of studying
        and making recommendations relative to the use of AI in education
