summary: Creates an Emerging Technologies Workforce Training Trust Fund that provides grants to institutions
  of higher education, vocational technical schools, and workforce training organizations for training
  programs in blockchain, artificial intelligence, cybersecurity, and renewable energy, along with scholarships
  and internships in those fields.
