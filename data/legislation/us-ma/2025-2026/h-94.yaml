id: us-ma-2025-2026-h-94
jurisdiction: us-ma
session: 2025-2026
identifier: H 94
title: To ensure accountability and transparency in artificial intelligence systems
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Creates an AI accountability and consumer protection chapter that treats AI systems materially
  influencing consequential decisions, including education opportunities, as high-risk. Requires developers
  and deployers to address algorithmic discrimination, notify consumers, explain decisions, and offer
  appeals, enforced by the attorney general.
provisions:
  - type: bias-or-equity-requirement
    description: AI systems that materially influence education opportunities are high-risk and subject
      to algorithmic discrimination duties.
    citation:
      source_url: https://malegislature.gov/Bills/194/H94.pdf
      locator: Sec. 1, new c. 93M, §1(3)
      quote: 'High-Risk Artificial Intelligence System: AI systems that materially influence consequential
        decisions, including but not limited to: (a) Education opportunities;'
