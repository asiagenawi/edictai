summary: Directs the Office of the Child Advocate, consulting the Department of Elementary and Secondary
  Education and others, to create an educational diversion program on sexting that covers the responsible
  use of generative artificial intelligence, with materials made available to school districts. Directs
  the department to encourage districts to teach media literacy using content from that program.
