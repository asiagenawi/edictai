id: us-ga-2025-2026-sb-167
jurisdiction: us-ga
session: 2025-2026
identifier: SB 167
title: Commerce and Trade; private entities that employ certain AI systems to guard against discrimination
  caused by such systems; provide
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - admissions
summary: Regulates private entities' use of automated decision systems in consequential decisions, including
  education enrollment or education opportunities, requiring developers and deployers to evaluate systems
  for algorithmic discrimination, disclose risks, and notify consumers when such systems are used.
provisions:
  - type: bias-or-equity-requirement
    description: Consequential decisions regulated by the chapter include education enrollment or opportunities.
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/232350
      locator: Section 1, new chapter of Title 10, definition of consequential decision
      quote: (A) Education enrollment or education opportunities; (B) Employment or employment opportunities;
  - type: bias-or-equity-requirement
    description: Developers must disclose known or foreseeable risks of algorithmic discrimination to
      the Attorney General and deployers.
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/232350
      locator: Sec. 1, new Ch. 16 (developer disclosure)
      quote: A developer of an automated decision system shall disclose to the Attorney General, in a
        form and manner prescribed by the Attorney General, and to all known deployers or other developers
        of the automated decision system, any known or reasonably foreseeable risks of algorithmic discrimination
