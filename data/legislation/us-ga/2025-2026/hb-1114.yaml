id: us-ga-2025-2026-hb-1114
jurisdiction: us-ga
session: 2025-2026
identifier: HB 1114
title: Quality Basic Education Act; allow for students in ninth and tenth grade to complete the high school
  graduation financial literacy course requirement
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - safety-wellbeing
summary: Requires the State Board of Education to adopt K-12 digital literacy content standards that address,
  among other things, evaluating information using or generated by artificial intelligence; requires local
  boards to provide digital literacy instruction beginning in 2027-28; and requires Department of Education
  model programs to include responsible and discerning use of AI and generative AI. Also revises financial
  literacy instruction and bars schools from partnering with gambling enterprises.
provisions:
  - type: ai-in-standards
    description: Digital literacy content standards must address evaluating information using or generated
      by AI.
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/248991
      locator: 20-2-149(a)(3)
      quote: (3) Evaluation of digital information and sources, including, but not limited to, information
        using or generated by artificial intelligence
  - type: requires-ai-literacy-instruction
    description: Department model programs must include instruction on responsible and discerning use
      of AI and generative AI.
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/248991
      locator: 20-2-149(c)(2)(A)(viii)
      quote: Responsible and discerning use of artificial intelligence and generative artificial intelligence
