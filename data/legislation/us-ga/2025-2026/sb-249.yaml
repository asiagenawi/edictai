id: us-ga-2025-2026-sb-249
jurisdiction: us-ga
session: 2025-2026
identifier: SB 249
title: '"Quality Basic Education Act,"; beginning in the 2031-2032 school year, a computer science course
  shall be a high school graduation requirement; provide'
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: Makes a computer science course a high school graduation requirement beginning in 2031-32, defines
  computer science to include artificial intelligence and emerging technologies, allows certain computer
  science courses to substitute for other credits, and provides grants for computer science teacher professional
  development subject to appropriations.
provisions:
  - type: ai-in-standards
    description: Defines computer science, which becomes a graduation requirement, to include artificial
      intelligence.
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/233730
      locator: Sec. 1, 20-2-149.3(b)(1)
      quote: '''Computer science'' means the study of computers, algorithmic processes, coding, artificial
        intelligence, emerging technologies, and logical critical thinking'
