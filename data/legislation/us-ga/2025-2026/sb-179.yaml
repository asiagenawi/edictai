id: us-ga-2025-2026-sb-179
jurisdiction: us-ga
session: "2025-2026"
identifier: SB 179
title: >-
  Education; the academic and disciplinary records of each transferring student shall be
  provided within five days; require
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: >-
  As enacted, makes a computer science course, or a career, technical, and agricultural
  education course with embedded computer science, a high school graduation requirement
  beginning in the 2031-2032 school year for students graduating in 2037 or later, and adds
  artificial intelligence and computer science ethics to the statutory definition of computer
  science. The final version also raises the Georgia Virtual School per-course charge, requires
  schools to allow patriotic societies to speak with students, and revises the definition of
  private school; the listed caption reflects the bill as first introduced.
abstract: >-
  To amend Chapter 2 of Title 20 of the Official Code of Georgia Annotated, relating to
  elementary and secondary education, so as to provide that, beginning in the 2031-2032 school
  year, a computer science course shall be a high school graduation requirement; to provide for
  certain computer science courses to be substituted for units of credit graduation
  requirements in certain other subject areas; to provide for such exception; to revise
  legislative findings; to increase the allowable charge per student per semester for each
  Georgia Virtual School course from $250.00 to $350.00; to require local school systems to
  allow the representatives of certain organizations to speak with students during school
  hours; to require certain organizations to provide notice; to require local school
  superintendents to provide approval of certain activities by certain organizations during
  school hours; to require local school superintendents to provide written explanation for
  denial of certain activities; to provide for legislative intent; to provide for a
  definition; to include certain online schools in the definition of "private school"; to
  provide for related matters; to repeal conflicting laws; and for other purposes.
provisions:
  - type: ai-course-or-graduation-requirement
    description: >-
      Requires students graduating in 2037 or later to complete a computer science course, or
      a CTAE course embedded with computer science, as a condition of high school graduation,
      beginning in the 2031-2032 school year.
    education_levels:
      - k12
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/247229
      locator: Section 1, O.C.G.A. 20-2-149.3(c)(4)(A)
      quote: >-
        Beginning in the 2031-2032 school year, each local board of education shall require
        all students who will graduate in 2037 or later, as a condition of graduation from high
        school, to complete a course in computer science
  - type: ai-in-standards
    description: >-
      Adds artificial intelligence and computer science ethics to the statutory definition of
      computer science that governs required computer science courses and content.
    education_levels:
      - k12
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/247229
      locator: Section 1, O.C.G.A. 20-2-149.3(b)(1)
      quote: >-
        'Computer science' means the study of computers, algorithmic processes, coding,
        computer science ethics, artificial intelligence, emerging technologies, and logical
        critical thinking
