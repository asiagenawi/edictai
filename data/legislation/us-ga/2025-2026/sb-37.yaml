id: us-ga-2025-2026-sb-37
jurisdiction: us-ga
session: 2025-2026
identifier: SB 37
title: '"AI Accountability Act"; enact'
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - data-governance
  - equity-access
summary: Enacts the AI Accountability Act, requiring every governmental entity, defined to include school
  systems, to publish and maintain an AI system usage plan covering goals, bias avoidance, data privacy,
  governance roles, human oversight, employee training, and incident response, and creating the Georgia
  Board for Artificial Intelligence to guide those plans.
provisions:
  - type: requires-local-ai-policy
    description: Each governmental entity, including school systems, must publish and maintain an AI system
      usage plan.
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/230409
      locator: new 50-1-14(b)
      quote: Each governmental entity shall be required to publish by December 31, 2026
  - type: requires-local-ai-policy
    description: Governmental entity is defined to include school systems.
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/230409
      locator: new 50-1-14(a)(2)
      quote: '''Governmental entity'' means any department, agency, board, bureau, commission, authority,
        county, municipal corporation, school system, or other political subdivision of this state.'
