id: us-ga-2025-2026-hb-487
jurisdiction: us-ga
session: "2025-2026"
identifier: HB 487
title: >-
  Quality Basic Education Act; computer science course shall be a high school graduation
  requirement beginning in 2031; provide
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: >-
  Would have made a computer science course, or a career, technical, and agricultural
  education course with embedded computer science, a high school graduation requirement
  beginning in the 2031-2032 school year, and revised the statutory definition of computer
  science to include artificial intelligence. It was read twice in the House and received no
  further action; the same requirement was later enacted through SB 179.
abstract: >-
  A BILL to be entitled an Act to amend Part 2 of Article 6 of Chapter 2 of Title 20 of the
  Official Code of Georgia Annotated, relating to competencies and core curriculum under the
  "Quality Basic Education Act," so as to provide that, beginning in the 2031-2032 school year,
  a computer science course shall be a high school graduation requirement; to provide for
  certain computer science courses to be substituted for units of credit graduation
  requirements in certain other subject areas; to provide for such exception; to revise
  legislative findings; to provide for related matters; to repeal conflicting laws; and for
  other purposes.
provisions:
  - type: ai-course-or-graduation-requirement
    description: >-
      Would require students to complete a computer science course, defined to include
      artificial intelligence, as a condition of high school graduation beginning in the
      2031-2032 school year.
    education_levels:
      - k12
    citation:
      source_url: https://www.legis.ga.gov/api/legislation/document/20252026/232701
      locator: O.C.G.A. 20-2-149.3(b)(1), (c)(4)(A), as proposed
      quote: >-
        Beginning in the 2031-2032 school year, each local board of education shall require
        all students, as a condition of graduation from high school, to complete a course in
        computer science
