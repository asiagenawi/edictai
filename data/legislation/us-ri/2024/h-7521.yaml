id: us-ri-2024-h-7521
jurisdiction: us-ri
session: "2024"
identifier: H 7521
title: Creates requirements for the developers or deployers of artificial intelligence and allows civil
  action against these developers or deployers by the attorney general and local solicitors.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - assessment
  - academic-integrity
  - equity-access
summary: Regulates developers and deployers of automated decision tools that make consequential decisions,
  requiring impact assessments and prohibiting algorithmic discrimination. Consequential decisions include
  education and vocational training, including assessment and detection of student cheating or plagiarism.
provisions:
  - type: regulates-ai-assessment
    description: Defines consequential decisions to include education assessment, including detecting
      student cheating or plagiarism.
    citation:
      source_url: https://webserver.rilegislature.gov/BillText24/HouseText24/H7521.pdf
      locator: Sec. 1, new 42-166-1(4)(ii)
      quote: '(ii) Education and vocational training including, but not limited to, all of the following:
        (A) Assessment including, but not limited to, detecting student cheating or plagiarism;'
  - type: bias-or-equity-requirement
    description: Impact assessments must analyze potential adverse impacts on protected groups from the
      deployer's use of the tool.
    citation:
      source_url: https://webserver.rilegislature.gov/BillText24/HouseText24/H7521.pdf
      locator: Sec. 1, new chapter 42-166, deployer impact assessment (5)
      quote: An analysis of potential adverse impacts on the basis of sex, race, color, ethnicity, religion,
        age, national origin, limited English proficiency, disability, veteran status, or genetic information
        from the deployer's use of the automated decision tool;
