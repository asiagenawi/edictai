id: us-ri-2025-s-627
jurisdiction: us-ri
session: "2025"
identifier: S 627
title: Establishes regulations to ensure the ethical development, integration, and deployment of high-risk
  AI systems, particularly those influencing consequential decisions.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - assessment
  - admissions
summary: Enacts the Artificial Intelligence Act, which requires developers, integrators, and deployers
  of high-risk AI systems to use reasonable care against algorithmic discrimination, keep risk management
  policies, and complete impact assessments. Consequential decisions covered include education decisions
  on assessments, cheating or plagiarism detection, accreditation, admissions, and financial aid.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential decisions to include education decisions, bringing high-risk AI
      systems used for them under the act's duties.
    citation:
      source_url: https://webserver.rilegislature.gov/BillText25/SenateText25/S0627.pdf
      locator: § 6-61-2(3)(ii)
      quote: '(ii) Education or vocational training, including any such decision or judgment made concerning:
        (A) Assessments; (B) Student cheating or plagiarism detection; (C) Accreditation; (D) Certification;
        (E) Admissions; or (F) Financial aid or scholarships;'
