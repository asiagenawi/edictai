identifier: H 7895
title: Establishes the Safe School Technology Act of 2026.
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - procurement
  - safety-wellbeing
summary: Establishes the Safe School Technology Act, setting rules for school-issued devices and instructional
  technology. To be certified, an instructional technology tool must be designed for instruction, meet
  curriculum standards, and exclude features such as generative or conversational artificial intelligence,
  targeted advertising and addictive design.
provisions:
  - type: limits-ai-instructional-use
    description: Certified instructional technology tools must not include generative or conversational
      AI features.
    citation:
      source_url: https://webserver.rilegislature.gov/BillText26/HouseText26/H7895.pdf
      locator: Section 4, certification of instructional technology tools, (b)(3)
      quote: 'Prohibit the following design features: (i) Geolocation; (ii) Generative or conversational
        artificial intelligence; (iii) Targeted advertisements;'
