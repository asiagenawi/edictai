identifier: H 8345
title: HOUSE RESOLUTION CREATING A SPECIAL LEGISLATIVE COMMISSION TO STUDY THE USE AND IMPACT OF DIGITAL
  AND ELECTRONIC TECHNOLOGY IN PUBLIC EDUCATION AND ON MENTAL HEALTH (Creates a fourteen (14) member special
  legislative study commission to study the use and impact of digital and electronic technology in public
  education and on mental health.)
classification: resolution
education_levels:
  - k12
topics:
  - task-force
  - safety-wellbeing
summary: Creates a 14-member special legislative commission to study the use and impact of digital and
  electronic technology, including artificial intelligence, in Rhode Island public education and on mental
  health. The study covers third-party platforms in schools, safe school software, AI in mental health
  care and AI companion technology.
provisions:
  - type: creates-task-force
