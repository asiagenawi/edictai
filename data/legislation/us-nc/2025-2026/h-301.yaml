id: us-nc-2025-2026-h-301
jurisdiction: us-nc
session: 2025-2026
identifier: H 301
title: Social Media & AI Safety
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - local-policy-requirement
  - educator-training
  - student-privacy
  - academic-integrity
  - safety-wellbeing
summary: Provides social media protections for children under 16 and requires the State Board of Education
  to adopt K-12 AI literacy standards included in computer science courses. Requires the Department of
  Public Instruction to adopt a model AI policy, requires local boards to adopt AI use policies, calls
  for a framework for evaluating generative AI educational tools, and directs AI training modules for
  educators and administrators developed with the Friday Institute.
provisions:
  - type: ai-in-standards
    description: Requires the State Board to adopt K-12 AI literacy standards and include AI literacy
      in computer science courses.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H301v6.pdf
      locator: Sec. 2.(a), new G.S. 115C-81.90(a1)
      quote: The State Board shall adopt age-appropriate standards for instruction on artificial intelligence
        (AI) literacy for grades kindergarten through 12. All courses offered pursuant to this section
        shall include instruction on AI literacy aligned with the standards adopted by the State Board.
  - type: issues-model-policy
    description: Requires a DPI model AI policy covering privacy, AI literacy and academic integrity standards.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H301v6.pdf
      locator: Sec. 3.(a)
      quote: Standards of ethical and acceptable use of AI and AI chatbots in an educational setting,
        including standards of academic integrity when using AI.
  - type: requires-local-ai-policy
    description: Requires local boards of education to adopt a policy on AI use by students and staff.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H301v6.pdf
      locator: Sec. 3.(b), new G.S. 115C-47(73)
      quote: Local boards of education shall adopt a policy on the use of artificial intelligence by students
        and staff for educational
  - type: educator-pd-requirement
    description: Requires DPI and the Friday Institute to develop online AI training modules for educators.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H301v6.pdf
      locator: Sec. 5.(a)
      quote: The Department of Public Instruction shall partner with the Friday Institute for Educational
        Innovation at North Carolina State University (Friday Institute) to design, produce, and support
        implementation of a suite of tool-agnostic online training modules and related training resources.
