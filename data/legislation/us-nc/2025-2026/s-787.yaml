id: us-nc-2025-2026-s-787
jurisdiction: us-nc
session: 2025-2026
identifier: S 787
title: AI Ethics and Literacy Across Education
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - funding
summary: Requires the State Board of Education to adopt standards for age-appropriate AI instruction for
  kindergarten through grade 12, covering AI concepts, real-world applications, economic, legal and social
  issues, and responsible, ethical use. Appropriates $100,000 in recurring funds to the Department of
  Public Instruction to support schools providing the instruction.
provisions:
  - type: ai-in-standards
    description: Requires the State Board to adopt K-12 AI instruction standards.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S787v1.pdf
      locator: Sec. 1, new G.S. 115C-81.66(a)
      quote: The State Board of Education shall adopt standards for age-appropriate instruction on artificial
        intelligence (AI) for kindergarten through grade 12.
  - type: appropriates-funding
    description: Appropriates funds distributed to public school units to support AI instruction.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S787v1.pdf
      locator: Sec. 2
      quote: There is appropriated from the General Fund to the Department of Public Instruction the sum
        of one hundred thousand dollars ($100,000) in recurring funds for the 2026-2027 fiscal year to
        be used to provide support to schools providing instruction pursuant to G.S. 115C-81.66
