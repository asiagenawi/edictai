id: us-nc-2025-2026-h-1004
jurisdiction: us-nc
session: 2025-2026
identifier: H 1004
title: UNC AI & Technology Hubs
classification: bill
education_levels:
  - postsecondary
topics:
  - funding
  - research
  - workforce
summary: Appropriates funds to establish AI Hubs at up to eight UNC constituent institutions and technology
  hubs at each institution for innovation, workforce upskilling, entrepreneurship and manufacturing. Creates
  a $30 million NC Collaboratory grant fund for AI research projects, with education listed as a priority
  area for applied AI research.
provisions:
  - type: appropriates-funding
    description: Creates an AI research grant fund that lists education among priority areas for applied
      AI applications.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H1004v1.pdf
      locator: Sec. 2.(b)
      quote: 'Involve applied AI research to develop an application in one of the following priority areas:
        a. Education. b. Workforce development. c. Healthcare. d. Government.'
  - type: appropriates-funding
    description: Funds technology hubs or AI Hubs at each UNC institution, including workforce upskilling
      and programming.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H1004v1.pdf
      locator: Sec. 2.(a)
      quote: to establish a technology hub or support previously designated Artificial Intelligence (AI)
        Hub at the institution to encourage (i) technology innovation, (ii) workforce upskilling, (iii)
        entrepreneurship, and (iv) advanced manufacturing
