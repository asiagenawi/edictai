id: us-nc-2025-2026-s-1006
jurisdiction: us-nc
session: 2025-2026
identifier: S 1006
title: K-12 Innovation and Transformation Act
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - instructional-use
  - funding
  - task-force
  - workforce
  - assessment
summary: Funds and changes K-12 education programs, including an AI Academic Support Program letting public
  school units contract for the AI tool Khanmigo in grades 6-12 and a project in which Wake County schools
  and Wake Tech use Khanmigo for college math courses. Creates a High School Redesign Commission that
  must consider AI uses for career exploration, defines high-tech learning accelerators including AI,
  and lists AI learning tools in a competency-based education grant objective.
provisions:
  - type: appropriates-funding
    description: Establishes an AI Academic Support Program for public school units to contract for Khanmigo
      in grades 6-12.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S1006v2.pdf
      locator: Sec. 1.12.(a), new G.S. 115C-650(a)
      quote: There is established the AI Academic Support Program (Program) to allow public school units
        to contract with Khan Academy, Inc., (Khan Academy)
  - type: appropriates-funding
    description: Requires a school district and community college to contract for the Khanmigo AI tutoring
      program for a math project.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S1006v2.pdf
      locator: Sec. 2.3.(c)
      quote: WCPSS, in collaboration with Wake Tech, shall contract with Khan Academy, Inc., (Khan) for
        use of the artificial intelligence student tutoring program, Khanmigo.
  - type: creates-task-force
    description: Directs the High School Redesign Commission to consider AI uses for student career exploration.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S1006v2.pdf
      locator: Commission duties, subdivision (9)
      quote: Uses of artificial intelligence to expand student opportunities to engage in career exploration
        and work-based learning experiences.
  - type: ai-workforce-program
    description: Defines high-tech learning accelerators to include AI topics.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S1006v2.pdf
      locator: Learning accelerator definitions, subdivision (3)
      quote: 'High-tech learning accelerator. – A learning accelerator focused on topics related to science,
        technology, engineering, and mathematics (STEM) , including any of the following: a. Artificial
        Intelligence.'
