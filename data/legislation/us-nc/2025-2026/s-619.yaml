id: us-nc-2025-2026-s-619
jurisdiction: us-nc
session: 2025-2026
identifier: S 619
title: AI Academic Support Grant Program
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - funding
  - research
  - educator-training
summary: Establishes a program allowing public school units to contract with Khan Academy for the AI tool
  Khanmigo in grades 6-12, funded by average daily membership, with professional development, rostering
  requirements and annual evaluations. Directs a Collaboratory study of Khanmigo's effectiveness, licenses
  for juvenile justice schools, and annual reports, and states intent to appropriate about $10.06 million.
provisions:
  - type: appropriates-funding
    description: Creates a program funding public school unit contracts for the Khanmigo AI tool in grades
      6-12.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S619v1.pdf
      locator: Sec. 1.(a), new G.S. 115C-650(a)
      quote: There is established the AI Instructional Support Program (Program) to allow public school
        units to contract with Khan Academy, Inc. (Khan Academy) for use of the academic support service
        Khanmigo, in grades six through 12.
  - type: creates-task-force
    description: Directs a study of Khanmigo's effectiveness on student performance.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S619v1.pdf
      locator: New G.S. 115C-650(f) (Study)
      quote: The Office of Learning Research at the North Carolina Collaboratory (OLR) shall design and
        conduct a study to measure the effectiveness of using Khanmigo, including any impact on student
        performance and growth.
