id: us-nc-2025-2026-s-640
jurisdiction: us-nc
session: 2025-2026
identifier: S 640
title: AI Ethics and Literacy Across Education
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Requires the State Board of Education to adopt standards for age-appropriate AI instruction for
  kindergarten through grade 12, covering AI concepts, real-world applications, economic, legal and social
  issues, and responsible, ethical use including privacy and academic dishonesty. Allows the instruction
  to be included in middle and high school computer science standards.
provisions:
  - type: ai-in-standards
    description: Requires the State Board to adopt K-12 AI instruction standards.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S640v1.pdf
      locator: Sec. 1, new G.S. 115C-81.66(a)
      quote: The State Board of Education shall adopt standards for age-appropriate instruction on artificial
        intelligence (AI) for kindergarten through grade 12.
  - type: requires-ai-literacy-instruction
    description: Requires the standards to cover basic AI concepts and how AI creates content.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S640v1.pdf
      locator: Sec. 1, new G.S. 115C-81.66(a)(1)
      quote: The basic concepts of artificial intelligence, including an age -appropriate understanding
        of how AI systems source and create content.
