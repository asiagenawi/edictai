id: us-nc-2025-2026-h-268
jurisdiction: us-nc
session: 2025-2026
identifier: H 268
title: 2026 Budget Technical Corrections - II
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - workforce
  - educator-training
  - funding
summary: Makes technical and other changes to the 2026 budget, including creating a North Carolina High
  School Redesign Commission that must consider uses of artificial intelligence to expand student career
  exploration and work-based learning. Also allows the Friday Institute to carry forward nonrecurring
  funds for AI professional development modules.
provisions:
  - type: creates-task-force
    description: Requires the High School Redesign Commission to consider uses of AI to expand student
      career exploration and work-based learning.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H268v4.pdf
      locator: Sec. 3.12.(e)(9)
      quote: Uses of artificial intelligence to expand student opportunities to engage in career exploration
        and work-based learning experiences.
  - type: educator-pd-requirement
    description: Lets the Friday Institute carry forward funds for AI professional development modules.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H268v4.pdf
      locator: Sec. 3.13
      quote: ALLOW FRIDAY INSTITUTE TO CARRYFORWARD NONRECURRING FUNDS FOR AI PROFESSIONAL DEVELOPMENT
        MODULES
