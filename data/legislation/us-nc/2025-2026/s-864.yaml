id: us-nc-2025-2026-s-864
jurisdiction: us-nc
session: 2025-2026
identifier: S 864
title: Safe and Responsible AI in Schools Act
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - local-policy-requirement
  - educator-training
  - student-privacy
  - academic-integrity
  - procurement
  - funding
summary: Requires the State Board of Education to adopt K-12 AI literacy standards included in computer
  science courses and to revise the computer science course of study. Requires the Department of Public
  Instruction to develop a model AI policy and local boards and other public school units to adopt AI
  use policies, establishes a framework for evaluating AI educational tools, and funds AI training modules
  for educators and administrators through the Friday Institute.
provisions:
  - type: ai-in-standards
    description: Requires K-12 AI literacy standards and AI literacy instruction in computer science courses.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S864v1.pdf
      locator: Sec. 1.(a), new G.S. 115C-81.90(a1)
      quote: The State Board shall adopt age-appropriate standards for instruction on artificial intelligence
        (AI) literacy for grades kindergarten through 12. All courses offered pursuant to this section
        shall include instruction on AI literacy aligned with the standards adopted by the State Board.
  - type: issues-model-policy
    description: Requires DPI to develop a model AI policy for public school units.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S864v1.pdf
      locator: Sec. 2.(a), new G.S. 115C-102.13
      quote: The Department of Public Instruction shall develop a model artificial intelligence (AI) policy
        to serve as guidance to public school units when developing their AI policies.
  - type: requires-local-ai-policy
    description: Requires local boards of education to adopt AI use policies after reviewing the model
      policy.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S864v1.pdf
      locator: Sec. 2.(b), new G.S. 115C-47(73)
      quote: Local boards of education shall adopt a policy on the use of artificial intelligence by students
        and staff for educational purposes after review of the model policy developed by the Department
        of Public Instruction pursuant to G.S. 115C-102.13.
  - type: educator-pd-requirement
    description: Specifies AI training module content for educators, including bias and academic integrity.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S864v1.pdf
      locator: Part IV, training modules
      quote: (4) Academic integrity and assessment redesign to account for greater student access to AI
        tools. (5) Data privacy and security regarding AI tools.
