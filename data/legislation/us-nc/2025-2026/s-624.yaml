topics:
  - data-governance
  - student-privacy
  - safety-wellbeing
summary: Creates chatbot licensing, safety and privacy requirements for covered platforms, including de-identification
  of conversation data and encryption. Applies a 30-day message destruction requirement to chatbots employed
  in fields that include education.
provisions:
  - type: restricts-student-data-use
    description: Applies a 30-day data destruction requirement to chatbots used in education and other
      sensitive domains.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S624v1.pdf
      locator: New G.S. 170-6(c)
      quote: 'The requirements of subsection (b) of this section shall apply to all chatbots which are
        employed in: healthcare, financial services, the legal field, government services, mental health
        support, and education.'
