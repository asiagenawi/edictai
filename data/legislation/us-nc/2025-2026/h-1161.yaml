id: us-nc-2025-2026-h-1161
jurisdiction: us-nc
session: 2025-2026
identifier: H 1161
title: Omnibus Artificial Intelligence Protections
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - local-policy-requirement
  - academic-integrity
  - instructional-use
  - ai-literacy
  - curriculum-standards
  - funding
summary: Authorizes local boards of education and other public school units to adopt policies on student
  AI use, including blocking AI tools and disciplining unauthorized use, with exceptions for teacher-authorized
  or IEP/504 use. Creates a middle school course covering proper uses of AI and identifying AI-generated
  content, with $500,000 for implementation, and requires universities and community colleges to develop
  standards for classroom AI use and discipline for misuse.
provisions:
  - type: academic-integrity-rules
    description: Lets local boards adopt student AI policies that may block AI tools and discipline unauthorized
      use.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H1161v1.pdf
      locator: Sec. 2.1.(a), new G.S. 115C-102.13(b)
      quote: Disciplinary actions for unauthorized use of artificial intelligence, up to retaining the
        student in the current grade for repeated violations.
  - type: limits-ai-instructional-use
    description: Allows schools to block student access to AI tools on devices and internet connections.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H1161v1.pdf
      locator: Sec. 2.1.(a), new G.S. 115C-102.13(b)(1)
      quote: Allow schools to block access to AI tools on student electronic devices.
  - type: requires-ai-literacy-instruction
    description: Requires a middle school course to include proper uses of AI and identifying AI-generated
      content.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H1161v1.pdf
      locator: Sec. 2.2
      quote: Proper uses of artificial intelligence in an academic and professional setting. (4) Instruction
        on identifying content generated using artificial intelligence.
  - type: requires-local-ai-policy
    description: Requires each community college to develop standards for classroom AI use, present them
      to students and provide discipline for misuse.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/House/PDF/H1161v1.pdf
      locator: Sec. 2.3.(b)
      quote: The policy shall permit community colleges to set their own standards but shall ensure that
        each community college (i) presents its standards to all students every year and (ii) provides
        for appropriate disciplinary action in the event a student misuses artificial intelligence in
        a class
