id: us-nc-2025-2026-s-257
jurisdiction: us-nc
session: 2025-2026
identifier: S 257
title: 2026 Appropriations Act
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - curriculum-standards
  - local-policy-requirement
  - educator-training
  - instructional-use
  - funding
  - student-privacy
  - academic-integrity
summary: The Current Operations Appropriations Act of 2026 funds AI programs letting public school units
  buy Khanmigo and MagicSchool licenses for grades 6-12 and a Wake County-Wake Tech math project using
  Khanmigo. It requires K-12 AI literacy standards in the computer science course of study, a Department
  of Public Instruction model AI policy, local AI policies, and AI training modules for educators.
provisions:
  - type: ai-in-standards
    description: Requires the State Board to revise the K-12 computer science standards to include AI
      literacy.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S257v8.pdf
      locator: Sec. 7.39.(b)
      quote: the State Board of Education shall revise the standard course of study for computer science
        for grades kindergarten through 12 to include artificial intelligence literacy in accordance with
        G.S. 115C-81.90(a1), as enacted by this section.
  - type: issues-model-policy
    description: Requires DPI to develop a model AI policy for public school units.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S257v8.pdf
      locator: Sec. 7.39, new G.S. 115C-102.13
      quote: The Department of Public Instruction shall develop a model artificial intelligence (AI) policy
        to serve as guidance to public school units when developing their AI policies.
  - type: appropriates-funding
    description: Funds public school unit licenses for the Khanmigo AI academic support tool in grades
      6-12.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S257v8.pdf
      locator: Sec. 7.15, new G.S. 115C-238.90(a)
      quote: for use of the academic support service Khanmigo, in grades six through 12. Khanmigo is an
        application that uses artificial intelligence to support teachers with lesson plan development
        and to support students with lesson comprehension.
  - type: educator-pd-requirement
    description: Specifies educator AI training content including responsible instructional use and verification.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S257v8.pdf
      locator: Sec. 7.39, training modules
      quote: '(2) Responsible instructional use of AI, such as the following: a. Lesson planning. b. Differentiated
        instruction. c. Student feedback.'
