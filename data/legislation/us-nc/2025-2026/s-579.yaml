id: us-nc-2025-2026-s-579
jurisdiction: us-nc
session: 2025-2026
identifier: S 579
title: Transforming the High School Experience
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - instructional-use
  - workforce
summary: Establishes a North Carolina High School Redesign Commission that must consider uses of artificial
  intelligence to expand student career exploration and work-based learning. Creates a Lighthouse Math
  Project in which Wake County schools and Wake Technical Community College contract for the Khanmigo
  AI tutoring program and develop Khanmigo-centered college math courses for high school students.
provisions:
  - type: creates-task-force
    description: Directs the High School Redesign Commission to consider AI uses for student career exploration.
    education_levels:
      - k12
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S579v2.pdf
      locator: Commission duties, subdivision (9)
      quote: Uses of artificial intelligence to expand student opportunities to engage in career exploration
        and work-based learning experiences.
  - type: appropriates-funding
    description: Requires the school district and Wake Tech to contract for the Khanmigo AI tutoring program.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S579v2.pdf
      locator: Sec. 3.(c)
      quote: WCPSS, in collaboration with Wake Tech, shall contract with Khan Academy, Inc. (Khan), for
        use of the artificial intelligence student tutoring program, Khanmigo.
  - type: ai-workforce-program
    description: Requires development of a Khanmigo-centered gateway college math course for high school
      students.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S579v2.pdf
      locator: Sec. 3.(c)(1)
      quote: Develop and deliver at least one Khanmigo-centered gateway college math course to be offered
        to high school students at participating high schools to be completed as a college level math
        course.
