id: us-nc-2025-2026-s-981
jurisdiction: us-nc
session: 2025-2026
identifier: S 981
title: AI in Ed Task Force and Standards
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - ai-literacy
  - curriculum-standards
  - educator-training
  - funding
summary: Establishes an Artificial Intelligence in Education Task Force to review laws on AI in educational
  contexts, recommend best practices for AI in schools and consider funding, reporting to the Joint Legislative
  Education Oversight Committee by March 2028. Requires the State Board of Education to adopt K-12 AI
  instruction standards and, to the extent funded, Department of Public Instruction professional development
  on AI, with a $250,000 appropriation.
provisions:
  - type: creates-task-force
    description: Establishes an AI in Education Task Force on the use and oversight of AI in educational
      settings.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S981v1.pdf
      locator: Sec. 1.(a)
      quote: There is established the Artificial Intelligence in Education (AIE) Task Force to gather
        information and decide the best means to utilize and oversee the use of artificial intelligence
        (AI) tools and systems in educational settings.
  - type: ai-in-standards
    description: Requires the State Board to adopt K-12 AI instruction standards.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S981v1.pdf
      locator: Sec. 2.(a), new G.S. 115C-81.66(a)
      quote: The State Board of Education shall adopt standards for age-appropriate instruction on artificial
        intelligence (AI) for kindergarten through grade 12.
  - type: educator-pd-requirement
    description: Directs DPI to provide AI professional development for teachers and administrators to
      the extent funded.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2025/Bills/Senate/PDF/S981v1.pdf
      locator: Sec. 2.(a), new G.S. 115C-81.66(c)
      quote: the Department of Public Instruction shall provide professional development for teachers
        and administrators related to AI and its use in education.
