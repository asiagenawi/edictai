title: Disaster Relief-3/Budget/Various Law Changes
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - funding
  - procurement
summary: Among budget and law changes, amends the AI School Safety Pilot Program to fund New Hanover and
  Davidson County Schools for a 2024-2025 school safety system integrating AI with cameras, video management
  and alerting protocols. Specifies required capabilities including facial recognition, requires both
  districts to use the same vendor, and moves reporting to the Center for Safer Schools.
provisions:
  - type: appropriates-funding
    description: Directs grants to two school districts for an AI School Safety Pilot Program in 2024-2025.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2023/Bills/Senate/PDF/S382v4.pdf
      locator: Sec. 3J.12, amending Sec. 7.36.(h) of S.L. 2023-134
      quote: Of the funds appropriated to the Department of Public Instruction by this act for the grants
        provided in this section for the 2024– 2025 fiscal year, the Department shall allocate
  - type: procurement-standards
    description: Requires the participating districts to contract with the same vendor and lists required
      capabilities.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2023/Bills/Senate/PDF/S382v4.pdf
      locator: Sec. 3J.12, amending Sec. 7.36.(h)(1b)
      quote: The participating public school units shall contract with the same vendor for the Pilot Program.
        The vendor shall be determined by the first public school unit to enter into a contract for a
        school safety solution.
