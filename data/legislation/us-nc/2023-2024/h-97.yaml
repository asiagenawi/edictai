summary: Amends the AI School Safety Pilot Program so that New Hanover and Davidson County Schools contract
  with a named vendor for a school safety system integrating AI with cameras, video management and alerting
  protocols. Requires the system to offer capabilities including threatening object detection, intruder
  detection, facial recognition and license plate reading.
provisions:
  - type: appropriates-funding
    description: Directs grants to two school districts to contract for an AI School Safety Pilot Program.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2023/Bills/House/PDF/H97v3.pdf
      locator: Sec. 6.1, amending Sec. 7.36.(h) of S.L. 2023-134
      quote: the Department shall allocate (i) three million two hundred thousand dollars ($3,200,000)
        as a directed grant to New Hanover County Schools and (ii) two million dollars ($2,000,000) as
        a directed grant to Davidson County Schools
  - type: procurement-standards
    description: Specifies required performance capabilities for the AI school safety solution.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2023/Bills/House/PDF/H97v3.pdf
      locator: Sec. 6.1, amending Sec. 7.36.(h)(1a)
      quote: 'The proposed school safety solution must offer the following performance capabilities: a.
        Threatening Objection Detection. b. Intruder Detection. c. Person Down Detection. d. Door Open
        Detection. e. Tag and Track. f. Facial Recognition.'
