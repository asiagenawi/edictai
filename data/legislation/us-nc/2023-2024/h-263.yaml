topics:
  - safety-wellbeing
  - funding
summary: The 2024 Appropriations Act modifies the 2023 budget, including the AI School Safety Pilot Program
  provision that directs $3.2 million to New Hanover County Schools and $2 million to Davidson County
  Schools for school safety systems integrating AI technology, with reporting coordinated through the
  Center for Safer Schools.
provisions:
  - type: appropriates-funding
    description: Directs grants to two school districts for an AI School Safety Pilot Program.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2023/Bills/House/PDF/H263v3.pdf
      locator: Sec. 7.36.(h) of S.L. 2023-134, as amended
      quote: Funds allocated for the Pilot Program shall be used for the implementation of a school safety
        system that integrates AI technology into existing access controls, alerting protocols, and intercom
        systems.
