identifier: H 259
title: 2023 Appropriations Act
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - funding
summary: The 2023 Current Operations Appropriations Act includes a provision directing the Department
  of Public Instruction to allocate $3.2 million to New Hanover County Schools and $2 million to Davidson
  County Schools for an AI School Safety Pilot Program integrating AI technology into school safety systems,
  with a report to the Joint Legislative Education Oversight Committee.
provisions:
  - type: appropriates-funding
    description: Directs grants to two school districts for an AI School Safety Pilot Program.
    citation:
      source_url: https://www.ncleg.gov/Sessions/2023/Bills/House/PDF/H259v7.pdf
      locator: Sec. 7.36.(h)(1)
      quote: Funds allocated for the Pilot Program shall be used for the implementation of a school safety
        system that integrates AI technology into existing access controls, alerting protocols, and intercom
        systems.
