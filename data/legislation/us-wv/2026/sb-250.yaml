summary: Makes appropriations for the 2027 fiscal year. As introduced, would direct $3,000,000 of the
  State Department of Education's Mountain State Digital Literacy Program appropriation to digital artificial
  intelligence tutoring; the later version directs that amount to tutoring and support resources for digital
  literacy, math, career-technical education, and internet safety. The AI provisions were removed by amendment.
provisions:
  - type: appropriates-funding
    description: Would direct $3,000,000 of the statewide Mountain State Digital Literacy Program appropriation
      to digital AI tutoring.
    citation:
      source_url: http://www.wvlegislature.gov/Bill_Status/bills_text.cfm?billdoc=sb250%20intr.htm&yr=2026&sesstype=RS&i=250
      locator: Introduced, State Department of Education, Mountain State Digital Literacy Program (fund
        0313, appropriation 86401)
      quote: From the above appropriation for Mountain State Digital Literacy Program (fund 0313, appropriation
        86401), $3,000,000 shall be used for digital artificial intelligence tutoring.
