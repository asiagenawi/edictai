      source_url: http://www.wvlegislature.gov/Bill_Status/bills_text.cfm?billdoc=hb4027%20intr.htm&yr=2026&sesstype=RS&i=4027
      locator: Introduced, State Department of Education, Mountain State Digital Literacy Program (fund
        0313, appropriation 86401)
      quote: From the above appropriation for Mountain State Digital Literacy Program (fund 0313, appropriation
        86401), $3,000,000 shall be used for digital artificial intelligence tutoring.
