identifier: HB 4014
title: Workforce Readiness and Opportunity Act
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
summary: Establishes the West Virginia Micro-Credential Program within the Higher Education Policy Commission
  to set standards for micro-credentials that document student and employee skills. Authorizes the commission
  to use digital, web-based, and artificial intelligence-based micro-credentials to meet workforce demands.
provisions:
  - type: ai-workforce-program
    description: Authorizes the commission to use AI-based micro-credentials within the statewide micro-credential
      program.
    citation:
      source_url: http://www.wvlegislature.gov/Bill_Status/bills_text.cfm?billdoc=hb4014%20sub1.htm&yr=2026&sesstype=RS&i=4014
      locator: §18B-3D-8(d)(4)
      quote: Utilize digital, web-based, artificial intelligence-based, hands-on, or on-the-job micro-credentials
        as needed to meet workforce and market demands;
