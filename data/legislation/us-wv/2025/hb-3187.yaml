id: us-wv-2025-hb-3187
jurisdiction: us-wv
session: "2025"
identifier: HB 3187
title: Relating to the West Virginia Task Force on Artificial Intelligence
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - instructional-use
  - local-policy-requirement
summary: Amends the West Virginia Task Force on Artificial Intelligence, whose duties include recommending
  model policies for schools on student use of AI in the classroom, to add identifying AI economic opportunities,
  require annual reports, and extend the task force to July 1, 2027.
provisions:
  - type: creates-task-force
    description: Keeps the task force duty to recommend model school policies on student classroom use
      of AI.
    citation:
      source_url: http://www.wvlegislature.gov/Bill_Status/bills_text.cfm?billdoc=hb3187%20enr.htm&yr=2025&sesstype=RS&i=3187
      locator: §5A-6-9(e)(6)
      quote: (6) Recommending model policies for schools to address the use of artificial intelligence
        by students in the classroom;
