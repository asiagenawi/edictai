title: To create an AI Task Force
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - instructional-use
  - local-policy-requirement
summary: Creates a state task force on artificial intelligence, with the State Superintendent of Schools
  and the higher education chancellor among its members, whose duties include recommending model policies
  for schools on student use of AI in the classroom. Requires a report to the Governor and Legislature
  by July 1, 2025.
provisions:
  - type: creates-task-force
    description: Charges the task force with recommending model school policies on student classroom use
      of AI.
    citation:
      source_url: http://www.wvlegislature.gov/Bill_Status/bills_text.cfm?billdoc=hb5490%20intr.htm&yr=2024&sesstype=RS&i=5490
      locator: §5A-6-9(e)(2)
      quote: (2) Recommending model policies for schools to address the use of generative artificial intelligence
        by students in the classroom;
