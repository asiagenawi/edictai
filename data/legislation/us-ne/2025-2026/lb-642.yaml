id: us-ne-2025-2026-lb-642
jurisdiction: us-ne
session: 2025-2026
identifier: LB 642
title: Adopt the Artificial Intelligence Consumer Protection Act
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - admissions
  - equity-access
  - institutional-operations
summary: Adopts the Artificial Intelligence Consumer Protection Act, requiring developers and deployers
  of high-risk AI systems used in consequential decisions to document, disclose and mitigate risks of
  algorithmic discrimination. Consequential decisions include those affecting education enrollment or
  an education opportunity.
provisions:
  - type: bias-or-equity-requirement
    description: Lists education enrollment and opportunities among consequential decisions covered by
      algorithmic discrimination duties.
    citation:
      source_url: https://nebraskalegislature.gov/FloorDocs/109/PDF/Intro/LB642.pdf
      locator: Sec. 2(3)(a)
      quote: 'Consequential decision means a decision that has a material legal or similarly significant
        effect on the provision or denial to any consumer of any, or the cost or terms of any: (a) Education
        enrollment or an education opportunity;'
  - type: bias-or-equity-requirement
    description: Requires developers to document measures taken to mitigate known risks of algorithmic
      discrimination.
    citation:
      source_url: https://nebraskalegislature.gov/FloorDocs/109/PDF/Intro/LB642.pdf
      locator: Sec. 3(2)(c)(iv)
      quote: The measures the developer has taken to mitigate known risks of algorithmic discrimination
        that could arise from the deployment of the high-risk artificial intelligence system
