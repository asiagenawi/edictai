id: us-ne-2023-2024-lb-1253
jurisdiction: us-ne
session: 2023-2024
identifier: LB 1253
title: Create the Dyslexia Research Grant Program
classification: bill
education_levels:
  - k12
topics:
  - research
  - funding
  - equity-access
summary: Creates a Dyslexia Research Grant Program administered by the State Department of Education,
  awarding up to $1 million to Nebraska businesses researching artificial-intelligence-based writing assistance
  for individuals with dyslexia. The research must focus on writing analytics that teachers can use to
  develop literacy plans for students with dyslexia.
provisions:
  - type: appropriates-funding
    description: Creates a grant program for research on AI-based writing assistance for individuals with
      dyslexia.
    citation:
      source_url: https://nebraskalegislature.gov/FloorDocs/108/PDF/Intro/LB1253.pdf
      locator: Sec. 1(4)
      quote: All grant money received under the Dyslexia Research Grant Program shall be used only for
        the purpose of researching the use of artificial-intelligence-based writing assistance by individuals
        with dyslexia.
  - type: appropriates-funding
    description: Requires the research to produce analytics teachers can use for literacy plans for students
      with dyslexia.
    citation:
      source_url: https://nebraskalegislature.gov/FloorDocs/108/PDF/Intro/LB1253.pdf
      locator: Sec. 1(4)
      quote: Such research shall be focused on using aggregate writing analytics to identify writing errors
        and patterns that can be used by teachers to develop a comprehensive literacy plan for students
        with dyslexia.
