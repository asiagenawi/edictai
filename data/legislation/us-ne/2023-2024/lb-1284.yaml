id: us-ne-2023-2024-lb-1284
jurisdiction: us-ne
session: 2023-2024
identifier: LB 1284
title: Provide for and change teacher incentive programs, provide for a pilot program to distribute menstrual
  products in schools, a Dyslexia Research Grant Program, a professional learning system relating to instruction
  in reading, and a statewide computer science education expansion program, create and change authorized
  use of certain funds, and change provisions relating to school psychologists and certain scholarship
  programs
classification: bill
education_levels:
  - k12
topics:
  - research
  - funding
  - equity-access
summary: Changes teacher incentive programs and other education provisions, and creates a Dyslexia Research
  Grant Program administered by the State Department of Education for Nebraska businesses researching
  artificial-intelligence-based writing assistance for individuals with dyslexia.
provisions:
  - type: appropriates-funding
    description: Creates a grant program for businesses researching AI-based writing assistance for individuals
      with dyslexia.
    citation:
      source_url: https://nebraskalegislature.gov/FloorDocs/108/PDF/Slip/LB1284.pdf
      locator: Sec. 2(1)-(2)
      quote: Eligible applicant means a privately owned business based in Nebraska that is in the process
        of researching artificial-intelligence-based writing assistance that can be used to assist individuals
        with dyslexia.
