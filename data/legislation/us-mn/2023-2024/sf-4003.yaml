summary: Makes Minnesota higher education policy changes, including student sexual misconduct, student
  aid, and institutional licensure provisions. Adds nonconsensual dissemination of a deepfake depicting
  intimate parts or sexual acts to the definition of sexual misconduct covered by the sexual misconduct
  policies of Minnesota postsecondary institutions.
