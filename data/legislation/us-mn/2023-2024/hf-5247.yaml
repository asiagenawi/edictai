title: Taxation and state government operations; various provisions modified, and money appropriated.
classification: bill
education_levels:
  - postsecondary
topics:
  - synthetic-media
  - safety-wellbeing
summary: Omnibus taxation and state government operations bill that includes higher education provisions.
  Adds nonconsensual dissemination of a deepfake depicting intimate parts or sexual acts to the definition
  of sexual misconduct covered by the sexual misconduct policies of Minnesota postsecondary institutions.
provisions:
  - type: addresses-deepfakes
    description: Includes deepfake dissemination in the sexual misconduct definition governing postsecondary
      institution policies.
    citation:
      source_url: https://www.revisor.mn.gov/bills/text.php?number=HF5247&version=4&session=ls93&session_year=2024&session_number=0&format=pdf
      locator: Sexual misconduct definition, paragraph (m) [Page 535]
      quote: nonconsensual dissemination of a deepfake depicting intimate
