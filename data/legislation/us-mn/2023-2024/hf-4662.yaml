id: us-mn-2023-2024-hf-4662
jurisdiction: us-mn
session: 2023-2024
identifier: HF 4662
title: Minnesota State Colleges and Universities faculty academic freedom protections established, artificial
  intelligence working group created, and report required.
classification: bill
education_levels:
  - postsecondary
topics:
  - instructional-use
  - institutional-operations
  - task-force
  - local-policy-requirement
  - employment-evaluation
summary: Bars Minnesota State Colleges and Universities institutions from using artificial or generative
  intelligence as the primary instructor for a credit-bearing course or to provide library, counseling
  and crisis intervention, athletic coaching, and training services, while preserving faculty use of AI.
  Requires AI use by faculty or staff to be cited and made clear to students, and directs the Board of
  Trustees to convene a work group to develop policies for safe and ethical AI use.
