topics:
  - synthetic-media
  - safety-wellbeing
summary: Makes higher education policy and finance changes in Minnesota, including student sexual misconduct,
  admissions, and student aid provisions. Adds nonconsensual dissemination of a deepfake depicting intimate
  parts or sexual acts to the definition of sexual misconduct covered by the sexual misconduct policies
  of Minnesota postsecondary institutions.
provisions:
  - type: addresses-deepfakes
    description: Includes deepfake dissemination in the sexual misconduct definition governing postsecondary
      institution policies.
    citation:
      source_url: https://www.revisor.mn.gov/bills/text.php?number=HF4024&version=3&session=ls93&session_year=2024&session_number=0&format=pdf
      locator: Sexual misconduct definition, paragraph (m) [Page 12]
      quote: nonconsensual dissemination of a deepfake depicting intimate
