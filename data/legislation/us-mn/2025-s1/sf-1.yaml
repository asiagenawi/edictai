summary: Provides higher education funding and policy changes for the Office of Higher Education, Minnesota
  State Colleges and Universities, and the University of Minnesota. Its campus sexual misconduct provisions
  define sexual misconduct, which institutional policies and grievance procedures must address, to include
  nonconsensual dissemination of a deepfake depicting intimate parts or sexual acts.
provisions:
  - type: addresses-deepfakes
    description: Includes deepfake dissemination in the sexual misconduct definition governing postsecondary
      institution policies.
    citation:
      source_url: https://www.revisor.mn.gov/bills/text.php?number=SF1&version=0&session=ls94&session_year=2025&session_number=1&format=pdf
      locator: 135A.15 definitions, paragraph (n) [Page 34]
      quote: of sexual images, sexual extortion, nonconsensual dissemination of a deepfake depicting
