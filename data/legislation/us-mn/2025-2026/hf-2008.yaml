summary: Modifies Minnesota campus sexual misconduct law, including definitions and the sexual misconduct
  grievance process postsecondary institutions must establish. The amended definition of sexual misconduct,
  which institutions' policies and grievance processes must address, includes nonconsensual dissemination
  of a deepfake depicting intimate parts or sexual acts.
