summary: Provides higher education funding and policy changes for the Office of Higher Education, Minnesota
  State Colleges and Universities, and the University of Minnesota. Its campus sexual misconduct provisions
  define sexual misconduct, which institutional policies must address, to include nonconsensual dissemination
  of a deepfake depicting intimate parts or sexual acts.
