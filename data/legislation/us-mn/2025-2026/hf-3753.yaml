summary: Establishes a school safety threat assessment pilot project in which the Office of Justice Programs
  contracts for threat monitoring and response services in selected school districts, which may use predictive
  analytics and artificial intelligence-driven software. Appropriates $4,000,000 in fiscal year 2027 and
  requires a report by January 15, 2027.
