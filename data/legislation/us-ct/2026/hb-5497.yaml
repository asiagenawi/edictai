id: us-ct-2026-hb-5497
jurisdiction: us-ct
session: "2026"
identifier: HB 5497
title: An Act Establishing A Task Force To Study The Effects Of Artificial Intelligence On The Trades
  Industry.
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - workforce
  - curriculum-standards
summary: Establishes a task force to study the effects of artificial intelligence on the trades industry,
  including job displacement and the current coursework and curriculum of the Technical Education and
  Career System regarding AI, with a report due January 1, 2027.
provisions:
  - type: creates-task-force
    description: Creates a task force whose study must examine the technical high school system's AI coursework
      and curriculum.
    citation:
      source_url: https://www.cga.ct.gov/2026/TOB/H/PDF/2026HB-05497-R01-HB.PDF
      locator: Sec. 1(a)
      quote: current coursework and curriculum of the Technical and Education Career System regarding
        the use of artificial intelligence
