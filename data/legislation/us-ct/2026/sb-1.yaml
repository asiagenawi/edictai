id: us-ct-2026-sb-1
jurisdiction: us-ct
session: "2026"
identifier: SB 1
title: An Act Making Adjustments To The State Budget For The Biennium Ending June 30, 2027, Making Deficiency
  Appropriations For The Fiscal Year Ending June 30, 2026, Authorizing And Adjusting Bonds Of The State
  And Concerning Provisions Relating To Revenue, School Construction And Other Items To Implement The
  State Budget.
classification: bill
education_levels:
  - postsecondary
topics:
  - funding
  - workforce
summary: A state budget adjustment act that, among many provisions, carries forward $500,000 to the Connecticut
  State Colleges and Universities for the AI Academy in fiscal year 2027.
provisions:
  - type: appropriates-funding
    description: Carries forward $500,000 to the Connecticut State Colleges and Universities for the AI
      Academy.
    citation:
      source_url: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00068-R00SB-00001-PA.PDF
      locator: Sec. 47
      quote: shall be transferred to the Connecticut State Colleges and Universities, for Various Grants,
        and made available during the fiscal year ending June 30, 2027, for AI Academy.
