id: us-ct-2026-sb-5
jurisdiction: us-ct
session: "2026"
identifier: SB 5
title: An Act Concerning Online Safety.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - educator-training
  - ai-literacy
  - workforce
  - instructional-use
summary: An online safety and artificial intelligence act that, among other provisions, establishes a
  Connecticut AI Academy through the Board of Regents offering AI courses, career preparation, resources
  for people aged 13 to 20, and courses and videos for K-12 teachers and administrators on appropriate
  classroom AI use and teaching students about AI, with certificates and badges for completers.
provisions:
  - type: educator-pd-requirement
    description: The AI Academy must develop courses and videos for K-12 teachers and administrators on
      appropriate AI use in classrooms.
    education_levels:
      - k12
    citation:
      source_url: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00015-R00SB-00005-PA.PDF
      locator: Sec. 17(b)(7)
      quote: develop and offer courses and videos for primary and secondary school teachers and administrators
        (A) concerning the appropriate use of artificial intelligence in primary and secondary school
        classrooms, (B) instructing such teachers how to use artificial intelligence
  - type: ai-workforce-program
    description: The AI Academy must prepare students for careers in fields involving AI.
    citation:
      source_url: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00015-R00SB-00005-PA.PDF
      locator: Sec. 17(b)(3)
      quote: (3) Prepare students for careers in fields involving artificial intelligence;
  - type: ai-workforce-program
    description: The Board of Regents must develop certificates and badges for completing AI Academy courses.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.cga.ct.gov/2026/ACT/PA/PDF/2026PA-00015-R00SB-00005-PA.PDF
      locator: Sec. 17(c)
      quote: The Board of Regents for Higher Education shall, in consultation with Charter Oak State College,
        develop certificates and badges to be awarded to persons who successfully complete courses offered
        by the Connecticut AI Academy.
