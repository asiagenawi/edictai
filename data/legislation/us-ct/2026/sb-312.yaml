id: us-ct-2026-sb-312
jurisdiction: us-ct
session: "2026"
identifier: SB 312
title: An Act Establishing An American Sign Language Education Working Group And Concerning Curriculum
  Guidance For American Sign Language Instruction.
classification: bill
education_levels:
  - k12
topics:
  - procurement
  - instructional-use
summary: Establishes an American Sign Language education working group and directs the Department of Education
  to issue curriculum guidance for American Sign Language instruction. As introduced, would have let the
  Department of Education approve supplemental literacy support products using machine-learning systems
  that listen to students read aloud and provide tutoring, subject to approval criteria. The AI provisions
  were removed by amendment.
provisions:
  - type: procurement-standards
    description: As introduced, the Department of Education could approve machine-learning literacy support
      products that meet listed criteria.
    education_levels:
      - k12
    citation:
      source_url: https://www.cga.ct.gov/2026/TOB/S/PDF/2026SB-00312-R00-SB.PDF
      locator: Introduced, Sec. 1(a)
      quote: The Department of Education may approve one or more supplemental literacy support products
        that utilizes a machine -learning or other machine -based system capable of (1) listening to students
        read aloud,
