id: us-ct-2025-sb-2
jurisdiction: us-ct
session: "2025"
identifier: SB 2
title: An Act Concerning Artificial Intelligence.
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - ai-literacy
summary: A comprehensive artificial intelligence bill that, among other provisions, requires the Board
  of Regents for Higher Education to establish a Connecticut AI Academy through Charter Oak State College
  offering online AI courses, digital literacy, career preparation, and courses for people aged 13 to
  20, with certificates and badges for completers, and creates an AI regulatory sandbox and other economic
  development measures.
provisions:
  - type: ai-workforce-program
    description: The Board of Regents must establish a Connecticut AI Academy offering AI courses and
      career preparation.
    citation:
      source_url: https://www.cga.ct.gov/2025/TOB/S/PDF/2025SB-00002-R04-SB.PDF
      locator: Sec. 13(b)
      quote: the Board of Regents for Higher Education shall establish, on behalf of Charter Oak State
        College and in consultation with the Labor Department, the State Board of Education, Workforce
        Investment Boards, employers and institutions of higher education in this state, a "Connecticut
        AI Academy"
  - type: ai-workforce-program
    description: The Board of Regents must develop certificates and badges for completing AI Academy courses.
    citation:
      source_url: https://www.cga.ct.gov/2025/TOB/S/PDF/2025SB-00002-R04-SB.PDF
      locator: Sec. 13(c)
      quote: The Board of Regents for Higher Education shall, in consultation with Charter Oak State College,
        develop certificates and badges to be awarded to persons who successfully complete courses offered
        by the Connecticut AI Academy.
