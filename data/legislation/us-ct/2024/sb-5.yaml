id: us-ct-2024-sb-5
jurisdiction: us-ct
session: "2024"
identifier: SB 5
title: An Act Concerning School Resources.
classification: bill
education_levels:
  - k12
topics:
  - educator-training
  - funding
summary: As introduced, would amend the general statutes to increase funding to Regional Education Service
  Centers to train school districts on the use of artificial intelligence in schools, along with reallocating
  funds for school HVAC upgrades. The AI provisions were removed by amendment.
provisions:
  - type: educator-pd-requirement
    description: As introduced, increased funding to Regional Education Service Centers to train school
      districts on AI use in schools.
    citation:
      source_url: https://www.cga.ct.gov/2024/TOB/S/PDF/2024SB-00005-R00-SB.PDF
      locator: Introduced, page 1
      quote: increase funding to Regional 3 Education Service Centers for the purpose of providing training
        to 4 school districts regarding the use of artificial intelligence in schools.
