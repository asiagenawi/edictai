summary: An omnibus bonding and implementer act whose Sections 143 and 144 directed the Connecticut State Department of Education to run an artificial intelligence education tool pilot program in five school districts for fiscal year 2024-25, with grants to implement a commissioner-selected AI tool in grades 7-12, and to provide related professional development for educators in the participating districts.
provisions:
  - type: appropriates-funding
    description: Creates a one-year AI education tool pilot program under which the Commissioner of Education awards grants to five local or regional boards of education to implement an existing AI tool for classroom instruction in a grade from seven to twelve.
    education_levels:
      - k12
    citation:
      source_url: https://www.cga.ct.gov/2024/ACT/PA/PDF/2024PA-00151-R00HB-05524-PA.PDF
      locator: Sec. 143(a)-(b), p. 193
      quote: For the fiscal year ending June 30, 2025, the Department of Education shall administer an artificial intelligence education tool pilot program. Under such pilot program, the Commissioner of Education shall award a grant to assist such boards in implementing an existing artificial intelligence tool, selected by the commissioner, that will be used by educators and students for classroom instruction and student learning.
  - type: educator-pd-requirement
    description: Requires the Department of Education to provide professional development to educators in the pilot districts on using the selected AI tool safely, its benefits, and laws on AI and student data privacy.
    education_levels:
      - k12
    citation:
      source_url: https://www.cga.ct.gov/2024/ACT/PA/PDF/2024PA-00151-R00HB-05524-PA.PDF
      locator: Sec. 144, p. 194
      quote: For the fiscal year ending June 30, 2025, the Department of Education shall provide professional development for educators employed by the local and regional boards of education participating in the artificial intelligence education tool pilot program pursuant to section 143 of this act.
