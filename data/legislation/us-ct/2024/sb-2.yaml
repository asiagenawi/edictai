id: us-ct-2024-sb-2
jurisdiction: us-ct
session: "2024"
identifier: SB 2
title: An Act Concerning Artificial Intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - workforce
  - ai-literacy
  - equity-access
summary: A comprehensive artificial intelligence bill that regulates high-risk AI systems making consequential
  decisions, including education enrollment or opportunity, directs the Board of Regents to offer AI courses
  with certificates and badges and to establish community-technical college certificate programs in prompt
  engineering and AI for small businesses, and creates related economic development measures.
provisions:
  - type: bias-or-equity-requirement
    description: Consequential decisions regulated by the AI provisions include education enrollment or
      opportunity.
    citation:
      source_url: https://www.cga.ct.gov/2024/TOB/S/PDF/2024SB-00002-R03-SB.PDF
      locator: Sec. 1(3)
      quote: '"Consequential decision" means any decision that has a material legal or similarly significant
        effect on any consumer''s access to, or availability, cost or terms of, any criminal justice remedy,
        education enrollment or opportunity'
  - type: ai-workforce-program
    description: The Board of Regents must develop certificates and badges for completing AI courses.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.cga.ct.gov/2024/TOB/S/PDF/2024SB-00002-R03-SB.PDF
      locator: Sec. 23
      quote: The board shall, in consultation with Charter Oak State College, develop certificates and
        badges to be awarded to persons who successfully complete such courses.
  - type: ai-workforce-program
    description: The Board of Regents must establish community-technical college certificate programs
      in prompt engineering and AI for small businesses.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.cga.ct.gov/2024/TOB/S/PDF/2024SB-00002-R03-SB.PDF
      locator: Sec. 23
      quote: the Board of Regents for Higher Education shall establish, on behalf of the regional community-technical
        colleges, certificate programs in prompt engineering, artificial intelligence marketing for small
        businesses and artificial intelligence for small business operations.
