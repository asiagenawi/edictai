identifier: HB 1
title: Relating to primary and secondary education, including the certification, compensation, and health
  coverage of certain public school employees, the public school finance system, special education in
  public schools, the establishment of an education savings account program, measures to support the education
  of public school students that include certain educational grant programs, reading instruction, and
  early childhood education, the provision of virtual education, and public school accountability.
classification: bill
education_levels:
  - k12
topics:
  - assessment
  - task-force
summary: Omnibus public education bill addressing educator certification and pay, school finance, special
  education, education savings accounts and other topics. In Sec. 39.456, it calls for review of the statewide
  assessment and accountability system, including grading systems and the use of artificial intelligence
  in grading.
provisions:
  - type: regulates-ai-assessment
    description: Requires the assessment and accountability review to address grading systems, including
      the use of AI in grading.
