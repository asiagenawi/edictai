id: us-tx-2025-2026-hb-4448
jurisdiction: us-tx
session: 2025-2026
identifier: HB 4448
title: Relating to an automated artificial intelligence review of library material purchased by public
  schools; providing an administrative penalty.
classification: bill
education_levels:
  - k12
topics:
  - procurement
  - institutional-operations
  - equity-access
summary: Requires school districts and charter schools to submit library materials to an agency-approved
  third party for automated artificial intelligence review of sexually explicit or sexually relevant content
  before purchase. Sets standards for approved reviewers, including bias mitigation and accuracy audits,
  and imposes penalties for violations.
provisions:
  - type: procurement-standards
    description: Districts must have library materials reviewed by an approved AI review vendor before
      purchase.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB04448I.htm
      locator: Sec. 35.0022(a)
      quote: a school district or open-enrollment charter school must ensure the material is submitted
        to a third party approved by the agency to conduct an automated artificial intelligence review
        of the material
  - type: bias-or-equity-requirement
    description: Approved AI review vendors must use bias mitigation protocols and cultural competency
      testing.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB04448I.htm
      locator: Sec. 35.0022(f)(2)
      quote: must require bias mitigation protocols and cultural competency testing;
