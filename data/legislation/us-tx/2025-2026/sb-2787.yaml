id: us-tx-2025-2026-sb-2787
jurisdiction: us-tx
session: 2025-2026
identifier: SB 2787
title: Relating to digital citizenship and media literacy instruction in public schools and a public school
  policy regarding Internet safety.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - safety-wellbeing
summary: Requires districts to provide digital citizenship and media literacy instruction and directs
  the State Board of Education to adopt essential knowledge and skills that include identifying credible
  information by analyzing content created or modified by generative artificial intelligence. Also requires
  districts and charter schools to adopt Internet safety policies.
provisions:
  - type: ai-in-standards
    description: The State Board of Education must adopt digital citizenship standards that include analyzing
      generative AI content to identify credible sources.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB02787I.htm
      locator: Sec. 1, Education Code 28.00215(c)(7)
      quote: how to identify credible sources of information, including by analyzing content created or
        modified by generative artificial intelligence technology
  - type: requires-ai-literacy-instruction
    description: Districts must incorporate digital citizenship instruction and require students in grades
      6 through 12 to complete media literacy instruction.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB02787I.htm
      locator: Sec. 1, Education Code 28.00215(b)
      quote: require students enrolled in grades 6 through 12 to complete instruction in media literacy
        as part of the district's foundation curriculum
