id: us-tx-2025-2026-sb-382
jurisdiction: us-tx
session: 2025-2026
identifier: SB 382
title: Relating to a prohibition on the use of artificial intelligence technology for classroom instruction.
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - employment-evaluation
summary: Prohibits school districts and open-enrollment charter schools from using artificial intelligence
  technology to provide instruction or to replace or supplement a teacher's role in instruction or interacting
  with students.
provisions:
  - type: limits-ai-instructional-use
    description: Districts and charter schools may not use AI technology to provide instruction to students.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00382I.htm
      locator: Sec. 1, Education Code 28.0028(1)
      quote: 'A school district or open-enrollment charter school may not use artificial intelligence
        technology to: (1) provide instruction to students'
  - type: prohibits-ai-replacing-educators
    description: Districts and charter schools may not use AI to replace or supplement a teacher's instructional
      role.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00382I.htm
      locator: Sec. 1, Education Code 28.0028(2)
      quote: replace or supplement a teacher's role in providing instruction or interacting with students
        in a course of instruction
