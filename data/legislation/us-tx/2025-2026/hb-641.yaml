      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB00641I.htm
      locator: Sec. 1, Education Code 28.002(z)(2)(A)
      quote: media literacy and the ability to identify credible sources of information, including by
        analyzing content created or modified by generative artificial intelligence technology
