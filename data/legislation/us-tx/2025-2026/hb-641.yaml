summary: Requires school districts to incorporate digital citizenship instruction, completed by sixth-grade
  students as part of social studies, and defines digital citizenship to include media literacy such as
  analyzing content created or modified by generative artificial intelligence.
provisions:
  - type: requires-ai-literacy-instruction
    description: Required digital citizenship instruction includes identifying credible information by
      analyzing content created or modified by generative AI.
