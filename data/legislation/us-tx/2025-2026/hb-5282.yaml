id: us-tx-2025-2026-hb-5282
jurisdiction: us-tx
session: 2025-2026
identifier: HB 5282
title: Relating to the use of artificial intelligence to score certain portions of assessment instruments
  administered to public school students.
classification: bill
education_levels:
  - k12
topics:
  - assessment
  - equity-access
summary: Requires the Texas Education Agency to prohibit artificial intelligence scoring of constructed
  responses on state assessments unless the scoring method is trained on representative samples of student
  responses, meets validity and reliability standards, and is certified by an independent entity as free
  of measurable bias.
provisions:
  - type: regulates-ai-assessment
    description: The agency must prohibit AI scoring of constructed responses on state assessments, except
      under listed conditions.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB05282I.htm
      locator: Sec. 1, Education Code 39.023(q)
      quote: the agency shall prohibit the use of artificial intelligence, including an artificial intelligence-based
        algorithm, algorithmic device, automated scoring engine, or any scoring method that uses artificial
        intelligence in part, to score a constructed response
  - type: bias-or-equity-requirement
    description: An AI scoring method may be used only if an independent entity certifies it shows no
      measurable bias against educationally disadvantaged, emergent bilingual, or special education students.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB05282I.htm
      locator: Sec. 1, Education Code 39.023(r)(3)(B)
      quote: does not demonstrate any measurable bias against a student described by Subdivision (1)
