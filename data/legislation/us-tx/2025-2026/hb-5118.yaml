id: us-tx-2025-2026-hb-5118
jurisdiction: us-tx
session: 2025-2026
identifier: HB 5118
title: Relating to a study on employer and state agency use of automated employment decision tools in
  assessing an applicant's suitability for a position.
classification: bill
education_levels:
  - postsecondary
topics:
  - employment-evaluation
  - task-force
  - equity-access
summary: Directs the Texas Workforce Commission to study the use of artificial intelligence systems and
  automated employment decision tools in hiring by employers and state agencies, defined to include university
  systems and institutions of higher education. The study must address bias detection, transparency and
  oversight and lead to a report with recommendations.
provisions:
  - type: creates-task-force
    description: Requires a study of AI hiring tools used by employers and state agencies, which include
      institutions of higher education.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB05118H.htm
      locator: Section 1(b)
      quote: The commission, in consultation and collaboration with the department, shall conduct a study
        on the use of artificial intelligence systems and automated employment decision tools in employment
        and hiring practices of employers, including state agencies.
