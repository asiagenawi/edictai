summary: Adds online safety to the required enrichment curriculum, including instruction on the potential
  dangers of applications that use artificial intelligence, and directs the State Board of Education to
  adopt related essential knowledge and skills. Also adds AI applications to the Department of Public
  Safety's online safety education for minors.
