id: us-tx-2025-2026-hb-2400
jurisdiction: us-tx
session: 2025-2026
identifier: HB 2400
title: Relating to a prohibition on the use of artificial intelligence technology for classroom instruction.
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
summary: Prohibits school districts and open-enrollment charter schools from using artificial intelligence
  technology to provide instruction to students or to replace or supplement a teacher's role in instruction
  or in interacting with students in a course, beginning in 2025-2026.
provisions:
  - type: prohibits-ai-replacing-educators
    description: Bars districts and charter schools from using AI to provide instruction or replace or
      supplement a teacher's instructional role.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB02400I.htm
      locator: Sec. 28.0028
      quote: 'A school district or open-enrollment charter school may not use artificial intelligence
        technology to: (1) provide instruction to students; or (2) replace or supplement a teacher''s
        role in providing instruction or interacting with students in a course of instruction.'
