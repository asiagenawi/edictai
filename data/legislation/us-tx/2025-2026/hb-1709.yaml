id: us-tx-2025-2026-hb-1709
jurisdiction: us-tx
session: 2025-2026
identifier: HB 1709
title: Relating to the regulation and reporting on the use of artificial intelligence systems by certain
  business entities and state agencies; providing civil penalties.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - workforce
  - funding
  - curriculum-standards
summary: Enacts a version of the Texas Responsible Artificial Intelligence Governance Act that, among
  other provisions, creates the Texas Artificial Intelligence Workforce Development Grant Program. The
  program provides grants to public school districts, charter schools, community colleges and technical
  institutes for AI-related career and technical education, curricula and training.
provisions:
  - type: ai-workforce-program
    description: Establishes an AI workforce development grant program including career and technical
      education in community colleges and high schools.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB01709I.htm
      locator: Sec. 319.051(a)
      quote: provide grants to local community colleges and public high schools to implement or expand
        career and technical education programs focused on artificial intelligence readiness and skill
        development;
  - type: appropriates-funding
    description: Makes school districts, charter schools, community colleges and technical institutes
      eligible for AI curriculum and training grants.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB01709I.htm
      locator: Sec. 319.053(a)
      quote: public school districts and charter schools offering or seeking to offer career and technical
        education programs in artificial intelligence-related fields or to update existing curricula to
        address these fields;
