id: us-tx-2025-2026-hb-3512
jurisdiction: us-tx
session: 2025-2026
identifier: HB 3512
title: Relating to artificial intelligence training programs for certain employees and officials of state
  agencies and local governments.
classification: bill
education_levels:
  - k12
topics:
  - educator-training
summary: Requires state and local government employees and officials who use computers for a substantial
  share of their duties to complete state-certified artificial intelligence training as well as cybersecurity
  training. Provides that school district cybersecurity coordinators complete the AI training annually
  and other district employees complete it as the district determines.
provisions:
  - type: educator-pd-requirement
    description: School district employees required to take the AI training complete it as determined
      by the district.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB03512F.htm
      locator: Section 1, amending Education Code 11.175(h-1)
      quote: Any other school district employee required to complete the cybersecurity training and the
        artificial intelligence training shall complete the training as determined by the district, in
        consultation with the district's cybersecurity coordinator.
