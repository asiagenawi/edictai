id: us-tx-2025-2026-sb-747
jurisdiction: us-tx
session: 2025-2026
identifier: SB 747
title: Relating to public school policies and programs regarding the production or distribution of certain
  intimate visual material by public school students.
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Allows removal or expulsion of students who release intimate visual material of another student,
  including material created with artificial intelligence, defines such production or distribution as
  cyberbullying, requires district bullying policies to address it, and directs development of programs
  on the risks of AI-generated intimate images.
provisions:
  - type: addresses-deepfakes
    description: Students who release or threaten to release intimate visual material of a student, including
      AI-created material, may be placed in a disciplinary program or expelled.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00747H.htm
      locator: Sec. 1, Education Code 37.0052(b)(3)
      quote: releases or threatens to release intimate visual material of a minor or a student who is
        18 years of age or older without the student's consent, including intimate visual material created
        using artificial intelligence technology
  - type: addresses-deepfakes
    description: Agency standards must require district bullying policies to address intimate images of
      students, including AI-created images.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00747H.htm
      locator: Sec. 3, Education Code 37.0832(c-1)(7)
      quote: require districts to include in the policy provisions specifically addressing incidents of
        bullying that involve the production or distribution of a video or image
  - type: addresses-deepfakes
    description: The center must develop programs for districts on the risks of producing or distributing
      AI-created intimate images of students.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/SB00747H.htm
      locator: Sec. 4, Education Code 37.218(b)(6)
      quote: the specific risks of producing or distributing visual material created using artificial
        intelligence technology that appears to depict a student with the student's intimate parts exposed
        or engaged in sexual conduct
