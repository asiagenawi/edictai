id: us-tx-2025-2026-hb-4390
jurisdiction: us-tx
session: 2025-2026
identifier: HB 4390
title: Relating to parental rights regarding the use of machine grading to score certain portions of assessment
  instruments administered to public school students in this state.
classification: bill
education_levels:
  - k12
topics:
  - assessment
summary: Requires the Texas Education Agency to notify parents when machine grading, including artificial
  intelligence, is used to score a student's constructed response on a state assessment. Lets parents
  of students who did not perform satisfactorily request rescoring by a traditional method at no cost.
provisions:
  - type: requires-disclosure
    description: The agency must notify parents when AI or computer software scores a student's constructed
      response.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB04390I.htm
      locator: Sec. 39.023(q)
      quote: The agency shall provide written notice to a student's parent if machine grading, including
        artificial intelligence or computer software, is used to score a constructed response provided
        by a student as part of an assessment instrument administered under this section.
  - type: regulates-ai-assessment
    description: Parents may request traditional rescoring of machine-graded responses for students who
      did not perform satisfactorily.
    citation:
      source_url: https://capitol.texas.gov/tlodocs/89R/billtext/html/HB04390I.htm
      locator: Sec. 39.023(r)
      quote: that portion of the student's assessment instrument must be rescored using a traditional
        scoring method that does not include machine grading, at no cost to the parent.
