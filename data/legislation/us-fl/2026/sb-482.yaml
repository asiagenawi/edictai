id: us-fl-2026-sb-482
jurisdiction: us-fl
session: "2026"
identifier: SB 482
title: Artificial Intelligence Bill of Rights
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - student-privacy
summary: Bars school districts, public and private schools, and VPK providers from giving students access
  to artificial intelligence instructional tools before grade 6 except under school personnel supervision
  or for English learner or disability supports. Requires notice to parents before students receive access,
  a parental opt-out with an alternative activity, and operator-provided parental access to student account
  information.
provisions:
  - type: limits-ai-instructional-use
    description: Educational entities may not give students access to AI instructional tools before grade
      6, with exceptions for supervised use, English learner support, and disability accommodations.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/482/BillText/e1/HTML
      locator: Section 12, new s. 1006.1495(2)
      quote: 'An educational entity may not provide students with access to an artificial intelligence
        instructional tool before grade 6 unless such use is: (a) Directed and supervised by school personnel;'
  - type: requires-disclosure
    description: Before a student gets access credentials, the educational entity must give the parent
      notice identifying the tool and its educational purpose.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/482/BillText/e1/HTML
      locator: Section 12, new s. 1006.1495(3)
      quote: 'Before a student is provided access credentials for an artificial intelligence instructional
        tool, the educational entity must provide the parent of a minor student with notice that: (a)
        Identifies the tool and its educational purpose;'
  - type: requires-disclosure
    description: Parents must be offered an opt-out of their student's use of an AI instructional tool.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/482/BillText/e1/HTML
      locator: Section 12, new s. 1006.1495(4)(a)
      quote: A parent of a minor student must be provided the opportunity to opt out of the student’s
        use of an artificial intelligence instructional tool.
