summary: Requires mathematics pathways and applied algebra courses, and requires the Department of Education
  to collaborate with the Lastinger Center for Learning to recommend an individualized, adaptive artificial
  intelligence tool for K-12 mathematics instruction, evaluating alignment to standards, diagnostics,
  teacher professional development, student data privacy, and costs, by December 1, 2026.
provisions:
  - type: creates-task-force
    description: The Department and the Lastinger Center must recommend an adaptive AI tool for K-12 math
      instruction.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/920/BillText/Filed/HTML
      locator: Sec. 3(1)
      quote: The Department of Education shall collaborate with the Lastinger Center for Learning at the
        University of Florida to recommend to the Legislature an individualized, adaptive artificial intelligence
        tool to support mathematics instruction in kindergarten through grade 12.
  - type: procurement-standards
    description: Recommendations must provide for student data privacy and transparency in data collection
      and retention.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/920/BillText/Filed/HTML
      locator: Sec. 3(1)(e)
      quote: Provide for student data privacy and transparency in data collection and retention.
