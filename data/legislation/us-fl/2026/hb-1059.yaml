identifier: HB 1059
title: Speech and Debate Education
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - funding
summary: As introduced, would have required an Institute for Speech and Debate Innovation within the Florida
  Virtual School to create artificial intelligence-based coaching tools, digital judging tutorials, and
  analytics dashboards for speech and debate instruction, and appropriated $750,000 to support the institute.
  The AI provisions were removed by amendment.
provisions:
  - type: appropriates-funding
    description: Appropriates $750,000 in recurring funds to the Florida Virtual School institute that
      is directed to create AI-based coaching tools.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1059/BillText/Filed/PDF
      locator: Introduced, Section 5(4)
      quote: (4) For the 2026-2027 fiscal year, the sum of $750,000 in recurring funds is appropriated
        from the General Revenue Fund to the Florida Virtual School Institute for Speech and Debate Innovation
        for the purposes of this act.
