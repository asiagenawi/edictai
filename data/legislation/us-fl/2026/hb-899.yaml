summary: Creates the Task Force on Artificial Intelligence in Public Postsecondary Education, adjunct
  to the Department of Education, to review AI in instruction, research, and student conduct in the State
  University System and Florida College System, examine academic integrity, privacy, and faculty training
  needs, recommend model institutional policies, and report by December 1, 2026.
provisions:
  - type: creates-task-force
    description: Creates a task force to review AI opportunities, risks, and best practices in public
      higher education.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/899/BillText/Filed/PDF
      locator: Sec. 1(1)
      quote: to review and make recommendations on the opportunities, risks, and best practices presented
        by artificial intelligence in academic instruction, research, and student conduct within the State
        University System and Florida College System
  - type: issues-model-policy
    description: The task force must recommend model policies for institutions on ethical and effective
      AI use.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/899/BillText/Filed/PDF
      locator: Sec. 1(3)(g)
      quote: Recommend model policies for institutions to adopt regarding the ethical and effective use
        of artificial intelligence.
