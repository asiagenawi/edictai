summary: An education bill that, among many provisions, requires the Department of Education to collaborate
  with the Lastinger Center for Learning to recommend individualized, adaptive artificial intelligence
  tools to support K-12 mathematics instruction, and allows reserved Title I funds to support STEM learning
  technologies including AI.
provisions:
  - type: creates-task-force
    description: The Department and the Lastinger Center must recommend adaptive AI tools for K-12 math
      instruction to the Legislature.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/7036/BillText/c2/HTML
      locator: Sec. 29(1)
      quote: The Department of Education shall collaborate with the Lastinger Center for Learning at the
        University of Florida to recommend to the Legislature individualized, adaptive artificial intelligence
        tools to support mathematics instruction in grades K-12.
  - type: appropriates-funding
    description: Reserved Title I funds may support STEM curricula and technologies including AI in Title
      I schools.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/7036/BillText/c2/HTML
      locator: Sec. 23
      quote: related learning technologies that support academic achievement in science, technology, engineering,
        and mathematics in Title I schools, including, but not limited to, technologies related to drones,
        coding, animation, artificial intelligence
