summary: An administrative efficiency bill for public schools that, among many provisions, addresses use
  of reserved Title I funds for STEM curricula and learning technologies in schools, including technologies
  related to artificial intelligence.
provisions:
  - type: appropriates-funding
    description: Reserved Title I funds may support school technologies including AI.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/320/BillText/Filed/HTML
      locator: Sec. 20
      quote: technologies related to drones, coding, animation, artificial intelligence, cybersecurity,
        data science, the engineering design process, mobile development, and robotics.
