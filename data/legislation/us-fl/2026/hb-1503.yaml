id: us-fl-2026-hb-1503
jurisdiction: us-fl
session: "2026"
identifier: HB 1503
title: Computer Science Education and Certification
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - curriculum-standards
  - educator-training
summary: Requires statewide general education core courses that integrate technology to include instruction
  on applying artificial intelligence tools, requires high school computer science courses offered to
  students to include instruction on artificial intelligence, and directs the State Board of Education
  to establish grade-band computer science teacher subject area coverages.
provisions:
  - type: requires-ai-literacy-instruction
    description: General education core courses that integrate technology must include instruction on
      applying AI tools.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1503/BillText/c2/PDF
      locator: Sec. 1, new 1007.25(3)(e)
      quote: General education core courses that integrate the use of technology must provide students
        with opportunities to improve digital literacy and competency, instruction on the application
        of artificial intelligence tools to the course
  - type: requires-ai-literacy-instruction
    description: High school computer science courses must include instruction on AI.
    education_levels:
      - k12
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1503/BillText/c2/PDF
      locator: Sec. 2, amended 1007.2616(6)
      quote: High school students must be provided opportunities to take computer science courses that
        include instruction on artificial intelligence
