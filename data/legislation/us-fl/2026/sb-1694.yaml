id: us-fl-2026-sb-1694
jurisdiction: us-fl
session: "2026"
identifier: SB 1694
title: Technology Education
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - ai-literacy
  - curriculum-standards
summary: Requires statewide general education core courses that integrate technology to include instruction
  on applying artificial intelligence tools, and provides that high school computer science courses that
  include AI instruction should give students a foundational understanding of how AI systems use data,
  their benefits, limitations, and risks, and ethical reasoning for responsible use.
provisions:
  - type: requires-ai-literacy-instruction
    description: General education core courses that integrate technology must include instruction on
      applying AI tools.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1694/BillText/c1/HTML
      locator: Sec. 1, new 1007.25(3)(e)
      quote: General education core courses that integrate the use of technology must provide students
        with opportunities to improve digital literacy and competency, instruction on the application
        of artificial intelligence tools to the course
  - type: ai-in-standards
    description: High school computer science courses with AI instruction should cover how AI uses data,
      its limits and risks, and ethical use.
    education_levels:
      - k12
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1694/BillText/c1/HTML
      locator: Sec. 2, amended 1007.2616(6)
      quote: Computer science courses that include instruction in artificial intelligence should provide
        students with a foundational understanding of artificial intelligence to critically evaluate how
        artificial intelligence systems use data to present information
