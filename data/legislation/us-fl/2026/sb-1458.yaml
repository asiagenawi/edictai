  - instructional-use
  - educator-training
  - student-privacy
summary: Creates the Artificial Intelligence in Higher Education Study Group to review AI in instruction,
  research, and student conduct in the State University System and Florida College System, examine academic
  integrity, privacy, and faculty training needs, recommend model institutional policies, and report by
  December 1, 2026.
provisions:
  - type: creates-task-force
    description: Creates a study group on AI opportunities, risks, and best practices in public higher
      education.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1458/BillText/Filed/HTML
      locator: Sec. 1(1)
      quote: There is created the Artificial Intelligence in Higher Education Study Group to review and
        make recommendations on the opportunities and risks presented by, and best practices for managing,
        artificial intelligence in academic instruction, research, and student conduct
  - type: issues-model-policy
    description: The study group must recommend model policies for institutions on AI use.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1458/BillText/Filed/HTML
      locator: Sec. 1(3)(g)
      quote: Recommend model policies for institutions to adopt regarding the ethical and effective use
        of artificial intelligence.
