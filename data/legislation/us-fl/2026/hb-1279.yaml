identifier: HB 1279
title: Education
classification: bill
education_levels:
  - k12
topics:
  - funding
summary: An education bill that, among many provisions, allows a district to reserve up to 1 percent of
  Title I funds for eligible schools to provide STEM curricula, instructional materials, and related learning
  technologies, including technologies related to artificial intelligence, in Title I schools.
provisions:
  - type: appropriates-funding
    description: Up to 1 percent of Title I funds may be reserved for STEM curricula and technologies,
      including AI, in Title I schools.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026/1279/BillText/er/PDF
      locator: Sec. 31
      quote: related learning technologies that support academic achievement in science, technology, engineering,
        and mathematics in Title I schools, including, but not limited to, technologies related to drones,
        coding, animation, artificial intelligence
