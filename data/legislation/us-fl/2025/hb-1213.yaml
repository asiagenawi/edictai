id: us-fl-2025-hb-1213
jurisdiction: us-fl
session: "2025"
identifier: HB 1213
title: K-12 School Route Optimization Pilot Program
classification: bill
education_levels:
  - k12
topics:
  - institutional-operations
summary: Creates a K-12 school route optimization pilot program in five county school districts that must
  use their transportation management systems with a student transportation intelligence platform with
  artificial intelligence, if available, to evaluate routing scenarios, and report costs and savings associated
  with the use of AI; the Department of Education assists and reports to the Legislature.
