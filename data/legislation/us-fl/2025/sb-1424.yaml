identifier: SB 1424
title: K-12 School Transportation
classification: bill
education_levels:
  - k12
topics:
  - institutional-operations
summary: Requires school districts to provide transportation to K-12 students living more than 1 mile
  from school, sets bus stop and route requirements, and requires district school boards to use artificial
  intelligence routing programs, if available, within 3 years, with a 15 percent transportation funding
  reduction for noncompliance.
