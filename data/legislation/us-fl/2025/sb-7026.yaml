identifier: SB 7026
title: Information Technology
classification: bill
education_levels:
  - k12
topics:
  - task-force
summary: Reorganizes state information technology governance and moves the Government Technology Modernization
  Council into the new agency, amending the council's duties, which include studying artificial intelligence
  in state government and evaluating the need for curriculum to prepare school age audiences with digital
  media and visual literacy skills.
provisions:
  - type: creates-task-force
    description: As amended, the council must evaluate the need for curriculum to prepare school age audiences
      with digital media and visual literacy skills.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2025/7026/BillText/Filed/HTML
      locator: Section 28, s. 282.802(7)(g)
      quote: (g) Evaluate the need for curriculum to prepare school age audiences with the digital media
        and visual literacy skills needed to navigate the digital information landscape.
