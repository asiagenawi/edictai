session: "2025"
identifier: SB 166
title: Administrative Efficiency in Public Schools
classification: bill
education_levels:
  - k12
topics:
  - funding
summary: An administrative efficiency bill for public schools that, among many provisions, lets school
  districts withhold Title I funds for eligible schools to provide STEM curricula, instructional materials,
  and learning technologies, including technologies related to artificial intelligence.
provisions:
  - type: appropriates-funding
    description: Title I funds withheld by districts may support STEM curricula and technologies including
      AI in Title I schools.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2025/166/BillText/e1/HTML
      locator: Section 29, s. 1011.69(4)(a)5.
      quote: in Title I schools, including, but not limited to, technologies related to drones, coding,
        animation, artificial intelligence, cybersecurity, data science, the engineering design process,
        mobile development, and robotics.
