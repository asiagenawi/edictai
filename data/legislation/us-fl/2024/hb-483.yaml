topics:
  - task-force
  - workforce
  - curriculum-standards
summary: Creates an AI in Education Task Force within the Department of Education, chaired by the Commissioner
  of Education, to evaluate AI applications in K-12 and higher education, assess ethical, legal, and data
  privacy implications, identify AI workforce needs, and recommend policy; also requires a statewide computer
  science education strategic plan, with computer science defined to include AI and machine learning.
provisions:
  - type: creates-task-force
    description: Establishes a task force to evaluate AI uses in K-12 and higher education and recommend
      policy for students and educators.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/483/BillText/c1/PDF
      locator: Sec. 1, new 1003.4202(1)(a)
      quote: force is to evaluate the potential applications of artificial intelligence in K-12 and higher
        education and to develop policy recommendations for responsible and effective uses of artificial
        intelligence by students and educators
