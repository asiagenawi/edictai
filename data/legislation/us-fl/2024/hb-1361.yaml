summary: An education act that, among other changes, amended Florida's digital learning statute to let school districts receive grant funds for subscription fees and professional learning for an artificial intelligence platform that supports students in grades 6-12. Platforms bought with the grants must meet listed requirements, including one-on-one tutoring aligned to state reading and math standards, teacher professional learning, and parental access to students' AI interactions.
provisions:
  - type: appropriates-funding
    description: Allows school districts to receive grant funds for AI platform subscription fees and professional learning to support students in grades 6 through 12 during the school day.
    education_levels:
      - k12
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/1361/BillText/er/PDF
      locator: Section 1, amending s. 1002.321(3), F.S., lines 64-70
      quote: A school district may receive grant funds for subscription fees and professional learning to support and accelerate learning for students in grades 6 through 12 during the school day.
  - type: procurement-standards
    description: Requires grant recipients to select an AI platform that uses a closed-system large language model, provides teacher professional learning, standards-aligned tutoring and lesson plans, and district, school, and parental reporting.
    education_levels:
      - k12
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/1361/BillText/er/PDF
      locator: Section 1, amending s. 1002.321(3)(a)-(e), F.S., lines 70-81
      quote: 'Grant recipients must select an artificial intelligence platform that: (a) Uses large language models based on GPT-4, its equivalent, or a successor, and is on a closed system. (b) Provides professional learning to teachers.'
  - type: requires-disclosure
    description: Requires the AI platform to give parents access to students' AI interactions.
    education_levels:
      - k12
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/1361/BillText/er/PDF
      locator: Section 1, amending s. 1002.321(3)(e), F.S., lines 80-81
      quote: (e) Provides district and school-level reporting and parental access to artificial intelligence interactions.
