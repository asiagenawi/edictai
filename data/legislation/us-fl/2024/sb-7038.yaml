summary: Authorizes school districts to receive grant funds for AI platform subscriptions and professional
  learning to support learning for students in grades 6 through 12, and requires grant recipients to select
  a closed-system platform that provides teacher professional learning, standards-aligned tutoring and
  lesson plans, and district, school, and parental access to AI interactions; also makes other education
  changes.
provisions:
  - type: appropriates-funding
    description: School districts may receive grants for AI platform subscriptions and professional learning
      for grades 6-12.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/7038/BillText/c1/HTML
      locator: Sec. 1, amended 1002.321(3)
      quote: A school district may receive grant funds for subscription fees and professional learning
        to support and accelerate learning for students in grades 6 through 12 during the school day.
  - type: procurement-standards
    description: Grant recipients must select an AI platform that uses a closed-system large language
      model.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/7038/BillText/c1/HTML
      locator: Sec. 1, amended 1002.321(3)(a)
      quote: 'Grant recipients must select an artificial intelligence platform that: (a) Uses large language
        models based on GPT-4, its equivalent, or a successor, and is on a closed system.'
  - type: requires-disclosure
    description: The selected platform must give district, school, and parental access to AI interactions.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/7038/BillText/c1/HTML
      locator: Sec. 1, amended 1002.321(3)(e)
      quote: Provides district and school-level reporting and parental access to artificial intelligence
        interactions.
