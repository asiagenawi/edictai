identifier: SB 1680
title: Advanced Technology
classification: bill
education_levels:
  - k12
topics:
  - task-force
summary: Creates the Government Technology Modernization Council, which must study artificial intelligence
  in state government, AI safety standards, and misuse of AI, and evaluate the need for curriculum to
  prepare school-age audiences with digital media and visual literacy skills.
provisions:
  - type: creates-task-force
    description: The council must evaluate the need for curriculum to prepare school-age audiences with
      digital media and visual literacy skills.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2024/1680/BillText/er/HTML
      locator: Section 1, new s. 282.802(7)(a)7.
      quote: Evaluate the need for curriculum to prepare school-age audiences with the digital media and
        visual literacy skills needed to navigate the digital information landscape.
