topics:
  - workforce
summary: As amended in committee, would have created the Institute for Risk Management and Insurance Education
  at the University of Central Florida, with goals that include programs integrating technology and artificial
  intelligence to prepare students for the insurance industry. The enrolled bill addresses charter school
  capital outlay funding. The AI provisions were removed by amendment.
provisions:
  - type: ai-workforce-program
    description: The institute's goals include offering programs, workshops, and applied research that
      integrate technology and AI while preparing students for the insurance industry.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2023/1259/BillText/c1/PDF
      locator: Comm Sub, Section 3, new s. 1004.3841, goal (6)
      quote: (6) Offer programs, workshops, case studies, and applied research studies that integrate
        technology and artificial intelligence with soft skills while preparing students and professionals
        for the technology-enabled insurance industry of the future.
