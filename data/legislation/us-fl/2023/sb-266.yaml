id: us-fl-2023-sb-266
jurisdiction: us-fl
session: "2023"
identifier: SB 266
title: Higher Education
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
summary: Creates the Institute for Risk Management and Insurance Education at the University of Central
  Florida, whose goals include offering programs, workshops, and applied research that integrate technology
  and artificial intelligence while preparing students for the insurance industry. The bill also makes
  other changes to postsecondary education law.
provisions:
  - type: ai-workforce-program
    description: The institute's goals include offering programs, workshops, and applied research that
      integrate technology and AI while preparing students for the insurance industry.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2023/266/BillText/er/HTML
      locator: Section 5, new s. 1004.3841, goal (6)
      quote: (6) Offer programs, workshops, case studies, and applied research studies that integrate
        technology and artificial intelligence with soft skills while preparing students and professionals
        for the technology-enabled insurance industry of the future.
