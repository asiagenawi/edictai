identifier: SB 2
title: Artificial Intelligence Bill of Rights
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - student-privacy
  - safety-wellbeing
summary: Creates an Artificial Intelligence Bill of Rights and restricts government AI contracts; among
  other provisions, bars educational entities from giving students access to AI instructional tools before
  grade 6 except when supervised or for English learner or disability supports, and requires parental
  notice, a parental opt-out with an alternative activity, and parental access to student AI tool accounts,
  with private schools also required to comply.
provisions:
  - type: limits-ai-instructional-use
    description: Educational entities may not give students access to AI instructional tools before grade
      6, with limited exceptions.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026D/2D/BillText/Filed/HTML
      locator: Sec. 12, new 1006.1495(2)
      quote: 'An educational entity may not provide students with access to an artificial intelligence
        instructional tool before grade 6 unless such use is: (a) Directed and supervised by school personnel'
  - type: requires-disclosure
    description: Before giving a student access credentials, the entity must notify parents identifying
      the tool and its purpose.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026D/2D/BillText/Filed/HTML
      locator: Sec. 12, new 1006.1495(3)
      quote: 'Before a student is provided access credentials for an artificial intelligence instructional
        tool, the educational entity must provide the parent of a minor student with notice that: (a)
        Identifies the tool and its educational purpose'
  - type: requires-disclosure
    description: Parents must be given the opportunity to opt their child out of AI instructional tool
      use.
    citation:
      source_url: https://www.flsenate.gov/Session/Bill/2026D/2D/BillText/Filed/HTML
      locator: Sec. 12, new 1006.1495(4)(a)
      quote: A parent of a minor student must be provided the opportunity to opt out of the student's
        use of an artificial intelligence instructional tool.
