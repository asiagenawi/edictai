summary: Enacts the Consumer Protections in Interactions with Artificial Intelligence Systems Act, prohibiting
  algorithmic discrimination by high-risk AI systems and setting duties for developers and deployers.
  High-risk systems include those that make or substantially factor into consequential decisions on education
  enrollment or education opportunities.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential decisions, subject to algorithmic discrimination rules, to include
      education enrollment and education opportunities.
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/prever/963_20260226.htm
      locator: Section 37-31-10
      quote: '"Consequential decision" means a decision that has a material legal or similarly significant
        effect on the provision or denial to any consumer of, or the cost or terms of: (a) education enrollment
        or an education opportunity;'
