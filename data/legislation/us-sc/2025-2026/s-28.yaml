id: us-sc-2025-2026-s-28
jurisdiction: us-sc
session: 2025-2026
identifier: S 28
title: AI Child Abuse
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
summary: Creates the offense of producing, distributing, soliciting, or possessing obscene visual depictions
  of minors, including computer-generated images, without requiring that the minor depicted actually exists,
  and adds it to the sex offender registry. Directs the State Department of Education, with state law
  enforcement and the Attorney General, to develop and implement a policy to educate and notify students
  of the act, and to report on it by July 1, 2026.
provisions:
  - type: addresses-deepfakes
    description: Directs the State Department of Education, with law enforcement and the Attorney General,
      to adopt a policy to educate and notify students about the new offense.
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/prever/28_20250508.htm
      locator: SECTION 4
      quote: The State Department of Education, the South Carolina Law Enforcement Division, and the Attorney
        General's Office, as appropriate, shall develop and implement a policy to educate and notify students
        of the provision of this act.
