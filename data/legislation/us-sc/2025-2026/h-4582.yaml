id: us-sc-2025-2026-h-4582
jurisdiction: us-sc
session: 2025-2026
identifier: H 4582
title: Artificial Intelligence Electives
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - educator-training
  - curriculum-standards
summary: Allows school districts, beginning in 2026-2027, to provide age-appropriate instruction on how
  to access, use and critically evaluate artificial intelligence tools. Directs the Department of Education
  to issue guidance on that instruction and, subject to funding, to provide professional development in
  AI education for educators.
provisions:
  - type: requires-ai-literacy-instruction
    description: Permits school districts to provide age-appropriate instruction on accessing, using and
      evaluating AI tools, aligned with department guidance.
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/prever/4582_20251217.htm
      locator: Section 59-59-260(A)
      quote: each school district may provide age-appropriate instruction to students on how to access,
        utilize, and critically evaluate various artificial intelligence tools within the curriculum taught
        by the educator.
  - type: issues-model-policy
    description: Directs the Department of Education to issue guidance to districts on implementing AI
      instruction.
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/prever/4582_20251217.htm
      locator: Section 59-59-260(B)
      quote: The Department of Education shall issue guidance to school districts on how to implement
        the provisions of subsection (A).
  - type: educator-pd-requirement
    description: Directs the Department of Education, subject to funding, to provide AI professional development
      for educators.
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/prever/4582_20251217.htm
      locator: Section 59-59-260(C)
      quote: Subject to available funding, the Department of Education shall provide a professional development
        program in artificial intelligence education for educators.
