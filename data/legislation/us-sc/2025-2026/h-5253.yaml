id: us-sc-2025-2026-h-5253
jurisdiction: us-sc
session: 2025-2026
identifier: H. 5253
title: Ai in education
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - student-privacy
  - data-governance
  - academic-integrity
  - local-policy-requirement
  - employment-evaluation
summary: >-
  Would add Section 59-28-195 to the South Carolina Code to require written opt-in parental
  consent before students use AI in instruction, annual disclosure of AI tools and data
  practices, teacher review of AI-generated content, and limits on student data collection and
  commercial use. It would bar AI from replacing licensed teachers in core instruction or final
  grading and from automated discipline or placement decisions without human review, and would
  let parents seek injunctive relief or damages.
provisions:
  - type: requires-disclosure
    description: Would require written opt-in parental consent before a student uses AI in instruction and an annual written disclosure of AI tools, vendors, and student data practices.
    education_levels:
      - k12
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/bills/5253.htm
      locator: Sec. 59-28-195(B)(1)-(2)
      quote: A school entity shall not require or permit a student to use artificial intelligence or generative artificial intelligence as part of instruction or school-sponsored activities without first obtaining written, opt-in parental consent.
  - type: prohibits-ai-replacing-educators
    description: Would bar AI from replacing a licensed teacher in core academic instruction or assigning final grades.
    education_levels:
      - k12
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/bills/5253.htm
      locator: Sec. 59-28-195(C)(1)
      quote: Artificial intelligence shall not replace a licensed teacher in providing core academic instruction or assigning final grades.
  - type: restricts-student-data-use
    description: Would limit AI systems to the minimum necessary student data, bar sale or commercial use of that data, require deletion, and require parental consent for biometric data collection.
    education_levels:
      - k12
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/bills/5253.htm
      locator: Sec. 59-28-195(D)
      quote: may not be sold, shared, licensed, or used for commercial advertising or profiling
  - type: academic-integrity-rules
    description: Would require school entities to adopt policies on student use of generative AI for coursework and bar its use on graded assignments unless a teacher expressly authorizes it.
    education_levels:
      - k12
    citation:
      source_url: https://www.scstatehouse.gov/sess126_2025-2026/bills/5253.htm
      locator: Sec. 59-28-195(E)
      quote: Students may not use generative artificial intelligence to complete graded assignments unless expressly authorized by a teacher for a defined instructional purpose.
