identifier: HB 2612
title: Establishes an educational technology impact advisory council to review the use of technology in
  schools
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - instructional-use
summary: Directs the Missouri commissioner of education to establish an educational technology impact
  advisory council of educators, parents, and specialists to review best practices in the use of technology
  in instruction, including the inclusion of artificial intelligence. The council must submit and periodically
  update recommendations and policy proposals to the State Board of Education and legislative education
  committees.
provisions:
  - type: creates-task-force
    description: Creates an advisory council that must review technology use in instruction, including
      AI.
