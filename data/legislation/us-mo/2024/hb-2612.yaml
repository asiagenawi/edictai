      source_url: https://documents.house.mo.gov/billtracking/bills241/hlrbillspdf/5424H.02C.pdf
      locator: Section 186.095.3(1)(e)
      quote: (d) Impacts on early childhood brain development, including reading and writing skills; (e)
        The inclusion of artificial intelligence;
