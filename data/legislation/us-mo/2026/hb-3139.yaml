id: us-mo-2026-hb-3139
jurisdiction: us-mo
session: "2026"
identifier: HB 3139
title: Establishes additional requirements for computer science courses in schools
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: Amends Missouri's computer science course law to define computer science courses to include artificial
  intelligence, cybersecurity, and social media training. Requires the computer science work group to
  develop additional academic performance standards incorporating artificial intelligence, to be adopted
  by the State Board of Education beginning in the 2027-28 school year.
provisions:
  - type: ai-in-standards
    description: Requires additional computer science performance standards incorporating artificial intelligence.
    citation:
      source_url: https://documents.house.mo.gov/billtracking/bills261/hlrbillspdf/6915H.01I.pdf
      locator: Section 170.018.8(1)
      quote: The workgroup established under subsection 2 of this section shall develop additional academic
        performance standards for computer science courses that incorporate academic requirements related
        to cybersecurity, social media training, and artificial intelligence.
  - type: ai-in-standards
    description: Adds artificial intelligence to the definition of a computer science course.
    citation:
      source_url: https://documents.house.mo.gov/billtracking/bills261/hlrbillspdf/6915H.01I.pdf
      locator: Section 170.018.1(1)
      quote: algorithmic processes, cybersecurity, social media training, and artificial intelligence
        including their principles, hardware and software designs,
