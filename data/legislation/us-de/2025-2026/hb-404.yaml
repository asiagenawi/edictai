id: us-de-2025-2026-hb-404
jurisdiction: us-de
session: 2025-2026
identifier: HB 404
title: An Act To Amend Title 14 Of The Delaware Code Relating To The Artificial Intelligence And Extended
  Reality In Schools Pilot Program.
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - procurement
  - funding
  - student-privacy
summary: Establishes a three-year Artificial Intelligence and Extended Reality in Schools Pilot Program
  in which the Department of Education funds and supports 6 to 12 selected schools to procure and implement
  AI and XR products, forms a committee to study best practices and recommend products that safeguard
  student and educator data, and finalizes contracts with state technology and legal staff.
provisions:
  - type: appropriates-funding
    description: The Department must establish and fund a pilot program helping schools procure and implement
      AI and XR products.
    citation:
      source_url: https://legis.delaware.gov/json/BillDetail/GenerateHtmlDocument?legislationId=143513&legislationTypeId=6&docTypeId=2&legislationName=HS1forHB404
      locator: Sec. 1, new 4902(a)
      quote: The Department, in collaboration with local education agencies, shall establish and administer
        the Artificial Intelligence and Extended Reality in Schools Pilot Program to help schools procure
        and safely implement AI and XR products that improve student outcomes and engagement
  - type: procurement-standards
    description: A committee must recommend AI and XR products that safeguard student and educator information
      and follow privacy and security guidelines.
    citation:
      source_url: https://legis.delaware.gov/json/BillDetail/GenerateHtmlDocument?legislationId=143513&legislationTypeId=6&docTypeId=2&legislationName=HS1forHB404
      locator: Sec. 1, new 4902(b)(2)b.
      quote: The recommended AI and XR products must safeguard student and educator information, including
        taking measures to prevent data breach, and follow state and federal guidelines for security and
        privacy.
