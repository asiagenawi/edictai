id: us-me-2025-2026-ld-2052
jurisdiction: us-me
session: 2025-2026
identifier: LD 2052
title: Resolve, to Study the Use of Technology in Classrooms and Study Safeguards Related to Its Use
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - instructional-use
  - assessment
  - employment-evaluation
  - safety-wellbeing
summary: Directs the Maine Education Policy Research Institute to survey schools on classroom technology
  use and safeguards, including policies on generative and conversational artificial intelligence and
  on AI use in grading and teacher evaluations. The Institute must gather guidance on safe instructional
  technology and report recommendations by December 1, 2026.
provisions:
  - type: creates-task-force
    description: Requires a survey of school policies on generative and conversational AI in classrooms.
    citation:
      source_url: https://legislature.maine.gov/legis/bills/getPDF.asp?paper=HP1376&item=3&snum=132
      locator: Sec. 2(3)
      quote: The policies regarding allowed use or prohibition of gamification, leader boards, push notification
        alerts, advertising, geolocation, generative and conversational artificial intelligence,
  - type: creates-task-force
    description: Requires the survey to cover policies prohibiting AI use in grading and teacher evaluations.
    citation:
      source_url: https://legislature.maine.gov/legis/bills/getPDF.asp?paper=HP1376&item=3&snum=132
      locator: Sec. 2(7)
      quote: The policies in place for prohibiting artificial intelligence use in grading, teacher evaluations
        and any other education or administrative areas;
