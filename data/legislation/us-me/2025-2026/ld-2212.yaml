id: us-me-2025-2026-ld-2212
jurisdiction: us-me
session: 2025-2026
identifier: LD 2212
title: An Act Making Supplemental Appropriations and Allocations from the General Fund and Other Funds
  for the Expenditures of State Government and Changing Certain Provisions of the Law Necessary to the
  Proper Operations of State Government for the Fiscal Years Ending June 30, 2026 and June 30, 2027
classification: bill
education_levels:
  - k12
topics:
  - funding
  - educator-training
  - instructional-use
summary: Makes supplemental appropriations for Maine state government for fiscal years 2026 and 2027.
  Includes one-time funding for the Department of Education to expand its artificial intelligence guidance
  toolkit and provide grants for AI professional development or planning for educators.
provisions:
  - type: appropriates-funding
    description: Funds expansion of the Department of Education's AI guidance toolkit and grants for educator
      AI professional development.
    citation:
      source_url: https://legislature.maine.gov/legis/bills/getPDF.asp?paper=HP1491&item=37&snum=132
      locator: Innovative Teaching and Learning Z394 initiative [Page 32]
      quote: to provide grants to school administrative units, nonprofits, universities and professional
        organizations that provide professional development or planning to educators related to artificial
        intelligence.
sponsors:
  - name: Andrew Gattine
    primary: true
    party: D
    chamber: lower
