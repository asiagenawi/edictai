id: us-me-2025-2026-ld-643
jurisdiction: us-me
session: 2025-2026
identifier: LD 643
title: Resolve, to Study the Effects of Artificial Intelligence, Cellular Telephones and Social Media
  on Public Education
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - instructional-use
summary: Directs the Maine Department of Education to establish a working group to study and make recommendations
  on the use of artificial intelligence, cellular telephones, and social media in public school settings.
  The working group must report findings and suggested legislation by December 3, 2025.
provisions:
  - type: creates-task-force
    description: Directs the Department of Education to establish a working group on AI, cell phones,
      and social media in public schools.
    citation:
      source_url: https://legislature.maine.gov/legis/bills/getPDF.asp?paper=HP0411&item=1&snum=132
      locator: Sec. 1
      quote: the Department of Education shall establish a working group to study and make recommendations
        regarding the use of artificial intelligence, cellular telephones and social media within public
        school settings.
