id: us-me-2023-2024-ld-1977
jurisdiction: us-me
session: 2023-2024
identifier: LD 1977
title: An Act to Enact the Maine Data Privacy and Protection Act
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Enacts a comprehensive data privacy law that includes requirements for covered algorithms using
  artificial intelligence techniques. Large covered entities must conduct annual impact assessments that
  describe steps to mitigate harms, including in determining access to education opportunities.
provisions:
  - type: bias-or-equity-requirement
    description: Requires algorithm impact assessments to describe mitigation of harms in determining
      access to education, among other opportunities.
    citation:
      source_url: https://legislature.maine.gov/legis/bills/getPDF.asp?paper=HP1270&item=1&snum=131
      locator: §9615(1)(F)(2)
      quote: Making or facilitating advertising for, determining access to or restrictions on the use
        of housing, education, employment, healthcare, insurance or credit opportunities;
