id: us-va-2025-sb-1214
jurisdiction: us-va
session: "2025"
identifier: SB 1214
title: High-risk artificial intelligence; development, deployment, and use by public bodies, report.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: Sets requirements for state public bodies that develop, deploy, or integrate high-risk artificial
  intelligence systems used in consequential decisions, defined to include education enrollment or an
  education opportunity, including documentation, acceptable use policies, and measures against algorithmic
  discrimination, and directs the Chief Information Officer to adopt related policies.
provisions:
  - type: bias-or-equity-requirement
    description: Covers high-risk AI used by public bodies in consequential decisions, including education
      enrollment or opportunity, and requires measures against algorithmic discrimination.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20251/SB1214/text/SB1214S2
      locator: Definitions, "consequential decision"
      quote: effect on the provision or denial to any consumer of, or the cost or terms of, (i) education
        enrollment or an education opportunity
