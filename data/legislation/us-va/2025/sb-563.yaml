id: us-va-2025-sb-563
jurisdiction: us-va
session: "2025"
identifier: SB 563
title: Regional career and technical education program; establishing in Planning District 2.
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
summary: As prefiled, would revise high school graduation requirements and dual and concurrent enrollment
  provisions and direct the Board of Education to develop guidelines on how computer science and artificial
  intelligence courses can satisfy graduation requirements. The committee substitute instead directs the
  Department of Education, with the Virginia Community College System, to study a regional career and
  technical education program in Planning District 2. The AI provisions were removed by amendment.
provisions:
  - type: ai-course-or-graduation-requirement
    description: As prefiled, the Board of Education would develop guidelines on how computer science
      and AI courses can satisfy graduation requirements.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20251/SB563/text/SB563
      locator: Prefiled, §22.1-253.13:4, item 14
      quote: The Board shall develop guidelines addressing how computer science and artificial intelligence
        courses can satisfy graduation requirements.
