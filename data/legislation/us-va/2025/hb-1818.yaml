id: us-va-2025-hb-1818
jurisdiction: us-va
session: "2025"
identifier: HB 1818
title: School Safety Firearm Detection Software Pilot Program; established.
classification: bill
education_levels:
  - k12
topics:
  - funding
  - safety-wellbeing
  - institutional-operations
summary: Adds firearm detection software that uses artificial intelligence to analyze school surveillance
  video to the security equipment eligible for state school security grants, and creates the School Safety
  Firearm Detection Software Pilot Program prioritizing Title 1 schools, with annual reporting on the
  program's efficacy.
provisions:
  - type: appropriates-funding
    description: Creates a grant pilot program for school divisions to buy firearm detection software
      that uses AI to analyze surveillance video.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20251/HB1818/text/HB1818
      locator: Sec. 22.1-280.2:2.1(A)
      quote: uses artificial intelligence to analyze video streams from surveillance cameras in real time
        for the detection of firearms and, upon detecting a firearm, immediately notifies local law enforcement,
        school security personnel, the school administration
