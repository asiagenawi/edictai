summary: Establishes the Virginia Education and Workforce Data Governing Board and a supporting office
  to govern the state's education and workforce data ecosystem, including advisory recommendations on
  emerging technologies such as artificial intelligence and a data system with machine learning and predictive
  analytics capabilities for longitudinal student data.
provisions:
  - type: creates-task-force
    description: The board must appoint an advisory committee that recommends on data privacy, migration,
      and the use of AI in the education and workforce data ecosystem.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20251/HB2465/text/HB2465
      locator: Sec. 2.2-2014.1, subdivision 11
      quote: provide recommendations on decisions related to data privacy and security, technical aspects
        of data migration, and the use of emerging technologies such as artificial intelligence
