id: us-va-2025-hb-2094
jurisdiction: us-va
session: "2025"
identifier: HB 2094
title: High-risk artificial intelligence; definitions, development, deployment, and use, civil penalties.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: Creates requirements for developers and deployers of high-risk artificial intelligence systems
  used in consequential decisions, defined to include education enrollment or an education opportunity,
  including disclosures, impact assessments, and measures against algorithmic discrimination, enforced
  by the Attorney General with civil penalties.
provisions:
  - type: bias-or-equity-requirement
    description: Covers high-risk AI used in consequential decisions, including education enrollment or
      opportunity, and requires developers to document and mitigate algorithmic discrimination risks.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20251/HB2094/text/HB2094ER
      locator: Sec. 59.1-607 (definition of consequential decision)
      quote: effect on the provision or denial to any consumer of (i) parole, probation, a pardon, or
        any other release from incarceration or court supervision; (ii) education enrollment or an education
        opportunity
