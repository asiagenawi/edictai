jurisdiction: us-va
session: 2026-s1
identifier: HB 30
title: Budget Bill.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - funding
  - workforce
summary: Enacts the 2026-2028 budget, which includes $2,000,000 for an AI Innovation in Education Pilot
  Program administered by the Department of Education to support adoption of artificial intelligence software,
  programs, and training, and $500,000 for a pilot providing internships and apprenticeships in artificial
  intelligence, data science, and cybersecurity for Virginia Community College System students and graduates.
provisions:
  - type: appropriates-funding
    description: Funds an AI Innovation in Education Pilot Program administered by the Department of Education.
    education_levels:
      - k12
    citation:
      source_url: https://budget.lis.virginia.gov/get/budget/5311/HB30/
      locator: Department of Education item, paragraph HHH
      quote: $2,000,000 the first year from the general fund is provided to support the AI Innovation
        in Education Pilot Program. The Department shall administer the Program and develop guidelines.
        Funding may be used to support the adoption of artificial intelligence software, programs, and
        training.
  - type: ai-workforce-program
    description: Funds a pilot of AI, data science, and cybersecurity internships and apprenticeships
      for community college students and recent graduates.
    education_levels:
      - postsecondary
    citation:
      source_url: https://budget.lis.virginia.gov/get/budget/5311/HB30/
      locator: Virginia Economic Development Partnership item, paragraph S.6
      quote: to develop and implement a pilot program to provide internship and apprenticeship opportunities
        with existing Virginia businesses for at least 1,000 students and recent graduates of the Virginia
        Community College System in Artificial Intelligence, Data Science, and Cybersecurity
