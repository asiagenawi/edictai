id: us-va-2026-hj-32
jurisdiction: us-va
session: "2026"
identifier: HJ 32
title: Higher educational institutions; JLARC to study artificial intelligence use policies.
classification: joint-resolution
education_levels:
  - postsecondary
topics:
  - task-force
  - local-policy-requirement
  - academic-integrity
  - student-privacy
  - equity-access
summary: Directs the Joint Legislative Audit and Review Commission to survey and evaluate artificial intelligence
  use policies at Virginia institutions of higher education on academic integrity, data privacy, equity,
  transparency, and faculty autonomy, to develop a model AI use policy, and to recommend resources for
  a statewide clearinghouse.
provisions:
  - type: creates-task-force
    description: JLARC must study AI use policies at institutions of higher education and evaluate how
      they address integrity, privacy, equity, transparency, and faculty autonomy.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20261/HJ32/text/HJ32ER
      locator: Resolved clause
      quote: the Joint Legislative Audit and Review Commission be directed to study the artificial intelligence
        use policies in place at the institutions of higher education in the Commonwealth
  - type: issues-model-policy
    description: JLARC must develop a model AI use policy for institutions of higher education.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20261/HJ32/text/HJ32ER
      locator: Resolved clause
      quote: JLARC shall develop a model policy for AI use in institutions of higher education in the
        Commonwealth
