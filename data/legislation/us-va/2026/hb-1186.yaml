id: us-va-2026-hb-1186
jurisdiction: us-va
session: "2026"
identifier: HB 1186
title: >-
  Department of Education; artificial intelligence system use in instructional settings;
  development of AIS safety guidance required; AIS Innovation in Education Pilot Program
  established; report.
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - instructional-use
  - student-privacy
  - equity-access
  - educator-training
  - funding
summary: >-
  Requires the Virginia Department of Education to compile information on current classroom uses
  of AI and post guidance for the safe, ethical, and equitable use of AI systems in public schools,
  and requires each school board to adopt policies consistent with that guidance. Subject to
  appropriation, it also creates the AIS Innovation in Education Pilot Program to fund and evaluate
  AI pilots in school divisions, with annual reports to the legislature.
provisions:
  - type: issues-model-policy
    description: >-
      Directs the Department of Education to compile information on current AI uses in public
      schools and post guidance for the safe, ethical, and equitable use of AI systems in
      instructional settings, covering student data privacy, teacher training, transparency, data
      privacy agreements barring use of student data to train external models, bias, and access.
    education_levels:
      - k12
    citation:
      source_url: https://lis.blob.core.windows.net/files/1224761.HTML
      locator: Va. Code 22.1-20.2:1(B)
      quote: >-
        establish and post in a publicly accessible location on its website guidance for the safe,
        ethical, and equitable use of an AIS in instructional settings in public elementary and
        secondary schools
  - type: requires-local-ai-policy
    description: Requires each school board to adopt and enforce policies consistent with the department's guidance.
    education_levels:
      - k12
    citation:
      source_url: https://lis.blob.core.windows.net/files/1224761.HTML
      locator: Va. Code 22.1-20.2:1(C)
      quote: >-
        Each school board shall establish, implement, and enforce policies consistent with the
        guidance developed by the Department pursuant to subsection B.
  - type: restricts-student-data-use
    description: >-
      The guidance must address data privacy agreements that prohibit using division-level or
      student data to train or improve external AI models.
    education_levels:
      - k12
    citation:
      source_url: https://lis.blob.core.windows.net/files/1224761.HTML
      locator: Va. Code 22.1-20.2:1(B)(1)(d)
  - type: appropriates-funding
    description: >-
      Subject to appropriation, establishes the AIS Innovation in Education Pilot Program to fund
      and evaluate AI uses in school divisions, prioritizing high-poverty, rural, and
      under-resourced divisions and requiring educator professional development; the pilot
      provisions expire July 1, 2030.
    education_levels:
      - k12
    citation:
      source_url: https://lis.blob.core.windows.net/files/1224761.HTML
      locator: Va. Code 22.1-20.2:1(D); enactment clause 2
  - type: educator-pd-requirement
    description: >-
      Pilot divisions must include professional development for educators on AI literacy and
      responsible use.
    education_levels:
      - k12
    citation:
      source_url: https://lis.blob.core.windows.net/files/1224761.HTML
      locator: Va. Code 22.1-20.2:1(D)(3)
