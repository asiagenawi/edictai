    Legacy record had no sponsor or dates; added from LIS (patrons Rasoul and Maldonado; approved
    April 13, 2026, Chapter 937, effective July 1, 2026). As introduced the bill instead would have
    barred AI chatbots for certain student instructional purposes; substitutes replaced it with the
    guidance and pilot program text. Identical companion SB 394 (Chapter 943). History and text read
    from LIS public data services. No Wayback snapshot retrieved (archive unreachable at access time).
