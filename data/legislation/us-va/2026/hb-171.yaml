id: us-va-2026-hb-171
jurisdiction: us-va
session: "2026"
identifier: HB 171
title: Student instruction; Internet safety, policy to include key modern digital safety topics.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - safety-wellbeing
  - curriculum-standards
summary: Requires the internet safety component of each school division's instructional program to include
  instruction on modern digital safety topics, including online scams, misinformation, and content generated
  by artificial intelligence, and directs the Superintendent of Public Instruction to issue guidance on
  those topics.
provisions:
  - type: requires-ai-literacy-instruction
    description: School division internet safety instruction must cover content generated by AI.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20261/HB171/text/CHAP0048
      locator: Sec. 22.1-70.2(A)(v)
      quote: include a component on internet safety for students that is integrated in a division's instructional
        program that includes instruction on key modern digital safety topics, including online scams,
        misinformation, and content generated by artificial intelligence
  - type: issues-model-policy
    description: The Superintendent of Public Instruction must issue guidelines to school divisions on
      internet safety instruction, including AI-generated content.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20261/HB171/text/CHAP0048
      locator: Sec. 22.1-70.2(D)
      quote: The Superintendent of Public Instruction shall issue guidelines to school divisions regarding
        instructional programs related to internet safety that includes guidance on the topics specified
        in clause (v) of subsection A.
