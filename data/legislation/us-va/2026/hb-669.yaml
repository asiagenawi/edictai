id: us-va-2026-hb-669
jurisdiction: us-va
session: "2026"
identifier: HB 669
title: Impersonation of certain licensed professionals by chatbot; definitions, notice, civil liability.
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - employment-evaluation
summary: Bars deployers from making available an artificial intelligence system that falsely presents
  itself as a licensed professional or provides individualized professional services that would violate
  licensure laws, including the Title 22.1 provisions cited in the bill (§§ 22.1-292 and 22.1-299), and
  requires notice to users that they are interacting with an AI system. The Attorney General enforces
  the section with civil penalties.
provisions:
  - type: prohibits-ai-replacing-educators
    description: AI systems may not provide individualized services that would violate the cited Title
      22.1 licensure provisions if provided by an unlicensed person.
    citation:
      source_url: https://lis.virginia.gov/bill-details/20261/HB669/text/HB669H1
      locator: § 54.1-111.1(B)(2)
      quote: (ii) would violate the provisions of § 22.1-292, 22.1-299, 54.1-2902, or 54.1-3904; or 3.
        Engages in conduct that would constitute the unlicensed practice of a profession or occupation
        requiring licensure
