id: us-va-2024-hb-747
jurisdiction: us-va
session: "2024"
identifier: HB 747
title: Artificial Intelligence Developer Act; established, civil penalty.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: Creates operating standards for developers and deployers of high-risk artificial intelligence
  systems used to make consequential decisions, defined to include decisions affecting access to education,
  including disclosures, protection against algorithmic discrimination, and impact assessments, with Attorney
  General enforcement.
provisions:
  - type: bias-or-equity-requirement
    description: Covers high-risk AI used in consequential decisions, defined to include access to education,
      and requires developers to disclose foreseeable risks of algorithmic discrimination.
    citation:
      source_url: https://lis.virginia.gov/cgi-bin/legp604.exe?241+ful+HB747H1+hil
      locator: Sec. 59.1-603 (definition of consequential decision)
      quote: '"Consequential decision" means any decision that has a material legal, or similarly significant,
        effect on a consumer''s access to credit, criminal justice, education, employment, health care,
        housing, or insurance.'
