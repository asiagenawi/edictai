identifier: SB 385
title: Artificial intelligence technology; use in education.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - academic-integrity
  - equity-access
  - educator-training
  - ai-literacy
summary: Directs the Board of Education, with the State Council of Higher Education for Virginia, to convene
  a work group to study and recommend guidelines on AI in public schools and public higher education,
  including academic dishonesty, equity, educator training, acceptable use policies, and AI literacy,
  and to report by November 1, 2024.
provisions:
  - type: creates-task-force
    description: Requires a work group to develop recommendations for guidelines on AI use in public schools
      and public institutions of higher education.
    citation:
      source_url: https://lis.virginia.gov/cgi-bin/legp604.exe?241+ful+SB385+hil
      locator: Sec. 1
      quote: shall convene a work group for the purpose of developing recommendations for guidelines on
        the use of artificial intelligence (AI) technology in education in public schools and in public
        institutions of higher education
