id: us-va-2024-hb-1083
jurisdiction: us-va
session: "2024"
identifier: HB 1083
title: VA Longitudinal Data System & VA Workforce Data Trust; work group to review current capabilities.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - data-governance
summary: Directs the Secretary of Education to convene a work group to review the Virginia Longitudinal
  Data System and the Virginia Workforce Data Trust and develop a work plan for improving the system.
  As prefiled, would have placed administration of a Virginia Education and Workforce Longitudinal Data
  System with the Office of Education Economics and required the system to include machine learning and
  predictive analytics capabilities for analyzing student and workforce data. The AI provisions were removed
  by amendment.
provisions:
  - type: issues-model-policy
    description: Would require the statewide education and workforce longitudinal data system to include
      machine learning capabilities to analyze longitudinal student data and apply predictive analytics.
    citation:
      source_url: https://lis.virginia.gov/cgi-bin/legp604.exe?241+ful+HB1083+hil
      locator: Prefiled, new § 2.2-2238.2(E)
      quote: advanced analytics functionality, including data mining and machine learning capabilities
        to analyze the longitudinal data for program evaluation and apply predictive analytics for forecasting
        and projections into the future
