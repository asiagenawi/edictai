identifier: SB 541
title: Relating to computer science education; declaring an emergency.
classification: bill
education_levels:
  - k12
topics:
  - educator-training
  - curriculum-standards
summary: Requires school districts to offer computer science education in all grades and adds computer
  science to required instruction. Directs the Department of Education to develop programming that supports
  teachers in integrating computational thinking and artificial intelligence into existing classes and
  curricula.
provisions:
  - type: educator-pd-requirement
    description: Directs the Department of Education to develop programming supporting teachers in integrating
      AI into existing classes and curricula.
    citation:
      source_url: https://olis.oregonlegislature.gov/liz/2025R1/Downloads/MeasureDocument/SB541/A-Engrossed
      locator: Section 2(2)(a)
      quote: Support current teachers in expanding their capacity to teach computer science courses, including
        integrating computational thinking and artificial intelligence into existing classes and curricula
