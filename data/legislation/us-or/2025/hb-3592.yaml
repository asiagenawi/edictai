identifier: HB 3592
title: Relating to artificial intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
summary: Creates the Senator Aaron Woods Commission on Artificial Intelligence within the Department of
  Justice to monitor AI use in Oregon and report to the Legislative Assembly. Among its duties, the commission
  reviews how AI is taught at the primary, secondary and post-secondary levels and recommends education
  policies.
provisions:
  - type: creates-task-force
    description: Directs the AI commission to review the state of education around AI at the primary,
      secondary and post-secondary levels.
    citation:
      source_url: https://olis.oregonlegislature.gov/liz/2025R1/Downloads/MeasureDocument/HB3592/A-Engrossed
      locator: Section 1(2)(i)
      quote: Review the state of education in this state around the uses of artificial intelligence systems
        at the primary, secondary and post-secondary education levels
