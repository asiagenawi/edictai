id: us-ar-2025-hb-1958
jurisdiction: us-ar
session: "2025"
identifier: HB 1958
title: To Require Public Entities To Create A Policy Concerning The Authorized Use Of Artificial Intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - local-policy-requirement
  - institutional-operations
  - educator-training
summary: Requires public entities, defined to include public school districts, open-enrollment charter
  schools, and institutions of higher education, to create an artificial intelligence and automated decision
  tool policy that defines authorized use and requires a human to make final decisions, and to train employees
  on it. Directs the Department of Education to develop AI policies for each type of state educational
  institution.
provisions:
  - type: requires-local-ai-policy
    description: Each public entity, including school districts and institutions of higher education,
      must create a policy defining authorized use of AI and automated decision tools.
    citation:
      source_url: https://arkleg.state.ar.us/Acts/FTPDocument?path=%2FACTS%2F2025R%2FPublic%2F&file=848.pdf&ddBienniumSession=2025%2F2025R
      locator: Section 1, 25-1-128(b)(3)
      quote: 'Create an artificial intelligence and automated decision tool policy that: (A) Defines the
        authorized use of artificial intelligence and automated decision tools for the public entity'
  - type: issues-model-policy
    description: The Department of Education must develop AI and automated decision tool policies to be
      used by each type of state educational institution.
    education_levels:
      - k12
    citation:
      source_url: https://arkleg.state.ar.us/Acts/FTPDocument?path=%2FACTS%2F2025R%2FPublic%2F&file=848.pdf&ddBienniumSession=2025%2F2025R
      locator: Section 1, 25-1-128(c)(2)(A)
      quote: Develop technology resources and artificial intelligence and automated decision tool policies
        that shall be used by each type of state educational institution
  - type: educator-pd-requirement
    description: Public entities must train all employees on the AI and automated decision tool policy.
    citation:
      source_url: https://arkleg.state.ar.us/Acts/FTPDocument?path=%2FACTS%2F2025R%2FPublic%2F&file=848.pdf&ddBienniumSession=2025%2F2025R
      locator: Section 1, 25-1-128(b)(4)
      quote: including training on the appropriate use of artificial intelligence and automated decision
        tools in deciding an outcome in the course of an employee's employment
