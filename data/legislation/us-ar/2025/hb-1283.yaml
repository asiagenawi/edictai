id: us-ar-2025-hb-1283
jurisdiction: us-ar
session: "2025"
identifier: HB 1283
title: To Require The Division Of Elementary And Secondary Education To Include Digital Media Standards
  In Kindergarten Through Grade Twelve Library Media Standards.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Requires the Division of Elementary and Secondary Education to establish K-12 digital media standards
  by the 2026-2027 school year, embedded in English language arts and library media standards. The standards
  must include artificial intelligence usage instruction and the proper use of AI, and the division must
  create or endorse a curriculum.
provisions:
  - type: ai-in-standards
    description: K-12 digital media standards must include digital citizenship instruction that covers
      AI usage.
    citation:
      source_url: https://arkleg.state.ar.us/Home/FTPDocument?path=%2FBills%2F2025R%2FPublic%2FHB1283.pdf
      locator: Section 1, new 6-16-163(d)(1)
      quote: Digital citizenship, including media literacy instruction, internet safety instruction, and
        artificial intelligence usage instruction;
  - type: ai-in-standards
    description: The standards must include instruction on the proper use of AI.
    citation:
      source_url: https://arkleg.state.ar.us/Home/FTPDocument?path=%2FBills%2F2025R%2FPublic%2FHB1283.pdf
      locator: Section 1, new 6-16-163(d)(5)
      quote: The proper use of artificial intelligence.
