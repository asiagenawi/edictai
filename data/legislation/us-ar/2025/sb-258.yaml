id: us-ar-2025-sb-258
jurisdiction: us-ar
session: "2025"
identifier: SB 258
title: To Create The Arkansas Digital Responsibility, Safety, And Trust Act.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - admissions
summary: Creates the Arkansas Digital Responsibility, Safety, and Trust Act, which regulates developers
  and deployers of high-risk artificial intelligence systems that make or substantially factor into consequential
  decisions, including education enrollment, with documentation, impact assessment, and disclosure duties.
  State agencies covered include public university systems and institutions of higher education.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential decisions subject to high-risk AI requirements to include education
      enrollment.
    citation:
      source_url: https://arkleg.state.ar.us/Home/FTPDocument?path=%2FBills%2F2025R%2FPublic%2FSB258.pdf
      locator: Section 1, definitions (15)
      quote: 'results in the provision or denial by the controller of: (A) Financial and lending services;
        (B) Housing, insurance, or healthcare services; (C) Education enrollment;'
