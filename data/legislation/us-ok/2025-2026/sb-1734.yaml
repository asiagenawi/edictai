id: us-ok-2025-2026-sb-1734
jurisdiction: us-ok
session: 2025-2026
identifier: SB 1734
title: Oklahoma Responsible Technology in Schools Act
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - local-policy-requirement
  - student-privacy
  - assessment
  - data-governance
summary: >-
  Sets statewide rules for artificial intelligence in Oklahoma public schools: AI tools must be
  educator-directed with human review of outputs, may not be the primary basis for grading,
  discipline, placement or other high-stakes decisions, and must comply with student privacy
  law. Districts must disclose AI tools to parents annually, let parents opt students out of
  student-facing AI without penalty, and adopt an AI policy before the 2027-2028 school year,
  and the State Department of Education must issue guidance.
provisions:
  - type: limits-ai-instructional-use
    description: Requires AI tools to be educator-directed and AI outputs to be reviewed by an educator or authorized employee before use in instruction, feedback, assessment, or decision-making.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/SB/SB1734%20ENR.PDF
      locator: Sec. 1(E)(1)-(2)
      quote: Outputs generated by artificial intelligence shall be reviewed by an educator or authorized school employee prior to use in instruction, feedback, assessment, or decision-making
  - type: regulates-ai-assessment
    description: Bars AI from being the primary basis for grading, discipline, placement, promotion, retention, or other high-stakes decisions.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/SB/SB1734%20ENR.PDF
      locator: Sec. 1(E)(3)
      quote: Artificial intelligence tools shall not be used as the primary basis for student grading, discipline, placement, promotion, retention, or other high-stakes educational decisions
  - type: restricts-student-data-use
    description: Requires AI tools to comply with student privacy laws including FERPA and requires districts to minimize student data shared with AI tools.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/SB/SB1734%20ENR.PDF
      locator: Sec. 1(E)(5)
      quote: School districts shall take reasonable steps to minimize the amount of student data shared with artificial intelligence tools
  - type: requires-disclosure
    description: Requires an annual written disclosure to parents listing AI tools in use, vendors, data collected and shared, and each tool's purpose, and allows parents to opt students out of student-facing AI tools without academic penalty.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/SB/SB1734%20ENR.PDF
      locator: Sec. 1(F)-(G)
      quote: Each school district shall provide parents or legal guardians of students enrolled in the district with a written disclosure not less than annually.
  - type: issues-model-policy
    description: Directs the State Department of Education to develop guidance on responsible use of AI and emerging technologies for school districts.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/SB/SB1734%20ENR.PDF
      locator: Sec. 1(H)
      quote: The State Department of Education shall develop and make available guidance regarding the responsible use of artificial intelligence and emerging technologies for public school districts in this state.
  - type: requires-local-ai-policy
    description: Requires each school district board of education to adopt an AI and emerging technology policy before the 2027-2028 school year, covering oversight roles, permitted and prohibited uses, data protection, transparency, and periodic review.
    education_levels:
      - k12
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/SB/SB1734%20ENR.PDF
      locator: Sec. 1(I)
      quote: Prior to the beginning of the 2027-2028 school year, each school district board of education shall adopt and maintain a policy governing the use of artificial intelligence and emerging technologies.
