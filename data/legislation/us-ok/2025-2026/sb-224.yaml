id: us-ok-2025-2026-sb-224
jurisdiction: us-ok
session: 2025-2026
identifier: SB 224
title: Student data; creating the Oklahoma Education and Workforce Statewide Longitudinal Data System.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - data-governance
summary: Creates the Oklahoma Education and Workforce Efficiency Data System to de-identify, exchange,
  and match early childhood, K-12, postsecondary, and workforce data among state agencies, requires the
  system to support advanced analytics including artificial intelligence and machine learning while complying
  with FERPA, and creates a governance council.
