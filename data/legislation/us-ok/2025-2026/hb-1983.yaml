id: us-ok-2025-2026-hb-1983
jurisdiction: us-ok
session: 2025-2026
identifier: HB 1983
title: Schools; media literacy and cybersecurity to be taught in sixth, seventh, or eighth grades; State
  Department of Education to adopt curriculum standards; effective date.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - synthetic-media
  - curriculum-standards
  - educator-training
summary: Requires public schools to teach a half-unit media literacy and cybersecurity course in grades
  six through eight, beginning with students entering sixth grade in 2027-2028, that includes identifying
  deepfake images, video, and audio and identifying artificial intelligence, and directs the State Board
  and Department of Education to adopt standards and provide guidelines, materials, and teacher professional
  development.
provisions:
  - type: ai-course-or-graduation-requirement
    description: Requires a middle school media literacy and cybersecurity course whose content includes
      identifying deepfakes and artificial intelligence.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20INT/hB/HB1983%20INT.PDF
      locator: Section 1(A)(6)
      quote: 6. Identifying deepfake images, videos, and audio and identifying artificial intelligence
        (AI).
  - type: educator-pd-requirement
    description: Directs the Department to develop professional development programs to help teachers
      provide the media literacy and cybersecurity instruction.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20INT/hB/HB1983%20INT.PDF
      locator: Section 1(F)(2)
      quote: Develop professional development programs that are designed to help teachers provide instruction
        in media literacy and cybersecurity.
