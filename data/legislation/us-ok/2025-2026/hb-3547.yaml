id: us-ok-2025-2026-hb-3547
jurisdiction: us-ok
session: 2025-2026
identifier: HB 3547
title: Schools; Parent Data Sovereignty Act of 2026; legislative findings; definitions; prohibiting student
  data use or transfer for commercial purposes; parental rights to student data; opt out; Data Transparency
  Portal; contractors and vendors protection of data; violations; rules; effective date.
classification: bill
education_levels:
  - k12
topics:
  - student-privacy
  - data-governance
summary: Enacts the Parent Data Sovereignty Act of 2026, making parents the owners of their minor children's
  personally identifiable education data, barring commercial use of student data, and giving parents rights
  to access, correct, and opt out of data collection, including opting out of predictive analytics models
  and artificial intelligence training datasets.
provisions:
  - type: restricts-student-data-use
    description: Gives parents the right to opt their child out of predictive analytics models and AI
      training datasets.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20INT/hB/HB3547%20INT.PDF
      locator: Section 1(E)(4)
      quote: Opt out of inclusion in any research study, predictive analytics model, artificial intelligence
        training dataset, or cross- agency workforce linkage;
