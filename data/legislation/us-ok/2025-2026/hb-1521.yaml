id: us-ok-2025-2026-hb-1521
jurisdiction: us-ok
session: 2025-2026
identifier: HB 1521
title: Schools; subject matter standards; personal financial literacy; AP courses; updating references;
  permitting alternate diploma for certain students; repealer; effective date; emergency.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Revises Oklahoma subject matter standards and graduation requirements, including a personal financial
  literacy unit. As introduced, would require the State Department of Education to adopt rules making
  all levels of the computer science standards include instruction on what artificial intelligence is
  and how it works. The AI provisions were removed by amendment.
provisions:
  - type: ai-in-standards
    description: Would require computer science standards at all grades to include instruction on fundamental
      concepts of AI.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20INT/hB/HB1521%20INT.PDF
      locator: Introduced, Section 1, 70 O.S. § 11-103.6(Y)
      quote: The State Department of Education shall promulgate rules reflecting that all levels and grades
        of the Oklahoma Academic Standards for Computer Science shall include instruction on the fundamental
        concepts of emerging computer science technologies such as artificial intelligence (AI)
