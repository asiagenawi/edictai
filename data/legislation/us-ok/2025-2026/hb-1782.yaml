id: us-ok-2025-2026-hb-1782
jurisdiction: us-ok
session: 2025-2026
identifier: HB 1782
title: Artificial intelligence education; creating the AI Education Innovation Act, the AI Education Innovation
  Revolving Fund and the AI Education Advisory Council; effective date.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - funding
  - task-force
  - educator-training
  - ai-literacy
  - workforce
summary: Creates the Oklahoma AI Education Innovation Act, an AI Education Innovation Revolving Fund that
  agencies may use for AI tools, educator professional development, curriculum, research, student AI literacy
  and workforce programs, and infrastructure, and an Oklahoma AI Education Advisory Council that advises
  the education, higher education, career technology, and library agencies on AI education.
provisions:
  - type: appropriates-funding
    description: Lets agencies use the revolving fund for AI educational tools, educator professional
      development, curriculum development, research, and student AI literacy programs.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20FLR/SFLR/HB1782%20SFLR.PDF
      locator: Section 2
      quote: 2. Professional development and training for educators, administrators, librarians, and staff
        on the effective and ethical use of artificial intelligence in educational settings; 3. Curriculum
        development integrating artificial intelligence concepts, digital literacy, and computational
        thinking;
  - type: creates-task-force
    description: Creates the Oklahoma AI Education Advisory Council, including K-12 and higher education
      officials and educators, to advise education agencies.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20FLR/SFLR/HB1782%20SFLR.PDF
      locator: Section 3(A)
      quote: There is hereby created, to continue until July 1, 2031, in accordance with the provisions
        of the Oklahoma Sunset Law, the Oklahoma AI Education Advisory Council.
  - type: ai-workforce-program
    description: Allows fund use for student programs promoting AI literacy and workforce readiness.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20FLR/SFLR/HB1782%20SFLR.PDF
      locator: Section 2
      quote: 5. Student programs and initiatives promoting artificial intelligence literacy and workforce
        readiness;
