topics:
  - safety-wellbeing
  - funding
  - student-privacy
summary: Directs the Department of Mental Health and Substance Abuse Services, with the State Department
  of Education, to solicit proposals and award grants to local boards of education for pilot programs
  that use AI software to monitor school-issued devices for student safety and readiness to learn without
  direct surveillance, and creates the AI School Safety Pilot Programs Revolving Fund.
provisions:
  - type: appropriates-funding
    description: Creates grants for school pilot programs that use AI software as a safety tool to monitor
      school-issued devices.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20INT/hB/HB2371%20INT.PDF
      locator: Section 1(A)
      quote: make grants to local boards of education for the establishment of pilot programs that utilize
        artificial intelligence (AI) software as
  - type: appropriates-funding
    description: Creates the AI School Safety Pilot Programs Revolving Fund.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20INT/hB/HB2371%20INT.PDF
      locator: Section 2
      quote: There is hereby created in the State Treasury a revolving fund for the Oklahoma Department
        of Mental Health and Substance Abuse Services to be designated the “AI School Safety Pilot Programs
        Revolving Fund”.
