topics:
  - ai-literacy
  - curriculum-standards
summary: Adds computer science and career technology options to science graduation requirements and requires
  the State Department of Education to adopt rules so that all levels and grades of the Oklahoma Academic
  Standards for Computer Science include instruction on emerging technologies such as artificial intelligence,
  including what AI is and how it works.
provisions:
  - type: ai-in-standards
    description: Requires rules so that all grades of the state computer science standards include instruction
      on AI, including what it is and how it works.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20INT/hB/HB1304%20INT.PDF
      locator: Sec. 1, 70 O.S. 11-103.6(S)
      quote: The State Department of Education shall promulgate rules to reflect that all levels and grades
        of the Oklahoma Academic Standards for Computer Science shall include instruction on the fundamental
        concepts of emerging computer science technologies such as artificial intelligence (AI)
