id: us-ok-2025-2026-hb-3021
jurisdiction: us-ok
session: 2025-2026
identifier: HB 3021
title: Schools; curriculum requirements for graduation; diploma pathway; State Department of Education;
  notice; seminar; English requirements financial literacy; alternate diploma; course availability; waiver;
  coursework; repealers; effective date; emergency.
classification: bill
education_levels:
  - k12
topics:
  - academic-integrity
summary: Revises high school graduation curriculum requirements and diploma pathways, and allows a school
  district to waive Oklahoma history graduation requirements for certain students who complete a project
  or paper without the assistance of artificial intelligence.
provisions:
  - type: academic-integrity-rules
    description: Conditions a waiver of Oklahoma history graduation requirements on a project or paper
      completed without the assistance of AI.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/hB/HB3021%20ENR.PDF
      locator: Section 11-103.6f
      quote: if the student completes a project or writes a paper, without the assistance of artificial
        intelligence, subject to approval of the school district, that demonstrates competencies and knowledge
        of Oklahoma history or United States Government.
