id: us-ok-2025-2026-sb-410
jurisdiction: us-ok
session: 2025-2026
identifier: SB 410
title: Schools; requiring students beginning certain school year to complete a computer science unit to
  graduate with standard diploma. Effective date. Emergency.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Adds a computer science unit or career technology program option to graduation requirements and
  requires the State Board of Education to adopt rules so that all levels and grades of the Oklahoma Academic
  Standards for Computer Science include instruction on emerging technologies such as artificial intelligence,
  including what AI is and how it works.
provisions:
  - type: ai-in-standards
    description: Requires rules so that all grades of the state computer science standards include instruction
      on AI, including what it is and how it works.
    citation:
      source_url: https://www.oklegislature.gov/cf_pdf/2025-26%20ENGR/SB/SB410%20ENGR.PDF
      locator: Sec. 1, 70 O.S. 11-103.6(S)
      quote: The State Board of Education shall promulgate rules to reflect that all levels and grades
        of the Oklahoma Academic Standards for Computer Science shall include instruction on the fundamental
        concepts of emerging computer science technologies such as artificial intelligence (AI)
