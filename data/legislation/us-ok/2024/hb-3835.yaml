summary: Creates the Ethical Artificial Intelligence Act, which requires developers and deployers of automated
  decision tools to complete impact assessments and bars deployers from algorithmic discrimination. Consequential
  decisions covered include education and vocational training decisions such as assessment, cheating or
  plagiarism detection, admissions, and financial aid.
provisions:
  - type: bias-or-equity-requirement
    description: Defines consequential decisions to include education decisions, bringing automated decision
      tools used for them under the act's impact assessment and anti-discrimination rules.
    citation:
      source_url: http://webserver1.lsb.state.ok.us/cf_pdf/2023-24%20INT/hB/HB3835%20INT.PDF
      locator: Section 3, 75A O.S. § 1001(4)(b)
      quote: 'b. education and vocational training, including, but not limited to: (1) assessment, including,
        but not limited to, detecting student cheating or plagiarism, (2) accreditation,'
