id: us-tn-2025-2026-sb-811
jurisdiction: us-tn
session: 2025-2026
identifier: SB 811
title: AN ACT to amend Tennessee Code Annotated, Title 49, relative to internet safety.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - safety-wellbeing
summary: Enacts the Teen Social Media and Internet Safety Act, directing the Department of Education to
  develop guidance for social media and internet safety instruction in grades 6-12 and requiring schools
  to provide that instruction. The guidance must emphasize evaluating information generated by artificial
  intelligence and the potential for AI misinformation.
provisions:
  - type: requires-ai-literacy-instruction
    description: Required internet safety instruction guidance must cover evaluating AI-generated information
      and AI misinformation.
    citation:
      source_url: https://publications.tnsosfiles.com/acts/114/pub/pc0195.pdf
      locator: Section 1, guidance contents (a)(7)
      quote: Emphasizing the importance of evaluating information generated by artificial intelligence
        and understanding the potential for misinformation when using artificial intelligence.
