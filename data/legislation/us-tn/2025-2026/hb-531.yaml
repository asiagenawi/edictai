title: AN ACT to amend Tennessee Code Annotated, Title 49, relative to artificial intelligence.
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
  - educator-training
summary: >-
  As introduced, would require local education agencies and public charter schools to provide
  age-appropriate instruction on accessing, using, and critically evaluating AI tools, and would
  require the Department of Education to issue implementation guidance and, subject to available
  funding, provide AI professional development for educators. It was taken off notice in the
  House Education Committee in March 2025.
