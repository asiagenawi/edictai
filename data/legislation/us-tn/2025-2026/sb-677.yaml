id: us-tn-2025-2026-sb-677
jurisdiction: us-tn
session: 2025-2026
identifier: SB 677
title: AN ACT to amend Tennessee Code Annotated, Title 49, relative to artificial intelligence.
classification: bill
education_levels:
  - k12
topics:
  - educator-training
summary: Requires the Department of Education to provide at least one free asynchronous professional development
  course on the use of artificial intelligence in the classroom for teachers in grades 6-12. Requires
  those teachers to complete such a course by August 1, 2028, or within two years of becoming licensed,
  and requires LEAs and public charter schools to award professional development points for it.
provisions:
  - type: educator-pd-requirement
    description: The department must offer a free asynchronous professional development course on classroom
      use of AI for grades 6-12 teachers.
    citation:
      source_url: https://publications.tnsosfiles.com/acts/114/pub/pc1056.pdf
      locator: Section 1(a)
      quote: The department shall provide at least one (1) professional development course for teachers
        that provides asynchronous instruction on the use of artificial intelligence in the classroom
  - type: educator-pd-requirement
    description: Teachers in grades 6-12 must complete a department-approved AI course by August 1, 2028,
      or within two years of licensure.
    citation:
      source_url: https://publications.tnsosfiles.com/acts/114/pub/pc1056.pdf
      locator: Section 1(b)
      quote: By August 1, 2028, or within two (2) years of becoming licensed as a teacher in this state,
        whichever is later, teachers in grades six through twelve (6-12) must complete at least one (1)
        professional development course approved by the department
