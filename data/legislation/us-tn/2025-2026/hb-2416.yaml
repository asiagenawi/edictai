id: us-tn-2025-2026-hb-2416
jurisdiction: us-tn
session: 2025-2026
identifier: HB 2416
title: AN ACT to amend Tennessee Code Annotated, Title 49, relative to education.
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - instructional-use
summary: Requires each public charter school to publish its governing board's policy on the use of artificial
  intelligence by students, teachers and staff on its website. Retains the requirement that local boards
  of education adopt such AI policies and directs them to have each school publish the policy on its website.
provisions:
  - type: requires-local-ai-policy
    description: Local boards of education must adopt AI use policies for instruction and assignments
      and report compliance.
    citation:
      source_url: https://www.capitol.tn.gov/Bills/114/Bill/HB2416.pdf
      locator: Section 2, amending 49-2-203(a)(16)(A)
      quote: Adopt a policy regarding the use of artificial intelligence by students, teachers, and staff
        for instructional and assignment purposes.
  - type: requires-disclosure
    description: Public charter schools must publish their AI use policy on their websites.
    citation:
      source_url: https://www.capitol.tn.gov/Bills/114/Bill/HB2416.pdf
      locator: Section 1, new 49-13-118(c)
      quote: Each public charter school shall publish the policy adopted by its governing board on the
        use of artificial intelligence by students, teachers, and staff for instructional and assignment
        purposes on the public charter school's website.
