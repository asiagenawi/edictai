id: us-tn-2025-2026-sb-1700
jurisdiction: us-tn
session: 2025-2026
identifier: SB 1700
title: AN ACT to amend Tennessee Code Annotated, Title 29; Title 37 and Title 47, relative to artificial
  intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
summary: Directs the Tennessee Advisory Commission on Intergovernmental Relations to study potential state
  regulation of artificial intelligence systems and generative AI chatbots and publish a report. The study
  must evaluate potential economic impacts on educational institutions, among others, and review safeguards
  for minors.
provisions:
  - type: creates-task-force
    description: The AI regulation study must evaluate potential economic impacts on educational institutions.
    citation:
      source_url: https://publications.tnsosfiles.com/acts/114/pub/pc1082.pdf
      locator: Section 1(5)
      quote: An evaluation of potential economic impacts on businesses, technology developers, educational
        institutions, and consumers in this state;
