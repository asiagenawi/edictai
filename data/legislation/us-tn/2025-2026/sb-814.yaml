id: us-tn-2025-2026-sb-814
jurisdiction: us-tn
session: 2025-2026
identifier: SB 814
title: AN ACT to amend Tennessee Code Annotated, Title 49, relative to school safety.
classification: bill
education_levels:
  - k12
topics:
  - funding
  - safety-wellbeing
  - procurement
summary: Directs the Department of Education to establish a three-year grant pilot program, subject to
  appropriations, for eligible school districts to purchase artificial intelligence weapons detection
  systems for schools. Systems must identify weapons on school grounds and notify law enforcement and
  school administrators, and the department must report annually on the program.
provisions:
  - type: appropriates-funding
    description: Creates a three-year grant pilot for eligible districts to buy AI weapons detection systems
      for schools.
    citation:
      source_url: https://www.capitol.tn.gov/Bills/114/Bill/SB0814.pdf
      locator: Section 1(b)
      quote: The department of education shall establish and administer a three-year artificial intelligence
        weapons detection system grant pilot program to award grants to eligible LEAs for the purchase
        of artificial intelligence weapons detection systems for
  - type: procurement-standards
    description: AI weapons detection systems purchased must identify weapons and immediately notify law
      enforcement and school administration.
    citation:
      source_url: https://www.capitol.tn.gov/Bills/114/Bill/SB0814.pdf
      locator: Section 1(c)
      quote: Each artificial intelligence weapons detection system purchased for purposes of this section
        must be capable of identifying weapons, including knives and firearms, on school grounds
