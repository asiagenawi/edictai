  notes: >-
    Corrections to legacy: prime Senate sponsor is Hensley, not Lundberg (Lundberg signed the
    Senate Education Committee amendment); House companion HB 1630 (Cepicky); filed January 11,
    2024 (legacy said January 9); signed and assigned Public Chapter 550 on March 19, 2024 (legacy
    said March 11, which is the transmittal date). Legacy claim that Tennessee is the only state
    mandating district AI policies removed (not supported by source). Public Chapter PDF returned
    403; operative text verified from the adopted amendment, which replaced the bill in full. No
    Wayback snapshot retrieved (archive unreachable at access time).
