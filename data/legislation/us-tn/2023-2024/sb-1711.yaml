id: us-tn-2023-2024-sb-1711
jurisdiction: us-tn
session: 2023-2024
identifier: SB 1711
title: AN ACT to amend Tennessee Code Annotated, Title 49, relative to artificial intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - local-policy-requirement
  - instructional-use
  - academic-integrity
summary: >-
  Requires each local board of education and public charter school governing body to adopt a
  policy on the use of artificial intelligence by students, teachers, and staff for instructional
  and assignment purposes, implemented by the 2024-2025 school year with annual compliance
  reports to the Department of Education. It also requires the University of Tennessee, the
  Board of Regents, and each state university board to adopt such a policy by July 1, 2025.
provisions:
  - type: requires-local-ai-policy
    description: >-
      Local boards of education must adopt and implement an AI use policy for instructional and
      assignment purposes by the 2024-2025 school year and report compliance to the Department of
      Education each July 1.
    education_levels:
      - k12
    citation:
      source_url: https://www.capitol.tn.gov/Bills/113/Amend/SA0527.pdf
      locator: Senate Amendment 1 (SA0527), Section 2 (TCA 49-2-203(a))
      quote: >-
        Adopt a policy regarding the use of artificial intelligence by students, teachers, and staff
        for instructional and assignment purposes. The policy must be implemented in schools no
        later than the 2024-2025 school year.
  - type: requires-local-ai-policy
    description: >-
      Public charter school governing bodies must adopt the same kind of policy on the same timeline.
    education_levels:
      - k12
    citation:
      source_url: https://www.capitol.tn.gov/Bills/113/Amend/SA0527.pdf
      locator: Senate Amendment 1 (SA0527), Section 3 (TCA Title 49, Chapter 13)
      quote: >-
        The governing body of a public charter school shall adopt a policy regarding the use of
        artificial intelligence by students, teachers, and staff for instructional and assignment
        purposes. The policy must be implemented in each public charter school no later than the
        2024-2025 school year.
  - type: requires-local-ai-policy
    description: >-
      The University of Tennessee board, the Board of Regents, and each state university board must
      adopt an AI use policy by July 1, 2025, post it online, and submit it to the legislative
      education committees.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.capitol.tn.gov/Bills/113/Amend/SA0527.pdf
      locator: Senate Amendment 1 (SA0527), Section 1(b), (d)
      quote: >-
        The board of trustees of the University of Tennessee, the board of regents, and each local
        governing board of trustees of a state university shall adopt a policy regarding the use of
        artificial intelligence technology by students, faculty, and staff for instructional and
        assignment purposes. The policy must be implemented no later than July 1, 2025.
