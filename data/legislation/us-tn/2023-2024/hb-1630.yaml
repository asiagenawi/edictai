id: us-tn-2023-2024-hb-1630
jurisdiction: us-tn
session: 2023-2024
identifier: HB 1630
title: AN ACT to amend Tennessee Code Annotated, Title 49, relative to artificial intelligence.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - local-policy-requirement
  - instructional-use
  - academic-integrity
summary: Requires the University of Tennessee board, the board of regents and each state university board
  to adopt a policy on the use of artificial intelligence by students, faculty and staff for instruction
  and assignments by July 1, 2025. Requires local boards of education and public charter school governing
  bodies to adopt such policies for the 2024-2025 school year and report compliance to the Department
  of Education.
provisions:
  - type: requires-local-ai-policy
    description: Public university governing boards must adopt policies on AI use by students, faculty
      and staff for instructional and assignment purposes.
    education_levels:
      - postsecondary
    citation:
      source_url: https://publications.tnsosfiles.com/acts/113/pub/pc0550.pdf
      locator: Section 1(b)
      quote: The board of trustees of the University of Tennessee, the board of regents, and each local
        governing board of trustees of a state university shall adopt a policy regarding the use of artificial
        intelligence technology by students, faculty, and staff for instructional and assignment purposes.
  - type: requires-local-ai-policy
    description: Local boards of education must adopt policies on AI use by students, teachers and staff
      for instructional and assignment purposes.
    education_levels:
      - k12
    citation:
      source_url: https://publications.tnsosfiles.com/acts/113/pub/pc0550.pdf
      locator: Section 2, amending 49-2-203(a)
      quote: Adopt a policy regarding the use of artificial intelligence by students, teachers, and staff
        for instructional and assignment purposes. The policy must be implemented in schools no later
        than the 2024-2025 school year.
  - type: requires-local-ai-policy
    description: Public charter school governing bodies must adopt AI use policies and report compliance.
    education_levels:
      - k12
    citation:
      source_url: https://publications.tnsosfiles.com/acts/113/pub/pc0550.pdf
      locator: Section 3(b)
      quote: The governing body of a public charter school shall adopt a policy regarding the use of artificial
        intelligence by students, teachers, and staff for instructional and assignment purposes.
