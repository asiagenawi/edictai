id: us-tn-2023-2024-sb-2530
jurisdiction: us-tn
session: 2023-2024
identifier: SB 2530
title: AN ACT to amend Tennessee Code Annotated, Title 4, relative to the artificial intelligence advisory
  council.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - workforce
summary: Creates the Tennessee Artificial Intelligence Advisory Council to develop an action plan on artificial
  intelligence in state government and the economy. The council must report on AI's labor market impact
  and propose policy changes related to workforce development, educational systems and research opportunities
  for colleges and universities.
provisions:
  - type: creates-task-force
    description: The advisory council's report must propose policy changes related to educational systems
      and research opportunities for colleges and universities.
    citation:
      source_url: https://publications.tnsosfiles.com/acts/113/pub/pc0988.pdf
      locator: Section 1, council report (c)(6)
      quote: Proposed policy changes related to workforce development, educational systems, and research
        opportunities for colleges and universities in this state
