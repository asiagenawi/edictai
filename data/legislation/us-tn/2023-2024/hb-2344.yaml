id: us-tn-2023-2024-hb-2344
jurisdiction: us-tn
session: 2023-2024
identifier: HB 2344
title: AN ACT to amend Tennessee Code Annotated, Title 12 and Title 49, relative to school safety.
classification: bill
education_levels:
  - k12
topics:
  - procurement
  - safety-wellbeing
summary: Enacts the Protecting Tennessee Schools and Events Act, directing the Department of Education,
  subject to appropriations, to contract for walk-through metal detectors for school districts. Contract
  evaluation criteria favor systems able to integrate an artificial intelligence-powered camera array
  for detecting exposed weapons.
provisions:
  - type: procurement-standards
    description: The department must evaluate school metal detector proposals on their ability to integrate
      AI-powered weapon detection cameras.
    citation:
      source_url: https://www.capitol.tn.gov/Bills/113/Bill/HB2344.pdf
      locator: Section 1, contract evaluation criteria (c)(2)(A)
      quote: The system's ability to integrate an artificial intelligence (AI) powered camera array capable
        of accurately detecting exposed weapons within its field of view in order to provide an additional
        layer of security beyond metal detection,
