id: us-oh-2025-2026-sb-326
jurisdiction: us-oh
session: 2025-2026
identifier: SB 326
title: Require students complete a high school computer science course
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Requires school districts to offer at least one-half unit of computer science and, beginning
  with students entering ninth grade on or after July 1, 2029, requires students to complete it; the unit
  must include instruction in artificial intelligence, and students may be exempted by demonstrating competency
  in computer science and AI.
provisions:
  - type: ai-course-or-graduation-requirement
    description: Requires a half unit of computer science for graduation that includes instruction in
      AI, including what it is, how it works, and its impact on society.
    citation:
      source_url: https://search-prod.lis.state.oh.us/api/v2/general_assembly_136/legislation/sb326/02_PS/pdf/
      locator: Sec. 3313.603(C)(10)(a)
      quote: The one-half unit of computer science shall include instruction in evolving areas of computer
        science, such as artificial intelligence, including an understanding of what it is, how it works,
        and its impact on society.
  - type: ai-course-or-graduation-requirement
    description: Allows exemption from the requirement for students who complete seventy-five hours of
      structured computer science and AI instruction from an approved provider.
    citation:
      source_url: https://search-prod.lis.state.oh.us/api/v2/general_assembly_136/legislation/sb326/02_PS/pdf/
      locator: Sec. 3313.603(C)(10)(c)
      quote: student from the requirement in division (C)(10) of this section if the student demonstrates
        competency in computer science and artificial intelligence by completing seventy-five cumulative
        hours of structured content in computer science and artificial intelligence instruction
