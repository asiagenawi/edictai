summary: Enacts Alyssa's Law, appropriating $25 million for a Department of Public Safety pilot grant
  program that lets school districts, community schools, STEM schools, and chartered nonpublic schools
  buy panic alert systems or contract for artificial intelligence firearm detection software, and sets
  criteria the software must meet.
provisions:
  - type: appropriates-funding
    description: Creates a pilot grant program for schools to buy panic alert systems or contract for
      AI firearm detection software.
    citation:
      source_url: https://search-prod.lis.state.oh.us/api/v2/general_assembly_136/legislation/hb106/00_IN/pdf/
      locator: Section 2(A)
      quote: pilot grants to school districts, community schools established under Chapter 3314. of the
        Revised Code, STEM schools established under Chapter 3326. of the Revised Code, and chartered
        nonpublic schools to purchase a wearable panic alert system
  - type: procurement-standards
    description: Requires AI firearm detection software used by grant recipients to meet listed criteria,
      such as detecting visible firearms, anti-terrorism designation, and integration with school cameras.
    citation:
      source_url: https://search-prod.lis.state.oh.us/api/v2/general_assembly_136/legislation/hb106/00_IN/pdf/
      locator: Section 2(B)(4)
      quote: 'A requirement that any artificial intelligence firearm detection software that a district
        or school intends to use meets all of the following criteria:'
