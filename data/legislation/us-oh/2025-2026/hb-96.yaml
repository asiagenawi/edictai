summary: >-
  Ohio's fiscal year 2026-2027 operating budget. Among many other provisions, it enacted Ohio
  Revised Code section 3301.24, which required the Department of Education and Workforce to
  develop a model policy on the use of artificial intelligence in schools by December 31, 2025,
  and requires every school district, community school, and STEM school to adopt an AI policy by
  July 1, 2026.
provisions:
  - type: issues-model-policy
    description: Requires the Department of Education and Workforce to develop a model policy on AI use in schools, addressing appropriate use by students and staff, by December 31, 2025.
    education_levels:
      - k12
    citation:
      source_url: https://codes.ohio.gov/ohio-revised-code/section-3301.24
      locator: R.C. 3301.24(A)
      quote: Not later than December 31, 2025, the department of education and workforce shall develop a model policy on the use of artificial intelligence in schools.
  - type: requires-local-ai-policy
    description: Requires each school district, community school, and STEM school to adopt an AI use policy by July 1, 2026; schools may adopt the department's model policy.
    education_levels:
      - k12
    citation:
      source_url: https://codes.ohio.gov/ohio-revised-code/section-3301.24
      locator: R.C. 3301.24(B)
      quote: Not later than July 1, 2026, each school district, community school established under Chapter 3314. of the Revised Code, and STEM school established under Chapter 3326. of the Revised Code shall adopt a policy on the use of artificial intelligence.
