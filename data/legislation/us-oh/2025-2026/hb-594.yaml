id: us-oh-2025-2026-hb-594
jurisdiction: us-oh
session: 2025-2026
identifier: HB 594
title: Require students complete a high school computer science course
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Requires school districts to offer, and students to complete, at least one unit of high school
  computer science, and requires that computer science instruction cover evolving areas such as artificial
  intelligence, including what it is, how it works, and its impact on society.
provisions:
  - type: ai-course-or-graduation-requirement
    description: Requires the computer science graduation unit to include instruction in artificial intelligence,
      including what it is, how it works, and its impact on society.
    citation:
      source_url: https://search-prod.lis.state.oh.us/api/v2/general_assembly_136/legislation/hb594/00_IN/pdf/
      locator: Sec. 3313.603(C)
      quote: of computer science shall include instruction in evolving areas of computer science, such
        as artificial intelligence, including an understanding of what it is, how it works, and its impact
        on society.
