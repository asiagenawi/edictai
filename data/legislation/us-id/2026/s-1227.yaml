id: us-id-2026-s-1227
jurisdiction: us-id
session: "2026"
identifier: S 1227
title: >-
  Education – Adds to existing law to establish provisions regarding generative artificial
  intelligence in public education.
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - instructional-use
  - ai-literacy
  - curriculum-standards
  - educator-training
  - student-privacy
  - procurement
  - academic-integrity
  - employment-evaluation
summary: >-
  Creates a new chapter of Idaho Code on generative AI in education. The State Department of
  Education must develop a statewide generative AI framework, subject to State Board of
  Education approval, that ensures no generative AI replaces a human teacher; every school
  district and public charter school must adopt an aligned generative AI policy. The department
  must also develop K-12 generative AI literacy standards, assessment guidelines, an educator
  professional development plan, and a parent guidance document, and AI tools procured by
  schools must meet data privacy and vendor disclosure requirements.
abstract: >-
  RELATING TO EDUCATION; AMENDING TITLE 33, IDAHO CODE, BY THE ADDITION OF A NEW CHAPTER 70,
  TITLE 33, IDAHO CODE, TO PROVIDE FOR LEGISLATIVE INTENT, TO PROVIDE FOR DEFINITIONS, TO
  REQUIRE THE STATE DEPARTMENT OF EDUCATION TO DEVELOP A GENERATIVE ARTIFICIAL INTELLIGENCE IN
  EDUCATION FRAMEWORK, TO REQUIRE LOCAL SCHOOL DISTRICTS AND PUBLIC CHARTER SCHOOLS TO ADOPT
  CERTAIN POLICIES, TO REQUIRE THE STATE DEPARTMENT OF EDUCATION TO DEVELOP CERTAIN STANDARDS,
  ASSESSMENTS, AND PROFESSIONAL DEVELOPMENT, TO PROVIDE FOR PARENTAL AND COMMUNITY ENGAGEMENT,
  TO PROVIDE FOR PROCUREMENT REQUIREMENTS, AND TO PROVIDE FOR RULEMAKING; AND DECLARING AN
  EMERGENCY AND PROVIDING AN EFFECTIVE DATE.
provisions:
  - type: issues-model-policy
    description: >-
      Directs the State Department of Education to develop a statewide generative AI in
      education framework, subject to State Board of Education approval, as the foundation for
      local policies.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1227E1.pdf
      locator: Idaho Code 33-7003(1)
      quote: >-
        The state department of education shall develop a statewide generative artificial
        intelligence in education framework, subject to state board of education approval
  - type: prohibits-ai-replacing-educators
    description: The framework must ensure that no generative AI replaces or eliminates a human teacher.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1227E1.pdf
      locator: Idaho Code 33-7003(1)(b)
      quote: Ensure that no generative artificial intelligence replaces or eliminates a human teacher
  - type: requires-local-ai-policy
    description: >-
      Requires every school district and public charter school to adopt a policy on generative
      AI use by students and employees, aligned with the state framework.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1227E1.pdf
      locator: Idaho Code 33-7004
      quote: >-
        Each local school district and public charter school shall adopt a policy governing the
        use of generative artificial intelligence by students and employees
  - type: ai-in-standards
    description: Requires the department to develop and recommend generative AI literacy standards for K-12 students.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1227E1.pdf
      locator: Idaho Code 33-7005(1)
      quote: Generative AI literacy standards for K-12 students
  - type: educator-pd-requirement
    description: Requires the department to develop and recommend a professional development plan for educators on generative AI.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1227E1.pdf
      locator: Idaho Code 33-7005(3)
      quote: >-
        A professional development plan to build educator capacity in safe and effective
        integration of generative AI technologies
  - type: procurement-standards
    description: >-
      Requires generative AI tools procured by districts and charter schools to comply with
      privacy laws and requires vendors to disclose AI use and provide data protection
      assurances.
    education_levels:
      - k12
    citation:
      source_url: https://legislature.idaho.gov/wp-content/uploads/sessioninfo/2026/legislation/S1227E1.pdf
      locator: Idaho Code 33-7007(1)
      quote: >-
        Vendors shall disclose whether products utilize machine learning, predictive analytics,
        or generative AI and shall provide assurances regarding data protection, algorithmic
        transparency, and responsible use.
