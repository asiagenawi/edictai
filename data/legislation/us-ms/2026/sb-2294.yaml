id: us-ms-2026-sb-2294
jurisdiction: us-ms
session: "2026"
identifier: SB 2294
title: Education; institute initiatives to promote literacy in math, reading, finance, computer science,
  and civics.
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: Enacts multiple K-12 literacy initiatives, including a requirement that public high school students
  earn a unit of computer science or CTE with embedded computer science credit before graduation. The
  qualifying course must include instruction on emerging technologies such as artificial intelligence,
  including what AI is, how it works, and its impact on society.
provisions:
  - type: ai-course-or-graduation-requirement
    description: Creates a computer science graduation requirement whose qualifying course must cover
      AI concepts.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2026/html/SB/2200-2299/SB2294SG.htm
      locator: New Section 37-13-215(4)
      quote: The computer science course or courses fulfilling this graduation requirement must include
        instruction on the fundamental concepts of emerging computer science technologies, such as artificial
        intelligence (AI), including an understanding of what AI is, how it works, and its impact on society.
  - type: requires-ai-literacy-instruction
    description: Requires instruction on what AI is, how it works and its impact on society.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2026/html/SB/2200-2299/SB2294SG.htm
      locator: New Section 37-13-215(4)
      quote: including an understanding of what AI is, how it works, and its impact on society
