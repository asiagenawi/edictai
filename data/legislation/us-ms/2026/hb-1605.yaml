  - employment-evaluation
  - workforce
summary: Authorizes the Department of Education to establish an AI and STEM Education Pilot Program letting
  school districts use AI-assisted learning tools in grades 6-12 STEM subjects, with priority for underperforming,
  rural and high-poverty schools. Requires educator professional development, bars use of the tools for
  teacher evaluation or employment decisions, restricts use of student data, and directs guidelines on
  algorithmic bias and human oversight.
provisions:
  - type: appropriates-funding
    description: Authorizes a voluntary pilot program for AI-assisted learning tools in grades 6-12 STEM
      subjects.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2026/html/HB/1600-1699/HB1605IN.htm
      locator: Sec. 4(1)-(2)
      quote: The program shall allow participating LEAs to implement AI-assisted learning tools in STEM
        subjects for Grades 6 through 12
  - type: educator-pd-requirement
    description: Requires the department to provide or approve professional development on integrating
      AI tools into instruction.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2026/html/HB/1600-1699/HB1605IN.htm
      locator: Sec. 6(1)
      quote: The department shall provide or approve professional development to ensure educators understand
        how to effectively and ethically integrate AI tools into instruction.
  - type: restricts-student-data-use
    description: Requires AI tools to comply with FERPA and bars selling or noneducational use of student
      data.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2026/html/HB/1600-1699/HB1605IN.htm
      locator: Sec. 7(2)
      quote: Student data shall not be sold, shared, or used for noneducational purposes.
  - type: bias-or-equity-requirement
    description: Directs the department to develop guidelines on algorithmic bias, transparency and human
      oversight.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2026/html/HB/1600-1699/HB1605IN.htm
      locator: Sec. 7(3)
      quote: 'The department shall develop guidelines addressing: (a) Algorithmic bias; (b) Transparency
        of AI systems; and (c) Appropriate human oversight of AI-generated recommendations.'
