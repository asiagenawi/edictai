id: us-ms-2025-sb-2535
jurisdiction: us-ms
session: "2025"
identifier: SB 2535
title: MS Future Innovators Act; enact to require high-school computer science or CTE with embedded computer
  science course.
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: Requires public high school students, beginning with the 2027-2028 ninth-grade class, to earn
  one unit of credit in computer science or a CTE course with embedded computer science. The qualifying
  course must include instruction on emerging technologies such as artificial intelligence, including
  what AI is, how it works, and its impact on society.
provisions:
  - type: ai-course-or-graduation-requirement
    description: Creates a computer science graduation requirement whose qualifying course must cover
      AI concepts.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2025/html/SB/2500-2599/SB2535PS.htm
      locator: Section 1, new 37-13-215(4)
      quote: The computer science course or courses fulfilling this graduation requirement must include
        instruction on the fundamental concepts of emerging computer science technologies, such as artificial
        intelligence (AI), including an understanding of what AI is, how it works, and its impact on society.
  - type: requires-ai-literacy-instruction
    description: Requires instruction on what AI is, how it works and its societal impact.
    citation:
      source_url: https://billstatus.ls.state.ms.us/documents/2025/html/SB/2500-2599/SB2535PS.htm
      locator: Section 1, new 37-13-215(4)
      quote: including an understanding of what AI is, how it works, and its impact on society
