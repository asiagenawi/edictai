id: us-ms-2025-sb-2426
jurisdiction: us-ms
session: "2025"
identifier: SB 2426
title: Artificial Intelligence Task Force; create and prescribe responsibilities of.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
summary: >-
  Creates the Artificial Intelligence Regulation (AIR) Task Force to study AI applications,
  risks, and policy options for Mississippi and report recommendations to the Legislature each
  year by December 1. Its ex officio expert members include people from K-12 education and from
  four-year and two-year postsecondary education; the task force dissolves December 31, 2027.
abstract: >-
  AN ACT TO ESTABLISH THE ARTIFICIAL INTELLIGENCE REGULATION (AIR) TASK FORCE; TO PROVIDE FOR
  THE APPOINTMENT OF MEMBERS OF THE TASK FORCE, INCLUDING EX-OFFICIO MEMBERS; TO SPECIFY THE TASK
  FORCE'S PURPOSE AND DUTIES; TO DIRECT THE TASK FORCE TO STUDY AND EVALUATE ARTIFICIAL
  INTELLIGENCE APPLICATIONS, RISKS AND POLICY RECOMMENDATIONS; TO REQUIRE THAT THE TASK FORCE WILL
  REPORT ITS FINDINGS AND ANY RECOMMENDATIONS TO THE LEGISLATURE ANNUALLY; TO AUTHORIZE FUNDS AND
  SUPPORT FOR THE TASK FORCE'S WORK; AND FOR RELATED PURPOSES.
provisions:
  - type: creates-task-force
    description: Establishes the AIR Task Force, with ex officio members from elementary and secondary education and from four-year and two-year postsecondary education, reporting annually and dissolving December 31, 2027.
