id: us-ca-2025-2026-ab-1792
jurisdiction: us-ca
session: 2025-2026
identifier: AB 1792
title: 'Pupil instruction: health framework: sexual health.'
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - ai-literacy
  - curriculum-standards
summary: Adds Education Code 51900.3 so that sexual health instruction includes content educating pupils
  about dating abuse and digital violence, including the risks of nonconsensual intimate imagery, deepfakes,
  and the misuse of generative artificial intelligence.
provisions:
  - type: addresses-deepfakes
    description: Sexual health education must include knowledge of digital safety risks including deepfakes
      and misuse of generative AI.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB1792#97CHP
      locator: Education Code 51900.3(b)(1)
      quote: The knowledge and skills necessary to understand digital and online safety, including the
        risks associated with nonconsensual intimate imagery, deepfakes, online grooming, sextortion,
        stalking, and the misuse of generative artificial intelligence.
