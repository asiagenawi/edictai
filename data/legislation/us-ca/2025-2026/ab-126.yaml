identifier: AB 126
title: 'Education finance: education omnibus trailer bill.'
classification: bill
education_levels:
  - k12
topics:
  - safety-wellbeing
  - instructional-use
  - funding
summary: Appropriates $600,000 to the State Department of Education to contract with a county office of
  education to maintain the California Educators Together online repository, which must include guidance
  and resources for educators and pupils on safeguards for use of new and emerging technology in schools,
  including artificial intelligence. It also creates a statewide subject matter transcript review service
  for the Commission on Teacher Credentialing that must comply with applicable AI governance standards.
provisions:
  - type: issues-model-policy
    description: The state-funded California Educators Together repository must include guidance and resources
      for educators and pupils on safeguards for AI use in schools.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB126#96CHP
      locator: Section on California Educators Together repository, subd. (c)(3)
      quote: Guidance and resources for educators and pupils dedicated towards protecting pupils online,
        cultivating media and digital literacy, and establishing safeguards for use of new and emerging
        technology in schools, including artificial intelligence.
