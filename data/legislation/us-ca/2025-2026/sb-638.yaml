id: us-ca-2025-2026-sb-638
jurisdiction: us-ca
session: 2025-2026
identifier: SB 638
title: 'California Education Interagency Council: California Career Technical Education Incentive Grant
  Program.'
classification: bill
education_levels:
  - k12
topics:
  - workforce
  - funding
summary: Revises the California Career Technical Education Incentive Grant Program and related interagency
  council duties; among other changes, eligible programs may document postsecondary partnerships for career
  pathways including artificial intelligence, and grant recipients are encouraged to develop pathway programs
  leading to in-demand careers including artificial intelligence.
provisions:
  - type: appropriates-funding
    description: Grant recipients are encouraged to use funds to develop pathway programs into high-demand
      careers, including AI.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB638#92CHP
      locator: Sec. 53075(c)
      quote: to develop pathway programs that lead into careers that are in high demand in the state,
        including, but not limited to, green technology, health care, information technology, education,
        and artificial intelligence.
  - type: ai-workforce-program
    description: Eligibility standards include partnerships with postsecondary institutions to establish
      or expand career pathways, including in AI.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB638#92CHP
      locator: Sec. 53071(c)(4)
      quote: partnerships to establish new or expand existing career pathways, including, but not limited
        to, green technology, health care, information technology, education, and artificial intelligence.
