id: us-ca-2025-2026-scr-82
jurisdiction: us-ca
session: 2025-2026
identifier: SCR 82
title: 'Public higher education: artificial intelligence usage.'
classification: concurrent-resolution
education_levels:
  - postsecondary
topics:
  - task-force
  - academic-integrity
  - instructional-use
  - educator-training
  - student-privacy
summary: Encourages the leaders of the University of California, California State University, and California
  Community Colleges to create a workgroup of faculty, staff, and administrators to review AI use in higher
  education, discuss best practices on academic honesty, student privacy, academic support, and faculty
  support, and report to the Legislature within one year.
provisions:
  - type: creates-task-force
    description: Encourages the three public higher education systems to form a workgroup reviewing AI
      use in higher education.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SCR82#98AMD
      locator: Legislative Counsel's Digest
      quote: the Chancellor of the California Community Colleges to create a workgroup of faculty, staff,
        and administrators to review the use of artificial intelligence in higher education
  - type: academic-integrity-rules
    description: The workgroup should discuss best practices for AI in academic studies, including mitigating
      plagiarism and protecting student privacy.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SCR82#98AMD
      locator: Resolved clause on AI in academic studies
      quote: mitigating plagiarism, ethically using artificial intelligence in academic assignments, reasonable
        safeguards to protect student privacy and personal information, ensuring safe and responsible
        use of artificial intelligence
