id: us-ca-2025-2026-ab-2148
jurisdiction: us-ca
session: 2025-2026
identifier: AB 2148
title: 'Elementary and secondary education: public school employees: contractors: natural persons.'
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - employment-evaluation
  - instructional-use
summary: Defines a public school employee and a contractor performing services in a public school as a
  natural person. As amended March 19, 2026, would have barred discipline or dismissal of K-12 and public
  college and university employees based on information produced via artificial intelligence or automated
  decision system output, or for refusing to use educational technology, and required educational technology
  to let employees turn it off. The AI provisions were removed by amendment.
