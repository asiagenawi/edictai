id: us-ca-2025-2026-sjr-2
jurisdiction: us-ca
session: 2025-2026
identifier: SJR 2
title: Classified workers’ rights.
classification: joint-resolution
education_levels:
  - k12
  - postsecondary
topics:
  - employment-evaluation
summary: Urges the President and Congress to enact federal legislation guaranteeing rights to classified
  school and college workers, including notification and input on the implementation of electronic monitoring,
  algorithms, and artificial intelligence technology in their workplaces and training as new technologies
  are introduced.
