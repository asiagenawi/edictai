id: us-ca-2025-2026-ab-1766
jurisdiction: us-ca
session: 2025-2026
identifier: AB 1766
title: 'Health curriculum framework: human trafficking and online safety.'
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - curriculum-standards
summary: Requires the Instructional Quality Commission, at the next revision of the health curriculum
  framework, to consider including content on human trafficking and online safety, including how to stay
  safe from sexually exploitative materials and deepfakes online, in an age-appropriate progression from
  kindergarten through grade 12. Requires the State Department of Education to maintain related information
  and educator training resources.
