summary: Amends the California Career Technical Education Incentive Grant Program renewal criteria. Applicants
  must show partnerships with postsecondary institutions, including dual enrollment, to establish or expand
  career pathways in fields including artificial intelligence.
provisions:
  - type: ai-workforce-program
    description: Grant criteria include partnerships to establish or expand career pathways in fields
      including AI.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB1694#98AMD
      locator: Education Code 53071
      quote: partnerships to establish new or expand existing career pathways, including, but not limited
        to, green technology, health care, information technology, education, and artificial intelligence.
