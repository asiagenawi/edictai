id: us-ca-2025-2026-sb-539
jurisdiction: us-ca
session: 2025-2026
identifier: SB 539
title: School facilities.
classification: bill
education_levels:
  - k12
topics:
  - institutional-operations
summary: Extends school facility hardship provisions to wildfire, flood, and other emergencies, and authorizes
  the State Department of Education, the State Architect, and the State Allocation Board to use machine
  learning to automate nondiscretionary permitting steps for these school projects, and school districts
  to use machine learning to prepare permitting documents.
