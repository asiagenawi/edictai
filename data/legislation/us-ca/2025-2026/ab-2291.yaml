id: us-ca-2025-2026-ab-2291
jurisdiction: us-ca
session: 2025-2026
identifier: AB 2291
title: 'Pupil safety: nonconsensual artificial intimate images: study.'
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - task-force
summary: Requires the State Department of Education to study nonconsensual artificial intimate images
  involving K-12 pupils, including school resources, reported incidents, effects on pupils, and recommended
  policy revisions, and to report to the Legislature by January 1, 2028.
provisions:
  - type: creates-task-force
    description: The department must conduct a study of nonconsensual artificial intimate images involving
      K-12 pupils.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2291#97AMD
      locator: Sec. 1, new 33319.7(a)
      quote: The department shall conduct a study on nonconsensual artificial intimate images involving
        pupils in kindergarten and grades 1 to 12, inclusive.
  - type: addresses-deepfakes
    description: The study must summarize current school policies and procedures for responding to such
      incidents.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2291#97AMD
      locator: Sec. 1, new 33319.7(a)(5)
      quote: A summary of current policies and procedures used by schools to respond to incidents involving
        nonconsensual artificial intimate images.
