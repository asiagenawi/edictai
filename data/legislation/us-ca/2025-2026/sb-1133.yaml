identifier: SB 1133
title: 'Pupil instruction: preventative health instruction.'
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Enacts the Ready to Learn, Ready for Health Act, requiring the Instructional Quality Commission,
  when the Health Education Framework is next revised on or after January 1, 2027, to consider including
  preventative health information, including the impacts and responsible use of social media, artificial
  intelligence, and digital platforms.
provisions:
  - type: ai-in-standards
    description: When the health framework is next revised, the commission must consider including information
      on the impacts and responsible use of AI.
    citation:
