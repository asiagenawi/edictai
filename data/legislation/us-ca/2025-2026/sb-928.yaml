id: us-ca-2025-2026-sb-928
jurisdiction: us-ca
session: 2025-2026
identifier: SB 928
title: 'California State University: faculty employees.'
classification: bill
education_levels:
  - postsecondary
topics:
  - instructional-use
  - employment-evaluation
summary: Requires the instructor of record for a California State University course, and CSU faculty employees,
  to be persons who meet the trustees' rules for faculty service, while stating that CSU employees may
  still use artificial intelligence tools in operations and student services.
provisions:
  - type: prohibits-ai-replacing-educators
    description: The instructor of record for a CSU course must be a person meeting the trustees' faculty
      rule.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB928#96CHP
      locator: Sec. 1, new 89500.3(b)
      quote: The instructor of record for a course of instruction shall be a person who meets the rule
        to serve as a faculty employee teaching credit instruction or a faculty employee teaching noncredit
        instruction established pursuant to Section 89500.
