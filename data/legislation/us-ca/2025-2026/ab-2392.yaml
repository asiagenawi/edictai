id: us-ca-2025-2026-ab-2392
jurisdiction: us-ca
session: 2025-2026
identifier: AB 2392
title: 'Public postsecondary education: generative artificial intelligence systems: procurement standards:
  training.'
classification: bill
education_levels:
  - postsecondary
topics:
  - procurement
  - educator-training
  - ai-literacy
  - task-force
summary: Requires the California Community Colleges chancellor's office and the California State University,
  and requests the University of California, to convene an intersegmental working group to recommend generative
  AI procurement standards and training. The systems must provide and annually review the training for
  students, faculty, and staff, keep training records, and report to the Legislature on systemwide GenAI
  contracts until standards are adopted.
provisions:
  - type: creates-task-force
    description: The three systems must jointly convene a working group to develop standards for GenAI
      training and procurement.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2392#93CHP
      locator: Sec. 1, new Article 14 (66098.1(a))
      quote: 'Jointly convene and participate in an intersegmental working group to develop standards
        for responsible GenAI training and procurement, as follows:'
  - type: procurement-standards
    description: The working group must present procurement standards and training recommendations to
      system leaders by January 1, 2028.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2392#93CHP
      locator: Sec. 1, new Article 14 (66098.1(a)(3)(C))
      quote: On or before January 1, 2028, present its recommendations for procurement standards and training
        developed pursuant to subparagraphs (A) and (B) to the respective system leaders.
  - type: educator-pd-requirement
    description: The systems must provide the GenAI training to students, faculty, or staff.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2392#93CHP
      locator: Sec. 1, new Article 14 (66098.1(b)(1))
      quote: Provide the training developed pursuant to subparagraph (B) of paragraph (3) of subdivision
        (a) to students, faculty, or staff, as applicable.
  - type: requires-disclosure
    description: Until standards are adopted, the systems must report to the Legislature on each systemwide
      GenAI contract, including vendor, intended use, and who will have access.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2392#93CHP
      locator: Sec. 1, new Article 14, section on reports of systemwide GenAI contracts, (a)
      quote: The GenAI system that was procured, including the vendor name, the intended use, and the
        population of students, faculty, or staff who will have access to the system.
