identifier: AB 1159
title: Student personal information.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - student-privacy
  - data-governance
summary: Amends California's student online privacy laws for K-12 and preschool so that operators of school-purpose websites, services, and apps may not use covered student information to train generative AI systems or develop AI systems. It also creates a Higher Education Student Information Protection Act, operative July 1, 2027, with similar protections for college students, and lets harmed students bring civil actions against noncompliant operators.
abstract: The bill would, among other changes to KOPIPA and ELPIPA related to protecting the personal information of students, prohibit an operator from using covered information, as defined, including persistent unique identifiers, created or gathered by the operator’s site, service, or application to train a generative artificial intelligence system or service or develop an artificial intelligence system. This bill would also enact the Higher Education Student Information Protection Act (HESIPA), which would generally protect the personal information of a student enrolled in a higher education institution, as defined, in a similar manner as KOPIPA and ELPIPA. The bill would make HESIPA operative on July 1, 2027.
provisions:
  - type: restricts-student-data-use
    description: Prohibits operators of K-12 school-purpose online services from using covered pupil information, including persistent unique identifiers, to train generative AI or develop AI systems.
    education_levels:
      - k12
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB1159
      locator: Sec. 1, Business and Professions Code 22584, paragraph (5)
      quote: Use covered information, including persistent unique identifiers, created or gathered by the operator’s site, service, or application to train a generative artificial intelligence system or service or develop an artificial intelligence system.
  - type: restricts-student-data-use
    description: Enacts the Higher Education Student Information Protection Act, operative July 1, 2027, extending similar protections, including the AI training prohibition, to students at higher education institutions.
    education_levels:
      - postsecondary
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB1159
      locator: Legislative Counsel's Digest
      quote: This bill would also enact the Higher Education Student Information Protection Act (HESIPA), which would generally protect the personal information of a student enrolled in a higher education institution, as defined, in a similar manner as KOPIPA and ELPIPA.
