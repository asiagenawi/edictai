identifier: AB 2071
title: 'Pupil instruction: digital wellness.'
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - task-force
summary: Requires the State Department of Education to develop, by January 1, 2028, a plan to expand digital
  wellness instruction in California public schools. The plan must include strategies for keeping curriculum
  current with evolving digital and artificial intelligence technology and for educator professional development.
provisions:
  - type: creates-task-force
    description: The department must develop a plan for digital wellness instruction that addresses keeping
      curriculum current with AI technology.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2071#94CHP
      locator: Sec. 3, amended 51929(b)
      quote: 'On or before January 1, 2028, the department shall develop a plan to expand digital wellness
        instruction in California public schools. This plan shall include all of the following:'
