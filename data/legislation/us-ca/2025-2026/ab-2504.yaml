id: us-ca-2025-2026-ab-2504
jurisdiction: us-ca
session: 2025-2026
identifier: AB 2504
title: 'Community colleges: artificial intelligence: pilot program.'
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
summary: Requires the Chancellor of the California Community Colleges, upon appropriation, to establish
  the Future of Creative Industries Pilot Program at up to 10 community colleges to reskill and upskill
  creative-industry workers displaced or at risk of displacement by generative AI, and to report on outcomes
  by January 1, 2032.
provisions:
  - type: ai-workforce-program
    description: Creates a community college pilot program offering reskilling for creative workers displaced
      by generative AI.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2504#92CHP
      locator: Sec. 1, new 78026.2(a)(3)(A)
      quote: who have been or are at risk of being displaced by generative artificial intelligence, including
        sound engineers, voice actors, concept artists, and employees in entry-level positions, by providing
        structured reskilling and upskilling opportunities through the California Community Colleges.
