id: us-ca-2025-2026-sb-241
jurisdiction: us-ca
session: 2025-2026
identifier: SB 241
title: 'Community colleges: personnel: qualifications.'
classification: bill
education_levels:
  - postsecondary
topics:
  - instructional-use
  - employment-evaluation
summary: Requires the instructor of record for a community college course, and other community college
  instructors and staff, to be persons who meet the minimum or alternative qualifications for their positions,
  while stating that community college staff may still use artificial intelligence tools in operations
  and student services.
provisions:
  - type: prohibits-ai-replacing-educators
    description: The instructor of record for a community college course must be a person meeting faculty
      minimum qualifications.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260SB241#96CHP
      locator: Sec. 1, amended 87359.2(a)
      quote: The instructor of record for a course of instruction shall be a person who meets the minimum
        qualifications to serve as a faculty member teaching credit instruction or a faculty member teaching
        noncredit instruction
