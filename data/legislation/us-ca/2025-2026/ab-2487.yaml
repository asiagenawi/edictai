summary: Enacts the Artificial Intelligence Education and Workforce Development Act, requiring the California
  Community Colleges, upon appropriation, to develop statewide guidance on AI use in community colleges,
  fund model AI curriculum and educational resources, and support AI literacy in instructor preparation
  and professional development.
provisions:
  - type: issues-model-policy
    description: The California Community Colleges must develop and disseminate statewide guidance on
      AI use in community colleges.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2487#98AMD
      locator: Legislative Counsel's Digest
      quote: develop and disseminate to community college districts statewide guidance on the use of AI
        in community colleges
  - type: educator-pd-requirement
    description: The system must encourage districts to give instructors dedicated time for AI learning
      and training.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB2487#98AMD
      locator: Sec. 1, new Ch. 13 (Gov. Code 11910 et seq.), subd. (c)
      quote: The California Community Colleges shall encourage community college districts to allocate
        dedicated time for community college instructors to learn about AI, redesign their lesson plans,
        participate in peer learning, and attend structured AI training.
