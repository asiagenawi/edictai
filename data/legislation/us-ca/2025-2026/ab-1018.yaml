id: us-ca-2025-2026-ab-1018
jurisdiction: us-ca
session: 2025-2026
identifier: AB 1018
title: Automated decision systems.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - assessment
  - admissions
  - equity-access
  - student-privacy
summary: Regulates the development and deployment of automated decision systems used to make consequential
  decisions, with duties for developers and deployers including instructions, notice, and disclosures.
  Consequential decisions include education and vocational training decisions on assessment and placement,
  accreditation, certification, admissions and enrollment, discipline, and financial aid, and education
  deployers subject to FERPA may give notice through FERPA processes.
provisions:
  - type: regulates-ai-assessment
    description: Defines consequential decisions to include education decisions on assessment and placement,
      admissions, discipline, and financial aid.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB1018#92AMD
      locator: Business and Professions Code 22756(d)(2)
      quote: 'Education and vocational training as they relate to any of the following: (A) Assessment
        and placement. (B) Accreditation. (C) Certification. (D) Admissions and enrollment. (E) Discipline.
        (F) Financial aid and scholarships.'
  - type: requires-disclosure
    description: Education deployers subject to FERPA satisfy notice and disclosure duties through FERPA
      processes, including notice to parents or eligible students.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202520260AB1018#92AMD
      locator: Section 1, notice provisions, (3)
      quote: For a consequential decision relating to education, a deployer that is subject to FERPA satisfies
        the notice and disclosure requirements of this section by providing notice and disclosures through
        processes and channels that are consistent with FERPA
