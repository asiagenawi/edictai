id: us-ca-2023-2024-ab-331
jurisdiction: us-ca
session: 2023-2024
identifier: AB 331
title: Automated decision tools.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - assessment
  - admissions
  - academic-integrity
summary: Requires deployers and developers of automated decision tools used for consequential decisions,
  including decisions on education and vocational training such as assessment, detecting student cheating
  or plagiarism, accreditation, admissions, and financial aid, to perform annual impact assessments and
  notify affected persons, and bars deployers from using tools that result in algorithmic discrimination.
provisions:
  - type: regulates-ai-assessment
    description: Education assessment, including detecting student cheating or plagiarism, is a covered
      consequential decision.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB331#95AMD
      locator: Sec. 1, new Section 22756, definition of consequential decision
      quote: '(2) Education and vocational training, including, but not limited to, all of the following:
        (A) Assessment, including, but not limited to, detecting student cheating or plagiarism.'
  - type: ai-in-admissions
    description: Admissions and financial aid decisions are covered consequential decisions.
    education_levels:
      - postsecondary
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB331#95AMD
      locator: Sec. 1, new Section 22756, definition of consequential decision
      quote: (D) Admissions. (E) Financial aid or scholarships.
  - type: requires-disclosure
    description: Deployers must notify persons subject to a consequential decision that an automated decision
      tool is used.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB331#95AMD
      locator: Sec. 1, deployer notice provision
      quote: A deployer shall, at or before the time an automated decision tool is used to make a consequential
        decision, notify any natural person that is the subject of the consequential decision that an
        automated decision tool is being used
  - type: bias-or-equity-requirement
    description: Deployers may not use tools that result in algorithmic discrimination.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB331#95AMD
      locator: Sec. 1, algorithmic discrimination provision
      quote: A deployer shall not use an automated decision tool that results in algorithmic discrimination.
