id: us-ca-2023-2024-ab-2885
jurisdiction: us-ca
session: 2023-2024
identifier: AB 2885
title: Artificial intelligence.
classification: bill
education_levels:
  - postsecondary
topics:
  - institutional-operations
summary: Establishes a uniform statutory definition of artificial intelligence across several California
  codes, including the Education Code provisions governing the California Online Community College, whose
  research and development unit uses machine learning and AI to build out student supports.
