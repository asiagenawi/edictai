id: us-ca-2023-2024-ab-302
jurisdiction: us-ca
session: 2023-2024
identifier: AB 302
title: 'Department of Technology: high-risk automated decision systems: inventory.'
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - institutional-operations
  - equity-access
summary: Requires the Department of Technology to conduct and report annually on an inventory of high-risk
  automated decision systems proposed or used by state agencies, including the California State University.
  High-risk systems include those affecting access to education, and the inventory must describe measures
  to mitigate risks of biased decisions.
provisions:
  - type: bias-or-equity-requirement
    description: Defines high-risk automated decision systems to include those materially affecting access
      to education, subject to an inventory of bias-mitigation measures.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB302#94CHP
      locator: Government Code 11546.45.5(a)(4)
      quote: including decisions that materially impact access to, or approval for, housing or accommodations,
        education, employment, credit, health care, and criminal justice.
