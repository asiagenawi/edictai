id: us-ca-2023-2024-ab-2876
jurisdiction: us-ca
session: 2023-2024
identifier: AB 2876
title: 'Pupil instruction: media literacy: artificial intelligence literacy: curriculum frameworks: instructional materials.'
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Requires California's Instructional Quality Commission to consider adding AI literacy content to the mathematics, science, and history-social science curriculum frameworks when they are next revised after January 1, 2025, and to consider AI literacy in its criteria for evaluating instructional materials in those subjects. The law defines AI literacy as knowing how AI works and how to use it, including its limitations, implications, and ethical considerations.
abstract: The bill would also require the commission to consider incorporating Artificial Intelligence (AI) literacy content into the mathematics, science, and history-social science curriculum frameworks when those frameworks are next revised after January 1, 2025, and would require the commission to consider including AI literacy in its criteria for evaluating instructional materials when the state board next adopts mathematics, science, and history-social science instructional materials, as provided.
provisions:
  - type: ai-in-standards
    description: Directs the Instructional Quality Commission to consider incorporating AI literacy content into the mathematics, science, and history-social science curriculum frameworks at their next revision after January 1, 2025.
    education_levels:
