    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202320240AB2876
      locator: Sec. 1, Education Code 33548(d)(1)
      quote: The commission shall consider incorporating AI literacy content into the mathematics, science, and history-social science curriculum frameworks when those frameworks are next revised after January 1, 2025.
  - type: ai-in-standards
    description: Directs the commission to consider including AI literacy in its criteria for evaluating mathematics, science, and history-social science instructional materials at the next adoption after January 1, 2025.
    education_levels:
      - k12
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202320240AB2876
      locator: Sec. 1, Education Code 33548(d)(2)
      quote: When mathematics, science, and history-social science instructional materials are next adopted by the state board after January 1, 2025, the commission shall consider including AI literacy in its criteria for evaluating instructional materials.
