id: us-ca-2023-2024-sb-1235
jurisdiction: us-ca
session: 2023-2024
identifier: SB 1235
title: 'Public postsecondary education: Artificial Intelligence and Deepfake Working Group.'
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - synthetic-media
summary: Requires California State University, Long Beach, in consultation with other public institutions
  of higher education, to establish an Artificial Intelligence and Deepfake Working Group that reports
  annually to the Legislature. Its scoping plan may address the impact of AI and deepfakes on elementary,
  secondary, and postsecondary education, and its members may include education staff, teachers, faculty,
  and students.
provisions:
  - type: creates-task-force
    description: CSU Long Beach must establish an AI and deepfake working group in consultation with other
      public institutions of higher education.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240SB1235#98AMD
      locator: Education Code 99501(a)
      quote: The California State University, Long Beach, in consultation with other public institutions
        of higher education, shall establish the Artificial Intelligence and Deepfake Working Group.
  - type: creates-task-force
    description: The scoping plan may address the impact of AI and deepfakes on elementary, secondary,
      and postsecondary education.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240SB1235#98AMD
      locator: Education Code 99501(b)(1)
      quote: The impact of the proliferation of artificial intelligence and deepfakes on state and local
        government, California-based businesses and the workforce, elementary, secondary, and postsecondary
        education, and residents of the state.
