id: us-ca-2023-2024-ab-2370
jurisdiction: us-ca
session: 2023-2024
identifier: AB 2370
title: 'Community colleges: faculty: instructor of record: qualifications.'
classification: bill
education_levels:
  - postsecondary
topics:
  - instructional-use
  - employment-evaluation
summary: As introduced, would bar artificial intelligence from replacing community college faculty in
  providing academic instruction to and regular interaction with students, allowing it only as a peripheral
  tool for uses such as course development, assessment, and tutoring. The chaptered version instead requires
  the instructor of record for a course to meet faculty minimum qualifications. The AI provisions were
  removed by amendment.
provisions:
  - type: prohibits-ai-replacing-educators
    description: As introduced, AI could not replace community college faculty for instruction and could
      be used only as a peripheral support tool.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB2370#99INT
      locator: Introduced, Sec. 1, new Section 87709
      quote: Artificial intelligence shall not be used to replace faculty for purposes of providing academic
        instruction to, and regular interaction with, students in a course of instruction, and may only
        be used as a peripheral tool to support faculty in carrying out those tasks
