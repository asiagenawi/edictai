id: us-ca-2023-2024-ab-2930
jurisdiction: us-ca
session: 2023-2024
identifier: AB 2930
title: Automated decision systems.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - assessment
  - admissions
  - academic-integrity
summary: As introduced, would require deployers and developers of automated decision tools to assess them
  for algorithmic discrimination and would bar their use in ways that cause such discrimination in consequential
  decisions, which included education decisions such as assessment, detecting student cheating or plagiarism,
  admissions, and financial aid. The education provisions were removed by amendment, and the latest version
  covers employment and government benefits and services.
provisions:
  - type: bias-or-equity-requirement
    description: As introduced, consequential decisions covered by the automated-decision rules included
      education and vocational training, including assessment, cheating detection, accreditation, admissions,
      and financial aid.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB2930#99INT
      locator: Introduced, Sec. 1, 22756(d)(2)
      quote: '(2) Education and vocational training as it relates to all of the following: (A) Assessment.
        (B) Detecting student cheating or plagiarism. (C) Accreditation. (D) Certification. (E) Admissions.
        (F) Financial aid or scholarships.'
