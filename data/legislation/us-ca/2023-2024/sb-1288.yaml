summary: Requires the State Superintendent of Public Instruction to convene a working group on artificial intelligence in public schools, at least half of whose members are current credentialed teachers. The group must develop guidance for school districts, county offices of education, and charter schools by January 1, 2026, a model AI policy by July 1, 2026, and a report to the Legislature by January 1, 2027. The provisions are repealed on January 1, 2031.
abstract: This bill would require the Superintendent to convene a working group, composed as provided, for specific purposes related to artificial intelligence in public schools, as specified. The bill would require, among other things, the working group to develop, on or before January 1, 2026, guidance for school districts, county offices of education, and charter schools on the safe use of artificial intelligence in education, and to, on or before July 1, 2026, develop a model policy for those local educational agencies regarding the safe and effective use of artificial intelligence in ways that benefit, and do not negatively impact, pupils and educators, as provided.
provisions:
  - type: creates-task-force
    description: Requires the Superintendent to convene an AI working group of teachers, classified staff, administrators, higher education faculty, industry representatives, and pupils, with at least half of members being current credentialed public school teachers.
    education_levels:
      - k12
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240SB1288
      locator: Sec. 2, Education Code 33328.5(b)-(c)
      quote: At least one-half of the workgroup shall be composed of current, credentialed public school teachers serving in elementary and secondary teaching positions with knowledge of the use of artificial intelligence in education.
  - type: issues-model-policy
    description: Requires the working group to develop statewide guidance by January 1, 2026, covering academic integrity, acceptable uses, data privacy and security, parent access to information pupils enter into AI systems, and software procurement.
    education_levels:
      - k12
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240SB1288
      locator: Sec. 2, Education Code 33328.5(d)(3)
      quote: On or before January 1, 2026, develop guidance for local educational agencies and charter schools on the safe use of artificial intelligence in education
  - type: issues-model-policy
    description: Requires the working group to develop a model AI policy for local educational agencies and charter schools by July 1, 2026, including equity and professional development strategies.
    education_levels:
      - k12
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240SB1288
      locator: Sec. 2, Education Code 33328.5(d)(4)
      quote: On or before July 1, 2026, develop a model policy for local educational agencies and charter schools regarding the safe and effective use of artificial intelligence in ways that benefit, and do not negatively impact, pupils and educators.
