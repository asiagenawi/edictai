id: us-ca-2023-2024-ab-2652
jurisdiction: us-ca
session: 2023-2024
identifier: AB 2652
title: 'State Department of Education: artificial intelligence working group.'
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - local-policy-requirement
  - academic-integrity
  - student-privacy
  - procurement
  - educator-training
  - equity-access
summary: Requires the Superintendent of Public Instruction to convene a working group of teachers, staff,
  administrators, faculty, industry, and pupils to assess the use of artificial intelligence in education,
  develop guidance for local educational agencies and charter schools on its safe use by January 1, 2026,
  and develop a model policy by July 1, 2026, covering academic integrity, acceptable uses, data privacy,
  procurement, equity, and professional development.
provisions:
  - type: creates-task-force
    description: The Superintendent must convene a working group on safe and effective uses of AI in education.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB2652#97AMD
      locator: Education Code 33328.5(b)
      quote: The Superintendent, in consultation with the state board, shall convene a working group for
        all of the following purposes
  - type: issues-model-policy
    description: The working group must develop guidance for local educational agencies on the safe use
      of AI, addressing academic integrity, data privacy, and procurement.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB2652#97AMD
      locator: Education Code 33328.5(d)(3)
      quote: On or before January 1, 2026, develop guidance for local educational agencies and charter
        schools on the safe use of artificial intelligence in education that addresses all of the following
  - type: issues-model-policy
    description: The working group must develop a model AI policy for local educational agencies and charter
      schools.
    citation:
      source_url: https://leginfo.legislature.ca.gov/faces/billTextClient.xhtml?bill_id=202320240AB2652#97AMD
      locator: Education Code 33328.5(d)(4)
      quote: On or before July 1, 2026, develop a model policy for local educational agencies and charter
        schools regarding the safe and effective use of artificial intelligence in ways that benefit,
        and do not harm, pupils and educators.
