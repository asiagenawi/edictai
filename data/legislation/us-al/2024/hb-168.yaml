id: us-al-2024-hb-168
jurisdiction: us-al
session: "2024"
identifier: HB 168
title: Crimes & Offenses, raises max. age for offenses involving obscene materials with depictions of
  children, authorizes punitive damages for victims of those offenses, and directs Board of Ed. to require
  policies related to those offenses
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - local-policy-requirement
summary: Revises Alabama child sexual abuse material offenses, including artificially generated material,
  and creates a civil cause of action. Directs the State Board of Education to require each local board
  of education to adopt and distribute a student discipline and education policy that prohibits private,
  explicit, or pornographic images generated with artificial intelligence.
provisions:
  - type: requires-local-ai-policy
    description: Local boards of education must adopt a written policy on student discipline and education
      related to private images and child sexual abuse material.
    citation:
      source_url: https://alison.legislature.state.al.us/files/pdf/SearchableInstruments/2024RS/HB168-enr.pdf
      locator: Section 7(1)
      quote: Develop a written policy on student discipline and education related to the distribution
        of private images
  - type: addresses-deepfakes
    description: The local policy must prohibit private, explicit, or pornographic images generated with
      AI.
    citation:
      source_url: https://alison.legislature.state.al.us/files/pdf/SearchableInstruments/2024RS/HB168-enr.pdf
      locator: Section 7(2)
      quote: Include within the written policy a prohibition of private, explicit, or pornographic images
        generated with artificial intelligence.
