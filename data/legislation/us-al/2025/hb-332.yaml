identifier: HB 332
title: Education, public K-12 schools, completion of approved computer science course required
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: Would have added emerging technologies, including artificial intelligence, to Alabama's statutory definition of computer science and required public school students, beginning with the graduating class of 2031, to earn a computer science credit to graduate. It passed the House but was not taken up for a final Senate vote before the 2025 regular session ended; a similar bill, HB 329, was enacted in 2026.
