id: us-al-2026-hb-329
jurisdiction: us-al
session: '2026'
identifier: HB 329
title: Education; public K-12 schools, completion of approved computer science course required
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
  - workforce
summary: Adds emerging technologies, including artificial intelligence, to Alabama's statutory definition of computer science and requires public school students, beginning with the graduating class of 2032, to earn at least one credit in a department-approved computer science course or a course with embedded computer science skills. The credit can count toward mathematics, science, career and technical education, or elective requirements without raising the total credits needed to graduate.
provisions:
  - type: ai-in-standards
    description: Expands the statutory definition of computer science to include emerging technologies such as artificial intelligence, which approved computer science courses meeting the graduation requirement must cover.
    education_levels:
      - k12
    citation:
      source_url: https://alison.legislature.state.al.us/files/pdf/SearchableInstruments/2026RS/HB329-enr.pdf
      locator: Section 1, amending Code of Alabama 1975 §16-46B-1(2)
      quote: COMPUTER SCIENCE. The study of computers and algorithmic processes, including their principles, their hardware and software designs, their implementation, and their impact on society, and their emerging technologies, including, but not limited to, artificial intelligence.
  - type: ai-course-or-graduation-requirement
    description: Requires students graduating in 2032 and later to earn at least one credit in an approved computer science course or a course with embedded computer science skills.
    education_levels:
      - k12
    citation:
      source_url: https://alison.legislature.state.al.us/files/pdf/SearchableInstruments/2026RS/HB329-enr.pdf
      locator: Section 1, amending Code of Alabama 1975 §16-46B-7(c)(1)
      quote: Beginning with the graduating class of 2032, all public school students shall demonstrate digital literacy by earning at least one credit in a department-approved, high school or college-level computer science course, or by completing a department-approved course with embedded computer science skills and experiences.
