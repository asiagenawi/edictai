id: us-ak-2025-2026-hb-47
jurisdiction: us-ak
session: 2025-2026
identifier: HB 47
title: Chld Sex Abuse Mat; Gen Images; Soc Media
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - employment-evaluation
summary: Creates crimes of distributing and possessing generated obscene child sexual abuse material that
  depicts a child who, by manipulation, creation, or modification, appears to engage in sexual conduct,
  regardless of whether an actual child was used. Requires lifetime revocation of the teaching certificate
  of a person convicted of these crimes.
provisions:
  - type: addresses-deepfakes
    description: Teaching certificates are revoked for life upon conviction for generated child sexual
      abuse material offenses.
    citation:
      source_url: https://www.akleg.gov/PDF/34/Bills/HB0047E.PDF
      locator: Sec. 22, AS 14.20.030(b)
      quote: The commissioner or the Professional Teaching Practices Commission shall revoke for life
        the certificate of a person who has been convicted of a crime, or an attempt, solicitation, or
        conspiracy to commit a crime, involving a minor under AS 11.41.410 - 11.41.460, AS 11.61.121,
        11.61.122, 11.61.125
