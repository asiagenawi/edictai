id: us-ak-2025-2026-sb-2
jurisdiction: us-ak
session: 2025-2026
identifier: SB 2
title: Ai, Deepfakes, Cybersecurity, Data Xfers
classification: bill
education_levels:
  - postsecondary
topics:
  - institutional-operations
  - procurement
  - data-governance
summary: Requires state agencies, defined to include the University of Alaska, that use generative artificial
  intelligence for consequential decisions to complete impact assessments, notify affected individuals,
  obtain consent before acquiring sensitive personal data, and provide an appeals process with human review,
  and bars such systems that involve biometric identification, emotion recognition, cognitive behavioral
  manipulation, or social scoring. Also requires disclosure statements on election-related deepfakes.
provisions:
  - type: requires-disclosure
    description: Agencies using generative AI for consequential decisions must notify affected individuals.
    citation:
      source_url: https://www.akleg.gov/PDF/34/Bills/SB0002A.PDF
      locator: Sec. 2, AS 44.99.720(a)
      quote: A state agency that uses a system that employs generative artificial intelligence for consequential
        decisions shall (1) notify each individual who may be legally or significantly affected by the
        use of the system;
  - type: procurement-standards
    description: Agencies may contract for AI systems for consequential decisions only with vendors meeting
      NIST security and privacy controls.
    citation:
      source_url: https://www.akleg.gov/PDF/34/Bills/SB0002A.PDF
      locator: Sec. 2, AS 44.99.720(d)
      quote: employs artificial intelligence for consequential decisions only if the person has implemented
        security and privacy controls as specified by the National Institute of Standards and Technology
