id: us-ak-2023-2024-hb-306
jurisdiction: us-ak
session: 2023-2024
identifier: HB 306
title: Ai, Deepfakes, Cybersecurity, Data Xfers
classification: bill
education_levels:
  - postsecondary
topics:
  - institutional-operations
  - equity-access
summary: Sets rules for state agency use of artificial intelligence in consequential decisions, including
  inventories, impact assessments, notice to affected individuals, consent, and human appeal, and bars
  certain uses. The definition of state agency includes the University of Alaska. The bill also requires
  disclosure of deepfakes in campaign communications.
provisions:
  - type: requires-disclosure
    description: A state agency, including the University of Alaska, using AI for consequential decisions
      must notify affected individuals.
    citation:
      source_url: https://www.akleg.gov/PDF/33/Bills/HB0306A.PDF
      locator: Sec. 2, new AS 44.99.720(a)(1)
      quote: (1) notify each individual who may be legally or significantly affected by the use of the
        system;
  - type: bias-or-equity-requirement
    description: Impact assessments must analyze unlawful discrimination or disparate impact resulting
      from the agency's AI system.
    citation:
      source_url: https://www.akleg.gov/PDF/33/Bills/HB0306A.PDF
      locator: Sec. 2, new AS 44.99.710(a)(7)
      quote: (7) any unlawful discrimination against or unlawful disparate impact on an individual or
        a group of individuals
