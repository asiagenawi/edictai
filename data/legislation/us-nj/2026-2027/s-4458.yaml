id: us-nj-2026-2027-s-4458
jurisdiction: us-nj
session: 2026-2027
identifier: S 4458
title: Establishes five-year "New Jersey Artificial Intelligence Workforce Transition Act."
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - funding
summary: Establishes the New Jersey Artificial Intelligence Workforce Transition Act, with supports for
  workers displaced by AI. Directs the Council of County Colleges to develop stackable credentials prioritizing
  fields such as AI systems oversight, and directs the Secretary of Higher Education to recommend performance
  supplements for county colleges, including for graduates who were AI-displaced workers.
provisions:
  - type: ai-workforce-program
    description: County colleges are to develop a modular credential framework prioritizing shortage fields
      including AI systems oversight.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4500/4458_I1.HTM
      locator: Sec. 20(b)
      quote: including, but not limited to advanced manufacturing, healthcare technology, cybersecurity,
        data analysis, AI systems oversight, and green infrastructure.
  - type: appropriates-funding
    description: The Secretary of Higher Education must recommend a performance supplement to county college
      aid, with an added amount per graduate who was an AI-displaced worker.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4500/4458_I1.HTM
      locator: Sec. 21(a)(2)
      quote: an additional supplement of $1,500 per graduate who was an AI-displaced worker prior to enrollment.
