identifier: S 4795
title: Requires public school employee to be natural person.
classification: bill
education_levels:
  - k12
topics:
  - employment-evaluation
  - instructional-use
summary: Requires public school employees and contractors performing services in public schools, including
  charter and renaissance schools, to be natural persons, covering positions such as teachers, administrators,
  counselors, and aides. The sponsor's statement says the intent is that interactions between students
  and school personnel be conducted by human beings rather than artificial intelligence.
provisions:
  - type: prohibits-ai-replacing-educators
    description: Public school employees and contractors in positions such as teacher and counselor must
      be natural persons, which the statement says is meant to keep these roles filled by humans rather
      than AI.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S5000/4795_I1.HTM
      locator: Sec. 1
      quote: A public school employee or an individual performing services in a public school pursuant
        to a contract with a board of education or board of trustees of a charter school or renaissance
        school project shall be a natural person.
