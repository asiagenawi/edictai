jurisdiction: us-nj
session: 2026-2027
identifier: A 2742
title: Amends public school laws on harassment, intimidation, and bullying to apply to certain acts against
  teachers and staff members; revises definition of "harassment, intimidation, or bullying" in "Anti-Bullying
  Bill of Rights Act."
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Amends New Jersey's public school harassment, intimidation, and bullying law to cover acts of
  fraudulent impersonation or false depiction by artificial intelligence or deepfake technology, and extends
  the law to protect teachers and staff members. School district anti-bullying policies apply to these
  acts.
provisions:
  - type: addresses-deepfakes
    description: Extends the school harassment, intimidation, and bullying law to impersonation or false
      depiction using AI or deepfake technology.
