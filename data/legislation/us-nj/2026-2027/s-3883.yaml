id: us-nj-2026-2027-s-3883
jurisdiction: us-nj
session: 2026-2027
identifier: S 3883
title: Requires boards of education to adopt policy on use of surveillance systems with artificial intelligence
  capabilities.
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - data-governance
  - student-privacy
summary: Requires school district boards of education and charter or renaissance school boards of trustees
  that use surveillance systems with artificial intelligence capabilities to adopt a policy on the system's
  use. The policy must describe the information collected, how it is used and accessed, and require signage,
  and the board must distribute it to parents and guardians.
provisions:
  - type: requires-local-ai-policy
    description: Boards that use a surveillance system with AI capabilities must adopt a policy on its
      use covering the information collected and how it is used and accessed.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4000/3883_I1.HTM
      locator: Sec. 1(a)
      quote: with artificial intelligence capabilities shall be required to adopt a policy regarding the
        use of the surveillance system.
  - type: requires-disclosure
    description: Boards must post signage where an AI surveillance system is in use and distribute the
      policy to parents and guardians.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4000/3883_I1.HTM
      locator: Sec. 1(a)(5), 1(c)
      quote: The signage shall indicate that a surveillance system with artificial intelligence capabilities
        is in use in the building or on the school grounds.
