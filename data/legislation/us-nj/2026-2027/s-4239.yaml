jurisdiction: us-nj
session: 2026-2027
identifier: S 4239
title: Establishes Office of Algorithmic Civil Rights in DLPS to prevent discrimination in use of algorithms.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Establishes an Office of Algorithmic Civil Rights in the Department of Law and Public Safety
  to audit high-risk algorithmic systems used by State entities, including systems affecting access to
  education, for bias and discriminatory impacts, and to require corrective action plans.
provisions:
  - type: bias-or-equity-requirement
    description: High-risk algorithmic systems subject to bias audits include systems affecting an individual's
      access to education.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4500/4239_I1.HTM
      locator: Sec. 1(a)
      quote: '"High-risk algorithmic system" means any automated or semi-automated system used by a State
        entity that may impact an individual''s ability to access housing, public benefits, employment,
        healthcare, education, or involvement with the criminal justice system.'
