id: us-nj-2026-2027-s-4469
jurisdiction: us-nj
session: 2026-2027
identifier: S 4469
title: Requires boards of education to adopt policy on use of artificial intelligence; requires DOE to
  establish model policy.
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - equity-access
  - instructional-use
summary: Requires each school district board of education to adopt, annually review, and post a policy
  on the responsible use of artificial intelligence in its schools, including a process for questions
  or concerns, equity of student access, and standards and approval processes for AI implementation. Directs
  the Commissioner of Education to develop a model policy.
provisions:
  - type: requires-local-ai-policy
    description: Each board of education must adopt and annually review a policy on responsible AI use
      in district schools.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4500/4469_I1.HTM
      locator: Sec. 1(b)
      quote: The board of education of a school district shall adopt a policy concerning the responsible
        use of artificial intelligence in the schools of the district.
  - type: bias-or-equity-requirement
    description: The district policy must address equity in student access to AI, including for students
      with disabilities and English language learners.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4500/4469_I1.HTM
      locator: Sec. 1(b)(2)
      quote: address potential equity issues concerning student access to artificial intelligence systems,
        including accessibility for students with limited access to technology, students with disabilities,
        and English language learners
  - type: issues-model-policy
    description: The Commissioner of Education must develop a model policy on responsible AI use in school
      districts.
    citation:
      source_url: https://pub.njleg.gov/Bills/2026/S4500/4469_I1.HTM
      locator: Sec. 1(d)
      quote: the Commissioner of Education shall develop and make available a model policy concerning
        the responsible use of artificial intelligence in school districts.
