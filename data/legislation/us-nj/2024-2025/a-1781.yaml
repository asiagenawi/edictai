id: us-nj-2024-2025-a-1781
jurisdiction: us-nj
session: 2024-2025
identifier: A 1781
title: Requires Commissioner of Labor and Workforce Development to conduct study and issue report on impact
  of artificial intelligence on growth of State's economy.
classification: bill
education_levels:
  - postsecondary
topics:
  - task-force
  - workforce
summary: Requires the Commissioner of Labor and Workforce Development, with the Commission on Science,
  Innovation and Technology, to study the impact of AI and automation on the State's economy and labor
  market for highly skilled professionals. The report must address the implications for long-term plans
  for educating the next generation of highly skilled employees.
provisions:
  - type: creates-task-force
    description: Requires a state study of AI's labor market impacts that includes implications for educating
      future highly skilled employees.
