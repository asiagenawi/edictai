summary: Establishes an Artificial Intelligence Grant Program and Artificial Intelligence Education Fund
  in the Office of the Secretary of Higher Education to award up to four annual grants of up to $25,000
  to nonprofit entities providing comprehensive education and training in artificial intelligence.
