id: us-nj-2024-2025-s-4867
jurisdiction: us-nj
session: 2024-2025
identifier: S 4867
title: Creates "New Jersey Responsible AI Advancement and Workforce Protection Act."
classification: bill
education_levels:
  - postsecondary
topics:
  - workforce
  - equity-access
summary: Creates the New Jersey Responsible AI Advancement and Workforce Protection Act, establishing
  an AI Horizon Fund for worker retraining and directing the Department of Labor and Workforce Development
  to engage community colleges on AI certification curricula. Defines high-risk AI systems to include
  those used in education and subjects them to impact assessments and ethical-use requirements.
provisions:
  - type: ai-workforce-program
    description: The department is to engage with community colleges to develop curricula around AI certification.
    citation:
      source_url: https://pub.njleg.gov/Bills/2024/S5000/4867_I1.HTM
      locator: Para. (3), department duties following Sec. 4(a)
      quote: engage with community colleges to develop curricula around AI certification
  - type: bias-or-equity-requirement
    description: Defines high-risk AI systems, subject to impact assessment requirements, to include AI
      used in education.
    citation:
      source_url: https://pub.njleg.gov/Bills/2024/S5000/4867_I1.HTM
      locator: Sec. 3
      quote: '"High-risk AI system" means any AI system used in employment, housing, healthcare, education,
        criminal justice, or public services.'
