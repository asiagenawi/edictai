jurisdiction: us-nj
session: 2024-2025
identifier: A 4736
title: Amends public school laws on harassment, intimidation, and bullying to apply to certain acts against
  teachers and staff members; revises definition of "harassment, intimidation, or bullying" in "Anti-Bullying
  Bill of Rights Act."
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Amends New Jersey's public school harassment, intimidation and bullying law to cover acts against
  teachers and staff members and to cover fraudulent impersonation or false depiction by means of artificial
  intelligence or deepfake technology. School district anti-bullying policies, reporting and school safety
  team provisions apply to these acts.
provisions:
  - type: addresses-deepfakes
    description: Extends the public school harassment, intimidation and bullying law to AI or deepfake
      impersonation and false depiction.
