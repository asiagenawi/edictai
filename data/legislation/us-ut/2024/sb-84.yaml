classification: bill
education_levels:
  - k12
topics:
  - funding
  - workforce
  - ai-literacy
summary: Revises provisions on the Governor's Office of Economic Opportunity and, in the amended third
  substitute, creates the Innovation in Artificial Intelligence Grant Pilot Program to award a grant to
  a business entity, working with a public or private school, to develop a program and curriculum teaching
  a course on artificial intelligence to K-12 students and preparing them for technology careers.
provisions:
  - type: appropriates-funding
    description: Creates a pilot grant for a business entity to develop a curriculum and course on AI
      for students, in partnership with a public or private school.
    citation:
      source_url: https://le.utah.gov/~2024/bills/sbillamd/SB0084S03.pdf
      locator: Amended (3rd Sub.), Section 30, 63N-3-1302(2)
      quote: 'The purpose of the pilot program is to award a grant to a business entity to develop a program,
        material, and curriculum to: (i) teach a course on artificial intelligence to students, with an
        emphasis on practical training; and (ii) prepare students for career opportunities in technology.'
