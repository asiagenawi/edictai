identifier: HB 121
title: Health Education Amendments
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - synthetic-media
summary: Requires the State Board of Education to establish health curriculum requirements that include
  sexual assault resource strategies, sexual violence behavior prevention, and the legal implications
  of electronically distributing sexually explicit images, including images created with artificial intelligence.
  Requires local education agencies to review local data to inform health education.
provisions:
  - type: ai-in-standards
    description: State health curriculum requirements must include the legal implications of creating
      or distributing sexually explicit images of an individual using AI.
    citation:
      source_url: https://le.utah.gov/Session/2025/bills/introduced/HB0121.pdf
      locator: Sec. 1, 53G-10-402(2)(a)(vii)
      quote: the legal implications of electronically distributing sexually explicit images of an individual,
        including creating or distributing pornographic or sexually explicit images of an individual using
        technology including artificial intelligence
