summary: Creates the Artificial Intelligence in Education Task Force, with legislative, education, higher
  education, privacy, and industry members, to study and recommend policies on AI in public and higher
  education, including literacy, student privacy, academic integrity, and equitable access. Requires quarterly
  meetings and an annual report to legislative committees.
provisions:
  - type: creates-task-force
    description: Creates a task force on AI in education that must study and make recommendations to the
      Legislature and public and higher education institutions.
    citation:
      source_url: https://le.utah.gov/Session/2025/bills/amended/AV_HB0168_2025-02-24_16-32-30.pdf
      locator: Sec. 1, 36-29-113(2), (10)
      quote: 'study and make recommendations to the Legislature, public education institutions, and higher
        education institutions on: (i) policies related to the use of artificial intelligence in education'
