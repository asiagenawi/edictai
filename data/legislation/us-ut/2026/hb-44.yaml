id: us-ut-2026-hb-44
jurisdiction: us-ut
session: "2026"
identifier: HB 44
title: School Security Personnel Standards
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - local-policy-requirement
summary: Revises school safety personnel standards and adds AI glasses to the devices students may not
  use at school during classroom hours, with local education agency policies required to permit use for
  emergencies, accommodations, and medical needs.
provisions:
  - type: limits-ai-instructional-use
    description: Students may not use AI glasses at school during classroom hours except as LEA policy
      allows.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0044.pdf
      locator: Section 7, 53G-7-227(3)
      quote: Except as provided in Subsection (2), a student may not use a cellphone, smart watch, AI
        glasses, or emerging technology at a school during classroom hours.
  - type: requires-local-ai-policy
    description: Each LEA must adopt a policy permitting student use of AI glasses and other devices in
      emergencies and for accommodations or medical necessity.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0044.pdf
      locator: Section 7, 53G-7-227(2)(a)
      quote: shall establish a policy that allows a student to use a cellphone, smart watch, AI
