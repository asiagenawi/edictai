id: us-ut-2026-hb-197
jurisdiction: us-ut
session: "2026"
identifier: HB 197
title: School Materials Amendments
classification: bill
education_levels:
  - k12
topics:
  - procurement
  - educator-training
summary: Revises rules on sensitive instructional materials in public schools, including review duties
  for local education agencies and prohibitions on vendors of digital instructional material. As introduced,
  would require the state board to contract with a book reviewer whose service uses artificial intelligence
  assisted analysis to screen materials, and require each local education agency to train schools on that
  AI tool. The AI provisions were removed by amendment.
provisions:
  - type: procurement-standards
    description: Would require the state board to contract with a book reviewer whose service uses AI-assisted
      analysis to screen instructional materials.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/HB0197.pdf
      locator: Introduced, Section 2, 53G-10-103(8)(e)
      quote: (ii) uses technology, including artificial intelligence assisted analysis, to screen the
        instructional materials described in Subsection (8)(e)(i) for violations of this section.
  - type: educator-pd-requirement
    description: Would require each LEA to train schools on using the AI tool the state board procures.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/HB0197.pdf
      locator: Introduced, Section 2, 53G-10-103(11)(c)
      quote: (c) provide training to each school on how to utilize the artificial intelligence tool the
        state board procures under Subsection (8)(e);
