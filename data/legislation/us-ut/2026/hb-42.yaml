id: us-ut-2026-hb-42
jurisdiction: us-ut
session: "2026"
identifier: HB 42
title: School Cybersecurity Amendments
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - local-policy-requirement
summary: Adds AI glasses to the devices students may not use at school during classroom hours, requires
  local education agencies to adopt policies allowing use for emergencies, crisis lines, accommodations,
  and medical needs, and directs the State Board of Education to set cybersecurity standards for local
  education agencies.
provisions:
  - type: limits-ai-instructional-use
    description: Students may not use AI glasses at school during classroom hours except as LEA policy
      allows.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/HB0042S03.pdf
      locator: Sec. 1, 53G-7-227(3)
      quote: Except as provided in Subsection (2), a student may not use a cellphone, smart watch, AI
        glasses, or emerging technology at a school during classroom hours.
  - type: requires-local-ai-policy
    description: Each LEA must adopt a policy permitting student use of AI glasses and other devices in
      emergencies and for accommodations or medical necessity.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/HB0042S03.pdf
      locator: Sec. 1, 53G-7-227(2)(a)
      quote: shall establish a policy that allows a student to use a cellphone, smart watch, AI glasses,
        or emerging technology
