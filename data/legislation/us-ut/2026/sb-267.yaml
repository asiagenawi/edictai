id: us-ut-2026-sb-267
jurisdiction: us-ut
session: "2026"
identifier: SB 267
title: Software in Education Amendments
classification: bill
education_levels:
  - k12
topics:
  - task-force
  - student-privacy
  - data-governance
  - procurement
summary: Requires the State Board of Education to study best practices for software used in public schools,
  including student data practices, algorithmic systems that may prioritize engagement over learning,
  and transparency about embedded analytics or artificial intelligence systems, and to publish and distribute
  guidance to local education agencies before July 1, 2027.
provisions:
  - type: creates-task-force
    description: The state board must study software practices in schools, including transparency about
      embedded AI systems and algorithmic systems that may prioritize engagement over learning.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/SB0267.pdf
      locator: Sec. 2, (3)(a)(ix)-(xi)
      quote: 'transparency regarding: (A) data the software collects; (B) third-party service providers
        or sub-processors; and (C) embedded analytics or artificial intelligence systems'
  - type: issues-model-policy
    description: The state board must publish guidance and best practices from the study and distribute
      them to each LEA.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/SB0267.pdf
      locator: Sec. 2, (4)
      quote: publish on the state board's website guidance and best practices identified through the study
        described in this section; and (b) distribute the guidance and best practices to each LEA
