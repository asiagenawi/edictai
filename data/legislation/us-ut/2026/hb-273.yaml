summary: >-
  Requires the Utah State Board of Education to publish a model policy on balanced classroom
  technology use that includes a model artificial intelligence use policy, and requires each
  local education agency to adopt its own AI use policy based on that model. It also adds AI to
  the core computer science standards and allows high schools to offer an AI "sandbox" course.
abstract: >-
  This bill requires the State Board of Education to create model policies on the use of
  technology and artificial intelligence in a public school classroom.
provisions:
  - type: issues-model-policy
    description: >-
      Directs the state board to publish and maintain a model AI use policy, part of a balanced
      technology model policy to be posted before December 1, 2026.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0273.xml
      locator: Utah Code 53G-7-1402(2); 53G-7-228(5)
      quote: The state board shall publish and maintain a model artificial intelligence use policy
  - type: requires-local-ai-policy
    description: >-
      Requires each LEA to adopt an AI use policy based on the model, submit it to the state board,
      train staff on it, and review it at least every two years; the model policy is the default for
      an LEA that fails to adopt one.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0273.xml
      locator: Utah Code 53G-7-1402(3)-(4)
      quote: >-
        An LEA shall produce and adopt an artificial intelligence use policy based on the model
        policy described in Subsection (2).
  - type: regulates-ai-assessment
    description: >-
      The model policy must prohibit educators from using generative AI to independently grade
      student work or make high-stakes determinations about placement, discipline, progression, or
      program eligibility.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0273.xml
      locator: Utah Code 53G-7-1402(1), (2)(f)
      quote: >-
        prohibits educators from using generative artificial intelligence to independently grade
        student work or issue high-stakes determinations
  - type: academic-integrity-rules
    description: >-
      The model policy must prohibit students from using generative AI to complete academic work
      unless an educator authorizes it for a specific instructional purpose.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0273.xml
      locator: Utah Code 53G-7-1402(2)(h)
  - type: requires-disclosure
    description: >-
      The model policy must require written notice to parents when a school or educator uses
      generative AI for instruction, assessment, or classroom activities.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0273.xml
      locator: Utah Code 53G-7-1402(2)(j)
  - type: ai-in-standards
    description: >-
      Requires the state board to include AI standards in the core computer science standards.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0273.xml
      locator: Utah Code 53E-4-202(2)(b)
      quote: include artificial intelligence standards in core computer science standards
  - type: ai-workforce-program
    description: >-
      Allows an LEA to offer an AI sandbox course to students in grades 9 through 12 aligned with
      workforce needs in AI, data science, and related fields.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0273.xml
      locator: Utah Code 53G-7-1403(1)
