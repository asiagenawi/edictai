id: us-ut-2026-sb-322
jurisdiction: us-ut
session: "2026"
identifier: SB 322
title: Educational Technology Regulatory Sandbox
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - student-privacy
  - academic-integrity
  - assessment
  - educator-training
  - safety-wellbeing
summary: Creates an Educational Technology Regulatory Sandbox in public education for time-limited pilots
  of artificial intelligence technologies, with parental notice and opt-out rights, limits on AI grading
  and placement decisions without educator review, student disclosure of substantial AI use, and state
  board training requirements for educators.
provisions:
  - type: requires-disclosure
    description: Sandbox participants must give parents annual notice of AI use and disclose when students
      will interact with conversational AI.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/SB0322S01.pdf
      locator: 53E-11 (sandbox participant duties), (5)(a)-(b)
      quote: annual written notice of artificial intelligence use in the parent's student's education;
        (b) clear disclosure when the parent's student will interact with conversational artificial intelligence
  - type: regulates-ai-assessment
    description: Vendor AI systems may not assign final grades or make placement decisions without educator
      review and approval.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/SB0322S01.pdf
      locator: 53E-11 (vendor requirements), (2)(a)-(b)
      quote: does not independently assign final grades without educator review and approval; (b) does
        not make academic placement decisions without educator review and approval
  - type: academic-integrity-rules
    description: Sandbox participants must require students to disclose substantial use of AI.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/SB0322S01.pdf
      locator: 53E-11 (vendor requirements), (5)
      quote: A sandbox participant shall require a student to disclose use of substantial artificial
  - type: educator-pd-requirement
    description: The state board must develop educator training requirements and curricula covering AI
      use, integrity, privacy, and bias.
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/introduced/SB0322S01.pdf
      locator: Section 15, new 53E-11-212(2)
      quote: 'The state board shall develop training requirements and curricula in consultation with:
        (a) classroom teachers with artificial intelligence experience in educational settings'
