identifier: H.B. 218
title: Digital Skills Amendments
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: >-
  Requires the State Board of Education to have standards in place, beginning with the 2027-2028
  school year, for a grade 7 or 8 digital skills course whose concepts include artificial
  intelligence literacy alongside topics such as digital privacy, cybersecurity, media literacy,
  and algorithms. It also lets the state superintendent create an advisory tech council on
  technology education.
abstract: >-
  This bill changes the requirements for the existing grades 7 and 8 required digital course.
provisions:
  - type: ai-in-standards
    description: >-
      Defines digital skills concepts to include AI literacy and requires state board standards for
      a grade 7 or 8 digital skills course beginning in the 2027-2028 school year.
    education_levels:
      - k12
    citation:
      source_url: https://le.utah.gov/Session/2026/bills/enrolled/HB0218.xml
      locator: Utah Code 53E-4-208(1)(b)(iii), (2)
      quote: >-
        artificial intelligence literacy, including understanding artificial intelligence
        capabilities, limitations, ethical considerations, and societal implications
