identifier: SB 860
title: 'Appropriations: school aid omnibus; fiscal year 2026-2027 appropriations for K-12 school aid,
  higher education, and community colleges; provide for. Amends secs. 11, 201 & 236 of 1979 PA 94 (MCL
  388.1611 et seq.). TIE BAR WITH: SB 0903''26'
classification: bill
education_levels:
  - k12
topics:
  - research
  - funding
  - instructional-use
summary: Makes fiscal year 2026-2027 omnibus appropriations for Michigan K-12 school aid, higher education,
  and community colleges. Directs Michigan Virtual University, from its section 98 school aid allocation,
  to operate a statewide laboratory for research, best practices, policy formulation, and awareness about
  responsible use of artificial intelligence in schools.
provisions:
  - type: appropriates-funding
    description: Directs school aid funds allocated to Michigan Virtual University to operate a statewide
      lab on responsible AI use in schools.
    citation:
      source_url: https://legislature.mi.gov/documents/2025-2026/billengrossed/Senate/htm/2026-SEBS-0860.htm
      locator: Sec. 98(5)
      quote: the identification and dissemination of best practices, rigorous experimentation, policy
        formulation, and proactive efforts to enhance awareness about the responsible utilization of artificial
        intelligence in schools.
