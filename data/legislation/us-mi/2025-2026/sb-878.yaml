id: us-mi-2025-2026-sb-878
jurisdiction: us-mi
session: 2025-2026
identifier: SB 878
title: 'Appropriations: omnibus; supplemental appropriations for multiple departments and branches for
  the fiscal year 2026-2027 and supplemental appropriations for fiscal year 2025-2026; provide for. Creates
  appropriation act.'
classification: bill
education_levels:
  - k12
topics:
  - funding
  - local-policy-requirement
  - instructional-use
  - assessment
summary: Makes supplemental omnibus appropriations for Michigan state departments for fiscal years 2025-2026
  and 2026-2027. Allocates up to $250,000 for the Department of Education to develop state artificial
  intelligence model policies, guidelines, and implementation tools and to integrate AI into its teaching,
  learning, and assessment supports for school districts.
provisions:
  - type: issues-model-policy
    description: Funds the Department of Education to develop state AI model policies, guidelines, and
      implementation tools for schools.
    citation:
      source_url: https://legislature.mi.gov/documents/2025-2026/publicact/htm/2026-PA-0021.htm
      locator: Sec. 1000
      quote: there is allocated an amount not to exceed $250,000.00 for the fiscal year 2026-2027 only
        for the department to develop state artificial intelligence model policies, guidelines, and implementation
        tools
  - type: appropriates-funding
    description: Funds integration of AI into department teaching, learning, and assessment supports for
      school districts.
    citation:
      source_url: https://legislature.mi.gov/documents/2025-2026/publicact/htm/2026-PA-0021.htm
      locator: Sec. 1000
      quote: begin integrating artificial intelligence into department teaching, learning, and assessment
        services and supports for school districts.
