id: us-mi-2025-2026-sb-166
jurisdiction: us-mi
session: 2025-2026
identifier: SB 166
title: 'Appropriations: school aid; fiscal year 2025-2026 appropriations for K-12 school aid; provide
  for. Amends, adds & repeals (See bill).'
classification: bill
education_levels:
  - k12
topics:
  - research
  - funding
  - instructional-use
summary: Makes fiscal year 2025-2026 appropriations for Michigan K-12 school aid. Directs Michigan Virtual
  University, from its section 98 school aid allocation, to operate a statewide laboratory for research,
  best practices, policy formulation, and awareness about responsible use of artificial intelligence in
  schools.
provisions:
  - type: appropriates-funding
    description: Directs school aid funds allocated to Michigan Virtual University to operate a statewide
      lab on responsible AI use in schools.
    citation:
      source_url: https://legislature.mi.gov/documents/2025-2026/publicact/htm/2025-PA-0015.htm
      locator: Sec. 98(5)
      quote: the identification and dissemination of best practices, rigorous experimentation, policy
        formulation, and proactive efforts to enhance awareness about the responsible utilization of artificial
        intelligence in schools.
