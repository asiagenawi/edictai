summary: Amends Michigan school aid appropriations. Directs Michigan Virtual University, from its section
  98 school aid allocation, to operate a statewide laboratory for research, best practices, policy formulation,
  and awareness about responsible use of artificial intelligence in schools.
provisions:
  - type: appropriates-funding
    description: Directs school aid funds allocated to Michigan Virtual University to operate a statewide
      lab on responsible AI use in schools.
    citation:
      source_url: https://legislature.mi.gov/documents/2025-2026/billengrossed/House/htm/2025-HEBH-4577.htm
      locator: Sec. 98(5)
      quote: the identification and dissemination of best practices, rigorous experimentation, policy
        formulation, and proactive efforts to enhance awareness about the responsible utilization of artificial
        intelligence in schools.
