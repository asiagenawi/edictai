  - funding
summary: Makes fiscal year 2025-2026 appropriations for the Michigan Department of Education. Directs
  the Department to use media literacy training funds to design, implement, and evaluate professional
  learning and optional curriculum modules for teaching artificial intelligence and media literacy.
provisions:
  - type: educator-pd-requirement
    description: Directs funds for professional learning and optional curriculum modules on teaching AI
      and media literacy.
    citation:
      source_url: https://legislature.mi.gov/documents/2025-2026/billengrossed/Senate/htm/2025-SEBS-0165.htm
      locator: Sec. 705
      quote: From the funds appropriated in part 1 for media literacy training, the department shall design,
        implement, and evaluate professional learning and optional curriculum modules for the purpose
        of teaching artificial intelligence and media literacy in this state.
