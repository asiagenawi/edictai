id: us-mi-2025-2026-hb-4706
jurisdiction: us-mi
session: 2025-2026
identifier: HB 4706
title: 'Appropriations: omnibus; appropriations for multiple departments and branches for the fiscal year
  2025-2026 and supplemental appropriations for fiscal year 2024-2025; provide for. Creates appropriation
  act.'
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - educator-training
  - funding
summary: Makes fiscal year 2025-2026 omnibus appropriations for Michigan state departments. Directs the
  Department of Education to use media literacy training funds to design, implement, and evaluate professional
  learning and optional curriculum modules for teaching artificial intelligence and media literacy.
provisions:
  - type: educator-pd-requirement
    description: Directs funds for professional learning and optional curriculum modules on teaching AI
      and media literacy.
    citation:
      source_url: https://legislature.mi.gov/documents/2025-2026/publicact/htm/2025-PA-0022.htm
      locator: Sec. 1001
      quote: From the funds appropriated in part 1 for media literacy training, the department shall design,
        implement, and evaluate professional learning and optional curriculum modules for the purpose
        of teaching artificial intelligence and media literacy in this state.
