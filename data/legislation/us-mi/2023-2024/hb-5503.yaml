id: us-mi-2023-2024-hb-5503
jurisdiction: us-mi
session: 2023-2024
identifier: HB 5503
title: 'Appropriations: school aid; fiscal year 2024-2025 appropriations for K-12 school aid; provide
  for. Amends secs. 11 & 31aa of 1979 PA 94 (MCL 388.1611 & 388.1631aa).'
classification: bill
education_levels:
  - k12
topics:
  - funding
  - research
  - instructional-use
summary: As engrossed in May 2024, would direct the Michigan Virtual University to allocate up to $500,000
  of its Sec. 98 allocation to operate a statewide laboratory for research, best practices, policy formulation,
  and awareness about the responsible use of artificial intelligence in schools. The AI provisions were
  removed by amendment.
provisions:
  - type: appropriates-funding
    description: Directs up to $500,000 for a statewide laboratory on research, best practices, and policy
      on responsible AI use in schools.
    citation:
      source_url: https://legislature.mi.gov/documents/2023-2024/billengrossed/House/htm/2024-HEBH-5503.htm
      locator: Engrossed (May 8, 2024), Sec. 98(5)
      quote: the Michigan Virtual University shall allocate up to $500,000.00 to operate a comprehensive
        statewide laboratory designed to function as a hub for cutting-edge research, the identification
        and dissemination of best practices, rigorous experimentation, policy formulation
  - type: appropriates-funding
    description: The laboratory's work includes efforts to raise awareness about responsible AI use in
      schools.
    citation:
      source_url: https://legislature.mi.gov/documents/2023-2024/billengrossed/House/htm/2024-HEBH-5503.htm
      locator: Engrossed (May 8, 2024), Sec. 98(5)
      quote: proactive efforts to enhance awareness about the responsible utilization of artificial intelligence
        in schools
