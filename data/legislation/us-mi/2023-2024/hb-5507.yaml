jurisdiction: us-mi
session: 2023-2024
identifier: HB 5507
title: 'Appropriations: school aid; fiscal year 2024-2025 omnibus appropriations for K-12 school aid,
  higher education, and community colleges; provide for. Amends, adds & repeals (See bill).'
classification: bill
education_levels:
  - k12
topics:
  - research
  - funding
  - instructional-use
summary: Makes fiscal year 2024-2025 omnibus appropriations for Michigan K-12 school aid, higher education,
  and community colleges. Directs Michigan Virtual University, from its section 98 school aid allocation,
  to operate a statewide laboratory for research, best practices, policy formulation, and awareness about
  responsible use of artificial intelligence in schools.
provisions:
  - type: appropriates-funding
    description: Directs school aid funds allocated to Michigan Virtual University to operate a statewide
      lab on responsible AI use in schools.
    citation:
      source_url: https://legislature.mi.gov/documents/2023-2024/publicact/htm/2024-PA-0120.htm
      locator: Sec. 98(5)
      quote: proactive efforts to enhance awareness about the responsible utilization of artificial intelligence
        in schools.
