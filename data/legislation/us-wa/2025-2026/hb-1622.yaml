id: us-wa-2025-2026-hb-1622
jurisdiction: us-wa
session: 2025-2026
identifier: HB 1622
title: Allowing bargaining over matters related to the use of artificial intelligence.
classification: bill
education_levels:
  - postsecondary
topics:
  - employment-evaluation
summary: Requires public employers under the state's public employee bargaining laws to bargain over decisions
  to adopt or modify artificial intelligence technology when the change affects employees' wages or performance
  evaluations. Makes the management right of institutions of higher education over the use of technology
  subject to this duty for their covered employees.
