identifier: SB 6299
title: Concerning artificial intelligence and instructional staff.
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - employment-evaluation
summary: Allows artificial intelligence to supplement or enhance instruction in public schools but prohibits
  it from replacing certificated instructional staff or paraeducators.
provisions:
  - type: prohibits-ai-replacing-educators
    description: AI may not replace certificated instructional staff or paraeducators.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/6299.pdf
      locator: Sec. 1, new section in chapter 28A.400 RCW
      quote: Artificial intelligence may supplement or enhance instruction. Artificial intelligence may
        not replace certificated instructional staff or paraeducators.
