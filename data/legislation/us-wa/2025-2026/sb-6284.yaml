id: us-wa-2025-2026-sb-6284
jurisdiction: us-wa
session: 2025-2026
identifier: SB 6284
title: Providing consumer protections for artificial intelligence systems.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: Regulates deployers of high-risk artificial intelligence systems used to make consequential decisions,
  including decisions on education enrollment or opportunity, requiring them to protect consumers from
  algorithmic discrimination, maintain risk management programs, and complete impact assessments.
provisions:
  - type: bias-or-equity-requirement
    description: Includes decisions about education enrollment or opportunity among the consequential
      decisions the act covers.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/6284-S.pdf
      locator: Sec. 2(3)
      quote: 'means any decision that has a material legal or similarly significant effect on the provision
        or denial of any consumer to: (a) Pardon, parole, probation, or any other release from incarceration
        or court supervision; (b) Education enrollment or an education opportunity;'
  - type: bias-or-equity-requirement
    description: Requires deployers of high-risk AI systems to protect consumers from algorithmic discrimination.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/6284-S.pdf
      locator: Sec. 3(1)(a)
      quote: each deployer of a high-risk artificial intelligence system must use industry-standard means
        to protect consumers from any known or reasonably foreseeable risks of algorithmic discrimination.
