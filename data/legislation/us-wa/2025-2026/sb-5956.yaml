id: us-wa-2025-2026-sb-5956
jurisdiction: us-wa
session: 2025-2026
identifier: SB 5956
title: Addressing artificial intelligence, student discipline, and surveillance in public schools.
classification: bill
education_levels:
  - k12
topics:
  - institutional-operations
  - student-privacy
  - equity-access
  - local-policy-requirement
  - safety-wellbeing
summary: Restricts the use of artificial intelligence, automated decision systems, and surveillance technologies
  in K-12 student discipline and school safety, and limits disclosure of student information generated
  by such systems to law enforcement. Directs the superintendent of public instruction to update its AI
  guidance and the school directors' association to develop a model policy.
provisions:
  - type: restricts-student-data-use
    description: Limits disclosure to law enforcement of student information obtained or generated through
      AI, automated decision, or surveillance systems.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/5956-S.pdf
      locator: Sec. 6(1)
      quote: 'Student personal information obtained or generated through an artificial intelligence system,
        automated decision system, or school surveillance technology may be disclosed to law enforcement
        only:'
  - type: issues-model-policy
    description: Directs the superintendent of public instruction to update its human-centered AI guidance
      to address discipline and surveillance.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/5956-S.pdf
      locator: Sec. 9
      quote: update its guidance on human-centered artificial intelligence in K–12 education
  - type: issues-model-policy
    description: Requires the school directors' association to develop a model policy and procedure for
      schools to implement the act.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/5956-S.pdf
      locator: Sec. 10(1)
      quote: By February 1, 2027, the Washington state school directors' association must develop, and
        periodically update, a model policy and procedure that school districts, charter schools, and
        state-tribal education compact schools may adopt or adapt
  - type: bias-or-equity-requirement
    description: Requires the model policy to address avoiding discriminatory impacts of AI systems on
      protected students.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/5956-S.pdf
      locator: Sec. 10(3)(b)
      quote: Strategies to avoid discriminatory or disproportionately harmful impacts on students with
        protected class status under chapters 49.60, 28A.640, and 28A.642 RCW
