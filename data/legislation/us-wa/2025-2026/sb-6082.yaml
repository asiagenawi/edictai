jurisdiction: us-wa
session: 2025-2026
identifier: SB 6082
title: Safeguarding student financial aid from fraud.
classification: bill
education_levels:
  - postsecondary
topics:
  - task-force
  - admissions
summary: Directs the joint legislative audit and review committee to audit financial aid fraud at institutions
  of higher education, including systemic weaknesses that allow fictitious student enrollment through
  the use of artificial intelligence. Requires a report with findings and recommendations by December
  1, 2027.
provisions:
  - type: creates-task-force
    description: Requires an audit that identifies weaknesses exploited to enroll fictitious students,
      including through AI.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Senate%20Bills/6082.pdf
      locator: Sec. 1(1)(d)
      quote: Identify systemic weaknesses that may be exploited to enroll fictitious students, including
        the use of artificial intelligence for such purposes;
