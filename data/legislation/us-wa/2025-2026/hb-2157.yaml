id: us-wa-2025-2026-hb-2157
jurisdiction: us-wa
session: 2025-2026
identifier: HB 2157
title: Regulating high-risk artificial intelligence system development, deployment, and use.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: Regulates developers and deployers of high-risk artificial intelligence systems used to make
  consequential decisions, including decisions on education enrollment or education opportunity, and requires
  them to protect consumers from algorithmic discrimination.
provisions:
  - type: bias-or-equity-requirement
    description: Includes decisions about education enrollment or opportunity among the consequential
      decisions the act covers.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/House%20Bills/2157-S.pdf
      locator: Sec. 1(3)
      quote: 'effect on the provision or denial to any consumer of: (a) Parole, probation, a pardon, or
        any other release from incarceration or court supervision; (b) Education enrollment or an education
        opportunity;'
  - type: bias-or-equity-requirement
    description: Requires deployers of high-risk AI systems to protect consumers from algorithmic discrimination.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/House%20Bills/2157-S.pdf
      locator: Sec. 3(1)
      quote: A deployer of a high-risk artificial intelligence system shall use reasonable care to protect
        consumers from any known or reasonably foreseeable risks of algorithmic discrimination.
