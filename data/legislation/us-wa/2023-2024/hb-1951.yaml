id: us-wa-2023-2024-hb-1951
jurisdiction: us-wa
session: 2023-2024
identifier: HB 1951
title: Promoting ethical artificial intelligence by protecting against algorithmic discrimination.
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - institutional-operations
summary: Regulates developers and deployers of automated decision tools that use artificial intelligence
  to make consequential decisions, including decisions on education and vocational training, by requiring
  impact assessments, developer documentation, and measures against algorithmic discrimination.
provisions:
  - type: bias-or-equity-requirement
    description: Developers and deployers of AI tools making consequential decisions, including in education,
      must assess and mitigate risks of algorithmic discrimination.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2023-24/Pdf/Bills/House%20Bills/1951.pdf
      locator: Sec. 1(4)(b) and Sec. 2
      quote: An assessment of the reasonably foreseeable risks of algorithmic discrimination arising from
        the use of the automated decision tool known to the deployer at the time of the impact assessment
