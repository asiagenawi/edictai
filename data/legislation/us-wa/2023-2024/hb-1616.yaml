summary: Creates the People's Privacy Act, establishing personal data rights and prohibiting covered entities
  and Washington governmental entities from using artificial intelligence-enabled profiling to make decisions
  with legal or similarly significant effects, which include educational enrollment, and barring discriminatory
  processing of personal information in education and other opportunities.
provisions:
  - type: bias-or-equity-requirement
    description: Prohibits using AI-enabled profiling to make significant decisions, which include educational
      enrollment.
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2023-24/Pdf/Bills/House%20Bills/1616.pdf
      locator: AI-enabled profiling section, subsection (1)
      quote: denial or degradation of consequential services or support, such as financial or lending
        services, housing, insurance, educational enrollment, criminal justice, employment opportunities,
        health care services, and access to basic necessities
