id: us-wa-2023-2024-sb-5838
jurisdiction: us-wa
session: 2023-2024
identifier: E2SSB 5838
title: Establishing an artificial intelligence task force
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - task-force
  - workforce
summary: >-
  Created a Washington artificial intelligence task force, staffed by the Office of the
  Attorney General, to study AI use in the public and private sectors and recommend
  guidelines and legislation to the Legislature. The task force's executive committee may
  convene subcommittees on topics including education and workforce development.
provisions:
  - type: creates-task-force
    description: Establishes an AI task force whose subcommittee topics include education and workforce development, with recommendations due to the Legislature.
    education_levels:
      - k12
      - postsecondary
    citation:
      source_url: https://lawfilesext.leg.wa.gov/biennium/2023-24/Pdf/Bills/Session%20Laws/Senate/5838-S2.SL.pdf
      locator: Sec. 2(2)(e)(i)
      quote: >-
        The executive committee shall define the scope of activity and subject matter focus
        required of the subcommittees including, but not limited to: Education and workforce
        development
