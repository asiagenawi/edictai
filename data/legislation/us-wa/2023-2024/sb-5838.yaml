verification:
  status: machine-verified
  last_verified: "2026-10-17"
  method: manual-source-fetch
  notes: >-
    Legacy record cited SB 5693, which is an unrelated salmon-recovery liability bill; the AI
    task force bill sponsored by Sen. Nguyen is SB 5838. Legacy dates were also wrong
    (introduced 2024-01-08 after prefiling 2023-12-12; signed 2024-03-18, not 2024-03-28).
    The session law does not mention student data protection; education appears only as a
    subcommittee topic. Bill is general AI policy, not education-specific.
