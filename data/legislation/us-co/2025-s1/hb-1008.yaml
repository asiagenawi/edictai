id: us-co-2025-s1-hb-1008
jurisdiction: us-co
session: 2025-s1
identifier: HB 1008
title: Consumer Protections for Artificial Intelligence Interactions
classification: bill
education_levels:
  - k12
topics:
  - procurement
summary: Moves the start date of developer and deployer duties for high-risk artificial intelligence systems
  under Colorado's AI consumer protection law. As introduced, it would also have voided public school
  contract terms that waive or limit the bill's AI consumer protection and anti-discrimination provisions.
  The AI provisions on public school contracts were removed by amendment.
provisions:
  - type: procurement-standards
    description: As introduced, a public school contract term that waives or limits the AI provisions
      of part 17 of article 1 of title 6 would be void.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2025B/bills/2025b_1008_01.pdf
      locator: Introduced, Section 3, 22-1-135(2)(a)(V)(E)
      quote: THE PROVISIONS OF PART 17 OF ARTICLE 1 OF TITLE 6 RELATING TO THE USE AND DEPLOYMENT OF ARTIFICIAL
        INTELLIGENCE SYSTEMS
  - type: procurement-standards
    description: The introduced bill's summary states that public school contracts must comply with consumer
      protection and anti-discrimination law for AI systems.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2025B/bills/2025b_1008_eng.pdf
      locator: Introduced, Bill Summary
      quote: The bill requires that contracts entered into by a Colorado public school, a state agency,
        or other public entity comply with the provisions of the "Colorado Consumer Protection Act" or
        the "Colorado Anti-discrimination Act" in relation to the use and deployment of artificial intelligence
        systems
