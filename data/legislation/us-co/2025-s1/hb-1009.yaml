summary: Revises Colorado's high-risk artificial intelligence law, keeping consequential decisions that
  include education enrollment or an education opportunity, and delaying developer and deployer duties
  to avoid algorithmic discrimination to August 1, 2027.
provisions:
  - type: bias-or-equity-requirement
    description: Consequential decisions covered by the AI law include education enrollment or an education
      opportunity.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2025B/bills/2025b_1009_01.pdf
      locator: Sec. 1, 6-1-1701 (consequential decision)
      quote: (a) Education enrollment or an education opportunity; (b) Employment or an employment opportunity;
  - type: bias-or-equity-requirement
    description: Deployers of high-risk AI systems must use reasonable care to protect consumers from
      algorithmic discrimination.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2025B/bills/2025b_1009_01.pdf
      locator: Sec. 3, 6-1-1703(1)
      quote: a deployer of a high-risk artificial intelligence system shall use reasonable care to protect
        consumers from any known or reasonably foreseeable risks of algorithmic discrimination
