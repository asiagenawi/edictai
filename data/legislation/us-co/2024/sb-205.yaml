id: us-co-2024-sb-205
jurisdiction: us-co
session: "2024"
identifier: SB 205
title: Consumer Protections for Artificial Intelligence
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Requires developers and deployers of high-risk artificial intelligence systems to use reasonable
  care to protect consumers from algorithmic discrimination in consequential decisions, which include
  education enrollment or an education opportunity, with documentation, risk management, impact assessment,
  and notice duties enforced by the attorney general.
provisions:
  - type: bias-or-equity-requirement
    description: Consequential decisions covered by the high-risk AI law include education enrollment
      or an education opportunity.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2024A/bills/2024a_205_enr.pdf
      locator: 6-1-1701(3), definition of consequential decision
      quote: EDUCATION ENROLLMENT OR AN EDUCATION OPPORTUNITY; (b) EMPLOYMENT OR AN EMPLOYMENT OPPORTUNITY;
  - type: bias-or-equity-requirement
    description: Deployers of high-risk AI systems must use reasonable care to protect consumers from
      algorithmic discrimination.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2024A/bills/2024a_205_enr.pdf
      locator: 6-1-1703(1)
      quote: A DEPLOYER OF A HIGH-RISK ARTIFICIAL INTELLIGENCE SYSTEM SHALL USE REASONABLE CARE TO PROTECT
        CONSUMERS FROM ANY KNOWN OR REASONABLY FORESEEABLE RISKS OF ALGORITHMIC DISCRIMINATION.
