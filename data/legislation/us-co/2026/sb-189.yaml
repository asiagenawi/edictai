id: us-co-2026-sb-189
jurisdiction: us-co
session: "2026"
identifier: SB 189
title: Automated Decision-Making Technology
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - student-privacy
  - admissions
summary: Regulates automated decision-making technology used to materially influence consequential decisions
  in covered domains, including education enrollment or an education opportunity, with notice, disclosure,
  and correction rights; deployers subject to FERPA may meet these duties for education decisions through
  FERPA notice and student record procedures.
provisions:
  - type: bias-or-equity-requirement
    description: Education enrollment or an education opportunity is a covered domain for consequential
      decisions under the ADMT law.
    citation:
      source_url: https://leg.colorado.gov/bill_files/116489/download
      locator: Sec. 1, part 17, definition (6)(a)
      quote: AN EDUCATION ENROLLMENT OR AN EDUCATION OPPORTUNITY;
  - type: requires-disclosure
    description: For education decisions, FERPA-covered deployers give required notices through FERPA
      processes, including to parents or eligible students.
    citation:
      source_url: https://leg.colorado.gov/bill_files/116489/download
      locator: Sec. 1, part 17, notice provision (9)(a)
      quote: FOR A CONSEQUENTIAL DECISION RELATING TO EDUCATION, A DEPLOYER THAT IS SUBJECT TO FERPA SATISFIES
        THE NOTICE AND DISCLOSURE REQUIREMENTS OF THIS SECTION BY PROVIDING NOTICE AND DISCLOSURES THROUGH
        PROCESSES AND CHANNELS THAT ARE CONSISTENT WITH FERPA
  - type: restricts-student-data-use
    description: FERPA-covered deployers meet correction rights for education decisions through student
      record amendment procedures.
    citation:
      source_url: https://leg.colorado.gov/bill_files/116489/download
      locator: Sec. 1, part 17, correction provision (2)(a)
      quote: FOR A CONSEQUENTIAL DECISION RELATING TO EDUCATION, A DEPLOYER THAT IS SUBJECT TO FERPA COMPLIES
        WITH THE REQUIREMENTS OF SUBSECTION ( 1) OF THIS SECTION THROUGH THE DEPLOYER'S EXISTING STUDENT
        RECORD INSPECTION, REVIEW, AND AMENDMENT PROCEDURES
