id: us-co-2025-sb-288
jurisdiction: us-co
session: "2025"
identifier: SB 288
title: Intimate Digital Depictions Criminal & Civil Actions
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
summary: Creates civil and criminal remedies for disclosing intimate digital depictions, defined to include
  images created or altered by generative AI, and extends the juvenile sexting offense to such depictions.
  Amends the school safety resource center's model program for school districts so that it informs students
  how to avoid adjudication if they receive a private intimate image or intimate digital depiction.
provisions:
  - type: addresses-deepfakes
    description: The school safety resource center's model sexting program for school districts must inform
      students about receiving intimate digital depictions.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2025A/bills/2025a_288_enr.pdf
      locator: 24-33.5-1803(3)(m)
      quote: which curriculum must include information informing students of the provisions of section
        18-7-109, including that, if a student receives a sexually explicit image PRIVATE INTIMATE IMAGE
        OR INTIMATE DIGITAL DEPICTION in violation of section 18-7-109
  - type: addresses-deepfakes
    description: Digital depictions covered by the act include those created or altered by generative
      AI.
    citation:
      source_url: https://leg.colorado.gov/sites/default/files/documents/2025A/bills/2025a_288_enr.pdf
      locator: Definitions, (5) digital depiction
      quote: HAS BEEN CREATED, ALTERED, OR PRODUCED BY GENERATIVE AI, IMAGE EDITING SOFTWARE, OR COMPUTER
        -GENERATED MEANS
