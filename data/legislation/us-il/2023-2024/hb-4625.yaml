identifier: HB 4625
title: SCH CD-DIGITAL LITERACY SKILLS
classification: bill
education_levels:
  - k12
topics:
  - ai-literacy
  - curriculum-standards
summary: Requires all school districts, with guidance and standards from the State Board of Education,
  to give students developmentally appropriate digital literacy instruction beginning in elementary school,
  including AI literacy. AI literacy instruction must cover what generative AI is, ethics and responsibilities
  in its use, age-appropriate use, and how AI impacts the world.
provisions:
  - type: requires-ai-literacy-instruction
    description: Digital literacy instruction in all school districts must include AI literacy.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB4625.htm
      locator: Sec. 27-20.07(b)
      quote: Digital literacy instruction shall include developmentally appropriate instruction in digital
        citizenship skills, media literacy, and AI literacy as provided in this Section.
  - type: requires-ai-literacy-instruction
    description: Sets minimum content for AI literacy instruction.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB4625.htm
      locator: Sec. 27-20.07(f)
      quote: '(f) At a minimum, AI literacy instruction shall include all of the following: (1) What constitutes
        generative AI. (2) Ethics and responsibilities associated with the use of generative AI. (3) Instruction
        on age-appropriate use of generative AI.'
