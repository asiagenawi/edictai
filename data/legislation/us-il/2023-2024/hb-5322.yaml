id: us-il-2023-2024-hb-5322
jurisdiction: us-il
session: 2023-2024
identifier: HB 5322
title: ALGORITHMIC IMPACT ASSESSMENTS
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - assessment
  - admissions
summary: Creates the Illinois Commercial Algorithmic Impact Assessments Act, requiring deployers and developers
  of AI-based automated decision tools used for consequential decisions, including education decisions
  such as assessment, cheating detection, admissions, and financial aid, to complete annual impact assessments
  that address risks of algorithmic discrimination.
provisions:
  - type: bias-or-equity-requirement
    description: Covers education and vocational training decisions, including assessment, cheating detection,
      admissions, and financial aid, as consequential decisions.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB5322.htm
      locator: Sec. 5, definition of "Consequential decision"
      quote: '(2) Education and vocational training, including, but not limited to: (A) Assessment, including,
        but not limited to, detecting student cheating or plagiarism; (B) Accreditation; (C) Certification;
        (D) Admissions; and (E) Financial aid or scholarships.'
  - type: bias-or-equity-requirement
    description: Requires deployers' annual impact assessments to assess reasonably foreseeable risks
      of algorithmic discrimination.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB5322.htm
      locator: Sec. 10(a)(5)
      quote: (5) An assessment of the reasonably foreseeable risks of algorithmic discrimination arising
        from the use of the automated decision tool known to the deployer at the time of the impact assessment;
