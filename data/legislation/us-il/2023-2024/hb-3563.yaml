summary: >-
  Created the Generative AI and Natural Language Processing Task Force within the Illinois
  Department of Innovation and Technology to study generative AI and report to the Governor
  and General Assembly by December 31, 2024. Its duties included recommending model policies
  for schools on student use of generative AI in the classroom, and its members included the
  State Superintendent of Education, teachers, and principals.
abstract: >-
  Amends the Department of Innovation and Technology Act. Provides that the Department of
  Innovation and Technology shall establish the Generative AI and Natural Language Processing
  Task Force investigate and provide a report on generative artificial intelligence software and
  natural language processing software.
provisions:
  - type: creates-task-force
    description: Directs the Department of Innovation and Technology to establish a Generative AI and Natural Language Processing Task Force, which must report to the Governor and General Assembly by December 31, 2024.
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/103/103-0451.htm
      locator: 20 ILCS 1370/1-80(b), (g)
      quote: The Department shall establish the Generative AI and Natural Language Processing Task Force.
  - type: issues-model-policy
    description: Makes recommending model policies for schools on student classroom use of generative AI one of the task force's responsibilities.
    education_levels:
      - k12
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/103/103-0451.htm
      locator: 20 ILCS 1370/1-80(e)(2)
      quote: recommending model policies for schools to address the use of generative artificial intelligence by students in the classroom
