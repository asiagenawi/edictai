identifier: HB 299
title: EDUCATION-TECH
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Amends the School Code's bullying prevention provisions to define artificial intelligence, generative
  AI, and digital replicas and, per its synopsis, to include posting or distributing digital replicas
  and sexually explicit images in cyber-bullying beginning with the 2025-2026 school year.
provisions:
  - type: addresses-deepfakes
    description: Defines digital replicas created with AI for purposes of the school bullying prevention
      section.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB0299eng.htm
      locator: Sec. 27-23.7(b)
      quote: individual created using a computer, algorithm, software, tool, artificial intelligence,
        or other technology that is fixed in a sound recording or audiovisual work in which that individual
        did not actually perform or appear
