summary: Requires the Board of Higher Education to report to the General Assembly within six months on
  the state of artificial intelligence education and development in public and private institutions of
  higher education, including existing and planned AI academic programs and courses.
provisions:
  - type: creates-task-force
    description: The Board of Higher Education must report on AI education and development in higher education
      institutions.
