id: us-il-2023-2024-hb-5116
jurisdiction: us-il
session: 2023-2024
identifier: HB 5116
title: AUTOMATED DECISION TOOLS
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
  - assessment
  - admissions
summary: Creates the Automated Decision Tools Act, requiring deployers of AI-based automated decision
  tools used for consequential decisions, including education decisions such as assessment, cheating detection,
  admissions, and financial aid, to perform annual impact assessments, notify affected persons, and maintain
  governance programs. Bars deployers from using tools that result in algorithmic discrimination.
provisions:
  - type: bias-or-equity-requirement
    description: Covers education and vocational training decisions, including assessment, cheating detection,
      admissions, and financial aid, as consequential decisions.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB5116.htm
      locator: Sec. 5, definition of "Consequential decision"
      quote: '(2) education and vocational training, including, but not limited to, all of the following:
        (A) assessment, including, but not limited to, detecting student cheating or plagiarism; (B) accreditation;
        (C) certification; (D) admissions; and (E) financial aid or scholarships;'
  - type: bias-or-equity-requirement
    description: Bars deployers from using an automated decision tool that results in algorithmic discrimination.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB5116.htm
      locator: Sec. 30(a)
      quote: A deployer shall not use an automated decision tool that results in algorithmic discrimination.
  - type: requires-disclosure
    description: Requires deployers to notify the person who is the subject of a consequential decision
      that an automated decision tool is being used.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB5116.htm
      locator: Sec. 15(a)
      quote: A deployer shall, at or before the time an automated decision tool is used to make a consequential
        decision, notify any natural person who is the subject of the consequential decision that an automated
        decision tool is being used
