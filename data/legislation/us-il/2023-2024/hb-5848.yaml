id: us-il-2023-2024-hb-5848
jurisdiction: us-il
session: 2023-2024
identifier: HB 5848
title: SCH CD-BULLYING-DEEPFAKE
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Amends the School Code's bullying prevention provisions so that, beginning with the 2025-2026
  school year, cyber-bullying includes distributing or posting a digital replica of an individual engaged
  in an activity they did not engage in, including sexually explicit depictions. Defines artificial intelligence,
  digital replica, and generative artificial intelligence.
provisions:
  - type: addresses-deepfakes
    description: Cyber-bullying under school bullying policies includes distributing or posting digital
      replicas.
    citation:
      source_url: https://www.ilga.gov/legislation/103/HB/10300HB5848.htm
      locator: Sec. 27-23.7(b)
      quote: Beginning with the 2025-2026 school year, "cyber-bullying" also includes bullying through
        the distribution by electronic means or the posting of a digital replica of an individual who
        is engaged in an activity in which the depicted individual did not engage in
