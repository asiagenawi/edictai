summary: Directs the Professional Review Panel and the Illinois State Board of Education to analyze and
  model the current and potential impacts of artificial intelligence and related technologies on the cost
  factors in the evidence-based school funding model, and to report to the General Assembly and Governor
  by December 31, 2027.
