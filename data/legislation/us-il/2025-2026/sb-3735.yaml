identifier: SB 3735
title: EDUC-TECH RTS/BIOMETRIC INFO
classification: bill
education_levels:
  - k12
topics:
  - student-privacy
  - assessment
  - data-governance
summary: Creates the Student Educational Technologies Rights Act giving students and parents rights to
  opt out of certain educational technologies, request human teacher review of grades generated by AI
  or automated scoring, and opt out of predictive analytics. Restricts school biometric systems and amends
  the Student Online Personal Protection Act to limit operators' AI training on students' covered information.
provisions:
  - type: restricts-student-data-use
    description: Operators' AI models may not train on and indefinitely retain a student's covered information
      without written notice and consent.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=208362&DocName=10400SB3735&DocNum=3735&DocTypeID=SB&LegID=167016&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Sec. 15(2) (Student Online Personal Protection Act, as amended)
      quote: 'An operator''s artificial intelligence model shall not train on a student''s covered information
        and retain the training data indefinitely, unless it first:'
  - type: regulates-ai-assessment
    description: Students and parents may request a human teacher review of AI-generated grades.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=208362&DocName=10400SB3735&DocNum=3735&DocTypeID=SB&LegID=167016&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Synopsis (Student Educational Technologies Rights Act)
      quote: request a human teacher review any automated scored grade or scored grade generated by artificial
        intelligence
