id: us-il-2025-2026-sb-416
jurisdiction: us-il
session: 2025-2026
identifier: SB 416
title: EDUCATION-TECH
classification: bill
education_levels:
  - k12
topics:
  - local-policy-requirement
  - assessment
  - procurement
  - employment-evaluation
summary: Requires each school board to adopt, by the 2027-2028 school year, an AI technology policy that
  prohibits teachers from using AI tools to assign scores or grades for tasks requiring professional judgment
  and requires district approval of any AI model used with students or student work, with a list of approved
  models provided to schools each year.
provisions:
  - type: requires-local-ai-policy
    description: Each school board must adopt an AI technology policy by the 2027-2028 school year.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=197854&DocName=10400SB0416eng&DocNum=416&DocTypeID=SB&LegID=158064&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Section 10
      quote: 'By the 2027-2028 school year, the school board of each school district shall adopt a policy
        that, at a minimum:'
  - type: regulates-ai-assessment
    description: The policy must bar teachers from using AI to grade tasks requiring professional judgment.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=197854&DocName=10400SB0416eng&DocNum=416&DocTypeID=SB&LegID=158064&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Section 10(1)
      quote: prohibits teachers from using an artificial intelligence tool to assign a numerical score
        or a grade for any task that requires professional judgment
  - type: procurement-standards
    description: AI models used with students or student work must be approved by the district.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=197854&DocName=10400SB0416eng&DocNum=416&DocTypeID=SB&LegID=158064&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Section 10(2)
      quote: requires that any artificial intelligence model used in relation to students or student work
        be approved by the school district
