summary: Supports Illinois ASCD/PD365 principles on ethical and effective AI use in K-12 classrooms and
  urges the Illinois State Board of Education to develop statewide guidelines for responsible AI use in
  education, covering student data protection, algorithmic transparency, bias monitoring, and AI literacy
  in curricula. Encourages investment in educator professional development and equitable access to technology.
provisions:
  - type: issues-model-policy
    description: Urges ISBE to develop statewide guidelines for ethical and responsible AI use in education.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=208317&DocName=10400SR0610&DocNum=610&DocTypeID=SR&LegID=166971&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Second resolved clause
      quote: we urge the Illinois State Board of Education (ISBE), in collaboration with school districts,
        educators, technology experts, and stakeholder organizations, to develop statewide guidelines
        for the ethical and responsible use of artificial intelligence in education
  - type: educator-pd-requirement
    description: Encourages investment in educator professional development and equitable technology access.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=208317&DocName=10400SR0610&DocNum=610&DocTypeID=SR&LegID=166971&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Third resolved clause
      quote: we encourage investment in educator professional development and equitable access to technology,
        including broadband infrastructure, one-to-one devices, and AI-enabled tools
