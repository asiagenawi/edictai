id: us-il-2025-2026-hb-1859
jurisdiction: us-il
session: 2025-2026
identifier: HB 1859
title: COM COL-Course Instructor-AI
classification: bill
education_levels:
  - postsecondary
topics:
  - instructional-use
  - employment-evaluation
summary: >-
  Amends the Public Community College Act so that a community college course may not use
  artificial intelligence as the sole source of instruction in place of a qualified faculty
  member. Faculty may still use AI to augment instruction. Takes effect January 1, 2026.
abstract: >-
  Replaces everything after the enacting clause. Amends the Public Community College Act.
  Provides that each board of trustees of a community college district shall require the faculty
  member who teaches a course to be an individual who meets the qualifications in the Illinois
  Administrative Code and any other applicable rules adopted by the Illinois Community College
  Board. Provides that a course may not, in lieu of a faculty member, use artificial intelligence
  as the sole source of instruction for students. Provides that nothing shall be construed to
  prohibit a faculty member from using artificial intelligence to augment course instruction.
provisions:
  - type: prohibits-ai-replacing-educators
    description: Bars community college courses from using AI as the sole source of instruction in place of a qualified faculty member, while allowing faculty to use AI to augment instruction.
    education_levels:
      - postsecondary
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/104/104-0201.htm
      locator: 110 ILCS 805/3-29.28(b)-(c)
      quote: A course may not, in lieu of a faculty member, use artificial intelligence as the sole source of instruction for students.
