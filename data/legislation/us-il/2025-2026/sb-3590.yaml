id: us-il-2025-2026-sb-3590
jurisdiction: us-il
session: 2025-2026
identifier: SB 3590
title: AI PRODUCT LIABILITY ACT
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - admissions
  - institutional-operations
summary: Creates product liability rules for developers and deployers of high-impact and generative artificial
  intelligence systems, covering defective design, inadequate warnings, and breach of express warranty.
  High-impact systems are tied to consequential decisions, defined to include decisions significantly
  affecting an individual's access to education.
provisions:
  - type: ai-in-admissions
    description: Defines consequential decisions to include decisions with significant effects on access
      to education.
    education_levels:
      - postsecondary
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=208023&DocName=10400SB3590&DocNum=3590&DocTypeID=SB&LegID=166677&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Section 10, definition of "consequential decision"
      quote: has a legal or similarly significant effect on an individual's access to the criminal justice
        system, housing, employment, credit, education, health care, or insurance
