id: us-il-2025-2026-sb-2909
jurisdiction: us-il
session: 2025-2026
identifier: SB 2909
title: SCH CD-Teacher Evaluation-AI
classification: bill
education_levels:
  - k12
topics:
  - institutional-operations
  - instructional-use
  - employment-evaluation
summary: >-
  Bars teacher evaluators from using AI tools to assign scores or ratings in a teacher's
  evaluation and bars teachers from using AI to generate evidence of professional practice for
  their evaluations, while allowing AI for administrative tasks. Evaluators and teachers must
  disclose the name and purpose of any AI tool they use. Takes effect January 1, 2027.
abstract: >-
  Amends the Evaluation of Certified Employees Article of the School Code. Prohibits an evaluator
  from using an artificial intelligence tool to assign a numerical score or qualitative rating for
  any component of a teacher's evaluation or any evaluation task that requires professional
  judgment. However, allows an artificial intelligence tool to be used to support the evaluator in
  administrative tasks.
provisions:
  - type: requires-disclosure
    description: Requires evaluators and teachers to disclose the name and specific purpose of any AI tool used in the teacher evaluation process.
    education_levels:
      - k12
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/104/104-0565.htm
      locator: 105 ILCS 5/24A-5
      quote: If an evaluator uses an artificial intelligence tool, the name and specific purpose of the artificial intelligence tool must be disclosed to the teacher being evaluated.
