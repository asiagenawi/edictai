summary: >-
  Requires the Illinois State Board of Education to develop and publish statewide guidance on
  the use of artificial intelligence in K-12 education by July 1, 2026, covering AI concepts,
  classroom and district uses, bias, student data privacy, AI literacy, and support for special
  populations, and allows the State Superintendent to convene an advisory council. It also adds
  AI-generated false depictions, including sexually explicit images and videos, to the
  recommended topics for Internet safety instruction, alongside unrelated provisions on American
  Sign Language resources and educator testing.
abstract: >-
  Replaces everything after the enacting clause. Amends the School Code. Requires the State Board
  of Education to develop statewide guidance for school districts and educators on the use of
  artificial intelligence in elementary and secondary education. Requires, no later than July 1,
  2026, the State Board of Education to encourage school districts to collect teaching resources
  to support American Sign Language programs. With respect to educator licensure, provides that,
  on or before July 1, 2026, the State Board of Education shall post publicly on its website the
  process by which the State Board or any entity designated by the State Board evaluates content
  area knowledge tests to determine content validity, an absence of bias, or the scores required
  to pass such tests. With respect to the recommendation that an age-appropriate unit of Internet
  safety instruction include recognizing and reporting online harassment and cyber-bullying, adds
  that this includes the creation and distribution of false representations of individuals
  created by artificial intelligence, including, but not limited to, sexually explicit images and
  videos.
provisions:
  - type: issues-model-policy
    description: Directs the State Board of Education to develop and publish statewide guidance for districts and educators on AI use in elementary and secondary education by July 1, 2026, and to update it as needed.
    education_levels:
      - k12
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/104/104-0399.htm
      locator: 105 ILCS 5/2-3.118a(a)
      quote: The State Board of Education shall develop and publish this guidance by July 1, 2026 and provide continuous updates as it deems necessary.
  - type: bias-or-equity-requirement
    description: The required guidance must address how districts can evaluate bias in AI tools and best practices for making AI applications accessible to all students and supporting English learners and students with disabilities.
    education_levels:
      - k12
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/104/104-0399.htm
      locator: 105 ILCS 5/2-3.118a(a)(3), (6), (7)
      quote: how districts and educators can evaluate and address bias, privacy, transparency, and risk assessment and management in the usage of artificial intelligence technologies and applications
  - type: creates-task-force
    description: Allows the State Superintendent to convene a statewide council, including AI experts and at least two practicing classroom teachers, to consult on further AI guidance and support.
    education_levels:
      - k12
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/104/104-0399.htm
      locator: 105 ILCS 5/2-3.118a(b)
      quote: The State Superintendent of Education may convene stakeholders for a statewide council to consult on the further development of guidance, resources, and other support for school districts and educators on the use of artificial intelligence in schools.
  - type: addresses-deepfakes
    description: Adds the creation and distribution of AI-generated false representations of individuals, including sexually explicit images and videos, to the recommended Internet safety curriculum topics.
    education_levels:
      - k12
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/104/104-0399.htm
      locator: 105 ILCS 5/27-13.3(c)(5)
      quote: including the creation and distribution of false representations of individuals created by artificial intelligence, including, but not limited to, sexually explicit images and videos
