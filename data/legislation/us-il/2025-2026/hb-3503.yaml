id: us-il-2025-2026-hb-3503
jurisdiction: us-il
session: 2025-2026
identifier: HB 3503
title: CURRICULUM OVERVIEW&ALIGNMENT
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - task-force
summary: Requires the State Board of Education to review all mandated units of study when new learning
  standards are adopted or every 10 years, including an assessment of new areas such as digital citizenship
  and artificial intelligence that may warrant inclusion. Requires a public report with recommendations
  and follow-up action plans and educator professional development as needed.
provisions:
  - type: creates-task-force
    description: The State Board's curriculum review must assess whether artificial intelligence warrants
      inclusion in mandated units of study.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=201969&DocName=10400HB3503eng&DocNum=3503&DocTypeID=HB&LegID=162181&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Section 15(b)(4)
      quote: (4) Assessment of new areas of societal or technological importance that may warrant inclusion,
        such as digital citizenship, artificial intelligence, and emerging global issues.
