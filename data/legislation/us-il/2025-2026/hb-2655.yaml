identifier: HB 2655
title: BD HIGHER ED-AI ED REPORT
classification: bill
education_levels:
  - postsecondary
topics:
  - task-force
  - curriculum-standards
  - research
  - funding
summary: Requires the Board of Higher Education to report within 18 months on AI education and development
  in public and private institutions of higher education, including existing and planned AI programs and
  courses, research, and recommendations on a State-funded grant program for AI learning labs, virtual
  platforms, and tools for K-12 teachers. The section is repealed after two years.
provisions:
  - type: creates-task-force
    description: The Board of Higher Education must report on AI education and development in higher education
      institutions.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=200402&DocName=10400HB2655&DocNum=2655&DocTypeID=HB&LegID=160615&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Sec. 9.45(a)
      quote: the Board shall prepare and submit to the General Assembly a report on the state of artificial
        intelligence education and development in public and private institutions of higher education
