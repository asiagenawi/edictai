title: SCH CD-Computer Science Req
classification: bill
education_levels:
  - k12
topics:
  - curriculum-standards
  - ai-literacy
summary: >-
  Would require students entering 9th grade in the 2028-2029 school year and later to complete
  one year of high school computer science and artificial intelligence to graduate, create an
  introductory computer science teaching endorsement for grades 5-12, and require school boards
  to report K-8 computer science course data to the State Board of Education.
abstract: >-
  Amends the School Code. Requires, beginning with the 2027-2028 school year, school boards to
  report specified data to the State Board of Education regarding computer science courses in
  schools maintaining any of grades kindergarten through 8. Requires the State Board to make the
  data publicly available. With respect to a Professional Educator License, provides that the
  State Board shall create an introductory content area endorsement for teaching computer science
  in grades 5 through 12 that allows licensed educators to teach introductory computer science
  courses. In provisions concerning required high school courses, provides that a computer
  science course (rather than an Advanced Placement computer science course) qualifies under the
  mathematics requirement. Requires each pupil entering the 9th grade beginning with the
  2028-2029 school year to successfully complete one year of high school computer science and
  artificial intelligence as a prerequisite to receiving a high school diploma, which may be
  taken in any of grades 7 through 12 and shall count toward the fulfillment of certain other
  high school graduation requirements. Requires the State Board to create guidelines for school
  districts. Provides that the computer science course requirement does not apply to a pupil
  transferring to a high school in this State from another state after the pupil's 11th grade
  year. Allows a school to enter into a cooperative resource sharing agreement to ensure that its
  students can enroll in a computer science course. Makes other changes.
