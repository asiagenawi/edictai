identifier: HB 2503
title: SCH CD-ARTIFICIAL INTELLIGENCE
classification: bill
education_levels:
  - k12
topics:
  - instructional-use
  - procurement
  - educator-training
  - ai-literacy
  - task-force
  - safety-wellbeing
summary: Requires the State Board of Education to establish a State Instructional Technology Advisory
  Board and, with it, to set standards for AI technologies used in schools, evaluate commonly used AI
  tools and publish the results, and issue annual guidance for districts and educators on AI use and AI
  literacy with professional development. Adds AI use to annual district technology reports and safe and
  responsible AI use to the Internet safety curriculum.
provisions:
  - type: procurement-standards
    description: The State Board must publish a list of AI tools evaluated against its standards and the
      results.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=200093&DocName=10400HB2503&DocNum=2503&DocTypeID=HB&LegID=160306&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Sec. 2-3.118a(c)(3)
      quote: the State Board of Education shall publish and provide to school districts a list of technology
        tools employing artificial intelligence that have been evaluated against these standards and the
        results of that evaluation.
  - type: issues-model-policy
    description: The State Board must develop guidance for districts and educators on AI use and AI literacy.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=200093&DocName=10400HB2503&DocNum=2503&DocTypeID=HB&LegID=160306&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Sec. 2-3.118a(d)
      quote: The State Board of Education shall, in collaboration with the Advisory Board, develop guidance
        for school districts and educators on the use of artificial intelligence in education and the
        development of artificial intelligence literacy.
  - type: educator-pd-requirement
    description: The State Board must offer professional development on AI literacy and the guidance.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=200093&DocName=10400HB2503&DocNum=2503&DocTypeID=HB&LegID=160306&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Sec. 2-3.118a(e)
      quote: The State Board of Education shall develop and offer both synchronous and asynchronous professional
        development opportunities designed to help educators develop artificial intelligence literacy
        and understand and implement this guidance effectively.
