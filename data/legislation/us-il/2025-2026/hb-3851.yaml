identifier: HB 3851
title: SCH CD-Cyber-Bullying
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: >-
  Amends the School Code's bullying provisions so that, beginning with the 2026-2027 school
  year, cyber-bullying also includes posting or distributing an unauthorized digital replica of
  a person (a digital replica used without the depicted person's consent) when it causes the
  harms listed in the definition of bullying. Takes effect July 1, 2026.
abstract: >-
  Amends the Courses of Study Article of the School Code. In provisions concerning bullying and
  cyber-bullying, provides that bullying includes posting or distributing sexually explicit
  images. Provides that, beginning with the 2026-2027 school year, the term "cyber-bullying"
  includes the posting or distribution of a digital replica by electronic means. Defines
  "artificial intelligence", "digital replica", and "generative artificial intelligence".
  Effective July 1, 2026.
provisions:
  - type: addresses-deepfakes
    description: Adds posting or distributing an unauthorized digital replica of an individual to the School Code definition of cyber-bullying, starting with the 2026-2027 school year.
    education_levels:
      - k12
    citation:
      source_url: https://ilga.gov/ftp/Public%20Acts/104/104-0338.htm
      locator: 105 ILCS 5/27-23.7(b)
      quote: Beginning with the 2026-2027 school year, "cyber-bullying" also includes the posting or distribution of an unauthorized digital replica by electronic means if the posting or distribution creates any of the effects enumerated in the definition of "bullying" in this Section.
