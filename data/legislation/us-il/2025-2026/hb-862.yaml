identifier: HB 862
title: STATE GOVERNMENT-TECH
classification: bill
education_levels:
  - k12
topics:
  - synthetic-media
  - safety-wellbeing
summary: Omnibus state government act that creates, dissolves, and renames funds and amends the Human
  Rights Act and other laws. Among its changes, it amends the School Code bullying section to add definitions
  of artificial intelligence and unauthorized digital replica.
provisions:
  - type: addresses-deepfakes
    description: Adds AI and unauthorized digital replica definitions to the school bullying prevention
      section.
    citation:
      source_url: https://www.ilga.gov/Legislation/BillStatus/FullText?LegDocId=196306&DocName=10400HB0862enr&DocNum=862&DocTypeID=HB&LegID=156540&GAID=18&SessionID=114&SpecSess=&Session=
      locator: Sec. 22-110(b)
      quote: '"Unauthorized digital replica" means the use of a digital replica of an individual without
        the consent of the depicted individual.'
