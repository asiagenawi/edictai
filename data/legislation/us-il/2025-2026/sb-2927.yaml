summary: Requires the Department of Commerce and Economic Opportunity, with the Department of Labor, to
  study strategies to protect jobs at risk from artificial intelligence. The study must include proposed
  policy changes related to workforce development, educational systems, and research opportunities for
  colleges and universities.
