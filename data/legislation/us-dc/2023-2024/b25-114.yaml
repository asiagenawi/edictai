id: us-dc-2023-2024-b25-114
jurisdiction: us-dc
session: 2023-2024
identifier: B25-0114
title: Stop Discrimination by Algorithms Act of 2023
classification: bill
education_levels:
  - k12
  - postsecondary
topics:
  - equity-access
summary: Prohibits covered entities from making algorithmic eligibility determinations, based on machine
  learning or artificial intelligence, about access to credit, education, employment, housing, public
  accommodations, or insurance in a discriminatory manner, and requires notices, adverse action disclosures,
  annual audits, and reports to the Attorney General.
provisions:
  - type: bias-or-equity-requirement
    description: Important life opportunities covered by the act include education.
    citation:
      source_url: https://lims.dccouncil.gov/downloads/LIMS/52282/Introduction/B25-0114-Introduction.pdf
      locator: Sec. 3(5)
      quote: “Important life opportunities” means access to, approval for, or offer of credit, education,
        employment, housing,
  - type: bias-or-equity-requirement
    description: Covered entities must annually audit algorithmic determinations for disparate impact.
    citation:
      source_url: https://lims.dccouncil.gov/downloads/LIMS/52282/Introduction/B25-0114-Introduction.pdf
      locator: Sec. 7(a)
      quote: 'A covered entity shall annually audit its algorithmic eligibility determination and algorithmic
        information availability determination practices to:'
